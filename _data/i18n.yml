ja:
  og_locale: ja_JP
  html_lang: ja
  site_title: ALM4GEST
  description: コナミの音楽ゲームのスコアを記録・分析する、個人開発のスコア管理アプリです。
  skip: 本文へスキップ
  lang_label: 言語
  logo_alt: ALM4GEST
  mock_alt: ALM4GEST のアプリ画面
  shots:
    label: アプリの画面
    prev: 前の画面
    next: 次の画面
    names: [ホーム, 楽曲, Tier表, 成長, 共有画像]
  external: Notion で開く
  hero:
    lead: |
      「ALM4GEST」は、コナミの音楽ゲームのスコアを記録・分析する、
      個人開発のスコア管理アプリです。
      （対応機種は「SOUND VOLTEX」「DanceDanceRevolution」「GITADORA」）
    meta: 無料 · iOS 対応 / Android 対応予定
    appstore_alt: App Store でダウンロード
  feature:
    en: FEATURE
    sub: 特長・機能
    items:
      - icon: icon-scores.svg
        title: プレーデータ・スコア管理
        body: |
          e-amusementのプレーデータを取り込み、
          スコア・クリア状況・VOLFORCE等の指標を
          一覧できます
      - icon: icon-tier.svg
        title: 偏差値・Tier分析
        body: |
          同レベル帯の統計と比べられる
          偏差値・Tier表で、得意と弱点が分かります
      - icon: icon-growth.svg
        title: 成長記録
        body: |
          成長グラフ・目標・共有画像で上達を追い、
          フレンドと記録を比べられます
  download:
    en: DOWNLOAD
    sub: ダウンロード
    android_note: Android版は現在クローズドテスト中です。（一般公開前）
    tester_title: Android版のテスター募集
    tester_lead: |
      Android版はまだ一般公開しておらず、テスターとして参加した方だけが使えます。
      インストールしてプレイし、気づいた不具合や使いにくい点を教えてください。
    tester_notes: |
      ※手順1を先に済ませてください。
      グループに参加していないアカウントでは、手順2のページを開けません。
      ※参加にはGoogleアカウントが必要です。
  development:
    en: DEVELOPMENT
    sub: 開発状況
    roadmap_title: 開発ロードマップ
    roadmap_body: これから作るもの・作っているものの一覧です。
    release_title: リリースノート
    release_body: 各バージョンで変わったことの記録です。
  contact:
    en: CONTACT
    sub: お問い合わせ
    info: |
      運営者：川口貴大（@ekarunian）
      連絡先：kawaguchi.ek＠gmail.com（＠→半角へ）
    x_label: X（旧Twitter）
    mail_label: メール
  nav:
    label: 規約・お問い合わせ
    terms: 利用規約
    privacy: プライバシーポリシー
    delete: データ削除の申し込み

en:
  og_locale: en_US
  html_lang: en
  site_title: ALM4GEST
  description: An independently developed score management app for KONAMI's music games.
  skip: Skip to content
  lang_label: Language
  logo_alt: ALM4GEST
  mock_alt: A screen from the ALM4GEST app
  shots:
    label: App screens
    prev: Previous screen
    next: Next screen
    names: [Home, Songs, Tier List, Growth, Share image]
  external: Open in Notion
  hero:
    lead: |
      An independently developed score management app for KONAMI's music games
      — "SOUND VOLTEX", "DanceDanceRevolution", and "GITADORA".
    meta: Free · iOS available / Android coming
    appstore_alt: Download on the App Store
  feature:
    en: FEATURE
    sub: ""
    items:
      - icon: icon-scores.svg
        title: Scores and play data
        body: Import your play data from e-amusement and browse scores, clear status, and metrics such as VOLFORCE in one list
      - icon: icon-tier.svg
        title: T-scores and tier lists
        body: See what you are good at and where you fall short, through statistics from players at your level
      - icon: icon-growth.svg
        title: Progress records
        body: Track your progress with growth charts, goals, and shareable images, and compare records with friends
  download:
    en: DOWNLOAD
    sub: ""
    android_note: The Android app is in closed testing (not yet public).
    tester_title: Android testers wanted
    tester_lead: |
      The Android app is not public yet, so only testers can install it.
      Play it and tell me about any bugs or issues you run into.
    tester_notes: |
      Do step 1 first.
      The Play page will not open for an account that has not joined the group.
      A Google account is required.
  development:
    en: DEVELOPMENT
    sub: ""
    roadmap_title: Roadmap
    roadmap_body: What is planned and what is being built.
    release_title: Release notes
    release_body: What changed in each version.
  contact:
    en: CONTACT
    sub: ""
    info: |
      Operator: Takahiro Kawaguchi (@ekarunian)
      Contact: kawaguchi.ek＠gmail.com (replace ＠ with @)
    x_label: X (Twitter)
    mail_label: Email
  nav:
    label: Terms and contact
    terms: Terms of Service
    privacy: Privacy Policy
    delete: Data deletion request

ko:
  og_locale: ko_KR
  html_lang: ko
  site_title: ALM4GEST
  description: 코나미의 음악 게임 스코어를 기록·분석하는, 개인이 개발한 스코어 관리 앱입니다.
  skip: 본문으로 건너뛰기
  lang_label: 언어
  logo_alt: ALM4GEST
  mock_alt: ALM4GEST 앱 화면
  shots:
    label: 앱 화면
    prev: 이전 화면
    next: 다음 화면
    names: [홈, 곡, 티어표, 성장, 공유 이미지]
  external: Notion에서 열기
  hero:
    lead: |
      코나미의 음악 게임("SOUND VOLTEX", "DanceDanceRevolution", "GITADORA")의
      스코어를 기록·분석하는, 개인이 개발한 스코어 관리 앱입니다.
    meta: 무료 · iOS 지원 / Android 지원 예정
    appstore_alt: App Store에서 다운로드
  feature:
    en: FEATURE
    sub: 특장·기능
    items:
      - icon: icon-scores.svg
        title: 플레이 데이터·스코어 관리
        body: e-amusement의 플레이 데이터를 가져와 스코어·클리어 상황·VOLFORCE 등의 지표를 한눈에 볼 수 있습니다
      - icon: icon-tier.svg
        title: T점수·티어 분석
        body: 같은 레벨대의 통계와 비교하는 T점수·티어표로 잘하는 것과 약점을 알 수 있습니다
      - icon: icon-growth.svg
        title: 성장 기록
        body: 성장 그래프·목표·공유 이미지로 향상을 추적하고, 프렌드와 기록을 비교할 수 있습니다
  download:
    en: DOWNLOAD
    sub: 다운로드
    android_note: Android 버전은 비공개 테스트 중입니다. (일반 공개 전)
    tester_title: Android 버전 테스터 모집
    tester_lead: |
      Android 버전은 아직 일반 공개되지 않아 테스터로 참여한 분만 사용할 수 있습니다.
      설치해서 플레이해 보시고, 발견한 버그나 불편한 점을 알려 주시기 바랍니다.
    tester_notes: |
      ※1번을 먼저 진행해 주시기 바랍니다.
      그룹에 가입하지 않은 계정으로는 2번 페이지가 열리지 않습니다.
      ※참여하려면 Google 계정이 필요합니다.
  development:
    en: DEVELOPMENT
    sub: 개발 현황
    roadmap_title: 개발 로드맵
    roadmap_body: 앞으로 만들 것과 만들고 있는 것의 목록입니다.
    release_title: 릴리스 노트
    release_body: 각 버전에서 바뀐 내용의 기록입니다.
  contact:
    en: CONTACT
    sub: 문의
    info: |
      운영자: 카와구치 타카히로(@ekarunian)
      연락처: kawaguchi.ek＠gmail.com (＠를 반각으로)
    x_label: X (구 Twitter)
    mail_label: 메일
  nav:
    label: 약관·문의
    terms: 이용약관
    privacy: 개인정보처리방침
    delete: 데이터 삭제 신청

