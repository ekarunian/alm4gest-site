    playstore_alt: Google Play で手に入れよう
  feature:
    en: FEATURE
    sub: 特長・機能
    items:
      - icon: icon-scores.svg
        title: プレーデータ・スコア管理
        body: |
          e-amusementのプレーデータを取り込み、
          スコア・クリア状況・VOLFORCE等の指標を
          一覧できます
      - icon: icon-tier.svg
        title: 偏差値・Tier分析
        body: |
          同レベル帯の統計と比べられる
          偏差値・Tier表で、得意と弱点が分かります
      - icon: icon-growth.svg
        title: 成長記録
        body: |
          成長グラフ・目標・共有画像で上達を追い、
          フレンドと記録を比べられます
