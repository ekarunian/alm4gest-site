id: "2026-10-04"
kind: release
version: "1.2.20261004"
date: "2026-10-03"
ja:
  title: "GITADORAで新曲枠（HOT）のずれが取り直されない不具合ほかを修正しました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "GITADORAの新曲枠（HOT）"
          desc: "GITADORAで、公式とずれた曲が新曲枠（HOT）だけのときに取り直しが行われず、スキルがずれたままになる不具合を修正しました。"
        - title: "成長タブの目標の見本"
          desc: "成長タブの追加画面に出る目標の見本で、月の前半に開くと数字が食い違う不具合を修正しました。"
    - heading: "改善"
      items:
        - title: "同期で送る記録"
          desc: "pop'nのポップンクラスが公式とずれる原因を調べるため、同期で送る記録を増やしました。"
en:
  title: "Fixed GITADORA not re-reading HOT songs, and other issues"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "GITADORA HOT songs"
          desc: "Fixed GITADORA not re-reading songs when only HOT songs differed from the official site, leaving Skill off."
        - title: "Goal Sample in the Growth tab"
          desc: "Fixed the goal Sample in the Growth tab's add panel showing mismatched numbers in the first half of a month."
    - heading: "Improvements"
      items:
        - title: "Records sent during sync"
          desc: "Sync now sends more records so we can find why pop'n class differs from the official site."
ko:
  title: "GITADORA 신곡 틀(HOT)의 어긋남을 다시 읽지 않던 문제 등을 수정했습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "GITADORA 신곡 틀(HOT)"
          desc: "GITADORA에서 공식과 다른 곡이 신곡 틀(HOT)에만 있을 때 다시 읽지 않아 스킬이 어긋난 채로 남던 문제를 수정했습니다."
        - title: "성장 탭의 목표 예시"
          desc: "성장 탭 추가 화면의 목표 예시에서 월 전반에 열면 숫자가 맞지 않던 문제를 수정했습니다."
    - heading: "개선"
      items:
        - title: "동기화 시 보내는 기록"
          desc: "pop'n 클래스가 공식과 다른 원인을 조사하기 위해 동기화 시 보내는 기록을 늘렸습니다."
zh:
  title: "修正 GITADORA 新曲欄（HOT）的偏差不會重新讀取等問題"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "GITADORA 新曲欄（HOT）"
          desc: "修正 GITADORA 中與官方不同的曲目只在新曲欄（HOT）時不會重新讀取，使 Skill 持續偏差的問題。"
        - title: "成長分頁的目標範例"
          desc: "修正成長分頁新增畫面中的目標範例，在月份前半開啟時數字不一致的問題。"
    - heading: "改善"
      items:
        - title: "同步時傳送的紀錄"
          desc: "為了找出 pop'n 等級與官方不同的原因，增加了同步時傳送的紀錄。"
