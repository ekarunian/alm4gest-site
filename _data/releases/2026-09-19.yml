id: "2026-09-19"
kind: release
version: "1.2.20260919"
date: "2026-09-18"
ja:
  title: "スコアタで登録済みのスコアを出し直せるようにし、GITADORAのスコアタで素のスコアが混ざる不具合を修正しました"
  sections:
    - heading: "スコアタの改善"
      items:
        - title: "スコアの再登録"
          desc: "スコアタで登録済みのスコアを出し直せるようにしました。期間中はどの課題曲でも「再登録」を押せます。"
        - title: "自動登録の上書き"
          desc: "自動で登録するとき、すでに出ている値より低いスコアで上書きしないようにしました。"
    - heading: "不具合の修正"
      items:
        - title: "GITADORAのスコアタ"
          desc: "GITADORAのスコアタで素のスコアが混ざる不具合を修正しました（達成率に統一）。"
en:
  title: "Score Attack scores can now be resubmitted, and GITADORA Score Attack no longer mixes in raw scores"
  sections:
    - heading: "Score Attack improvements"
      items:
        - title: "Resubmit a score"
          desc: "Score Attack: you can now resubmit a score. Resubmit is available on every chart while the event runs."
        - title: "Auto-submission"
          desc: "Auto-submission no longer overwrites your entry with a lower score."
    - heading: "Bug fixes"
      items:
        - title: "GITADORA Score Attack"
          desc: "Fixed GITADORA Score Attack mixing in raw scores; achievement rate is now always used."
ko:
  title: "스코어 어택에서 등록한 점수를 다시 제출할 수 있게 하고, GITADORA 스코어 어택에서 원점수가 섞이는 문제를 수정했습니다"
  sections:
    - heading: "스코어 어택 개선"
      items:
        - title: "점수 재등록"
          desc: "스코어 어택에서 등록한 점수를 다시 제출할 수 있게 했습니다. 기간 중에는 모든 과제곡에서 「재등록」을 누를 수 있습니다."
        - title: "자동 등록 시 덮어쓰기"
          desc: "자동으로 등록할 때 이미 올라간 값보다 낮은 점수로 덮어쓰지 않도록 했습니다."
    - heading: "버그 수정"
      items:
        - title: "GITADORA 스코어 어택"
          desc: "GITADORA 스코어 어택에서 원점수가 섞이는 문제를 수정했습니다(달성률로 통일)."
zh:
  title: "分數挑戰可重新登錄分數，並修正 GITADORA 分數挑戰混入原始分數的問題"
  sections:
    - heading: "分數挑戰改善"
      items:
        - title: "重新登錄分數"
          desc: "分數挑戰已可重新登錄分數。活動期間任何指定樂曲都能按「重新登錄」。"
        - title: "自動登錄的覆寫"
          desc: "自動登錄時，不再以低於現有成績的分數覆寫。"
    - heading: "錯誤修正"
      items:
        - title: "GITADORA 分數挑戰"
          desc: "修正 GITADORA 分數挑戰混入原始分數的問題（統一使用達成率）。"
