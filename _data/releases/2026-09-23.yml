id: "2026-09-23"
kind: release
version: "1.2.20260923"
date: "2026-09-24"
ja:
  title: "期間の終わった大会を自動で確定し、成長ボードのレベルを1段ずつ選べるようにしました"
  sections:
    - heading: "大会"
      items:
        - title: "承認待ちが0件で自動確定"
          desc: "期間の終わった大会は、承認待ちの申告が0件になった時点で自動で確定します。主催者の「結果を確定する」ボタンは無くなりました。終了から2週間での自動確定はそのまま残ります。"
    - heading: "成長ボードのレベル選択"
      items:
        - title: "全機種で1段ずつ選べる"
          desc: "目標やウィジェットで選ぶレベルを、全機種で1段ずつ選べるようにしました（SDVX 20〜1・DDR 19〜1・GITADORA 9.50〜1.00・pop'n 50〜1）。難しい方が先頭で、横にスクロールして選びます。「Lv◯以下」でまとめる選び方はやめました。保存済みの目標はそのまま使えます。"
    - heading: "フレンド"
      items:
        - title: "負けている譜面を「詳細」表示で"
          desc: "「この相手に負けている譜面を見る」で開く楽曲一覧が「詳細」表示になり、相手の数字が並びます。"
        - title: "フレンド・ライバルの枠を開いて表示"
          desc: "フレンドの対象楽曲から開いた楽曲詳細は、フレンド・ライバルの枠が開いた状態で出ます。"
        - title: "上限に達したときの断り"
          desc: "フレンドの上限に達しているときは、申請を送る前に断りを出します。"
    - heading: "成長と目標"
      items:
        - title: "空の成長ボードのプレビュー"
          desc: "空の成長ボードのプレビューに、実際の絵の見本を出すようにしました。"
        - title: "必要ペースは週あたり"
          desc: "目標の必要ペースは週あたりだけで出します。"
        - title: "上位%の小数"
          desc: "上位%は、1%未満のときだけ小数で出します。"
        - title: "GITADORA のレベル別プリセット"
          desc: "GITADORA のレベル別プリセットを 0.5 刻みの10枚（Lv5.0〜9.5）にしました。"
        - title: "Tier表の既定レベル"
          desc: "Tier表の既定レベルを pop'n 40・GITADORA 7 にしました。"
        - title: "おすすめの未プレイ譜面"
          desc: "おすすめの未プレイ譜面の候補を、VF対象譜面のレベル帯と1つ上に収めました。"
    - heading: "同期と記録"
      items:
        - title: "活動カレンダーの濃淡"
          desc: "活動カレンダーの濃淡を、その日に遊んだ曲数（1-2／3-5／6-9／10以上）で決めるようにしました。"
        - title: "同期の所要時間の見込み"
          desc: "同期の所要時間の見込みを実態に近づけました。"
        - title: "手動記録の差の上限"
          desc: "手動記録の差の上限を満点の20%に揃えました。"
        - title: "譜面メモは200字まで"
          desc: "譜面メモの上限を200字に上げ、超えた分は保存できないようにしました。"
        - title: "手で足した譜面のあるリスト"
          desc: "手で足した譜面のあるリストは、大会リストの整理で消さなくなりました。"
        - title: "GITADORA の取り込み"
          desc: "GITADORA の取り込みが、マスタに無い曲を理由に失敗しなくなりました。"
    - heading: "そのほかの改善と修正"
      items:
        - title: "改善"
          list:
            - "プロフィール編集で、名前を空のまま保存できないようにしました。名前とプレイヤーネームの上限は10字です"
            - "成果画像で、その期間に課題が無いときは「課題進捗」「課題のみ」を選べなくしました"
            - "iOS の「Xに投稿」でクリップボードへ複写しなくなりました"
            - "最後の1機種は消せないようにしました（スナックバーで断ります）"
            - "大会の照合結果の表示をやめました"
        - title: "修正"
          list:
            - "SDVX のおすすめが出ないことがあったのを直しました"
            - "ヘルスケアのワークアウトが二重に書かれることがあったのを直しました。書き出しの30日制限も外しました"
            - "曲メモが200字を超えると消えていたのを直しました"
en:
  title: "Score Attacks finalize automatically, and every level on the growth board's level picker"
  sections:
    - heading: "Score Attack"
      items:
        - title: "Finalized once nothing awaits approval"
          desc: "Once a Score Attack's period has ended, its results finalize automatically as soon as no entries are awaiting approval. The host's \"Finalize results\" button is gone. Automatic finalizing two weeks after the end still applies."
    - heading: "Growth board level picker"
      items:
        - title: "Every level on every game"
          desc: "Goals and widgets now let you pick any single level on every game (SDVX 20–1, DDR 19–1, GITADORA 9.50–1.00, pop'n 50–1). The hardest comes first; scroll sideways to choose. Grouped choices such as \"Lv◯ and below\" are gone. Saved goals keep working."
    - heading: "Friends"
      items:
        - title: "Charts you are behind on, in Detail view"
          desc: "The song list opened from \"Charts you are behind on\" now uses the Detail view and lists the other player's numbers."
        - title: "Friends/Rival panel opens with the song"
          desc: "Song detail opened from a friend's target songs shows with the Friends/Rival panel already open."
        - title: "A notice at the friend limit"
          desc: "If you have reached the friend limit, you are told before you send a request."
    - heading: "Growth and goals"
      items:
        - title: "Preview of an empty growth board"
          desc: "The preview of an empty growth board now shows a sample of the real picture."
        - title: "Pace per week"
          desc: "The pace needed for a goal is shown per week only."
        - title: "Decimals in Top %"
          desc: "Top % uses decimals only when it is under 1%."
        - title: "GITADORA level presets"
          desc: "GITADORA level presets are now ten, in 0.5 steps (Lv5.0–9.5)."
        - title: "Default Tier List level"
          desc: "The default Tier List level is now 40 for pop'n and 7 for GITADORA."
        - title: "Suggested unplayed charts"
          desc: "Suggested unplayed charts are now limited to the level band of your VF target charts and one level above."
    - heading: "Sync and records"
      items:
        - title: "Activity calendar shading"
          desc: "The shading of the activity calendar now follows the number of songs played that day (1–2 / 3–5 / 6–9 / 10+)."
        - title: "Sync time estimate"
          desc: "The sync time estimate is closer to reality."
        - title: "Limit on manual record differences"
          desc: "The limit on the difference in manual records is now 20% of the max score on every game."
        - title: "Chart notes up to 200 characters"
          desc: "Chart notes can now be up to 200 characters, and longer notes cannot be saved."
        - title: "Lists with charts you added by hand"
          desc: "Lists with charts you added by hand are no longer removed when Score Attack lists are cleaned up."
        - title: "GITADORA import"
          desc: "GITADORA import no longer fails because of songs missing from the song data."
    - heading: "Other improvements and fixes"
      items:
        - title: "Improvements"
          list:
            - "You can no longer save your profile with an empty name. Name and player name are limited to 10 characters"
            - "In result images, \"Challenge\" and \"Challenge only\" cannot be chosen when there are no challenges in that period"
            - "\"Post to X\" on iOS no longer copies to the clipboard"
            - "The last remaining game cannot be removed (a snackbar explains why)"
            - "Score Attack matching results are no longer shown"
        - title: "Fixes"
          list:
            - "Fixed SDVX suggestions sometimes not appearing"
            - "Fixed Health app workouts sometimes being written twice. The 30-day limit on exporting was also removed"
            - "Fixed song notes disappearing when they went over 200 characters"
ko:
  title: "기간이 끝난 스코어 어택을 자동으로 확정하고, 성장 보드의 레벨을 한 단계씩 고를 수 있게 했습니다"
  sections:
    - heading: "스코어 어택"
      items:
        - title: "승인 대기 0건이면 자동 확정"
          desc: "기간이 끝난 스코어 어택은 승인 대기 중인 신고가 0건이 된 시점에 자동으로 확정됩니다. 주최자의 「결과 확정」 버튼은 없어졌습니다. 종료 2주 후의 자동 확정은 그대로 남습니다."
    - heading: "성장 보드의 레벨 선택"
      items:
        - title: "전 기종에서 한 단계씩 선택"
          desc: "목표와 위젯에서 고르는 레벨을 전 기종에서 한 단계씩 고를 수 있게 했습니다(SDVX 20~1・DDR 19~1・GITADORA 9.50~1.00・pop'n 50~1). 어려운 쪽이 앞에 오며, 가로로 스크롤해 고릅니다. 「Lv◯ 이하」로 묶어 고르는 방식은 없앴습니다. 저장된 목표는 그대로 쓸 수 있습니다."
    - heading: "친구"
      items:
        - title: "지고 있는 채보를 「상세」 표시로"
          desc: "「이 상대에게 지고 있는 채보 보기」로 여는 곡 목록이 「상세」 표시가 되어, 상대의 수치가 나란히 나옵니다."
        - title: "친구・라이벌 칸을 연 상태로 표시"
          desc: "친구의 대상곡에서 연 곡 상세는 친구・라이벌 칸이 열린 상태로 나옵니다."
        - title: "상한에 도달했을 때의 안내"
          desc: "친구 상한에 도달한 경우, 신청을 보내기 전에 안내를 표시합니다."
    - heading: "성장과 목표"
      items:
        - title: "빈 성장 보드의 미리보기"
          desc: "빈 성장 보드의 미리보기에 실제 그림의 견본을 표시하도록 했습니다."
        - title: "필요 페이스는 주 단위로"
          desc: "목표의 필요 페이스는 주 단위로만 표시합니다."
        - title: "상위 %의 소수점"
          desc: "상위 %는 1% 미만일 때만 소수로 표시합니다."
        - title: "GITADORA 레벨별 프리셋"
          desc: "GITADORA의 레벨별 프리셋을 0.5 단위 10개(Lv5.0~9.5)로 했습니다."
        - title: "티어표의 기본 레벨"
          desc: "티어표의 기본 레벨을 pop'n 40・GITADORA 7로 했습니다."
        - title: "추천 미플레이 채보"
          desc: "추천 미플레이 채보 후보를 VF 대상 채보의 레벨대와 그 한 단계 위로 좁혔습니다."
    - heading: "동기화와 기록"
      items:
        - title: "활동 캘린더의 농담"
          desc: "활동 캘린더의 농담을 그날 플레이한 곡 수(1-2／3-5／6-9／10 이상)로 정하도록 했습니다."
        - title: "동기화 소요 시간 예상"
          desc: "동기화 소요 시간 예상을 실제에 가깝게 했습니다."
        - title: "수동 기록의 차이 상한"
          desc: "수동 기록의 차이 상한을 만점의 20%로 맞췄습니다."
        - title: "채보 메모는 200자까지"
          desc: "채보 메모의 상한을 200자로 늘리고, 넘는 부분은 저장할 수 없게 했습니다."
        - title: "수동으로 추가한 채보가 있는 리스트"
          desc: "수동으로 추가한 채보가 있는 리스트는 스코어 어택 리스트를 정리할 때 지우지 않게 했습니다."
        - title: "GITADORA 가져오기"
          desc: "GITADORA 가져오기가 마스터에 없는 곡 때문에 실패하지 않게 했습니다."
    - heading: "그 밖의 개선과 수정"
      items:
        - title: "개선"
          list:
            - "프로필 편집에서 이름을 비운 채 저장할 수 없게 했습니다. 이름과 플레이어 네임의 상한은 10자입니다"
            - "성과 이미지에서 그 기간에 과제가 없으면 「과제 진행」「과제만」을 고를 수 없게 했습니다"
            - "iOS의 「X에 게시」에서 클립보드로 복사하지 않게 했습니다"
            - "마지막 1개 기종은 지울 수 없게 했습니다(스낵바로 안내합니다)"
            - "스코어 어택 대조 결과 표시를 없앴습니다"
        - title: "수정"
          list:
            - "SDVX 추천이 표시되지 않는 경우가 있던 문제를 고쳤습니다"
            - "헬스케어의 운동 기록이 두 번 기록되는 경우가 있던 문제를 고쳤습니다. 내보내기의 30일 제한도 없앴습니다"
            - "곡 메모가 200자를 넘으면 사라지던 문제를 고쳤습니다"
zh:
  title: "期間結束的分數挑戰自動結算，成長看板的等級可逐級選擇"
  sections:
    - heading: "分數挑戰"
      items:
        - title: "無待審申報時自動結算"
          desc: "期間結束的分數挑戰，會在待審申報為 0 件時自動結算。主辦者的「確定結果」按鈕已移除。結束滿 2 週自動結算的機制維持不變。"
    - heading: "成長看板的等級選擇"
      items:
        - title: "全機種逐級選擇"
          desc: "目標與小工具中選擇的等級，全機種都能逐級選擇（SDVX 20〜1・DDR 19〜1・GITADORA 9.50〜1.00・pop'n 50〜1）。較難的排在前面，橫向捲動選擇。已取消以「Lv◯以下」合併選擇的方式。已儲存的目標可照常使用。"
    - heading: "好友"
      items:
        - title: "落後的譜面以「詳細」顯示"
          desc: "從「查看落後此對象的譜面」開啟的樂曲一覽改為「詳細」顯示，並列出對方的數值。"
        - title: "開啟時展開好友・勁敵欄"
          desc: "從好友的對象曲開啟的樂曲詳細，會以好友・勁敵欄展開的狀態顯示。"
        - title: "達到上限時的提示"
          desc: "達到好友上限時，送出申請前會先提示。"
    - heading: "成長與目標"
      items:
        - title: "空白成長看板的預覽"
          desc: "空白成長看板的預覽改為顯示實際畫面的範例。"
        - title: "所需進度僅以每週顯示"
          desc: "目標的所需進度只以每週為單位顯示。"
        - title: "前%的小數"
          desc: "前%只在未滿 1% 時以小數顯示。"
        - title: "GITADORA 等級預設"
          desc: "GITADORA 的等級預設改為以 0.5 為間隔的 10 組（Lv5.0〜9.5）。"
        - title: "Tier表的預設等級"
          desc: "Tier表的預設等級改為 pop'n 40・GITADORA 7。"
        - title: "推薦的未遊玩譜面"
          desc: "推薦的未遊玩譜面候選，限縮在 VF 對象譜面的等級帶與其上一級。"
    - heading: "同步與紀錄"
      items:
        - title: "活動月曆的深淺"
          desc: "活動月曆的深淺改依當天遊玩的曲數（1-2／3-5／6-9／10 以上）決定。"
        - title: "同步所需時間的預估"
          desc: "同步所需時間的預估更貼近實際。"
        - title: "手動紀錄差距的上限"
          desc: "手動紀錄差距的上限統一為滿分的 20%。"
        - title: "譜面備註上限 200 字"
          desc: "譜面備註的上限提高至 200 字，超過的部分無法儲存。"
        - title: "含手動加入譜面的清單"
          desc: "含有手動加入譜面的清單，在整理分數挑戰清單時不再被刪除。"
        - title: "GITADORA 匯入"
          desc: "GITADORA 匯入不再因主資料中沒有的樂曲而失敗。"
    - heading: "其他改善與修正"
      items:
        - title: "改善"
          list:
            - "編輯個人資料時，名稱為空將無法儲存。名稱與玩家名稱上限為 10 字"
            - "成果圖片中，該期間沒有課題時，無法選擇「課題進度」「僅課題」"
            - "iOS 的「發佈到 X」不再複製到剪貼簿"
            - "最後 1 個機種無法刪除（以 Snackbar 提示）"
            - "不再顯示分數挑戰的比對結果"
        - title: "修正"
          list:
            - "修正 SDVX 推薦有時未顯示的問題"
            - "修正「健康」的體能訓練有時被重複寫入的問題，並取消匯出的 30 天限制"
            - "修正樂曲備註超過 200 字時會消失的問題"
