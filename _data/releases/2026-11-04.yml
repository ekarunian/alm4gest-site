---
id: '2026-11-04'
kind: release
version: 1.3.20261104
date: '2026-11-02'
ja:
  title: beatmania IIDX に対応し、楽曲一覧の絞り込みを作り直し、課題を受け付けるレベルを塗り分けられるようにしました
  lead: 本アップデートでは、beatmania IIDX への対応、楽曲一覧の絞り込みの作り直し、課題を受け付けるレベルの塗り分け、スコアタへの家庭用版からの参加、iPhone のホーム画面ウィジェット、不具合報告への画像と動画の添付などを行いました。
  sections:
  - heading: beatmania IIDX に対応
    items:
    - title: ソフラン曲の譜面確認
      desc: ソフランの曲の対策を、遊ぶ前に決められます。実機と同じ見え方で譜面を流し、START 2回・皿チョンを入れる位置と、そのときの緑数字を確認できます。
      media:
        type: video
        src: 52288a8f-625d-46b2-bc2d-4c6931a915b4.mp4
        poster: 52288a8f-625d-46b2-bc2d-4c6931a915b4.jpg
    - title: RANDOM の当たり配置を記録
      desc: RANDOM の当たり配置を記録し、手持ちのランダムレーンチケットで狙えます。所持チケットに登録すると、当たり配置に「当たりランダムレーンチケットあり」の印を表示します。みんなの当たり配置も見られます。
      media:
        type: video
        src: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.mp4
        poster: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.jpg
    - title: ほかの機種と同じ機能
      desc: 同期・おすすめ・楽曲一覧と絞り込み・Tier表・目標・成長ボード（段位・アリーナ）など、ほかの機種と同じ機能を IIDX でも使えます。
      media:
        type: video
        src: 24994fce-e094-42ae-a421-b533e052ea43.mp4
        poster: 24994fce-e094-42ae-a421-b533e052ea43.jpg
    - title: 注意すること
      list:
      - 統計の初期値は Tachi の記録（SP 203人・DP 161人）です。偏差値、おすすめの「遊んだ人が取得 ◯%」、Tier表の段は、登録が増えると変わります
      - 34 ZINRAI の新曲は、登録者が20人になるまで統計が空欄です。曲詳細の「比較」は「データ準備中」と表示します
      - みんなの当たり配置は、最初は空です
      - Tier表はジャケットの代わりに、難易度の色・曲名・版のロゴのタイルで表示します。見せ方の要望は報告フォームで受け付けます
      - 自己ベストを更新しなかったプレーの点数と、SCORE CLASS・クリア率は、公式から取れないため表示しません
      - INFINITAS の取り込みには、まだ対応していません
      - 譜面確認は Lv8 以上が対象です。34 ZINRAI の新曲の HYPER 80譜面と ANOTHER 9譜面（Textage に未掲載）、流桜ノ門と月下繚乱の DP ANOTHER（Textage の譜面のノーツ数が、BEMANIWiki・Tachi・bm2dx より1つ多い）は「譜面なし」です
  - heading: 楽曲一覧の絞り込み
    items:
    - title: レベルを棒グラフで選ぶ
      desc: 全機種で絞り込みを作り直しました。レベルは、譜面数の棒グラフの上で2つのつまみを動かして範囲を選びます。SDVX は 18.2 のように小数ごとに1本です。
      media:
        type: video
        src: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.mp4
        poster: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.jpg
    - title: 得意度とレーダーの主軸
      desc: 得意度（得意・標準・苦手）と、レーダーの主軸（SDVX・DDR・IIDX）で絞り込めます。
      media:
        type: video
        src: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.mp4
        poster: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.jpg
    - title: DDR のフレアランク
      desc: 'DDR はフレアランクで絞り込めます。フレアスキルの伸びしろを、目指すフレア（例: IX）までで数える設定も追加しました。'
      media:
        type: video
        src: 7c3755c1-523d-4a1c-87df-a39633bb20a6.mp4
        poster: 7c3755c1-523d-4a1c-87df-a39633bb20a6.jpg
    - title: バージョン・ランプ・グレードの選び方
      desc: 選んだバージョンを公式ロゴで表示します。ランプやグレードは、指でなぞって続けて選べます。
  - heading: 課題
    items:
    - title: 受け付けるレベルを塗り分け
      desc: 課題を受け付けるレベルを、機種ごとに「歓迎」「OK」「NG」の三段階で塗り分けられます。指でなぞるとまとめて塗れます。
      media:
        type: video
        src: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.mp4
        poster: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.jpg
    - title: 受け付けのひと言と印
      desc: 受け付けのひと言（28字まで）を、課題を投げる相手に表示します。課題を投げる画面では、相手の歓迎のレベルに★、NG のレベルに⊘を表示します。
      media:
        type: video
        src: 51eac85a-9176-4fc7-be23-17724d7ea4fe.mp4
        poster: 51eac85a-9176-4fc7-be23-17724d7ea4fe.jpg
    - title: 送れない課題と、止める理由の表示
      desc: 相手が課題曲に登録済みの譜面は、課題として送れないようにしました。受け付けを止める理由が重なったときは、細かいほう（曲ごと、機種ごと、すべての順）の理由を相手に表示します。すべてを止めている間は、曲ごとの停止は押せません。
      media:
        type: video
        src: 391403b4-d07b-479b-b387-441f1f80dc20.mp4
        poster: 391403b4-d07b-479b-b387-441f1f80dc20.jpg
    - title: pop'n music のメダルの課題
      desc: 目標に「今作でクリア」とメダルを追加しました。クリア済みの曲でも、上のメダルを目標にできます。
      media:
        type: video
        src: 0dc319c1-4774-404c-b9c6-abcfc519fac0.mp4
        poster: 0dc319c1-4774-404c-b9c6-abcfc519fac0.jpg
    - title: SDVX の「遊ぶ」課題
      desc: 点数の変わらないプレーでは「遊ぶ」課題が達成にならない不具合を修正しました。
  - heading: スコアタ
    items:
    - title: 家庭用版からの参加
      desc: 作成時に「家庭用からの参加」を「許可」か「ACのみ」から選べます。
      media:
        type: video
        src: a22daa9e-3a62-473f-896e-602fe1211be0.mp4
        poster: a22daa9e-3a62-473f-896e-602fe1211be0.jpg
    - title: 家庭用版の記録
      desc: 家庭用版の記録はリザルト画像を添えて登録し、順位表などに「家庭用」の印を表示します。
      media:
        type: video
        src: 1756fa74-0f7c-4350-bcee-01710a43ea53.mp4
        poster: 1756fa74-0f7c-4350-bcee-01710a43ea53.jpg
    - title: コメントを全文表示
      desc: コメントを「…」で切らずに全文表示します。
      media:
        type: image
        src: 0740e4db-82a6-4194-9e55-5504fec7ea37.webp
    - title: 開催中の内容の変更
      desc: 主催者は開催中も、題名・説明・期間・画像を変更できます。確定後は、期間を除いて変更できます。
      media:
        type: video
        src: 4a7caeb7-2330-4034-85b9-1b90668b714a.mp4
        poster: 4a7caeb7-2330-4034-85b9-1b90668b714a.jpg
    - title: ホームに出す数と並び
      desc: 設定で、ホームに出すスコアタの数（3・5・10件）と並び（終了日が近い順・新着順、参加中を先頭に）を選べます。承認待ちなどの件数の札は、ホームのスコアタの見出しから外し、各スコアタの行だけに表示します。
      media:
        type: video
        src: 642ffadf-a612-4e22-99fb-9f2b14ce4408.mp4
        poster: 642ffadf-a612-4e22-99fb-9f2b14ce4408.jpg
  - heading: 成長
    items:
    - title: ホーム画面ウィジェット
      desc: iPhone のホーム画面ウィジェットで、成長タブの目標まであといくつかを表示します（iOS 17 以降、小と中の2サイズ）。押すとその目標の画面を開きます。
      media:
        type: image
        src: 4a844ac1-51c3-4630-ad08-a1a353a9dd91.webp
  - heading: 機種別
    items:
    - title: SDVX の判定調整を 1ms ずつ
      desc: SDVX は、判定調整を ms で表示しているとき、1ms ずつ動かして入力できます。
      media:
        type: video
        src: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.mp4
        poster: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.jpg
    - title: GITADORA と DDR の既定値を分けて設定
      desc: GITADORA は GF と DM、DDR は SP と DP で、判定調整・描画・ハイスピードの既定値を別々に設定できます（前の版の値は両方へ引き継ぎます）。
      media:
        type: video
        src: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.mp4
        poster: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.jpg
    - title: DDR の譜面ビューア
      desc: 譜面ビューアで見られる曲を14曲追加しました。
    - title: SDVX の小数レベルの Tier表
      desc: Lv17 以上では、小数レベル（18.0・18.1…）の Tier表を、レベルの札から開くメニューで選べます。
      media:
        type: video
        src: 6a9b6b5d-d705-438e-b386-3884162eb28b.mp4
        poster: 6a9b6b5d-d705-438e-b386-3884162eb28b.jpg
    - title: GITADORA の XG 筐体の記録
      desc: XG 筐体の版の記録も取り込みます。両方で遊んだ譜面は、達成率の高い方を採用します。
    - title: そのほかの変更
      list:
      - 'SDVX: 点数から見て低すぎる EX（PUC なのに EX が低いなど）を、得意度と統計から除外'
      - 'GITADORA: GF タブのパートの既定を「Gt+Ba」に変更'
      - 'pop''n music: 楽曲一覧の詳細表示で、遊び込んでいるレベル帯より下の行を薄く表示するのをやめました'
    - title: 不具合の修正
      list:
      - 'SDVX: 曲数が少なく一覧が1ページのレベルで、同期が失敗する不具合'
      - 'pop''n music: 同期を途中で止めると、成果のポップンクラスの伸びが ±0 になる不具合'
      - 'pop''n music: メダル無しと青メダルの譜面が、曲詳細・成長・スコアタ・絞り込みで未クリアとして扱われていなかった不具合'
  - heading: 全般の改善と不具合修正
    items:
    - title: Tier表で未クリアに絞る
      desc: Tier表で、未クリアの曲だけに絞る切り替えを追加しました。指標がクリア以外のときは、未達成の曲に絞ります。
      media:
        type: video
        src: 8262ffc5-8df6-477c-8c96-939e0cb22195.mp4
        poster: 8262ffc5-8df6-477c-8c96-939e0cb22195.jpg
    - title: 報告に画像と動画を添付
      desc: 開発要望・不具合などの報告に、画像4枚と動画1本（60秒まで）を添付できます。
      media:
        type: video
        src: 31eac384-d245-4cfa-9922-6aba382eced5.mp4
        poster: 31eac384-d245-4cfa-9922-6aba382eced5.jpg
    - title: 得意度の表示
      desc: 得意度を、0 以下や 100 超えも実際の値で表示します。50 未満は下がり方を緩やかにし、「苦手」の札は 30 以下の譜面にだけ表示します。
    - title: そのほか
      list:
      - KONAMI ID でログインし直したとき、e-amusement の画面で止まらずにそのまま同期を開始
      - iPhone Duo で画面いっぱいに表示
      - 曲名の ā・ī・Ō などの記号が隣の字へずれる不具合を修正
      - 文字を大きくしたときに小さく縮みすぎていた札や数字を修正
en:
  title: beatmania IIDX support, rebuilt song list filters, and levels you accept challenges for
  lead: This release adds beatmania IIDX support, rebuilds the song list filters, lets you mark which levels you accept challenges for, and lets players join Score Attack from home versions. It also adds an iPhone Home Screen widget and lets you attach images and video to bug reports.
  sections:
  - heading: beatmania IIDX support
    items:
    - title: Chart view for BPM-change songs
      desc: Plan for BPM-change songs before you play. The chart view scrolls the way it does in the game, so you can check where to press START twice or do a scratch flick, and see the green number at each point.
      media:
        type: video
        src: 52288a8f-625d-46b2-bc2d-4c6931a915b4.mp4
        poster: 52288a8f-625d-46b2-bc2d-4c6931a915b4.jpg
    - title: Save lucky RANDOM lane picks
      desc: Save your lucky RANDOM lane picks and aim for them with the Random Lane Tickets you own. Register the tickets you have, and lane picks you can get with them are marked "Ticket for a hit lane order". You can also see community lane picks.
      media:
        type: video
        src: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.mp4
        poster: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.jpg
    - title: Same features as other games
      desc: Sync, recommendations, the song list and filters, Tier Lists, goals and the growth board (Class and Arena) work for IIDX just as they do for the other games.
      media:
        type: video
        src: 24994fce-e094-42ae-a421-b533e052ea43.mp4
        poster: 24994fce-e094-42ae-a421-b533e052ea43.jpg
    - title: Please note
      list:
      - Initial stats come from Tachi records (203 SP and 161 DP players). T-scores, the share of players who reached each goal in recommendations, and Tier List rows will change as more players register
      - Stats for new songs in 34 ZINRAI stay blank until 20 players have registered. The "Compare" tab in song details shows "Preparing data"
      - Community lane picks start out empty
      - Tier Lists show tiles with the difficulty color, song title and version logo instead of jackets. Feedback on their look is welcome through the report form
      - Scores from plays that did not beat your personal best, SCORE CLASS, and clear rates are not shown, because the official site does not provide them
      - Importing from INFINITAS is not supported yet
      - Chart view covers Lv8 and up. It is not available for the 80 HYPER and 9 ANOTHER charts of new songs in 34 ZINRAI (not yet on Textage), or for the DP ANOTHER charts of 流桜ノ門 and 月下繚乱 (the Textage charts have one more note than BEMANIWiki, Tachi and bm2dx)
  - heading: Song list filters
    items:
    - title: Pick levels on a bar chart
      desc: Filters have been rebuilt for every game. Pick a level range by dragging two handles over a bar chart of chart counts per level. In SDVX, there is one bar per decimal level, such as 18.2.
      media:
        type: video
        src: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.mp4
        poster: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.jpg
    - title: Strength and Main radar axis
      desc: Filter by Strength (Strong, Standard, Weak) and by Main radar axis (SDVX, DDR and IIDX).
      media:
        type: video
        src: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.mp4
        poster: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.jpg
    - title: DDR flare rank
      desc: In DDR, filter by flare rank. A new setting counts Flare Skill gains only up to the flare you are aiming for (for example, IX).
      media:
        type: video
        src: 7c3755c1-523d-4a1c-87df-a39633bb20a6.mp4
        poster: 7c3755c1-523d-4a1c-87df-a39633bb20a6.jpg
    - title: Versions, lamps and grades
      desc: Selected versions are shown with their official logos. Lamps and grades can be selected by sliding your finger across them.
  - heading: Challenges
    items:
    - title: Mark the levels you accept
      desc: Mark the levels you accept challenges for as "Welcome", "OK" or "No" for each game. Slide your finger to mark several at once.
      media:
        type: video
        src: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.mp4
        poster: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.jpg
    - title: A short note and level marks
      desc: Add a short note (up to 28 characters) that friends see when they send you a challenge. When sending a challenge, levels your friend welcomes are marked with ★ and levels they decline are marked with ⊘.
      media:
        type: video
        src: 51eac85a-9176-4fc7-be23-17724d7ea4fe.mp4
        poster: 51eac85a-9176-4fc7-be23-17724d7ea4fe.jpg
    - title: Charts you can't send, and pause reasons
      desc: Charts your friend already has as challenge songs can no longer be sent. When several reasons for pausing challenges apply, your friend sees the most specific one (per song, then per game, then all). While all challenges are paused, per-song pausing is disabled.
      media:
        type: video
        src: 391403b4-d07b-479b-b387-441f1f80dc20.mp4
        poster: 391403b4-d07b-479b-b387-441f1f80dc20.jpg
    - title: pop'n music medal goals
      desc: '"Clear in this version" and medals have been added as goals. You can set a higher medal as the goal even on songs you have already cleared.'
      media:
        type: video
        src: 0dc319c1-4774-404c-b9c6-abcfc519fac0.mp4
        poster: 0dc319c1-4774-404c-b9c6-abcfc519fac0.jpg
    - title: SDVX "Play" challenges
      desc: Fixed "Play" challenges not being completed by plays that did not change your score.
  - heading: Score Attack
    items:
    - title: Entries from home versions
      desc: When creating a Score Attack, choose whether to allow entries from home versions ("Allowed" or "AC only").
      media:
        type: video
        src: a22daa9e-3a62-473f-896e-602fe1211be0.mp4
        poster: a22daa9e-3a62-473f-896e-602fe1211be0.jpg
    - title: Home version scores
      desc: Home version scores are submitted with a result image and marked "Home" in the rankings and elsewhere.
      media:
        type: video
        src: 1756fa74-0f7c-4350-bcee-01710a43ea53.mp4
        poster: 1756fa74-0f7c-4350-bcee-01710a43ea53.jpg
    - title: Full comments
      desc: Comments are shown in full instead of being cut off with "…".
      media:
        type: image
        src: 0740e4db-82a6-4194-9e55-5504fec7ea37.webp
    - title: Edits during an event
      desc: Organizers can change the title, description, period and image while a Score Attack is running. Once results are final, everything except the period can still be changed.
      media:
        type: video
        src: 4a7caeb7-2330-4034-85b9-1b90668b714a.mp4
        poster: 4a7caeb7-2330-4034-85b9-1b90668b714a.jpg
    - title: Count and order on Home
      desc: In Settings, choose how many Score Attacks appear on Home (3, 5 or 10) and their order (Ending soonest or Newest, with an option to show joined ones first). Badges such as pending reviews have been removed from the Score Attack heading on Home and are now shown only on each Score Attack's row.
      media:
        type: video
        src: 642ffadf-a612-4e22-99fb-9f2b14ce4408.mp4
        poster: 642ffadf-a612-4e22-99fb-9f2b14ce4408.jpg
  - heading: Growth
    items:
    - title: Home Screen widget
      desc: An iPhone Home Screen widget shows how far you are from your growth tab goals (iOS 17 or later, small and medium sizes). Tap it to open that goal.
      media:
        type: image
        src: 4a844ac1-51c3-4630-ad08-a1a353a9dd91.webp
  - heading: Game-specific
    items:
    - title: SDVX judge timing in 1 ms steps
      desc: In SDVX, when judge timing is shown in ms, you can adjust it 1 ms at a time.
      media:
        type: video
        src: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.mp4
        poster: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.jpg
    - title: Separate defaults for GITADORA and DDR
      desc: GITADORA (GF and DM) and DDR (SP and DP) now keep separate defaults for judge timing, visual timing and Hi-Speed. Your previous values carry over to both.
      media:
        type: video
        src: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.mp4
        poster: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.jpg
    - title: DDR chart viewer
      desc: 14 more songs can be viewed in the chart viewer.
    - title: SDVX decimal-level Tier Lists
      desc: For Lv17 and up, choose the decimal-level Tier List (18.0, 18.1 and so on) from a menu that opens from the level tag.
      media:
        type: video
        src: 6a9b6b5d-d705-438e-b386-3884162eb28b.mp4
        poster: 6a9b6b5d-d705-438e-b386-3884162eb28b.jpg
    - title: GITADORA XG cabinet records
      desc: Records from the XG cabinet version are also imported. For charts played on both, the higher achievement rate is kept.
    - title: Other changes
      list:
      - 'SDVX: EX scores that are too low for the normal score (such as a low EX on a PUC) are left out of Strength and stats'
      - 'GITADORA: The default part on the GF tab is now "Gt+Ba"'
      - 'pop''n music: Rows below the level range you play most are no longer dimmed in the detailed song list view'
    - title: Fixes
      list:
      - 'SDVX: Sync failing for levels whose song list fits on one page'
      - 'pop''n music: Your pop''n Class gain showing ±0 in the results after you stopped a sync partway'
      - 'pop''n music: Charts with no medal or a blue medal are now treated as not cleared in song details, growth, Score Attack and filters'
  - heading: Other improvements and fixes
    items:
    - title: Uncleared songs in Tier Lists
      desc: Tier Lists can be narrowed down to uncleared songs only. When the metric is not "Clear", charts below the target count as uncleared.
      media:
        type: video
        src: 8262ffc5-8df6-477c-8c96-939e0cb22195.mp4
        poster: 8262ffc5-8df6-477c-8c96-939e0cb22195.jpg
    - title: Images and video in reports
      desc: Feature requests and bug reports can include up to 4 images and 1 video (up to 60 seconds).
      media:
        type: video
        src: 31eac384-d245-4cfa-9922-6aba382eced5.mp4
        poster: 31eac384-d245-4cfa-9922-6aba382eced5.jpg
    - title: Strength values
      desc: Strength now shows its actual value even below 0 or above 100. Below 50 it drops more gently, and the "Weak" tag appears only on charts at 30 or below.
    - title: Other
      list:
      - After signing in again with your KONAMI ID, sync starts right away instead of stopping on the e-amusement page
      - The app now fills the whole screen on iPhone Duo
      - Fixed symbols such as ā, ī and Ō in song titles shifting into the next character
      - Fixed tags and numbers shrinking too much with large text
ko:
  title: beatmania IIDX 지원, 곡 목록 필터 개편, 과제를 받는 레벨 구분
  lead: 이번 업데이트에서는 beatmania IIDX 지원, 곡 목록 필터 개편, 과제를 받는 레벨 구분, 스코어 어택의 가정용 참가, iPhone 홈 화면 위젯, 버그 신고 시 이미지·동영상 첨부 등을 추가했습니다.
  sections:
  - heading: beatmania IIDX 지원
    items:
    - title: 변속곡 채보 미리보기
      desc: 변속곡 대책을 플레이 전에 정할 수 있습니다. 실기와 같은 모습으로 채보를 흘려 보며, START 2회·스크래치 플릭을 넣을 위치와 그때의 녹색 숫자를 확인할 수 있습니다.
      media:
        type: video
        src: 52288a8f-625d-46b2-bc2d-4c6931a915b4.mp4
        poster: 52288a8f-625d-46b2-bc2d-4c6931a915b4.jpg
    - title: RANDOM 당첨 배치 기록
      desc: RANDOM 당첨 배치를 기록하고, 가지고 있는 랜덤 레인 티켓으로 노릴 수 있습니다. 보유 티켓을 등록하면 당첨 배치에 「당첨 랜덤 레인 티켓 있음」 표시가 붙습니다. 모두의 당첨 배치도 볼 수 있습니다.
      media:
        type: video
        src: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.mp4
        poster: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.jpg
    - title: 다른 기종과 같은 기능
      desc: 동기화·추천·곡 목록과 필터·티어표·목표·성장 보드(단위·ARENA) 등 다른 기종과 같은 기능을 IIDX에서도 쓸 수 있습니다.
      media:
        type: video
        src: 24994fce-e094-42ae-a421-b533e052ea43.mp4
        poster: 24994fce-e094-42ae-a421-b533e052ea43.jpg
    - title: 주의 사항
      list:
      - 통계의 초기값은 Tachi의 기록(SP 203명·DP 161명)입니다. T점수, 추천의 「플레이한 사람의 달성 ◯%」, 티어표의 단은 등록이 늘면 바뀝니다
      - 34 ZINRAI 신곡은 등록자가 20명이 될 때까지 통계가 비어 있습니다. 곡 상세의 「비교」에는 「데이터 준비 중」이 표시됩니다
      - 모두의 당첨 배치는 처음에는 비어 있습니다
      - 티어표는 재킷 대신 난이도 색·곡명·버전 로고 타일로 표시합니다. 표시 방식에 대한 요청은 신고 양식으로 받습니다
      - 자기 최고 기록을 갱신하지 않은 플레이의 점수와 SCORE CLASS·클리어율은 공식에서 가져올 수 없어 표시하지 않습니다
      - INFINITAS 가져오기는 아직 지원하지 않습니다
      - 채보 미리보기는 Lv8 이상이 대상입니다. 34 ZINRAI 신곡의 HYPER 80채보와 ANOTHER 9채보(Textage 미게재), 流桜ノ門과 月下繚乱의 DP ANOTHER(Textage 채보의 노트 수가 BEMANIWiki·Tachi·bm2dx보다 1개 많음)는 「채보 없음」입니다
  - heading: 곡 목록 필터
    items:
    - title: 막대그래프에서 레벨 선택
      desc: 전 기종의 필터를 새로 만들었습니다. 레벨은 채보 수 막대그래프 위에서 두 개의 손잡이를 움직여 범위를 지정합니다. SDVX는 18.2처럼 소수점 레벨마다 막대가 1개입니다.
      media:
        type: video
        src: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.mp4
        poster: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.jpg
    - title: 강점도와 레이더 주축
      desc: 강점도(강점·보통·약점)와 레이더 주축(SDVX·DDR·IIDX)으로 필터링할 수 있습니다.
      media:
        type: video
        src: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.mp4
        poster: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.jpg
    - title: DDR 플레어 랭크
      desc: 'DDR은 플레어 랭크로 필터링할 수 있습니다. 플레어 스킬의 성장 여지를 목표 플레어(예: IX)까지만 세는 설정도 추가했습니다.'
      media:
        type: video
        src: 7c3755c1-523d-4a1c-87df-a39633bb20a6.mp4
        poster: 7c3755c1-523d-4a1c-87df-a39633bb20a6.jpg
    - title: 버전·램프·그레이드 선택
      desc: 선택한 버전을 공식 로고로 표시합니다. 램프와 그레이드는 손가락으로 쓸어서 연속으로 선택할 수 있습니다.
  - heading: 과제
    items:
    - title: 받는 레벨 구분
      desc: 과제를 받는 레벨을 기종별로 「환영」「OK」「NG」 3단계로 칠해 구분할 수 있습니다. 손가락으로 쓸면 한꺼번에 칠할 수 있습니다.
      media:
        type: video
        src: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.mp4
        poster: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.jpg
    - title: 한마디와 표시
      desc: 과제를 받을 때의 한마디(28자까지)를 과제를 보내는 상대에게 표시합니다. 과제를 보내는 화면에서는 상대가 환영하는 레벨에 ★, NG인 레벨에 ⊘를 표시합니다.
      media:
        type: video
        src: 51eac85a-9176-4fc7-be23-17724d7ea4fe.mp4
        poster: 51eac85a-9176-4fc7-be23-17724d7ea4fe.jpg
    - title: 보낼 수 없는 과제와 중지 이유 표시
      desc: 상대가 이미 과제곡으로 등록한 채보는 과제로 보낼 수 없게 했습니다. 과제 받기를 중지한 이유가 겹칠 때는 더 세부적인 쪽(곡별, 기종별, 전체 순)의 이유를 상대에게 표시합니다. 전체를 중지한 동안에는 곡별 중지를 누를 수 없습니다.
      media:
        type: video
        src: 391403b4-d07b-479b-b387-441f1f80dc20.mp4
        poster: 391403b4-d07b-479b-b387-441f1f80dc20.jpg
    - title: pop'n music 메달 과제
      desc: 목표에 「이번 작품에서 클리어」와 메달을 추가했습니다. 클리어한 곡이라도 더 높은 메달을 목표로 설정할 수 있습니다.
      media:
        type: video
        src: 0dc319c1-4774-404c-b9c6-abcfc519fac0.mp4
        poster: 0dc319c1-4774-404c-b9c6-abcfc519fac0.jpg
    - title: SDVX 「플레이」 과제
      desc: 점수가 바뀌지 않은 플레이로는 「플레이」 과제가 달성되지 않던 오류를 수정했습니다.
  - heading: 스코어 어택
    items:
    - title: 가정용 참가
      desc: 만들 때 「가정용 참가」를 「허용」 또는 「AC만」 중에서 고를 수 있습니다.
      media:
        type: video
        src: a22daa9e-3a62-473f-896e-602fe1211be0.mp4
        poster: a22daa9e-3a62-473f-896e-602fe1211be0.jpg
    - title: 가정용 기록
      desc: 가정용 기록은 결과 화면 이미지를 첨부해 등록하며, 순위표 등에 「가정용」 표시가 붙습니다.
      media:
        type: video
        src: 1756fa74-0f7c-4350-bcee-01710a43ea53.mp4
        poster: 1756fa74-0f7c-4350-bcee-01710a43ea53.jpg
    - title: 코멘트 전체 표시
      desc: 코멘트를 「…」로 자르지 않고 전체를 표시합니다.
      media:
        type: image
        src: 0740e4db-82a6-4194-9e55-5504fec7ea37.webp
    - title: 진행 중 내용 수정
      desc: 주최자는 진행 중에도 제목·설명·기간·이미지를 바꿀 수 있습니다. 확정 후에는 기간을 제외하고 바꿀 수 있습니다.
      media:
        type: video
        src: 4a7caeb7-2330-4034-85b9-1b90668b714a.mp4
        poster: 4a7caeb7-2330-4034-85b9-1b90668b714a.jpg
    - title: 홈 표시 개수와 순서
      desc: 설정에서 홈에 표시할 스코어 어택의 개수(3·5·10개)와 순서(종료일이 가까운 순·최신순, 참가 중을 맨 앞에)를 고를 수 있습니다. 승인 대기 등의 건수 배지는 홈의 스코어 어택 제목에서 빼고, 각 스코어 어택 행에만 표시합니다.
      media:
        type: video
        src: 642ffadf-a612-4e22-99fb-9f2b14ce4408.mp4
        poster: 642ffadf-a612-4e22-99fb-9f2b14ce4408.jpg
  - heading: 성장
    items:
    - title: 홈 화면 위젯
      desc: iPhone 홈 화면 위젯에 성장 탭의 목표까지 남은 수치를 표시합니다(iOS 17 이상, 소·중 2가지 크기). 누르면 해당 목표 화면을 엽니다.
      media:
        type: image
        src: 4a844ac1-51c3-4630-ad08-a1a353a9dd91.webp
  - heading: 기종별
    items:
    - title: SDVX 판정 조정을 1ms씩
      desc: SDVX는 판정 조정을 ms로 표시할 때 1ms씩 움직여 입력할 수 있습니다.
      media:
        type: video
        src: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.mp4
        poster: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.jpg
    - title: GITADORA와 DDR의 기본값을 따로 설정
      desc: GITADORA는 GF와 DM, DDR은 SP와 DP로 판정 조정·표시 타이밍·하이스피드 기본값을 따로 설정할 수 있습니다(이전 버전의 값은 양쪽에 이어집니다).
      media:
        type: video
        src: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.mp4
        poster: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.jpg
    - title: DDR 채보 뷰어
      desc: 채보 뷰어에서 볼 수 있는 곡을 14곡 추가했습니다.
    - title: SDVX 소수점 레벨 티어표
      desc: Lv17 이상에서는 소수점 레벨(18.0·18.1…)의 티어표를 레벨 태그에서 여는 메뉴로 고를 수 있습니다.
      media:
        type: video
        src: 6a9b6b5d-d705-438e-b386-3884162eb28b.mp4
        poster: 6a9b6b5d-d705-438e-b386-3884162eb28b.jpg
    - title: GITADORA XG 기체 기록
      desc: XG 기체 버전의 기록도 가져옵니다. 양쪽에서 플레이한 채보는 달성률이 높은 쪽을 채택합니다.
    - title: 기타 변경
      list:
      - 'SDVX: 점수에 비해 너무 낮은 EX(PUC인데 EX가 낮은 경우 등)를 강점도와 통계에서 제외'
      - 'GITADORA: GF 탭의 파트 기본값을 「Gt+Ba」로 변경'
      - 'pop''n music: 곡 목록 상세 표시에서 많이 플레이하는 레벨대보다 아래 행을 흐리게 표시하던 것을 중지'
    - title: 오류 수정
      list:
      - 'SDVX: 곡 수가 적어 목록이 1페이지인 레벨에서 동기화가 실패하던 오류'
      - 'pop''n music: 동기화를 도중에 멈추면 성과의 팝픈 클래스 상승폭이 ±0이 되던 오류'
      - 'pop''n music: 메달 없음과 파란 메달 채보가 곡 상세·성장·스코어 어택·필터에서 미클리어로 처리되지 않던 오류'
  - heading: 전반 개선 및 오류 수정
    items:
    - title: 티어표에서 미클리어만 보기
      desc: 티어표에서 미클리어 곡만 보는 전환을 추가했습니다. 지표가 클리어가 아닐 때는 미달성 곡으로 좁힙니다.
      media:
        type: video
        src: 8262ffc5-8df6-477c-8c96-939e0cb22195.mp4
        poster: 8262ffc5-8df6-477c-8c96-939e0cb22195.jpg
    - title: 신고에 이미지와 동영상 첨부
      desc: 개발 요청·버그 등의 신고에 이미지 4장과 동영상 1개(60초까지)를 첨부할 수 있습니다.
      media:
        type: video
        src: 31eac384-d245-4cfa-9922-6aba382eced5.mp4
        poster: 31eac384-d245-4cfa-9922-6aba382eced5.jpg
    - title: 강점도 표시
      desc: 강점도를 0 이하나 100 초과도 실제 값으로 표시합니다. 50 미만은 내려가는 폭을 완만하게 하고, 「약점」 태그는 30 이하인 채보에만 표시합니다.
    - title: 기타
      list:
      - KONAMI ID로 다시 로그인했을 때 e-amusement 화면에서 멈추지 않고 바로 동기화를 시작
      - iPhone Duo에서 화면 가득 표시
      - 곡명의 ā·ī·Ō 등의 기호가 옆 글자로 밀리던 오류를 수정
      - 글자를 크게 했을 때 너무 작게 줄어들던 태그와 숫자를 수정
zh:
  title: 支援 beatmania IIDX，翻新樂曲一覽篩選，並可區分接受課題的等級
  lead: 本次更新支援 beatmania IIDX，翻新樂曲一覽篩選，可區分接受課題的等級，分數挑戰可從家用版參賽，新增 iPhone 主畫面小工具，問題回報也可附加圖片與影片。
  sections:
  - heading: 支援 beatmania IIDX
    items:
    - title: 變速曲的譜面預覽
      desc: 遊玩前就能決定變速曲的對策。以與實機相同的方式播放譜面，確認按 START 兩次、輕撥轉盤的位置，以及當時的綠色數字。
      media:
        type: video
        src: 52288a8f-625d-46b2-bc2d-4c6931a915b4.mp4
        poster: 52288a8f-625d-46b2-bc2d-4c6931a915b4.jpg
    - title: 記錄 RANDOM 好配置
      desc: 記錄 RANDOM 的好配置，並可用手上的 Random Lane Ticket 瞄準。登錄持有的票券後，好配置會顯示「有好配置的 Random Lane Ticket」標記。也能參考大家的好配置。
      media:
        type: video
        src: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.mp4
        poster: 8b84d9c9-32db-4ff3-a191-ca2929b61a71.jpg
    - title: 與其他機種相同的功能
      desc: 同步、推薦、樂曲一覽與篩選、Tier表、目標、成長看板（段位・ARENA）等，與其他機種相同的功能在 IIDX 也能使用。
      media:
        type: video
        src: 24994fce-e094-42ae-a421-b533e052ea43.mp4
        poster: 24994fce-e094-42ae-a421-b533e052ea43.jpg
    - title: 注意事項
      list:
      - 統計的初始值來自 Tachi 的紀錄（SP 203 人・DP 161 人）。T分數、推薦中的「遊玩者達成 ◯%」以及 Tier表的分段，會隨登錄人數增加而改變
      - 34 ZINRAI 的新曲在登錄者達到 20 人前，統計為空白。樂曲詳細的「比較」會顯示「資料準備中」
      - 大家的好配置一開始是空的
      - Tier表以難度顏色・曲名・版本標誌的方塊代替封面顯示。對呈現方式的需求可透過回報表單提出
      - 未更新個人最佳的遊玩分數，以及 SCORE CLASS・通關率，因無法從官方取得而不顯示
      - 尚未支援匯入 INFINITAS
      - 譜面預覽以 Lv8 以上為對象。34 ZINRAI 新曲的 HYPER 80 個譜面與 ANOTHER 9 個譜面（Textage 未收錄），以及流桜ノ門與月下繚乱的 DP ANOTHER（Textage 譜面的音符數比 BEMANIWiki・Tachi・bm2dx 多 1 個）為「無譜面」
  - heading: 樂曲一覽篩選
    items:
    - title: 在長條圖上選擇等級
      desc: 全面翻新所有機種的篩選。等級是在譜面數的長條圖上移動兩個滑桿來選取範圍。SDVX 以 18.2 這樣的小數點等級各為 1 條。
      media:
        type: video
        src: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.mp4
        poster: 3ed2b854-503e-4377-bd2b-1ad2f112eea8.jpg
    - title: 擅長度與雷達主軸
      desc: 可依擅長度（擅長・普通・不擅長）與雷達主軸（SDVX・DDR・IIDX）篩選。
      media:
        type: video
        src: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.mp4
        poster: 378ebced-26cd-4ffd-9fe0-d960ca6915fc.jpg
    - title: DDR Flare 等級
      desc: DDR 可依 Flare 等級篩選。也新增了只計算到目標 Flare（例：IX）為止的 Flare Skill 提升空間的設定。
      media:
        type: video
        src: 7c3755c1-523d-4a1c-87df-a39633bb20a6.mp4
        poster: 7c3755c1-523d-4a1c-87df-a39633bb20a6.jpg
    - title: 版本・燈號・評級的選擇
      desc: 選取的版本以官方標誌顯示。燈號與評級可用手指滑過連續選取。
  - heading: 課題
    items:
    - title: 區分接受的等級
      desc: 可依機種將接受課題的等級塗成「歡迎」「OK」「NG」三個階段。用手指滑過即可一次塗好。
      media:
        type: video
        src: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.mp4
        poster: 21ea1f7a-e609-432b-aa95-d3b06aca7f17.jpg
    - title: 留言與標記
      desc: 接受課題的留言（最多 28 字）會顯示給發送課題的對方。在發送課題的畫面上，對方歡迎的等級顯示★，NG 的等級顯示⊘。
      media:
        type: video
        src: 51eac85a-9176-4fc7-be23-17724d7ea4fe.mp4
        poster: 51eac85a-9176-4fc7-be23-17724d7ea4fe.jpg
    - title: 無法發送的課題與暫停原因的顯示
      desc: 對方已登錄為課題曲的譜面，無法再作為課題發送。暫停接收課題的原因重疊時，會向對方顯示較細的原因（依樂曲、機種、全部的順序）。全部暫停期間，無法按下依樂曲暫停。
      media:
        type: video
        src: 391403b4-d07b-479b-b387-441f1f80dc20.mp4
        poster: 391403b4-d07b-479b-b387-441f1f80dc20.jpg
    - title: pop'n music 獎章課題
      desc: 目標新增「於本作通關」與獎章。即使是已通關的樂曲，也能以更高的獎章為目標。
      media:
        type: video
        src: 0dc319c1-4774-404c-b9c6-abcfc519fac0.mp4
        poster: 0dc319c1-4774-404c-b9c6-abcfc519fac0.jpg
    - title: SDVX「遊玩」課題
      desc: 修正分數沒有變化的遊玩無法達成「遊玩」課題的問題。
  - heading: 分數挑戰
    items:
    - title: 家用版參賽
      desc: 建立時可從「允許」或「僅限 AC」中選擇是否接受家用版參賽。
      media:
        type: video
        src: a22daa9e-3a62-473f-896e-602fe1211be0.mp4
        poster: a22daa9e-3a62-473f-896e-602fe1211be0.jpg
    - title: 家用版的紀錄
      desc: 家用版的紀錄需附上結算畫面圖片登錄，並在排行榜等處顯示「家用版」標記。
      media:
        type: video
        src: 1756fa74-0f7c-4350-bcee-01710a43ea53.mp4
        poster: 1756fa74-0f7c-4350-bcee-01710a43ea53.jpg
    - title: 完整顯示留言
      desc: 留言不再以「…」截斷，會完整顯示。
      media:
        type: image
        src: 0740e4db-82a6-4194-9e55-5504fec7ea37.webp
    - title: 活動進行中修改內容
      desc: 主辦者在活動進行中也能修改標題・說明・期間・圖片。結果確定後，期間以外的項目仍可修改。
      media:
        type: video
        src: 4a7caeb7-2330-4034-85b9-1b90668b714a.mp4
        poster: 4a7caeb7-2330-4034-85b9-1b90668b714a.jpg
    - title: 首頁顯示數量與排序
      desc: 可在設定中選擇首頁顯示的分數挑戰數量（3・5・10 個）與排序（結束日期近的優先・最新優先，參加中置頂）。待審核等件數標記已從首頁的分數挑戰標題移除，只顯示在各分數挑戰的列上。
      media:
        type: video
        src: 642ffadf-a612-4e22-99fb-9f2b14ce4408.mp4
        poster: 642ffadf-a612-4e22-99fb-9f2b14ce4408.jpg
  - heading: 成長
    items:
    - title: 主畫面小工具
      desc: iPhone 主畫面小工具顯示距離成長分頁目標的剩餘進度（iOS 17 以上，小・中 2 種尺寸）。點擊即可開啟該目標的畫面。
      media:
        type: image
        src: 4a844ac1-51c3-4630-ad08-a1a353a9dd91.webp
  - heading: 各機種
    items:
    - title: SDVX 判定調整可 1ms 調整
      desc: SDVX 以 ms 顯示判定調整時，可每次移動 1ms 輸入。
      media:
        type: video
        src: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.mp4
        poster: 07e8b671-d2e2-4958-a7f2-f56c57932bb9.jpg
    - title: GITADORA 與 DDR 分開設定預設值
      desc: GITADORA 的 GF 與 DM、DDR 的 SP 與 DP，可分別設定判定調整・顯示時機・Hi-Speed 的預設值（前一版的值會沿用到兩者）。
      media:
        type: video
        src: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.mp4
        poster: 8bec3147-a378-41f5-9a3f-3f1b2054d44d.jpg
    - title: DDR 譜面檢視器
      desc: 譜面檢視器可查看的樂曲增加了 14 首。
    - title: SDVX 小數點等級的 Tier表
      desc: Lv17 以上可從等級標籤開啟的選單中，選擇小數點等級（18.0・18.1…）的 Tier表。
      media:
        type: video
        src: 6a9b6b5d-d705-438e-b386-3884162eb28b.mp4
        poster: 6a9b6b5d-d705-438e-b386-3884162eb28b.jpg
    - title: GITADORA XG 機台紀錄
      desc: 也會匯入 XG 機台版本的紀錄。兩邊都玩過的譜面，採用達成率較高的一方。
    - title: 其他變更
      list:
      - SDVX：從分數來看過低的 EX（明明 PUC 但 EX 偏低等）會從擅長度與統計中排除
      - GITADORA：GF 分頁的預設部分改為「Gt+Ba」
      - pop'n music：樂曲一覽的詳細顯示中，不再淡化顯示低於常玩等級區間的列
    - title: 錯誤修正
      list:
      - SDVX：樂曲數少、列表只有 1 頁的等級同步失敗的問題
      - pop'n music：中途停止同步時，成果的 pop'n Class 提升顯示為 ±0 的問題
      - pop'n music：無獎章與藍獎章的譜面在樂曲詳細・成長・分數挑戰・篩選中未被視為未通關的問題
  - heading: 整體改善與錯誤修正
    items:
    - title: Tier表只看未通關
      desc: Tier表新增只顯示未通關樂曲的切換。指標不是通關時，會篩選出未達成的樂曲。
      media:
        type: video
        src: 8262ffc5-8df6-477c-8c96-939e0cb22195.mp4
        poster: 8262ffc5-8df6-477c-8c96-939e0cb22195.jpg
    - title: 回報可附加圖片與影片
      desc: 開發需求・問題等回報可附加 4 張圖片與 1 段影片（最長 60 秒）。
      media:
        type: video
        src: 31eac384-d245-4cfa-9922-6aba382eced5.mp4
        poster: 31eac384-d245-4cfa-9922-6aba382eced5.jpg
    - title: 擅長度的顯示
      desc: 擅長度在 0 以下或超過 100 時也顯示實際數值。低於 50 時下降幅度變得平緩，「不擅長」標記只顯示在 30 以下的譜面。
    - title: 其他
      list:
      - 以 KONAMI ID 重新登入時，不會停在 e-amusement 畫面，直接開始同步
      - 在 iPhone Duo 上全螢幕顯示
      - 修正曲名中 ā・ī・Ō 等符號偏移到相鄰文字的問題
      - 修正放大文字時標籤與數字縮得過小的問題
