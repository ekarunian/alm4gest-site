id: "2026-10-24"
kind: release
version: "1.2.20261024"
date: "2026-10-23"
ja:
  title: "スコアタでDDR・GITADORAの通しを同期で自動登録するようにし、SDVXの判定調整のms表示を修正しました"
  sections:
    - heading: "スコアタ"
      items:
        - title: "通しの自動登録"
          desc: "DDR（通常スコア）とGITADORAの通しは、課題曲を並び順どおり続けて遊ぶと、同期で自動登録されるように変更しました。"
    - heading: "SDVXの判定調整"
      items:
        - title: "1目盛のms表示"
          desc: "判定調整の1目盛は4msなのに2msとして表示していたのを修正しました。入れてある値の目盛の数字はそのままで、横に出るmsが2倍になります。"
        - title: "表示と入力の単位"
          desc: "判定調整を「単位なし」と「ms」のどちらで表示・入力するかを設定で選べるようにしました。"
en:
  title: "Score Attack runs in DDR and GITADORA now register on sync, and SDVX judge timing shows the correct ms"
  sections:
    - heading: "Score Attack"
      items:
        - title: "Automatic registration of runs"
          desc: "DDR (normal score) and GITADORA runs now register automatically on sync when you play the assigned songs back to back in list order."
    - heading: "SDVX judge timing"
      items:
        - title: "ms per step"
          desc: "Fixed judge timing adjustment showing 1 step as 2ms instead of 4ms. Saved step values remain unchanged, and the displayed ms is now doubled."
        - title: "Display and input unit"
          desc: "You can now choose in Settings whether judge timing adjustment is displayed and entered in Step or ms."
ko:
  title: "스코어 어택에서 DDR・GITADORA의 연속 플레이를 동기화 시 자동 등록하고, SDVX 판정 조정의 ms 표시를 수정했습니다"
  sections:
    - heading: "스코어 어택"
      items:
        - title: "연속 플레이 자동 등록"
          desc: "DDR(일반 점수)과 GITADORA의 연속 플레이는 과제곡을 순서대로 이어서 플레이하면 동기화 시 자동 등록되도록 변경했습니다."
    - heading: "SDVX 판정 조정"
      items:
        - title: "1스텝의 ms 표시"
          desc: "판정 조정 1스텝이 4ms이나 2ms로 표시되던 오류를 수정했습니다. 저장된 스텝 값은 유지되며, 옆에 표시되는 ms는 2배가 됩니다."
        - title: "표시・입력 단위"
          desc: "판정 조정을 「스텝」 또는 「ms」로 표시·입력할 수 있는 설정을 추가했습니다."
zh:
  title: "分數挑戰的 DDR・GITADORA 連續遊玩改為同步時自動登錄，並修正 SDVX 判定調整的 ms 顯示"
  sections:
    - heading: "分數挑戰"
      items:
        - title: "連續遊玩自動登錄"
          desc: "DDR（一般分數）與 GITADORA 的連續遊玩，改為依序接連遊玩課題曲後，同步時自動登錄。"
    - heading: "SDVX 判定調整"
      items:
        - title: "1 格的 ms 顯示"
          desc: "修正判定調整 1 格應為 4ms 卻顯示為 2ms 的問題。已設定的數值維持不變，旁邊顯示的 ms 將變為 2 倍。"
        - title: "顯示與輸入的單位"
          desc: "可在設定中選擇判定調整以「數值」或「ms」顯示與輸入。"
