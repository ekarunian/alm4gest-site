id: "2026-10-23"
kind: release
version: "1.2.20261023"
date: "2026-10-21"
ja:
  title: "得意度と新しい偏差値、楽曲詳細のタブ化、譜面攻略メモの共有、スコアタの通しを追加しました"
  lead: "得意度と新しい偏差値で統計を作り直し、楽曲詳細をタブに分けました。譜面攻略メモの共有、プロフィールのリンク、スコアタの通しとリザルト写真からのスコア読み取りを加え、不具合を修正しました。"
  sections:
    - heading: "統計（得意度と偏差値）"
      items:
        - title: "得意度と新しい偏差値"
          desc: "譜面ごとの得意・苦手を示す「得意度」を追加しました。同じレベルの他の譜面での自分の成績から予想点を見込み、実際の点数と比べます。50が予想どおり、70以上が得意、30以下が苦手です。"
          list:
            - "偏差値を、同じ実力帯の人の中での位置として計算し直しました"
            - "曲一覧の並び替えに得意度順を追加しました。SDVX は通常とEXの両方で偏差値順・得意度順を選べます"
          media: {type: "video", src: "531b63d5-8147-486f-9828-55ee417dbea1.mp4", poster: "531b63d5-8147-486f-9828-55ee417dbea1.jpg"}
        - title: "弱点分析"
          list:
            - "弱点分析とホームの弱点カードを得意度に切り替え、弱点分析の曲から楽曲詳細を開けるようにしました"
            - "DDR の弱点分析で、伸ばせる量を総合フレアスキルの実際の増分で表示します"
    - heading: "楽曲詳細と譜面攻略メモ"
      items:
        - title: "4つのタブに作り直し"
          desc: "楽曲詳細を「概要」「比較」「スコア履歴」「その他」の4タブに分けて作り直しました。"
          list:
            - "偏差値の比較バーを作り直し、自分と実力帯の値と差を印の真上に表示します"
            - "スコア履歴を表にし、最新の行を強調します"
            - "メモの見出しを「自分用メモ」「皆の譜面攻略情報」に変えました"
          media: {type: "video", src: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.mp4", poster: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.jpg"}
        - title: "譜面攻略メモを共有"
          desc: "楽曲詳細から譜面の攻略メモや感想を投稿し、ほかの利用者と共有できます。"
          list:
            - "攻略・感想で絞り込み、参考順・新しい順で並べ替えできます"
            - "いいね（1人1回）、報告・削除に対応しています"
          media: {type: "video", src: "00c458e4-e97c-4af5-8f81-68fe77990ace.mp4", poster: "00c458e4-e97c-4af5-8f81-68fe77990ace.jpg"}
    - heading: "プロフィールとフレンド"
      items:
        - title: "SNSなどのリンクを5件まで"
          desc: "プロフィールにSNSなどのリンクを5件まで載せられます。名刺のコードの行にサービスの印が並び、押すと一覧を表示します。"
          media: {type: "video", src: "04218d8a-59df-4827-a27d-da24fec687d8.mp4", poster: "04218d8a-59df-4827-a27d-da24fec687d8.jpg"}
        - title: "フレンド詳細の数字"
          desc: "フレンド詳細で、長い数字を1行に収めて表示します。"
    - heading: "スコアタ"
      items:
        - title: "3〜4曲の通し"
          desc: "3〜4曲を1回の通しで競うルールを追加しました。全曲のスコアとトータルリザルト画像1枚をまとめて提出します。"
          media: {type: "video", src: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.mp4", poster: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.jpg"}
        - title: "リザルト写真からスコアを読み取る"
          desc: "リザルト写真を選ぶと、端末内で文字を読み取ってスコア欄へ入力します。結果画像は切り取らずに縮小して表示します。"
          media: {type: "video", src: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.mp4", poster: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.jpg"}
        - title: "通しのトータルリザルトを読み取る"
          desc: "通しのトータルリザルトは、曲名で課題曲に照合します。"
          media: {type: "video", src: "10012f07-75f0-4333-b487-e3821d326d6d.mp4", poster: "10012f07-75f0-4333-b487-e3821d326d6d.jpg"}
    - heading: "pop'n music"
      items:
        - title: "Tier表を解禁曲で絞り込む"
          desc: "Tier表を「全曲」「最初から」「解禁」で絞り込めます。"
          media: {type: "video", src: "274fa5e4-d1c7-4491-89da-1b25851d0f32.mp4", poster: "274fa5e4-d1c7-4491-89da-1b25851d0f32.jpg"}
        - title: "銅・銀の段を追加"
          desc: "Tier表の観点と成長の目標に、銅◆・銅★・銀◆・銀★の段を追加しました。"
          media: {type: "image", src: "0e9b49e3-ed62-4dda-b4d9-a5d878e98716.webp"}
        - title: "銅◆難度のTier表"
          desc: "観点を銅◆難度にしたTier表です。"
          media: {type: "image", src: "7c210651-663e-44fd-8b49-0d705975dc12.webp"}
    - heading: "成長の目標"
      items:
        - title: "割合でも目標を決められる"
          desc: "目標を割合（達成率）でも決められるようにしました。曲数と割合を併記します。"
          media: {type: "video", src: "9acbec84-1e4f-4063-972c-5af3460f6aa6.mp4", poster: "9acbec84-1e4f-4063-972c-5af3460f6aa6.jpg"}
    - heading: "SDVX の判定調整"
      items:
        - title: "判定調整（音）"
          desc: "判定調整を、目盛（±50、1目盛2ms）とmsの併記で表示します。1目盛は正しくは4msで、次の版 1.2.20261024 で訂正しました。"
          media: {type: "image", src: "452212e0-bad3-4ce9-83b7-ccf31a920590.webp"}
        - title: "判定調整（描画）"
          desc: "描画の判定調整も、目盛とmsを併記します。"
          media: {type: "image", src: "59dfd802-6f91-415b-bb7c-9a2994556950.webp"}
    - heading: "全般の改善と不具合修正"
      items:
        - title: "入力中のシートを閉じない"
          desc: "入力を変えたシートは、下へ引いても閉じないようにしました。シートの外を押すと確認を表示します。"
          media: {type: "video", src: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.mp4", poster: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.jpg"}
        - title: "課題の通知"
          desc: "ホームに出していない機種へ届いた課題も、通知を開くと印が消えるようにしました。"
        - title: "その他の改善と修正"
          list:
            - "DDR の前回差分で、最近プレーした曲の古いほうの更新が取り込まれない不具合を修正しました"
            - "CSV の日付を表計算ソフトの形式でも読めるようにしました"
            - "フレンドのプロフィール表示、曲一覧画像の撮影中、Android のデータベースのロックで落ちる不具合を修正しました"
en:
  title: "Strength and new T-scores, tabbed song details, community tips and multi-song Score Attack runs"
  lead: "This release rebuilds the stats around a new Strength score and recalculated T-scores, and splits song details into tabs. It also adds community tips, profile links, multi-song Score Attack runs and reading scores from result photos, and fixes several bugs."
  sections:
    - heading: "Stats (Strength and T-scores)"
      items:
        - title: "Strength and new T-scores"
          desc: "A new \"Strength\" score shows how strong or weak you are on each chart. It estimates your expected score from your results on other charts of the same level and compares it with your actual score. 50 means as expected, 70 or more is strong, and 30 or less is weak."
          list:
            - "T-scores are recalculated as your position among players of a similar skill level"
            - "The song list can be sorted by Strength. In SDVX, both T-score and Strength sorting are available for normal and EX scores"
          media: {type: "video", src: "531b63d5-8147-486f-9828-55ee417dbea1.mp4", poster: "531b63d5-8147-486f-9828-55ee417dbea1.jpg"}
        - title: "Weakness analysis"
          list:
            - "Weakness analysis and the home weakness card now use Strength, and songs in the weakness analysis open their song details"
            - "DDR weakness analysis shows potential gains as the actual increase to your total Flare Skill"
    - heading: "Song details and community tips"
      items:
        - title: "Rebuilt with four tabs"
          desc: "Song details are rebuilt with four tabs: \"Overview\", \"Compare\", \"History\" and \"More\"."
          list:
            - "The T-score comparison bar is redesigned, showing your value, the middle of your skill level and the difference right above each marker"
            - "Score history is shown as a table with the latest row highlighted"
            - "Memo headings are now \"My notes\" and \"Community tips\""
          media: {type: "video", src: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.mp4", poster: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.jpg"}
        - title: "Share chart tips"
          desc: "Post tips or thoughts on a chart from song details and share them with other players."
          list:
            - "Filter by \"Tips\" or \"Thoughts\", and sort by \"Most helpful\" or \"Newest\""
            - "Give a like (once per person), and report or delete posts"
          media: {type: "video", src: "00c458e4-e97c-4af5-8f81-68fe77990ace.mp4", poster: "00c458e4-e97c-4af5-8f81-68fe77990ace.jpg"}
    - heading: "Profile and friends"
      items:
        - title: "Up to 5 links"
          desc: "Profiles can show up to 5 links, such as social media accounts. Service icons appear in the code row of your card, and tapping them opens the list."
          media: {type: "video", src: "04218d8a-59df-4827-a27d-da24fec687d8.mp4", poster: "04218d8a-59df-4827-a27d-da24fec687d8.jpg"}
        - title: "Numbers in friend details"
          desc: "Long numbers in friend details fit on one line."
    - heading: "Score Attack"
      items:
        - title: "3-4 song runs"
          desc: "A new rule lets players compete on 3-4 songs in one run. Submit all song scores together with one total result image."
          media: {type: "video", src: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.mp4", poster: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.jpg"}
        - title: "Read scores from result photos"
          desc: "Choose a result photo, and the text is read on your device and filled into the score fields. Result images are shown scaled down instead of cropped."
          media: {type: "video", src: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.mp4", poster: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.jpg"}
        - title: "Read a run's total result"
          desc: "For a run's total result, songs are matched to the target songs by title."
          media: {type: "video", src: "10012f07-75f0-4333-b487-e3821d326d6d.mp4", poster: "10012f07-75f0-4333-b487-e3821d326d6d.jpg"}
    - heading: "pop'n music"
      items:
        - title: "Filter Tier Lists by unlocks"
          desc: "Tier Lists can be filtered by \"All\", \"Default\" and \"Unlocks\"."
          media: {type: "video", src: "274fa5e4-d1c7-4491-89da-1b25851d0f32.mp4", poster: "274fa5e4-d1c7-4491-89da-1b25851d0f32.jpg"}
        - title: "Bronze and silver tiers"
          desc: "Tier List views and growth goals include bronze ◆, bronze ★, silver ◆ and silver ★ tiers."
          media: {type: "image", src: "0e9b49e3-ed62-4dda-b4d9-a5d878e98716.webp"}
        - title: "Tier List by bronze ◆ difficulty"
          desc: "A Tier List with the view set to bronze ◆ difficulty."
          media: {type: "image", src: "7c210651-663e-44fd-8b49-0d705975dc12.webp"}
    - heading: "Growth goals"
      items:
        - title: "Goals as a percentage"
          desc: "Goals can also be set as a percentage (completion rate). Both the song count and the percentage are shown."
          media: {type: "video", src: "9acbec84-1e4f-4063-972c-5af3460f6aa6.mp4", poster: "9acbec84-1e4f-4063-972c-5af3460f6aa6.jpg"}
    - heading: "SDVX timing adjustment"
      items:
        - title: "Timing adjustment (audio)"
          desc: "Timing adjustment is shown as steps (±50, 1 step = 2 ms) together with ms. One step is actually 4 ms; this was corrected in the next version, 1.2.20261024."
          media: {type: "image", src: "452212e0-bad3-4ce9-83b7-ccf31a920590.webp"}
        - title: "Timing adjustment (visual)"
          desc: "Visual timing adjustment also shows steps together with ms."
          media: {type: "image", src: "59dfd802-6f91-415b-bb7c-9a2994556950.webp"}
    - heading: "General improvements and fixes"
      items:
        - title: "Sheets stay open while editing"
          desc: "Sheets with edited input no longer close when you swipe down. Tapping outside the sheet asks for confirmation."
          media: {type: "video", src: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.mp4", poster: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.jpg"}
        - title: "Challenge notifications"
          desc: "Challenges sent to a game not shown on your home screen now clear their badge when you open the notification."
        - title: "Other improvements and fixes"
          list:
            - "Fixed an issue in DDR where \"Since last sync\" missed older updates on recently played songs"
            - "Spreadsheet-formatted dates in CSV files can now be read"
            - "Fixed crashes in friend profiles, while capturing song list images, and from Android database locks"
ko:
  title: "강점도와 새 T점수, 곡 상세 탭 구성, 채보 공략 메모 공유, 스코어 어택 연속 플레이 추가"
  lead: "강점도와 새 T점수로 통계를 새로 구성하고, 곡 상세를 탭으로 나누었습니다. 채보 공략 메모 공유, 프로필 링크, 스코어 어택 연속 플레이와 결과 사진에서 점수 읽기를 추가하고, 오류를 수정했습니다."
  sections:
    - heading: "통계(강점도와 T점수)"
      items:
        - title: "강점도와 새 T점수"
          desc: "채보별 강점과 약점을 보여주는 「강점도」를 추가했습니다. 같은 레벨의 다른 채보에서의 자신의 성적으로 예상 점수를 구하고, 실제 점수와 비교합니다. 50이 예상대로, 70 이상이 강점, 30 이하가 약점입니다."
          list:
            - "T점수를 비슷한 실력대 사람들 사이에서의 위치로 다시 계산했습니다"
            - "곡 목록 정렬에 강점도순을 추가했습니다. SDVX는 일반과 EX 모두 T점수순·강점도순을 고를 수 있습니다"
          media: {type: "video", src: "531b63d5-8147-486f-9828-55ee417dbea1.mp4", poster: "531b63d5-8147-486f-9828-55ee417dbea1.jpg"}
        - title: "약점 분석"
          list:
            - "약점 분석과 홈의 약점 카드를 강점도 기준으로 바꾸고, 약점 분석의 곡에서 곡 상세를 열 수 있게 했습니다"
            - "DDR 약점 분석에서 올릴 수 있는 양을 총합 플레어 스킬의 실제 증가분으로 표시합니다"
    - heading: "곡 상세와 채보 공략 메모"
      items:
        - title: "4개 탭으로 새로 구성"
          desc: "곡 상세를 「개요」「비교」「이력」「기타」 4개 탭으로 나누어 새로 구성했습니다."
          list:
            - "T점수 비교 바를 새로 만들어, 자신과 실력대의 값과 차이를 표시 바로 위에 보여줍니다"
            - "스코어 이력을 표로 바꾸고 최신 행을 강조합니다"
            - "메모 제목을 「내 메모」「모두의 채보 공략 정보」로 바꾸었습니다"
          media: {type: "video", src: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.mp4", poster: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.jpg"}
        - title: "채보 공략 메모 공유"
          desc: "곡 상세에서 채보 공략 메모나 감상을 올려 다른 유저와 공유할 수 있습니다."
          list:
            - "공략·감상으로 필터링하고, 추천순·최신순으로 정렬할 수 있습니다"
            - "좋아요(1인 1회), 신고·삭제를 지원합니다"
          media: {type: "video", src: "00c458e4-e97c-4af5-8f81-68fe77990ace.mp4", poster: "00c458e4-e97c-4af5-8f81-68fe77990ace.jpg"}
    - heading: "프로필과 친구"
      items:
        - title: "SNS 등 링크 최대 5개"
          desc: "프로필에 SNS 등의 링크를 최대 5개까지 표시할 수 있습니다. 명함의 코드 줄에 서비스 아이콘이 나란히 표시되고, 누르면 목록이 열립니다."
          media: {type: "video", src: "04218d8a-59df-4827-a27d-da24fec687d8.mp4", poster: "04218d8a-59df-4827-a27d-da24fec687d8.jpg"}
        - title: "친구 상세의 숫자"
          desc: "친구 상세에서 긴 숫자를 한 줄에 맞춰 표시합니다."
    - heading: "스코어 어택"
      items:
        - title: "3~4곡 연속 플레이"
          desc: "3~4곡을 한 번의 연속 플레이로 겨루는 규칙을 추가했습니다. 모든 곡의 점수와 토털 결과 이미지 1장을 함께 제출합니다."
          media: {type: "video", src: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.mp4", poster: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.jpg"}
        - title: "결과 사진에서 점수 읽기"
          desc: "결과 사진을 고르면 기기 안에서 문자를 읽어 점수 칸에 입력합니다. 결과 이미지는 자르지 않고 축소해 표시합니다."
          media: {type: "video", src: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.mp4", poster: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.jpg"}
        - title: "연속 플레이의 토털 결과 읽기"
          desc: "연속 플레이의 토털 결과는 곡명으로 과제곡과 대조합니다."
          media: {type: "video", src: "10012f07-75f0-4333-b487-e3821d326d6d.mp4", poster: "10012f07-75f0-4333-b487-e3821d326d6d.jpg"}
    - heading: "pop'n music"
      items:
        - title: "티어표 해금곡 필터"
          desc: "티어표를 「전곡」「처음부터」「해금」으로 필터링할 수 있습니다."
          media: {type: "video", src: "274fa5e4-d1c7-4491-89da-1b25851d0f32.mp4", poster: "274fa5e4-d1c7-4491-89da-1b25851d0f32.jpg"}
        - title: "동·은 단계 추가"
          desc: "티어표의 관점과 성장 목표에 동◆·동★·은◆·은★ 단계를 추가했습니다."
          media: {type: "image", src: "0e9b49e3-ed62-4dda-b4d9-a5d878e98716.webp"}
        - title: "동◆ 난이도 티어표"
          desc: "관점을 동◆ 난이도로 설정한 티어표입니다."
          media: {type: "image", src: "7c210651-663e-44fd-8b49-0d705975dc12.webp"}
    - heading: "성장 목표"
      items:
        - title: "비율로도 목표 설정"
          desc: "목표를 비율(달성률)로도 정할 수 있게 했습니다. 곡 수와 비율을 함께 표시합니다."
          media: {type: "video", src: "9acbec84-1e4f-4063-972c-5af3460f6aa6.mp4", poster: "9acbec84-1e4f-4063-972c-5af3460f6aa6.jpg"}
    - heading: "SDVX 판정 조정"
      items:
        - title: "판정 조정(소리)"
          desc: "판정 조정을 스텝(±50, 1스텝 2ms)과 ms를 함께 표시합니다. 1스텝은 실제로는 4ms이며, 다음 버전 1.2.20261024에서 정정했습니다."
          media: {type: "image", src: "452212e0-bad3-4ce9-83b7-ccf31a920590.webp"}
        - title: "판정 조정(화면)"
          desc: "화면 판정 조정도 스텝과 ms를 함께 표시합니다."
          media: {type: "image", src: "59dfd802-6f91-415b-bb7c-9a2994556950.webp"}
    - heading: "전반적인 개선과 오류 수정"
      items:
        - title: "입력 중인 시트가 닫히지 않음"
          desc: "입력을 바꾼 시트는 아래로 끌어도 닫히지 않게 했습니다. 시트 바깥을 누르면 확인 창을 표시합니다."
          media: {type: "video", src: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.mp4", poster: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.jpg"}
        - title: "과제 알림"
          desc: "홈에 표시하지 않은 기종으로 온 과제도 알림을 열면 표시가 사라지게 했습니다."
        - title: "기타 개선과 수정"
          list:
            - "DDR 「지난 동기화 이후」에서 최근 플레이한 곡의 이전 갱신이 누락되던 오류를 수정했습니다"
            - "CSV의 날짜를 스프레드시트 형식으로도 읽을 수 있게 했습니다"
            - "친구 프로필 표시, 곡 목록 이미지 촬영 중, Android 데이터베이스 잠금으로 앱이 종료되던 오류를 수정했습니다"
zh:
  title: "新增擅長度與新的 T分數、樂曲詳細分頁、譜面攻略筆記分享，以及分數挑戰的連續遊玩"
  lead: "以擅長度與新的 T分數重新設計統計，並將樂曲詳細改為分頁。新增譜面攻略筆記分享、個人檔案連結、分數挑戰的連續遊玩與從結算照片讀取分數，並修正了問題。"
  sections:
    - heading: "統計（擅長度與 T分數）"
      items:
        - title: "擅長度與新的 T分數"
          desc: "新增顯示各譜面擅長程度的「擅長度」。依自己在同等級其他譜面的成績推估預期分數，再與實際分數比較。50 代表符合預期，70 以上為擅長，30 以下為不擅長。"
          list:
            - "T分數改以在相近實力區間玩家中的位置重新計算"
            - "樂曲一覽排序新增擅長度排序。SDVX 的一般與 EX 皆可選擇 T分數排序與擅長度排序"
          media: {type: "video", src: "531b63d5-8147-486f-9828-55ee417dbea1.mp4", poster: "531b63d5-8147-486f-9828-55ee417dbea1.jpg"}
        - title: "弱點分析"
          list:
            - "弱點分析與首頁的弱點卡片改用擅長度，並可從弱點分析的樂曲開啟樂曲詳細"
            - "DDR 的弱點分析，以總 Flare Skill 的實際增加量顯示可提升的幅度"
    - heading: "樂曲詳細與譜面攻略筆記"
      items:
        - title: "改為 4 個分頁"
          desc: "樂曲詳細改為「概要」「比較」「紀錄」「其他」4 個分頁。"
          list:
            - "重新設計 T分數比較條，在標記正上方顯示自己與實力區間的數值及差距"
            - "分數紀錄改為表格，並強調最新一列"
            - "筆記標題改為「自己的筆記」「大家的譜面攻略資訊」"
          media: {type: "video", src: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.mp4", poster: "5073d6a1-2b2d-4465-83ca-480cd7f90f06.jpg"}
        - title: "分享譜面攻略筆記"
          desc: "可從樂曲詳細發布譜面攻略筆記或心得，並與其他玩家分享。"
          list:
            - "可依攻略・心得篩選，並依參考程度・最新排序"
            - "支援按讚（每人 1 次）、檢舉・刪除"
          media: {type: "video", src: "00c458e4-e97c-4af5-8f81-68fe77990ace.mp4", poster: "00c458e4-e97c-4af5-8f81-68fe77990ace.jpg"}
    - heading: "個人檔案與好友"
      items:
        - title: "最多 5 個連結"
          desc: "個人檔案最多可放 5 個社群網站等連結。名片的代碼列會排列服務圖示，點按即可顯示列表。"
          media: {type: "video", src: "04218d8a-59df-4827-a27d-da24fec687d8.mp4", poster: "04218d8a-59df-4827-a27d-da24fec687d8.jpg"}
        - title: "好友詳細的數字"
          desc: "好友詳細中較長的數字會收在一行內顯示。"
    - heading: "分數挑戰"
      items:
        - title: "連續遊玩 3～4 首"
          desc: "新增以一次連續遊玩 3～4 首來競爭的規則。全部樂曲的分數與 1 張總結算圖片一起提交。"
          media: {type: "video", src: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.mp4", poster: "d1ebb3f7-1ebd-464e-9e1a-b8747db93971.jpg"}
        - title: "從結算照片讀取分數"
          desc: "選擇結算照片後，會在裝置內讀取文字並填入分數欄。結算圖片不裁切，縮小後顯示。"
          media: {type: "video", src: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.mp4", poster: "9ea3b004-6726-4f26-97eb-ca87a60dfb9d.jpg"}
        - title: "讀取連續遊玩的總結算"
          desc: "連續遊玩的總結算會以曲名對照課題曲。"
          media: {type: "video", src: "10012f07-75f0-4333-b487-e3821d326d6d.mp4", poster: "10012f07-75f0-4333-b487-e3821d326d6d.jpg"}
    - heading: "pop'n music"
      items:
        - title: "Tier表可篩選解鎖曲"
          desc: "Tier表可依「全曲」「初始」「解鎖」篩選。"
          media: {type: "video", src: "274fa5e4-d1c7-4491-89da-1b25851d0f32.mp4", poster: "274fa5e4-d1c7-4491-89da-1b25851d0f32.jpg"}
        - title: "新增銅、銀分級"
          desc: "Tier表的觀點與成長目標，新增銅◆・銅★・銀◆・銀★分級。"
          media: {type: "image", src: "0e9b49e3-ed62-4dda-b4d9-a5d878e98716.webp"}
        - title: "銅◆難度的 Tier表"
          desc: "觀點設為銅◆難度的 Tier表。"
          media: {type: "image", src: "7c210651-663e-44fd-8b49-0d705975dc12.webp"}
    - heading: "成長目標"
      items:
        - title: "也可用百分比設定目標"
          desc: "目標也可用百分比（達成率）設定，並同時顯示曲數與百分比。"
          media: {type: "video", src: "9acbec84-1e4f-4063-972c-5af3460f6aa6.mp4", poster: "9acbec84-1e4f-4063-972c-5af3460f6aa6.jpg"}
    - heading: "SDVX 判定調整"
      items:
        - title: "判定調整（聲音）"
          desc: "判定調整以刻度（±50，1 格 2ms）與 ms 並列顯示。1 格實際為 4ms，已於下一版 1.2.20261024 更正。"
          media: {type: "image", src: "452212e0-bad3-4ce9-83b7-ccf31a920590.webp"}
        - title: "判定調整（畫面）"
          desc: "畫面的判定調整也並列顯示刻度與 ms。"
          media: {type: "image", src: "59dfd802-6f91-415b-bb7c-9a2994556950.webp"}
    - heading: "整體改善與問題修正"
      items:
        - title: "編輯中的面板不會關閉"
          desc: "已變更輸入內容的面板，往下拉也不會關閉。點按面板外側會顯示確認。"
          media: {type: "video", src: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.mp4", poster: "93d6fe1b-2dcf-4f2d-8710-2538cc010b9c.jpg"}
        - title: "課題通知"
          desc: "傳送到未顯示在首頁之機種的課題，開啟通知後標記也會消失。"
        - title: "其他改善與修正"
          list:
            - "修正 DDR「上次同步後」遺漏最近遊玩樂曲較舊更新紀錄的問題"
            - "CSV 的日期也可讀取試算表軟體的格式"
            - "修正顯示好友個人檔案、拍攝樂曲一覽圖片時，以及 Android 資料庫鎖定造成閃退的問題"
