id: "2026-10-25"
kind: release
version: "1.2.20261025"
date: "2026-10-30"
ja:
  title: "プッシュ通知に対応し、課題への一言と受け付けの停止、スコアタのスコア修正を追加しました"
  lead: "本アップデートでは、プッシュ通知、課題への一言の返信と受け付けの停止、スコアタの主催者によるスコア修正、前回差分の取りこぼしの修正などを行いました。"
  sections:
    - heading: "通知"
      items:
        - title: "種類ごとにオンオフできるプッシュ通知"
          desc: "プッシュ通知に対応しました。課題が届いた、投げた課題の達成と返事、フレンド申請、スコアタの審査・結果・終了、新曲、新しいスコアタの開催、もうすぐ終わる参加中のスコアタを、種類ごとにアプリ内通知とプッシュ通知でオンオフできます。"
          list:
            - "新曲と新しいスコアタの開催は、受け取る機種を選べます（DDR は SP と DP を別に選択）"
            - "もうすぐ終わる参加中のスコアタは、終了の最大7日前、または終わる前の曜日と時刻に通知できます"
            - "新曲の通知を開くと、増えた曲だけに絞った曲一覧を表示します"
            - "設定に、通知の届き方を再生して見せるプレビューを追加しました"
          media: {type: video, src: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.mp4", poster: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.jpg"}
    - heading: "課題"
      items:
        - title: "課題に一言を返す"
          desc: "課題を断る・受ける・達成したときに、送り主へ一言を返せます。断ったことも送り主へ届きます。投げた課題の一覧には相手の返事の段と一言を表示し、一言の段を押すと、受けたときと達成したときの一言を両方表示します。"
          media: {type: video, src: "026089a2-f9e9-425f-a63f-ecf2888d3380.mp4", poster: "026089a2-f9e9-425f-a63f-ecf2888d3380.jpg"}
        - title: "課題の受け付けを止める"
          desc: "届く課題の受け付けを、曲ごと・機種ごと・全部で止められます。止めている理由は投げる側に表示します。設定の「課題の受け付け」、楽曲詳細の「その他」、ホームの課題曲の見出しから設定できます。"
          media: {type: video, src: "202b030d-cce8-4176-9919-d6cbde722e17.mp4", poster: "202b030d-cce8-4176-9919-d6cbde722e17.jpg"}
        - title: "課題を投げる曲を並べ替え"
          desc: "課題を投げる曲を、相手のスコア・クリアランプ（DDR はフレア）で並べ替えられます。一覧から削除曲を除きました。"
          media: {type: video, src: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.mp4", poster: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.jpg"}
    - heading: "スコアタ"
      items:
        - title: "主催者によるスコアの修正"
          desc: "主催者が提出されたスコアを修正し、一言を添えて参加者へ通知できます。修正前の値へ戻すこともできます。"
          media: {type: video, src: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.mp4", poster: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.jpg"}
        - title: "そのほかの変更と修正"
          list:
            - "「申告」の表記を「提出」に変更"
            - "通しの参加者管理で、画像を参加者の行から開けるように変更。2機種の通しは画像を左右に送って確認"
            - "作成画面の戻るを1段ずつに変更。説明欄と詳細の説明をスクロール可能に"
            - "一覧の最後の行がホームバーに隠れる問題、「終了」タブの数に全機種が入る問題、貼り付けた文で開催できないことがある問題を修正"
    - heading: "機種別"
      items:
        - title: "SDVX：「スコアで伸ばせる」を PUC 狙いで切り替え"
          desc: "SDVX の「スコアで伸ばせる」を、PUC 狙いとそれ以外で切り替えられます。ホームのおすすめと全件の画面で使えます。"
          media: {type: video, src: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.mp4", poster: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.jpg"}
        - title: "取り込みと譜面ビューアの修正"
          list:
            - "前回差分で、読んだ曲の一部が取り込まれない不具合を DDR・GITADORA・SDVX・pop'n music で修正"
            - "GITADORA：達成率100%の譜面が0.00%で取り込まれる不具合を修正"
            - "DDR：譜面ビューアで、停止の続く箇所のクラップのずれと、最後の矢印のクラップが鳴らない不具合を修正"
    - heading: "全般の改善と不具合修正"
      items:
        - title: "改善"
          list:
            - "意見フォームを、ブラウザを開かずアプリから直接送信"
            - "プルダウンの見た目をアプリ全体でそろえました"
            - "狭い画面や大きな文字で文言が切れないように変更"
            - "シートを連打しても1枚だけ開くように変更。ホームの課題曲の絵記号を押しやすく変更"
        - title: "不具合修正"
          desc: "共有画像を保存できないことがある不具合と、成長ボードのカードを2本の指で動かすとアプリが落ちる不具合を修正しました。"
en:
  title: "Push notifications, replies and pausing for challenges, and score fixes in Score Attack"
  lead: "This release adds push notifications, lets you reply to challenges with a comment and pause incoming challenges, lets Score Attack organizers fix submitted scores, and fixes songs being missed by \"Since last sync\"."
  sections:
    - heading: "Notifications"
      items:
        - title: "Push notifications by type"
          desc: "Push notifications are now supported. Turn in-app and push notifications on or off for each type: incoming challenges, completed challenges and replies, friend requests, Score Attack reviews, results and endings, new songs, new Score Attacks, and Score Attacks you joined that are ending soon."
          list:
            - "For new songs and new Score Attacks, choose which games to receive them for (SP and DP can be chosen separately for DDR)"
            - "For Score Attacks you joined that are ending soon, get notified up to 7 days before the end, or on a set day and time before they end"
            - "Opening a new-song notification shows the song list filtered to just the new songs"
            - "Settings includes a preview demonstrating how notifications appear"
          media: {type: video, src: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.mp4", poster: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.jpg"}
    - heading: "Challenges"
      items:
        - title: "Reply to challenges with a comment"
          desc: "When you decline, accept or complete a challenge, you can reply to the sender with a comment. Senders are also notified when a challenge is declined. Your sent challenges show your friend's reply status and comment. Tap the comment row to see the comments from both acceptance and completion."
          media: {type: video, src: "026089a2-f9e9-425f-a63f-ecf2888d3380.mp4", poster: "026089a2-f9e9-425f-a63f-ecf2888d3380.jpg"}
        - title: "Pause incoming challenges"
          desc: "Pause incoming challenges per song, per game or all at once. Senders see why. Set this in Settings under \"Challenge requests\", in the \"Other\" tab of song details, or from the challenge songs heading on Home."
          media: {type: video, src: "202b030d-cce8-4176-9919-d6cbde722e17.mp4", poster: "202b030d-cce8-4176-9919-d6cbde722e17.jpg"}
        - title: "Sort songs for a challenge"
          desc: "Sort songs for a challenge by your friend's score or clear lamp (Flare for DDR). Deleted songs no longer appear in the list."
          media: {type: video, src: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.mp4", poster: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.jpg"}
    - heading: "Score Attack"
      items:
        - title: "Organizers can fix scores"
          desc: "Organizers can correct submitted scores and notify the player with a comment. Scores can also be reverted to their previous value."
          media: {type: video, src: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.mp4", poster: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.jpg"}
        - title: "Other changes and fixes"
          list:
            - "\"Report\" is now \"Submit\""
            - "In run-style Score Attacks, open images from each player's row in player management. For runs across two games, swipe left and right through the images"
            - "The back button on the create screen now goes back one step at a time. The description field and the detailed description can be scrolled"
            - "Fixed the last row of the list being hidden behind the Home bar, the \"Ended\" tab counting every game, and pasted text sometimes preventing a Score Attack from being created"
    - heading: "Game-specific"
      items:
        - title: "SDVX: PUC toggle in \"Improve by score\""
          desc: "In SDVX, \"Improve by score\" can now be toggled between aiming for PUC and all other scores, in the Home recommendations and the full list."
          media: {type: video, src: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.mp4", poster: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.jpg"}
        - title: "Import and chart viewer fixes"
          list:
            - "Fixed \"Since last sync\" missing some of the songs it read in DDR, GITADORA, SDVX and pop'n music"
            - "GITADORA: Fixed charts with a 100% achievement rate being imported as 0.00%"
            - "DDR: Fixed clap timing in sections with consecutive stops in the chart viewer, and the clap not playing on the last arrow"
    - heading: "Other improvements and fixes"
      items:
        - title: "Improvements"
          list:
            - "Send feedback directly from the app without opening a browser"
            - "Consistent dropdown styling throughout the app"
            - "Text no longer gets cut off on narrow screens or with large text"
            - "Tapping repeatedly to open a sheet now opens only one. The icons for challenge songs on Home are easier to tap"
        - title: "Bug fixes"
          desc: "Fixed shared images sometimes failing to save, and the app crashing when moving a growth board card with two fingers."
ko:
  title: "푸시 알림 지원, 과제에 한마디 답장과 받기 중지, 스코어 어택 스코어 수정 추가"
  lead: "이번 업데이트에서는 푸시 알림, 과제에 한마디 답장과 받기 중지, 스코어 어택 주최자의 스코어 수정, '지난 동기화 이후'의 누락 수정 등을 진행했습니다."
  sections:
    - heading: "알림"
      items:
        - title: "종류별로 켜고 끄는 푸시 알림"
          desc: "푸시 알림을 지원합니다. 과제 도착, 보낸 과제의 달성과 답장, 친구 신청, 스코어 어택의 심사·결과·종료, 신곡, 새 스코어 어택 개최, 곧 끝나는 참가 중인 스코어 어택을 종류별로 앱 내 알림과 푸시 알림으로 켜고 끌 수 있습니다."
          list:
            - "신곡과 새 스코어 어택 개최는 받을 기종을 선택 가능(DDR은 SP와 DP를 따로 선택)"
            - "곧 끝나는 참가 중인 스코어 어택 알림은 종료 최대 7일 전, 또는 종료 전 요일과 시각으로 설정 가능"
            - "신곡 알림을 열면 추가된 곡만으로 좁힌 곡 목록을 표시"
            - "설정에 알림이 오는 모습을 재생해 보여 주는 미리보기 추가"
          media: {type: video, src: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.mp4", poster: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.jpg"}
    - heading: "과제"
      items:
        - title: "과제에 한마디 답장"
          desc: "과제를 거절·수락·달성할 때 보낸 사람에게 한마디를 보낼 수 있습니다. 거절한 사실도 보낸 사람에게 전달됩니다. 보낸 과제 목록에 상대의 답장 단계와 한마디를 표시하며, 한마디 행을 누르면 수락할 때와 달성할 때의 한마디를 모두 표시합니다."
          media: {type: video, src: "026089a2-f9e9-425f-a63f-ecf2888d3380.mp4", poster: "026089a2-f9e9-425f-a63f-ecf2888d3380.jpg"}
        - title: "과제 받기 중지"
          desc: "받는 과제를 곡별·기종별·전체로 중지할 수 있습니다. 중지한 이유는 보내는 쪽에 표시됩니다. 설정의 '과제 받기', 곡 상세의 '기타', 홈의 과제곡 제목에서 설정합니다."
          media: {type: video, src: "202b030d-cce8-4176-9919-d6cbde722e17.mp4", poster: "202b030d-cce8-4176-9919-d6cbde722e17.jpg"}
        - title: "과제를 보낼 곡 정렬"
          desc: "과제를 보낼 곡을 상대의 스코어·클리어 램프(DDR은 플레어)로 정렬할 수 있습니다. 목록에서 삭제곡을 제외했습니다."
          media: {type: video, src: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.mp4", poster: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.jpg"}
    - heading: "스코어 어택"
      items:
        - title: "주최자의 스코어 수정"
          desc: "주최자가 제출된 스코어를 수정하고 한마디를 덧붙여 참가자에게 알릴 수 있습니다. 수정 전 값으로 되돌릴 수도 있습니다."
          media: {type: video, src: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.mp4", poster: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.jpg"}
        - title: "그 밖의 변경과 수정"
          list:
            - "'신고' 표기를 '제출'로 변경"
            - "연속 플레이의 참가자 관리에서 참가자 행에서 이미지를 열 수 있도록 변경. 2기종 연속 플레이는 이미지를 좌우로 넘겨 확인"
            - "작성 화면의 뒤로 가기를 한 단계씩으로 변경. 설명란과 상세 설명을 스크롤 가능"
            - "목록의 마지막 행이 홈 바에 가려지는 문제, '종료' 탭 개수에 모든 기종이 포함되는 문제, 붙여넣은 글로 개최하지 못할 때가 있는 문제를 수정"
    - heading: "기종별"
      items:
        - title: "SDVX: '스코어로 올리기'에서 PUC 목표 전환"
          desc: "SDVX의 '스코어로 올리기'를 PUC 목표와 그 외로 전환할 수 있습니다. 홈의 추천과 전체 목록 화면에서 쓸 수 있습니다."
          media: {type: video, src: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.mp4", poster: "026b665c-8ebb-4ba3-a733-9d0ba11d3dbe.jpg"}
        - title: "가져오기와 채보 뷰어 수정"
          list:
            - "'지난 동기화 이후'에서 읽은 곡 일부가 가져와지지 않던 오류를 DDR·GITADORA·SDVX·pop'n music에서 수정"
            - "GITADORA: 달성률 100% 채보가 0.00%로 가져와지던 오류 수정"
            - "DDR: 채보 뷰어에서 정지가 이어지는 구간의 클랩 어긋남과, 마지막 화살표의 클랩이 울리지 않던 오류 수정"
    - heading: "전반적인 개선과 오류 수정"
      items:
        - title: "개선"
          list:
            - "의견 양식을 브라우저를 열지 않고 앱에서 바로 전송"
            - "드롭다운 디자인을 앱 전체에서 통일"
            - "좁은 화면이나 큰 글자에서 문구가 잘리지 않도록 변경"
            - "시트를 연타해도 한 장만 열리도록 변경. 홈의 과제곡 아이콘을 누르기 쉽게 변경"
        - title: "오류 수정"
          desc: "공유 이미지를 저장하지 못할 때가 있던 오류와, 성장 보드 카드를 두 손가락으로 움직이면 앱이 종료되던 오류를 수정했습니다."
zh:
  title: "支援推播通知，新增課題回覆一句話與暫停接收、分數挑戰的分數修正"
  lead: "本次更新加入推播通知、課題回覆一句話與暫停接收、分數挑戰主辦者修正分數，並修正「上次同步後」遺漏樂曲等問題。"
  sections:
    - heading: "通知"
      items:
        - title: "依種類開關的推播通知"
          desc: "支援推播通知。收到課題、發出課題的達成與回覆、好友申請、分數挑戰的審查・結果・結束、新曲、新分數挑戰開辦、即將結束的參加中分數挑戰，皆可依種類分別開關 App 內通知與推播通知。"
          list:
            - "新曲與新分數挑戰開辦可選擇接收的機種（DDR 的 SP 與 DP 分開選擇）"
            - "即將結束的參加中分數挑戰，可設定在結束前最多 7 天，或結束前的星期與時刻通知"
            - "開啟新曲通知時，顯示只篩選新增樂曲的樂曲一覽"
            - "設定中新增播放通知呈現方式的預覽"
          media: {type: video, src: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.mp4", poster: "02a3b625-88e3-4fc8-9c4b-8bf58998f559.jpg"}
    - heading: "課題"
      items:
        - title: "回覆課題一句話"
          desc: "拒絕、接受或達成課題時，可向發送者回覆一句話。拒絕也會通知發送者。發出的課題列表會顯示對方的回覆狀態與留言，點擊留言列可同時查看接受時與達成時的留言。"
          media: {type: video, src: "026089a2-f9e9-425f-a63f-ecf2888d3380.mp4", poster: "026089a2-f9e9-425f-a63f-ecf2888d3380.jpg"}
        - title: "暫停接收課題"
          desc: "可依樂曲、機種或全部暫停接收課題，暫停的原因會顯示給發送方。可從設定的「課題接收」、樂曲詳細的「其他」、首頁課題曲的標題進行設定。"
          media: {type: video, src: "202b030d-cce8-4176-9919-d6cbde722e17.mp4", poster: "202b030d-cce8-4176-9919-d6cbde722e17.jpg"}
        - title: "排序要發送課題的樂曲"
          desc: "要發送課題的樂曲可依對方的分數或通關燈號（DDR 為 Flare）排序。列表中已排除刪除曲。"
          media: {type: video, src: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.mp4", poster: "2de39d8a-f6cc-40e7-9a2e-d40f00aed844.jpg"}
    - heading: "分數挑戰"
      items:
        - title: "主辦者修正分數"
          desc: "主辦者可修正已提交的分數，並附上一句話通知參加者。也可還原為修正前的數值。"
          media: {type: video, src: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.mp4", poster: "21b1c731-fba9-4333-b39f-2f6b1b7db62f.jpg"}
