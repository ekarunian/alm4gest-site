id: "2026-09-04"
kind: release
version: "1.2.20260904"
date: "2026-09-01"
ja:
  title: "pop'n music に対応し、個人差の出し方を変え、起動を速くしました"
  sections:
    - heading: "pop'n music に対応"
      items:
        - title: "他の機種と同じ機能"
          desc: "4機種目として pop'n music を追加しました。プロフィールからのスコア取り込み、楽曲一覧、曲詳細、Tier表、成長ボード、共有画像、フレンドの比較まで、他の機種と同じ機能が使えます。"
        - title: "ポップンクラスと曲画像"
          desc: "ポップンクラスは今作の記録から計算します。曲画像は公式のバナーをそのまま帯として出し、絵が無い曲は曲名とジャンル名を描いた板で埋めます。"
        - title: "楽曲名とジャンル名を選べる"
          desc: "楽曲一覧のメイン表示は、設定で「楽曲名」と「ジャンル名」から選べます。選ばなかったほうは小さく下の行に出ます。"
    - heading: "公式の絵と DDR"
      items:
        - title: "グレードとランプを公式の絵に"
          desc: "スコアグレード・クリアランプ・フレアランクを、独自の札から各機種の公式サイトの画像に置き換えました。ホームの中核指標のバッジ（SDVX の CLASS・DDR のフレアランク）も同じ絵です。絵の大きさは「文字の大きさ」の設定に合わせて変わります。"
        - title: "フレアランクを「+」区分まで"
          desc: "DDR のフレアランクのバッジ・進捗メーター・次のランクまでの表示を、公式の「+」区分（NEPTUNE+・SUN+++ など）に合わせて細かくしました。"
        - title: "DDR の譜面確認"
          desc: "譜面の全体像を1枚で見られる一望図、踏み足の記録、メモ、画像出力を入れました。メモと踏み足はバックアップにも入ります。"
    - heading: "個人差・偏差値・Skill"
      items:
        - title: "個人差の出し方"
          desc: "曲詳細の個人差を、同じレベルの譜面の分布の中でこの譜面がどこにあるかを見る形にしました。値は、全プレイヤーを母集団にした「実力の差を差し引いたスコアのばらつき」です。未クリアの記録と極端な外れ値は母集団から外しています。楽曲一覧に「個人差順」の並べ替えも足しました。"
        - title: "全体の偏差値を併記"
          desc: "同レベル帯の偏差値の横に、全体の偏差値を出します。同レベル帯の値が出ない譜面でも、全体の偏差値は出ます。スコアが0の記録は平均と偏差値の計算から外しました。外部データへの依存は、自前のデータが増えるにつれて自然に下がります。"
        - title: "GITADORA・pop'n の曲別Skill"
          desc: "楽曲一覧の値と並べ替えが、曲ごとではなく譜面ごとの値を見るようになりました。"
    - heading: "楽曲一覧と検索"
      items:
        - title: "語順を問わない AND 検索"
          desc: "空白で区切ると、語順を問わない AND 検索になります（「capp hearts」で Cappuccino Hearts が出ます）。"
        - title: "読みで引ける曲を増やしました"
          desc: "読み仮名の索引を全機種ぶん作り直し、次のような曲も読みで引けるようにしました。"
          list:
            - "当て字や英字の曲（DDR の 888＝はちやそば など）"
            - "英字の合字（ÆTHER＝エーテル）"
            - "英字の合成語（Hypernova＝ハイパーノヴァ）"
            - "辞書に無い英字の綴り（Bellatrix＝ベラトリクス）"
        - title: "小数レベルで絞り込み"
          desc: "絞り込みに小数レベルを足しました（SDVX は0.1刻み、GITADORA は0.5刻み）。楽曲一覧のヘッダーは、絞り込み・検索窓・右端のボタンの1列にまとめました。"
        - title: "Tier表の並べ替え"
          desc: "Tier表は、段の中を Tier 順とレベル順で並べ替えられます。前回見ていた表で開きます。"
    - heading: "共有画像"
      items:
        - title: "今日の成果の画像"
          desc: "タイトル右側の大きな余白をなくし、そこにフレアスキルや消費カロリーを入れました。共有画像6面とも、ヘッダーを詰めました。"
        - title: "大きさをプレビューで変える"
          desc: "文字とジャケットの大きさをプレビューでその場で変えられ、画像ごとに設定を覚えます。特大にしてもヘッダーが切れず、数字も丸まりません。"
        - title: "表示形式とカラム数"
          desc: "成果画像に「表示形式」（全て／課題進捗／フレア対象）を置きました。楽曲リストの画像は、幅に合わせて最大3カラムまで広がります。"
    - heading: "過去の記録の入力"
      items:
        - title: "アプリを入れる前の記録を足す"
          desc: "成長ボードの中核指標・消費カロリー・クレジット数について、アプリを入れる前の記録を手で足せます。設定＞データ、または成長ボードの各タイルから開きます。"
        - title: "編集と CSV"
          desc: "追加・編集・削除のほか、CSV での書き出しと取り込みができます。入れた値は成長ボードのグラフとバックアップに反映されます。"
    - heading: "速さと見た目"
      items:
        - title: "起動と画面の切り替え"
          list:
            - "オフにした機種の集計を飛ばし、起動の下ごしらえを並列にしました"
            - "ホームは1機種目から順に出し、開いていないタブは選ぶまで作りません"
            - "大きな統計データの読み込みを別の処理へ移し、起動直後のカクつきを減らしました"
            - "楽曲一覧は統計の読み直しを待たずに出ます"
        - title: "画面デザイン"
          desc: "数値のカウントアップ、タブ切り替えのフェード、機種色のさざなみ、読み込み中の骨組み表示などを入れました。カードやレーダーの色も機種色に寄せました。"
    - heading: "その他"
      items:
        - title: "バナー広告"
          desc: "バナー広告が30秒ごとに切り替わるようにしました。フレンドタブを開くたびに枠が読み直される動きを直しました。"
        - title: "表記が違う曲の同期"
          desc: "公式サイトとアプリの曲データで表記が違う曲が、同期で落ちる問題を直しました。"
en:
  title: "pop'n music support, a new take on chart difficulty bias, and faster startup"
  sections:
    - heading: "pop'n music support"
      items:
        - title: "Same features as the other games"
          desc: "pop'n music joins as the fourth game. Score import from your profile, the song list, song details, Tier Lists, the growth board, share images and friend comparisons all work the same way as the other games."
        - title: "pop'n class and song art"
          desc: "Your pop'n class is calculated from records in the current version. Song art uses the official banners as-is, and songs without art get a plate drawn with the song and genre name."
        - title: "Song name or genre name"
          desc: "In Settings, choose whether the main line of the song list shows the song name or the genre name. The other one appears smaller on the line below."
    - heading: "Official artwork and DDR"
      items:
        - title: "Official art for grades and lamps"
          desc: "Score grades, clear lamps and Flare ranks now use the images from each game's official site instead of our own badges. The core metric badges on Home (SDVX CLASS, DDR Flare rank) use the same artwork. Their size follows your text size setting."
        - title: "Flare ranks down to the \"+\" tiers"
          desc: "For DDR Flare ranks, badges, the progress meter and the \"next rank\" display now follow the official \"+\" tiers (NEPTUNE+, SUN+++ and so on)."
        - title: "DDR chart viewer"
          desc: "Added a full-chart overview on a single screen, footing notes, memos and image export. Memos and footing are included in backups."
    - heading: "Difficulty bias, T-scores and Skill"
      items:
        - title: "How difficulty bias is shown"
          desc: "The bias in song details now tells you where this chart sits within the distribution of charts at the same level. The value is the spread of scores with player skill differences removed, taken across all players. Uncleared records and extreme outliers are excluded. The song list also gained a \"By difficulty bias\" sort."
        - title: "Overall T-score alongside"
          desc: "The overall T-score is now shown next to the same-level one. Charts where the same-level value cannot be produced still show the overall value. Records with a score of 0 are excluded from averages and T-scores. Reliance on external data falls naturally as our own data grows."
        - title: "Per-chart Skill for GITADORA and pop'n"
          desc: "The value and the sort in the song list now look at the chart rather than the song."
    - heading: "Song list and search"
      items:
        - title: "AND search in any order"
          desc: "Separate words with a space for an AND search that ignores word order (\"capp hearts\" finds Cappuccino Hearts)."
        - title: "More songs found by reading"
          desc: "The reading index was rebuilt for every game, so songs like these can now be found by reading."
          list:
            - "Unusual readings and Latin titles (DDR's 888, read \"hachiyasoba\")"
            - "Ligatures (ÆTHER as エーテル)"
            - "Compounds (Hypernova as ハイパーノヴァ)"
            - "Spellings not in the dictionary (Bellatrix as ベラトリクス)"
        - title: "Filter by decimal level"
          desc: "Filters now include decimal levels (0.1 steps for SDVX, 0.5 steps for GITADORA). The song list header is a single row: filter, search box, and the buttons on the right."
        - title: "Sorting Tier Lists"
          desc: "Tier Lists can be sorted within a row by Tier order or level order, and open on the table you were last looking at."
    - heading: "Share images"
      items:
        - title: "Daily results image"
          desc: "The large gap to the right of the title is gone, and Flare skill and calories burned sit there now. All six share images have tighter headers."
        - title: "Change sizes in the preview"
          desc: "Change text and jacket size right in the preview, and each image remembers its own setting. Even at the largest size the header is not clipped and numbers are not rounded."
        - title: "Layout and columns"
          desc: "The results image has a Layout option (All / Challenge progress / Flare targets). Song list images open up to three columns depending on width."
    - heading: "Entering past records"
      items:
        - title: "Add records from before install"
          desc: "Core metrics, calories burned and credit counts on the growth board can now be entered by hand for the period before you installed the app. Open it from Settings > Data, or from each tile on the growth board."
        - title: "Editing and CSV"
          desc: "You can add, edit and delete entries, and export or import them as CSV. What you enter shows up in the growth board charts and in backups."
    - heading: "Speed and look"
      items:
        - title: "Startup and tab switching"
          list:
            - "Games you turned off are skipped during aggregation, and startup preparation runs in parallel"
            - "Home appears game by game, and tabs you have not opened are not built until you select them"
            - "Loading large statistics data moved off the main work, reducing the stutter right after startup"
            - "The song list no longer waits for statistics to reload"
        - title: "Visual polish"
          desc: "Added number count-ups, a fade when switching tabs, a ripple in the game's color and skeleton placeholders while loading. Cards and radar charts lean toward each game's color."
    - heading: "Other"
      items:
        - title: "Banner ad"
          desc: "The banner ad now rotates every 30 seconds, and its frame no longer reloads every time you open the Friends tab."
        - title: "Songs with different spellings"
          desc: "Fixed songs being dropped during sync when the official site and the app's song data spell them differently."
ko:
  title: "pop'n music 지원, 개인차 표시 방식 변경, 시작 속도 개선"
  sections:
    - heading: "pop'n music 지원"
      items:
        - title: "다른 기종과 같은 기능"
          desc: "4번째 기종으로 pop'n music을 추가했습니다. 프로필에서의 스코어 가져오기, 곡 목록, 곡 상세, 티어표, 성장 보드, 공유 이미지, 친구 비교까지 다른 기종과 같은 기능을 쓸 수 있습니다."
        - title: "pop'n 클래스와 곡 이미지"
          desc: "pop'n 클래스는 이번 작품의 기록으로 계산합니다. 곡 이미지는 공식 배너를 그대로 띠로 표시하고, 이미지가 없는 곡은 곡명과 장르명을 그린 판으로 채웁니다."
        - title: "곡명과 장르명 선택"
          desc: "곡 목록의 메인 표시는 설정에서 「곡명」과 「장르명」 중에서 고를 수 있습니다. 고르지 않은 쪽은 아래 줄에 작게 나옵니다."
    - heading: "공식 이미지와 DDR"
      items:
        - title: "그레이드와 램프를 공식 이미지로"
          desc: "스코어 그레이드·클리어 램프·플레어 랭크를 자체 표시에서 각 기종 공식 사이트의 이미지로 바꿨습니다. 홈의 핵심 지표 배지(SDVX의 CLASS·DDR의 플레어 랭크)도 같은 이미지입니다. 이미지 크기는 「글자 크기」 설정에 맞춰 바뀝니다."
        - title: "플레어 랭크를 「+」 구분까지"
          desc: "DDR 플레어 랭크의 배지·진행 미터·다음 랭크까지의 표시를 공식 「+」 구분(NEPTUNE+·SUN+++ 등)에 맞춰 세분화했습니다."
        - title: "DDR 채보 확인"
          desc: "채보 전체를 한 장으로 볼 수 있는 전체도, 발 기록, 메모, 이미지 출력을 넣었습니다. 메모와 발 기록은 백업에도 들어갑니다."
    - heading: "개인차·T점수·Skill"
      items:
        - title: "개인차 표시 방식"
          desc: "곡 상세의 개인차를, 같은 레벨 채보의 분포 속에서 이 채보가 어디에 있는지 보는 형태로 바꿨습니다. 값은 모든 플레이어를 모집단으로 한 「실력 차이를 뺀 스코어의 흩어짐」입니다. 미클리어 기록과 극단적인 이상값은 모집단에서 제외합니다. 곡 목록에 「개인차순」 정렬도 추가했습니다."
        - title: "전체 T점수 함께 표시"
          desc: "같은 레벨대 T점수 옆에 전체 T점수를 표시합니다. 같은 레벨대 값이 나오지 않는 채보도 전체 T점수는 나옵니다. 스코어가 0인 기록은 평균과 T점수 계산에서 제외했습니다. 외부 데이터 의존도는 자체 데이터가 늘수록 자연스럽게 낮아집니다."
        - title: "GITADORA·pop'n의 곡별 Skill"
          desc: "곡 목록의 값과 정렬이 곡 단위가 아니라 채보 단위의 값을 보게 되었습니다."
    - heading: "곡 목록과 검색"
      items:
        - title: "순서에 상관없는 AND 검색"
          desc: "공백으로 나누면 순서에 상관없는 AND 검색이 됩니다(「capp hearts」로 Cappuccino Hearts가 나옵니다)."
        - title: "읽는 법으로 찾을 수 있는 곡 확대"
          desc: "읽는 법 색인을 모든 기종에 대해 다시 만들어, 다음과 같은 곡도 읽는 법으로 찾을 수 있습니다."
          list:
            - "특수한 읽기나 영문 곡(DDR의 888＝はちやそば 등)"
            - "영문 합자(ÆTHER＝エーテル)"
            - "영문 합성어(Hypernova＝ハイパーノヴァ)"
            - "사전에 없는 영문 철자(Bellatrix＝ベラトリクス)"
        - title: "소수 레벨로 좁히기"
          desc: "좁히기에 소수 레벨을 추가했습니다(SDVX는 0.1 단위, GITADORA는 0.5 단위). 곡 목록 헤더는 좁히기·검색창·오른쪽 끝 버튼의 한 줄로 정리했습니다."
        - title: "티어표 정렬"
          desc: "티어표는 단 안을 Tier 순과 레벨 순으로 정렬할 수 있습니다. 지난번에 보던 표로 열립니다."
    - heading: "공유 이미지"
      items:
        - title: "오늘의 성과 이미지"
          desc: "제목 오른쪽의 큰 여백을 없애고, 그 자리에 플레어 스킬과 소비 칼로리를 넣었습니다. 공유 이미지 6종 모두 헤더를 줄였습니다."
        - title: "미리보기에서 크기 변경"
          desc: "글자와 재킷 크기를 미리보기에서 바로 바꿀 수 있고, 이미지마다 설정을 기억합니다. 가장 크게 해도 헤더가 잘리지 않고 숫자도 반올림되지 않습니다."
        - title: "표시 형식과 칼럼 수"
          desc: "성과 이미지에 「표시 형식」(전체／과제 진행／플레어 대상)을 넣었습니다. 곡 목록 이미지는 폭에 맞춰 최대 3칼럼까지 넓어집니다."
    - heading: "과거 기록 입력"
      items:
        - title: "앱 설치 전의 기록 추가"
          desc: "성장 보드의 핵심 지표·소비 칼로리·크레딧 수에 대해, 앱을 설치하기 전의 기록을 손으로 추가할 수 있습니다. 설정＞데이터, 또는 성장 보드의 각 타일에서 엽니다."
        - title: "편집과 CSV"
          desc: "추가·편집·삭제 외에 CSV로 내보내기와 가져오기를 할 수 있습니다. 입력한 값은 성장 보드 그래프와 백업에 반영됩니다."
    - heading: "속도와 디자인"
      items:
        - title: "시작과 탭 전환"
          list:
            - "끈 기종의 집계를 건너뛰고, 시작 준비를 병렬로 처리합니다"
            - "홈은 첫 번째 기종부터 차례로 표시하고, 열지 않은 탭은 선택할 때까지 만들지 않습니다"
            - "큰 통계 데이터 읽기를 별도 처리로 옮겨, 시작 직후의 끊김을 줄였습니다"
            - "곡 목록은 통계 다시 읽기를 기다리지 않고 표시됩니다"
        - title: "화면 디자인"
          desc: "숫자 카운트업, 탭 전환 페이드, 기종 색 물결, 로딩 중 뼈대 표시 등을 넣었습니다. 카드와 레이더 색도 기종 색에 맞췄습니다."
    - heading: "기타"
      items:
        - title: "배너 광고"
          desc: "배너 광고가 30초마다 바뀌도록 했습니다. 친구 탭을 열 때마다 광고 틀이 다시 읽히던 동작을 고쳤습니다."
        - title: "표기가 다른 곡의 동기화"
          desc: "공식 사이트와 앱의 곡 데이터에서 표기가 다른 곡이 동기화에서 빠지던 문제를 고쳤습니다."
zh:
  title: "支援 pop'n music，改變個人差的呈現方式，並加快啟動速度"
  sections:
    - heading: "支援 pop'n music"
      items:
        - title: "與其他機種相同的功能"
          desc: "新增 pop'n music 作為第 4 個機種。從個人資料匯入分數、樂曲一覽、樂曲詳細、Tier表、成長看板、分享圖片到好友比較，都能使用與其他機種相同的功能。"
        - title: "pop'n 等級與樂曲圖片"
          desc: "pop'n 等級以本代的記錄計算。樂曲圖片直接以官方橫幅作為帶狀顯示，沒有圖片的樂曲則以繪有曲名與類型名稱的板子補上。"
        - title: "可選擇曲名或類型名稱"
          desc: "樂曲一覽的主要顯示可在設定中從「曲名」與「類型名稱」選擇。未選的一方會以小字顯示在下一行。"
    - heading: "官方圖示與 DDR"
      items:
        - title: "評價與通關燈改用官方圖示"
          desc: "分數評價、通關燈、Flare 階級由自製標示改為各機種官方網站的圖片。首頁核心指標的徽章（SDVX 的 CLASS、DDR 的 Flare 階級）也使用相同圖示。圖示大小會隨「文字大小」設定改變。"
        - title: "Flare 階級細分至「+」區分"
          desc: "DDR Flare 階級的徽章、進度條與距離下一階級的顯示，依官方的「+」區分（NEPTUNE+、SUN+++ 等）更細地呈現。"
        - title: "DDR 譜面確認"
          desc: "新增可一張看完整個譜面的全覽圖、踏足記錄、備忘與圖片輸出。備忘與踏足也會納入備份。"
    - heading: "個人差、T分數與 Skill"
      items:
        - title: "個人差的呈現方式"
          desc: "樂曲詳細的個人差，改為呈現此譜面在同等級譜面分布中的位置。數值是以全體玩家為母體、「扣除實力差距後的分數離散程度」。未通關的記錄與極端離群值不納入母體。樂曲一覽也新增了「依個人差」排序。"
        - title: "併列整體T分數"
          desc: "同等級T分數旁會顯示整體T分數。無法算出同等級數值的譜面，也會顯示整體T分數。分數為 0 的記錄不納入平均與T分數計算。對外部資料的依賴，會隨著自有資料增加而自然降低。"
        - title: "GITADORA、pop'n 的樂曲別 Skill"
          desc: "樂曲一覽的數值與排序，改為依譜面而非依樂曲的數值。"
    - heading: "樂曲一覽與搜尋"
      items:
        - title: "不分順序的 AND 搜尋"
          desc: "以空白分隔即為不分順序的 AND 搜尋（輸入「capp hearts」會找到 Cappuccino Hearts）。"
        - title: "更多樂曲可用讀音搜尋"
          desc: "重建了所有機種的讀音索引，以下這類樂曲也能用讀音搜尋。"
          list:
            - "特殊讀法或英文樂曲（DDR 的 888＝はちやそば 等）"
            - "英文合字（ÆTHER＝エーテル）"
            - "英文複合詞（Hypernova＝ハイパーノヴァ）"
            - "字典中沒有的英文拼法（Bellatrix＝ベラトリクス）"
        - title: "以小數等級篩選"
          desc: "篩選新增小數等級（SDVX 以 0.1 為單位，GITADORA 以 0.5 為單位）。樂曲一覽的標題列整合為篩選、搜尋框、右端按鈕一列。"
        - title: "Tier表排序"
          desc: "Tier表可在同一段內依 Tier 順序或等級順序排序，並會以上次瀏覽的表開啟。"
    - heading: "分享圖片"
      items:
        - title: "今天的成果圖片"
          desc: "移除標題右側的大片空白，改放 Flare Skill 與消耗卡路里。6 種分享圖片都精簡了標題區。"
        - title: "在預覽中改變大小"
          desc: "可在預覽中直接改變文字與封面圖大小，並依圖片分別記住設定。即使設為最大，標題區也不會被切掉，數字也不會被四捨五入。"
        - title: "顯示形式與欄數"
          desc: "成果圖片新增「顯示形式」（全部／課題進度／Flare 對象）。樂曲列表圖片會依寬度最多展開為 3 欄。"
    - heading: "輸入過去的記錄"
      items:
        - title: "補上安裝前的記錄"
          desc: "成長看板的核心指標、消耗卡路里、Credit 數，可手動補上安裝 App 之前的記錄。從設定＞資料，或成長看板的各個方塊開啟。"
        - title: "編輯與 CSV"
          desc: "除了新增、編輯、刪除，也能以 CSV 匯出與匯入。輸入的數值會反映在成長看板的圖表與備份中。"
    - heading: "速度與外觀"
      items:
        - title: "啟動與切換分頁"
          list:
            - "略過已關閉機種的統計，並將啟動準備改為平行處理"
            - "首頁從第 1 個機種起依序顯示，未開啟的分頁在選擇前不會建立"
            - "大型統計資料的讀取移至其他處理，減少啟動後的卡頓"
            - "樂曲一覽不必等待統計重新讀取即可顯示"
        - title: "畫面設計"
          desc: "加入數字遞增動畫、切換分頁的淡入淡出、機種色漣漪、讀取中的骨架顯示等。卡片與雷達圖的顏色也貼近機種色。"
    - heading: "其他"
      items:
        - title: "橫幅廣告"
          desc: "橫幅廣告改為每 30 秒切換一次。修正每次開啟好友分頁時廣告框都會重新讀取的問題。"
        - title: "名稱寫法不同的樂曲同步"
          desc: "修正官方網站與 App 樂曲資料寫法不同的樂曲，在同步時遺漏的問題。"
