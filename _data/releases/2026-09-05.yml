id: "2026-09-05"
kind: release
version: "1.2.20260905"
date: "2026-09-05"
ja:
  title: "GITADORAの統計データが取得できない不具合を改善し、初回設定でも同期の失敗理由を表示するようにしました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "GITADORAの統計データ"
          desc: "GITADORAの統計データが取得出来ない不具合を改善しました。"
    - heading: "改善"
      items:
        - title: "初回設定での失敗理由"
          desc: "同期に失敗した理由（コース未加入・ログイン切れなど）を初回設定でも表示するようにしました。"
en:
  title: "Fixed GITADORA statistics, and setup now shows why a sync failed"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "GITADORA statistics"
          desc: "Fixed GITADORA play data not reaching the statistics server."
    - heading: "Improvements"
      items:
        - title: "Sync failure reasons in setup"
          desc: "Setup now shows why a sync failed (no course, logged out, etc.), same as the sync screen."
ko:
  title: "GITADORA 통계 수집 문제를 고치고, 초기 설정에서도 동기화 실패 이유를 표시합니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "GITADORA 통계 수집"
          desc: "GITADORA 통계 수집이 전달되지 않던 문제를 고쳤습니다."
    - heading: "개선"
      items:
        - title: "초기 설정의 실패 이유"
          desc: "동기화 실패 이유(코스 미가입·로그아웃 등)를 초기 설정에서도 표시합니다."
zh:
  title: "修正 GITADORA 統計收集問題，初次設定也會顯示同步失敗原因"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "GITADORA 統計收集"
          desc: "修正 GITADORA 統計收集無法送達的問題。"
    - heading: "改善"
      items:
        - title: "初次設定的失敗原因"
          desc: "初次設定也會顯示同步失敗的原因（未加入課程、已登出等）。"
