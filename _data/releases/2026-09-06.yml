id: "2026-09-06"
kind: release
version: "1.2.20260906"
date: "2026-09-07"
ja:
  title: "DDRの前回差分同期が毎回全曲の取得になる不具合ほかを修正し、同期を途中で止められるようにしました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "DDRの前回差分同期"
          desc: "DDRの「前回差分」同期が毎回全曲の取得に切り替わってしまう不具合を修正しました。"
        - title: "DDRの不合格プレー"
          desc: "DDRで不合格（E判定）のプレーが取り込まれず飛ばされていた不具合を修正しました。"
    - heading: "同期の改善"
      items:
        - title: "同期を止めるボタン"
          desc: "同期を途中で止めるボタンを追加しました。"
        - title: "メンテナンス中の表示"
          desc: "公式サイトのメンテナンス中は、その旨を表示するようにしました。"
en:
  title: "Fixed DDR \"Since last sync\" fetching every song and other issues, and added a way to stop a sync"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "DDR \"Since last sync\""
          desc: "Fixed DDR \"Since last sync\" falling back to fetching every song each time."
        - title: "DDR failed plays"
          desc: "Fixed DDR failed (E-rank) plays being skipped during import."
    - heading: "Sync improvements"
      items:
        - title: "Stop button"
          desc: "Added a button to stop a sync in progress."
        - title: "Maintenance notice"
          desc: "Shows a maintenance notice while the official site is under maintenance."
ko:
  title: "DDR 「지난 동기화 이후」 동기화가 매번 전체 곡 수집이 되던 문제 등을 고치고, 동기화를 도중에 멈출 수 있게 했습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "DDR 「지난 동기화 이후」 동기화"
          desc: "DDR 「지난 동기화 이후」 동기화가 매번 전체 곡 수집으로 바뀌던 문제를 고쳤습니다."
        - title: "DDR 불합격 플레이"
          desc: "DDR에서 불합격(E 판정) 플레이가 건너뛰어지던 문제를 고쳤습니다."
    - heading: "동기화 개선"
      items:
        - title: "동기화 중지 버튼"
          desc: "동기화를 도중에 멈추는 버튼을 추가했습니다."
        - title: "점검 중 표시"
          desc: "공식 사이트 점검 중에는 그 내용을 표시합니다."
zh:
  title: "修正 DDR「上次同步後」同步每次都抓取全部樂曲等問題，並可中途停止同步"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "DDR「上次同步後」同步"
          desc: "修正 DDR「上次同步後」同步每次都改為抓取全部樂曲的問題。"
        - title: "DDR 未通關的遊玩紀錄"
          desc: "修正 DDR 未通關（E 評價）的遊玩紀錄被略過的問題。"
    - heading: "同步改善"
      items:
        - title: "停止同步按鈕"
          desc: "新增可中途停止同步的按鈕。"
        - title: "維護中提示"
          desc: "官方網站維護中時會顯示提示。"
