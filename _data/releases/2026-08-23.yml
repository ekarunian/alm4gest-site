id: "2026-08-23"
kind: release
version: "1.2.20260823"
date: "2026-08-22"
ja:
  title: "GITADORAの記録が統計に集まらない問題ほかの不具合を修正しました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "GITADORAの記録の統計"
          desc: "GITADORAの記録が統計に集まらない不具合を直しました。プレイヤー情報の取得が曲データの巡回より後だったため、巡回が途中で途切れた端末では記録が送られていませんでした。"
        - title: "プレイヤーネーム未設定時の統計"
          desc: "公式サイトでプレイヤーネームを設定していない場合に、記録が統計に集まらない不具合を直しました。"
        - title: "SDVXの前回差分"
          desc: "SDVXの前回差分で、覚えている曲を遊び直した回に更新が丸ごと落ちる不具合を直しました。"
        - title: "表示崩れ"
          desc: "共有画像・成長タブ・Tier表の細かな表示崩れを直しました。"
en:
  title: "Fixed GITADORA records not reaching the statistics, and other issues"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "GITADORA records in statistics"
          desc: "Fixed GITADORA records not reaching the statistics. Player info was fetched after the song crawl, so devices whose crawl ended early sent nothing."
        - title: "Statistics without a player name"
          desc: "Fixed records not reaching the statistics when no player name is set on the official site."
        - title: "SDVX \"Since last sync\""
          desc: "Fixed SDVX \"Since last sync\" dropping a whole update when a known song was replayed."
        - title: "Layout issues"
          desc: "Fixed minor layout issues on shared images, the growth tab and Tier Lists."
ko:
  title: "GITADORA 기록이 통계에 모이지 않는 문제 등을 수정했습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "GITADORA 기록의 통계"
          desc: "GITADORA 기록이 통계에 모이지 않는 문제를 수정했습니다. 플레이어 정보를 곡 수집 뒤에 가져왔기 때문에, 수집이 중간에 끊긴 기기에서는 기록이 전송되지 않았습니다."
        - title: "플레이어 네임 미설정 시 통계"
          desc: "공식 사이트에서 플레이어 네임을 설정하지 않은 경우 기록이 통계에 모이지 않는 문제를 수정했습니다."
        - title: "SDVX 「지난 동기화 이후」 동기화"
          desc: "SDVX 「지난 동기화 이후」 동기화에서 이미 아는 곡을 다시 플레이한 회차의 갱신이 통째로 누락되는 문제를 수정했습니다."
        - title: "표시 문제"
          desc: "공유 이미지·성장 탭·티어표의 사소한 표시 문제를 수정했습니다."
zh:
  title: "修正 GITADORA 成績未進入統計等問題"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "GITADORA 成績的統計"
          desc: "修正 GITADORA 成績未進入統計的問題。玩家資訊在曲目巡覽之後才取得，因此巡覽中斷的裝置不會送出成績。"
        - title: "未設定玩家名稱時的統計"
          desc: "修正未在官方網站設定玩家名稱時，成績不會進入統計的問題。"
        - title: "SDVX「上次同步後」同步"
          desc: "修正 SDVX「上次同步後」同步時，重玩已記錄曲目的那一次更新整筆遺漏的問題。"
        - title: "顯示問題"
          desc: "修正分享圖片、成長頁籤與 Tier表的細部顯示問題。"
