id: "2026-10-03"
kind: release
version: "1.2.20261003"
date: "2026-10-02"
ja:
  title: "GITADORAのスキルが公式とずれる不具合ほかを修正しました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "GITADORAの同期"
          desc: "GITADORAの同期で、別の曲の記録を取り込むことがあり、スキルが公式とずれる不具合を修正しました。"
        - title: "更新後の曲データ"
          desc: "アプリを更新したあと曲データが読み直されず、一部の曲を照合できない不具合を修正しました。"
        - title: "pop'nのイージー・アシストクリア"
          desc: "pop'nで、イージー・アシストでクリアした譜面を未クリアとして数え、ポップンクラスが低く出る不具合を修正しました。"
    - heading: "改善"
      items:
        - title: "同期で送る記録"
          desc: "公式の値とずれたときに原因を調べられるよう、同期で送る記録を増やしました。"
en:
  title: "Fixed GITADORA Skill differing from the official site, and other issues"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "GITADORA sync"
          desc: "Fixed GITADORA sync sometimes saving another song's record, which made Skill differ from the official site."
        - title: "Song data after an update"
          desc: "Fixed song data not being re-read after an update, so some songs failed to match."
        - title: "pop'n EASY/ASSIST clears"
          desc: "Fixed pop'n counting EASY/ASSIST clears as not cleared, which lowered pop'n class."
    - heading: "Improvements"
      items:
        - title: "Records sent during sync"
          desc: "Sync now sends more records so we can find why values differ from the official site."
ko:
  title: "GITADORA 스킬이 공식과 달라지던 문제 등을 수정했습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "GITADORA 동기화"
          desc: "GITADORA 동기화에서 다른 곡의 기록을 가져와 스킬이 공식과 달라지던 문제를 수정했습니다."
        - title: "업데이트 후 곡 데이터"
          desc: "앱 업데이트 후 곡 데이터를 다시 읽지 않아 일부 곡을 대조하지 못하던 문제를 수정했습니다."
        - title: "pop'n 이지・어시스트 클리어"
          desc: "pop'n에서 이지・어시스트 클리어를 미클리어로 세어 pop'n 클래스가 낮게 나오던 문제를 수정했습니다."
    - heading: "개선"
      items:
        - title: "동기화 시 보내는 기록"
          desc: "공식 값과 다를 때 원인을 조사할 수 있도록 동기화 시 보내는 기록을 늘렸습니다."
zh:
  title: "修正 GITADORA 的 Skill 與官方不同等問題"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "GITADORA 同步"
          desc: "修正 GITADORA 同步時有時會讀入其他曲目的紀錄，導致 Skill 與官方不同的問題。"
        - title: "更新後的曲目資料"
          desc: "修正更新 App 後未重新讀取曲目資料，部分曲目無法對照的問題。"
        - title: "pop'n 的 EASY・ASSIST 通關"
          desc: "修正 pop'n 將 EASY・ASSIST 通關算作未通關，使 pop'n 等級偏低的問題。"
    - heading: "改善"
      items:
        - title: "同步時傳送的紀錄"
          desc: "為了在數值與官方不同時找出原因，增加了同步時傳送的紀錄。"
