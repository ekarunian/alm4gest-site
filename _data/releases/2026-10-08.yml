id: "2026-10-08"
kind: release
version: "1.2.20261008"
date: "2026-10-09"
ja:
  title: "プロフィールの編集で保存中に選択画面を開くとアプリが落ちる不具合を修正しました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "プロフィール編集中の強制終了"
          desc: "プロフィールの編集で「保存」を押したあと、保存が終わる前に「好きな譜面」「苦手な譜面」「MY SHOWCASE」「スコアタ成績」を選ぶ画面を開くと、アプリが落ちる不具合を直しました。"
en:
  title: "Fixed a crash when opening a picker in Edit profile before saving finished"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "Crash in Edit profile"
          desc: "Fixed a crash when opening the chart, MY SHOWCASE, or Score Attack result picker in Edit profile before saving finished."
ko:
  title: "프로필 편집에서 저장 중에 선택 화면을 열면 앱이 종료되는 문제를 수정했습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "프로필 편집 중 앱 종료"
          desc: "프로필 편집에서 「저장」을 누른 뒤 저장이 끝나기 전에 채보・MY SHOWCASE・스코어 어택 성적 선택 화면을 열면 앱이 종료되는 문제를 수정했습니다."
zh:
  title: "修正編輯個人檔案時，儲存中開啟選擇畫面會當機的問題"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "編輯個人檔案時當機"
          desc: "修正在編輯個人檔案時按下「儲存」後、儲存完成前開啟譜面、MY SHOWCASE 或分數挑戰成績的選擇畫面，App 會當機的問題。"
