id: "2026-09-22"
kind: release
version: "1.2.20260922"
date: "2026-09-22"
ja:
  title: "大会の順位と確定を整え、ホームの説明文をⓘにまとめました"
  sections:
    - heading: "大会の順位と確定"
      items:
        - title: "同点は同じ順位に"
          desc: "同点は同じ順位になります。1位が2人なら1位・1位・3位と並びます。結果画像の表彰台も、同点があっても崩れなくなりました。"
        - title: "順位表に主催者の印"
          desc: "順位表の行に、主催者の印が出るようになりました。"
        - title: "却下した申告を承認し直せる"
          desc: "却下した申告を、主催者が承認し直せるようになりました。"
        - title: "終了から2週間で自動確定"
          desc: "終了から2週間が過ぎた大会は自動で確定します。主催者の画面には確定の期限が出ます。"
    - heading: "ホーム"
      items:
        - title: "説明文をⓘにまとめる"
          desc: "各節に出ていた説明文を、見出しの横のⓘで読む形にしました。画面の縦が短くなり、一覧を広く使えます。"
    - heading: "おすすめ"
      items:
        - title: "目標を「1つ上の曲を追い越す」に"
          desc: "GITADORA と pop'n で、すでに枠の中に入っている曲の目標を「1つ上の曲を追い越す」に変えました。今までは「今より少し上」が並んでいました。"
    - heading: "フレンド"
      items:
        - title: "フレンドまわりの改善"
          list:
            - "pop'n でもフレンドの対象楽曲を開けるようにしました"
            - "相手のプロフィールから、届いているフレンド申請を承認できるようにしました"
            - "フレンドを探す画面のブロックを、長押しではなく⋯メニューから行う形にしました"
            - "フレンド課題の「プレーする」が、プレー回数の増加でも達成になるようにしました"
    - heading: "そのほかの改善と修正"
      items:
        - title: "弱点分析のタブ"
          desc: "弱点分析のタブを、分析のある SDVX と DDR だけにしました。"
        - title: "不具合の修正"
          list:
            - "pop'n の前回差分で記録を取りこぼすことがあったのを直しました"
            - "初回設定で選んだ GITADORA の取得方法が保存されるようにしました"
            - "Tier表の共有画像に、別の機種のプレイヤー名が出ることがあったのを直しました"
en:
  title: "Score Attack ranks and finalizing, and Home explanations moved into ⓘ"
  sections:
    - heading: "Score Attack ranks and finalizing"
      items:
        - title: "Ties share a rank"
          desc: "Ties now share a rank. With two players in 1st, the order reads 1st, 1st, 3rd. The podium on the result image no longer breaks when there are ties."
        - title: "Host mark in the standings"
          desc: "Rows in the standings now show a host mark."
        - title: "Approve a rejected entry"
          desc: "The host can now approve an entry that was rejected."
        - title: "Automatic finalizing after two weeks"
          desc: "Score Attacks finalize automatically two weeks after they end. The host's screen shows the deadline."
    - heading: "Home"
      items:
        - title: "Explanations moved into ⓘ"
          desc: "The explanations shown in each section are now read from the ⓘ next to the heading. The screen is shorter and the lists get more room."
    - heading: "Recommendations"
      items:
        - title: "Goals now \"pass the next song up\""
          desc: "On GITADORA and pop'n, goals for songs already inside a frame are now \"pass the next song up\". Before, they were \"a little higher than now\"."
    - heading: "Friends"
      items:
        - title: "Friend improvements"
          list:
            - "Friends' target songs can now be opened on pop'n too"
            - "You can accept a friend request you received from that player's profile"
            - "Blocking on the Find friends screen is now done from the ⋯ menu instead of a long press"
            - "The \"Play\" friend challenge now also counts as done when the play count goes up"
    - heading: "Other improvements and fixes"
      items:
        - title: "Weakness Analysis tabs"
          desc: "The Weakness Analysis tabs now show only SDVX and DDR, the games that have the analysis."
        - title: "Fixes"
          list:
            - "Fixed pop'n \"Since last sync\" sometimes missing records"
            - "The GITADORA fetch method chosen during first-time setup is now saved"
            - "Fixed Tier List share images sometimes showing a player name from another game"
ko:
  title: "스코어 어택의 순위와 확정을 정비하고, 홈의 설명문을 ⓘ로 모았습니다"
  sections:
    - heading: "스코어 어택의 순위와 확정"
      items:
        - title: "동점은 같은 순위로"
          desc: "동점은 같은 순위가 됩니다. 1위가 2명이면 1위·1위·3위로 나열됩니다. 결과 이미지의 시상대도 동점이 있어도 무너지지 않게 했습니다."
        - title: "순위표에 주최자 표시"
          desc: "순위표의 행에 주최자 표시가 나오게 했습니다."
        - title: "거절한 신고를 다시 승인"
          desc: "거절한 신고를 주최자가 다시 승인할 수 있게 했습니다."
        - title: "종료 후 2주가 지나면 자동 확정"
          desc: "종료 후 2주가 지난 스코어 어택은 자동으로 확정됩니다. 주최자 화면에는 확정 기한이 표시됩니다."
    - heading: "홈"
      items:
        - title: "설명문을 ⓘ로 모으기"
          desc: "각 섹션에 나오던 설명문을 제목 옆 ⓘ에서 읽는 방식으로 바꿨습니다. 화면 세로 길이가 짧아져 목록을 넓게 쓸 수 있습니다."
    - heading: "추천"
      items:
        - title: "목표를 '바로 위 곡 추월하기'로"
          desc: "GITADORA와 pop'n에서 이미 대상 범위 안에 들어 있는 곡의 목표를 '바로 위 곡 추월하기'로 바꿨습니다. 지금까지는 '지금보다 조금 위'가 나열되었습니다."
    - heading: "친구"
      items:
        - title: "친구 관련 개선"
          list:
            - "pop'n에서도 친구의 대상곡을 열 수 있게 했습니다"
            - "상대의 프로필에서 받은 친구 신청을 승인할 수 있게 했습니다"
            - "친구 찾기 화면의 차단을 길게 누르기 대신 ⋯ 메뉴에서 하도록 바꿨습니다"
            - "친구 과제의 '플레이하기'가 플레이 횟수 증가로도 달성되게 했습니다"
    - heading: "그 밖의 개선과 수정"
      items:
        - title: "약점 분석 탭"
          desc: "약점 분석 탭을 분석이 있는 SDVX와 DDR만으로 했습니다."
        - title: "문제 수정"
          list:
            - "pop'n의 「지난 동기화 이후」에서 기록을 놓치는 문제를 수정했습니다"
            - "초기 설정에서 고른 GITADORA 가져오기 방법이 저장되게 했습니다"
            - "티어표 공유 이미지에 다른 기종의 플레이어명이 나오는 문제를 수정했습니다"
zh:
  title: "整理分數挑戰的名次與結算，首頁說明文字整合到ⓘ"
  sections:
    - heading: "分數挑戰的名次與結算"
      items:
        - title: "同分顯示為相同名次"
          desc: "同分會是相同名次。有2人並列第1時，會排成第1、第1、第3。結果圖片的頒獎台在有同分時也不會跑版。"
        - title: "排名表顯示主辦者標記"
          desc: "排名表的列會顯示主辦者標記。"
        - title: "可重新核准曾退回的申報"
          desc: "主辦者可重新核准曾退回的申報。"
        - title: "結束滿兩週自動結算"
          desc: "結束滿兩週的分數挑戰會自動結算。主辦者的畫面會顯示結算期限。"
    - heading: "首頁"
      items:
        - title: "說明文字整合到ⓘ"
          desc: "各區塊原本顯示的說明文字，改為從標題旁的ⓘ閱讀。畫面縱向變短，列表可用空間更大。"
    - heading: "推薦"
      items:
        - title: "目標改為「超越上一首」"
          desc: "在 GITADORA 與 pop'n 中，已在名額內的樂曲，目標改為「超越上一首」。過去顯示的是「比現在高一點」。"
    - heading: "好友"
      items:
        - title: "好友相關改善"
          list:
            - "pop'n 也能開啟好友的對象樂曲"
            - "可從對方的個人檔案核准收到的好友邀請"
            - "「尋找好友」畫面的封鎖改為從⋯選單操作，而非長按"
            - "好友課題的「遊玩」在遊玩次數增加時也會算作達成"
    - heading: "其他改善與修正"
      items:
        - title: "弱點分析分頁"
          desc: "弱點分析的分頁只保留有分析的 SDVX 與 DDR。"
        - title: "問題修正"
          list:
            - "修正 pop'n「上次同步後」漏抓紀錄的問題"
            - "初次設定時選擇的 GITADORA 取得方式現在會被儲存"
            - "修正 Tier表分享圖片出現其他機種玩家名稱的問題"
