id: "2026-09-11"
kind: release
version: "1.2.20260911"
date: "2026-09-11"
ja:
  title: "ヘルスケア連携に対応し、曲のリスト保存とホームからのクイック同期を追加しました"
  sections:
    - heading: "ヘルスケアと体重"
      items:
        - title: "成長ボードに健康ウィジェット3枚"
          desc: "iPhone のヘルスケア（Android は Health Connect）から体重・体脂肪率・活動エネルギーを読み取り、成長ボードに3枚のウィジェットで出します。重ねた棒グラフでプレー量と体重の推移を並べ、DDR をした日としなかった日で体重の変わり方がどう違うかを見られます。"
          media: {type: image, src: "4ae74827-86d1-480f-8ad6-86d414d786c2.webp"}
        - title: "体重の入力と対応機器の案内"
          desc: "体重はアプリから直接入れられ、公式サイトの体重欄へ送ることもできます。設定と体重の入力画面には、Apple Health・Health Connect に対応した体重計・活動量計の一覧を置きました。機器ごとに、このアプリが読む項目（体重・体脂肪率・活動エネルギー）のどれに対応しているかが分かります。"
          media: {type: image, src: "0313b2fb-d6d4-4f15-a54f-d93f484433ef.webp"}
        - title: "過去の体重を手で補完"
          desc: "過去の記録の手動補完に体重を足しました。ヘルスケア連携の記録が優先で、手入力とCSVの取り込みは連携由来の日を上書きしません。"
          media: {type: image, src: "54680adb-b761-475b-9f4a-97746d156d50.webp"}
    - heading: "楽曲一覧とリスト"
      items:
        - title: "お気に入りを「リスト保存」に"
          desc: "「お気に入り」を「リスト保存」に変えました。譜面ごとに複数のリストへ入れられ、リストの中は手で並べ替えられます。楽曲一覧はリストで絞り込めます。"
          media: {type: image, src: "b9832e7f-e379-4cbc-a869-d96c93e07ae0.webp"}
        - title: "バージョンで絞り込み"
          desc: "4機種すべてで、曲の初出バージョンによる絞り込みと並べ替えができます。バージョンは公式のロゴから選びます。"
          media: {type: image, src: "19b7ce26-be51-4cc9-936f-4218d8322421.webp"}
        - title: "一覧を広く使える"
          desc: "下へスクロールすると上部の絞り込みが隠れ、一覧が広くなります。下へ動かしたときは最下部へ、上へ動かしたときは最上部へ一気に送るボタンが出ます。"
          media: {type: image, src: "50a64400-f112-4517-97fe-50923515e984.webp"}
    - heading: "pop'n の今作と歴代"
      items:
        - title: "今作と歴代の切り替え"
          desc: "楽曲一覧・対象楽曲・おすすめ・ポップンクラスを、今作の記録と歴代の記録で切り替えられます。切り替えは対象楽曲一覧の「おすすめ楽曲」の右にあります。今作のスコアの有無でも絞り込めます。"
          media: {type: image, src: "dab7301d-a835-4096-9d29-dc10f9753109.webp"}
    - heading: "Tier表"
      items:
        - title: "区分タブ"
          desc: "DDR・pop'n・GITADORA の Tier表に区分タブを置き、見たい区分だけを出せます。達成済みの本数を示す帯は、区分タブと表の間に出ます。"
          media: {type: image, src: "07e8a67e-8cb4-421e-bec3-ce996d6b754e.webp"}
        - title: "カスタムTier表のしきい値"
          desc: "目標の達成判定を、一覧に無い水準でも数値で直接入れられます。レベルの選び方と区分の入力画面も作り直しました。"
          media: {type: image, src: "4b3fec60-2c62-417b-ab3a-fcafee6d7b2c.webp"}
    - heading: "同期とプレー履歴"
      items:
        - title: "ホームから1タップのクイック同期"
          desc: "ホームの同期バーで「クイック同期」と「通常同期」を切り替えられます。クイック同期は保存済みのログイン情報が生きているかを先に確かめ、切れているときだけログイン画面を出します。同期の進み具合はホームのバーに出るので、画面が切り替わりません。体重を公式サイトへ送るときも同じ確かめ方を使います。"
          media: {type: image, src: "a463c293-ad6e-4dcd-b485-41c801952559.webp"}
        - title: "最近プレーした曲の履歴"
          desc: "今日の成果の見出しの横に履歴アイコンを置きました。DDR・GITADORA・pop'n について、同期で取り込んだプレーを日付ごとに並べます。公式サイトの上限（直近20プレー）を越えて端末に積むので、1日に2回同期すればその両方が残ります。GITADORA は行をタップすると判定の内訳が開きます。"
          media: {type: image, src: "6fd2cb35-f9ad-4a88-8199-b37fea7117a7.webp"}
        - title: "GITADORA の前回差分の取りこぼしを防ぐ"
          desc: "公式のプレー履歴に収まらない回のために、切り替え先（変化した曲だけ／全曲）を選べるようにしました。履歴が「最大直近20プレー」であることも同期画面に出します。"
          media: {type: image, src: "0b2581d8-93cb-49fb-a75f-2bf1b6551f31.webp"}
    - heading: "ホームと曲詳細"
      items:
        - title: "放置曲の期間を選べる"
          desc: "ホームの放置曲を 90日／半年／1年で切り替えられます。成長ボードの並べ替えは Tier表と同じ判定に揃えました。"
          media: {type: image, src: "be7e5892-1041-44e6-80d0-35e7e5de7f02.webp"}
        - title: "曲詳細を使いやすく"
          desc: "手動記録を開く鉛筆を記録行の末尾へ置き直し、譜面データの列は幅が足りないときに出さないようにしました。メモ欄がキーボードに隠れる問題も直しました。"
          media: {type: image, src: "698baa4b-d0cf-43d6-a0d6-cd9304188639.webp"}
    - heading: "DDR の譜面確認"
      items:
        - title: "フリーズアローの表示を3段階に"
          desc: "フリーズアローの表示を3段階（通常・細い・頭だけ）から選べます。"
          media: {type: image, src: "6e416c85-d5f6-41f8-9019-379d4fa480da.webp"}
        - title: "空打ちの追加モード"
          desc: "踏み足の記録に空打ちを足すモードを入れました。矢印ボタン・刻みの選択・上下の移動・削除ができます。"
          media: {type: image, src: "f9410ae9-eed4-43ab-9d14-47b350d0b4ce.webp"}
    - heading: "配信地域とその他の修正"
      items:
        - title: "インドネシアで配信開始"
          desc: "インドネシアで配信を始めました。"
        - title: "その他の修正"
          list:
            - "DDR で削除された曲の記録を「-」で出すようにしました"
            - "同期に失敗したときの文言を、原因ごとに書き分けました"
            - "フレンドの並べ替えで、つまみの近くを触ると一覧全体が動いてしまう問題を直しました"
            - "pop'n の曲別詳細が途中で止まっても同期が完了になる問題など、同期の取りこぼしを直しました"
en:
  title: "Health sync, saved song lists, and one-tap quick sync from Home"
  sections:
    - heading: "Health and weight"
      items:
        - title: "Three health widgets on the growth board"
          desc: "ALM4GEST now reads weight, body fat percentage and active energy from Apple Health (Health Connect on Android) and shows them as three widgets on the growth board. A stacked bar chart puts your play volume next to your weight, so you can see how your weight changes on days you played DDR and days you did not."
          media: {type: image, src: "d738e6da-818d-4966-aef3-b5b3166536af.webp"}
        - title: "Weight entry and a device guide"
          desc: "You can enter weight in the app, and send it to the weight field on the official site. Settings and the weight sheet now list scales and trackers that work with Apple Health or Health Connect, and show which of the values this app reads (weight, body fat, active energy) each device supports."
          media: {type: image, src: "cc65fc7b-945c-4368-87d4-ac8e7f3fc0df.webp"}
        - title: "Fill in past weight by hand"
          desc: "Weight joins the manual backfill for past records. Records from Health take priority: manual entry and CSV import never overwrite a day that came from Health."
          media: {type: image, src: "62069ab3-ec75-437d-b9a0-1037af5cc355.webp"}
    - heading: "Song list and saved lists"
      items:
        - title: "Favorites became saved lists"
          desc: "A chart can belong to several lists, and each list can be reordered by hand. The song list can be filtered by list."
          media: {type: image, src: "0ee03a73-20f5-413a-92a3-c1fbe184ce04.webp"}
        - title: "Filter by version"
          desc: "All four games can now be filtered and sorted by the version a song first appeared in. Versions are chosen from their official logos."
          media: {type: image, src: "b9ac6d51-a86f-4c47-8653-beee7debd7ec.webp"}
        - title: "More room in the list"
          desc: "Scrolling down hides the filter row, so the list gets taller. Buttons appear to jump straight to the bottom when you scroll down, and to the top when you scroll up."
          media: {type: image, src: "7ee33f21-0fe4-4b09-8125-21c91003f68e.webp"}
    - heading: "pop'n: current version and all time"
      items:
        - title: "Switch between current and all time"
          desc: "The song list, target songs, recommendations and pop'n class can all be read from either the current version or your all-time records. The switch sits to the right of \"Recommended songs\" on the target song list. You can also filter by whether a current-version score exists."
          media: {type: image, src: "21b7eaf4-6cac-4ae2-bf54-7fc7a3b6588c.webp"}
    - heading: "Tier Lists"
      items:
        - title: "Category tabs"
          desc: "DDR, pop'n and GITADORA Tier Lists gained category tabs, so you can show only the category you care about. The bar that counts what you have cleared now sits between the tabs and the table."
          media: {type: image, src: "ddd3baa0-c0bc-4d96-9e5a-034906e25485.webp"}
        - title: "Any threshold in a custom Tier List"
          desc: "Goal thresholds can be typed in directly, including values that are not in the preset list. The level picker and the category editor were rebuilt as well."
          media: {type: image, src: "69de7e3f-6c67-46b2-836b-d249c0b8a99a.webp"}
    - heading: "Sync and play history"
      items:
        - title: "Quick sync in one tap from Home"
          desc: "The sync bar on Home switches between quick sync and normal sync. Quick sync checks whether your saved login is still valid and only opens the login screen when it has expired. Progress appears in the bar itself, so the screen no longer changes. Sending your weight to the official site uses the same check."
          media: {type: image, src: "63ca74f4-85d3-4fce-9a32-2bc36d87f119.webp"}
        - title: "See every recent play"
          desc: "A history icon sits next to the heading of today's results. For DDR, GITADORA and pop'n it lists every play the sync picked up, grouped by day. Plays are stored beyond the official limit of 20, so syncing twice in one day keeps both batches. Tapping a GITADORA row opens its judgement breakdown."
          media: {type: image, src: "ce78920a-0b3b-4b9c-ab1a-377c46042abb.webp"}
        - title: "Fewer misses in GITADORA \"Since last sync\""
          desc: "When a session does not fit in the official play history, you can choose what the sync falls back to: only songs whose scores changed, or every song. The sync screen also states that the history holds at most the 20 most recent plays."
          media: {type: image, src: "23865882-b6c7-4c7c-81b8-f8c8e3865902.webp"}
    - heading: "Home and song details"
      items:
        - title: "Choose the window for neglected songs"
          desc: "The neglected-songs card on Home switches between 90 days, six months and one year. Sorting on the growth board now matches the Tier List."
          media: {type: image, src: "9bd149c6-3642-4487-8f95-9b6adb73932b.webp"}
        - title: "A tidier song detail sheet"
          desc: "The pencil that opens manual entry moved to the end of the record row, and the chart data column is dropped when there is not enough width. The memo field is no longer hidden by the keyboard."
          media: {type: image, src: "e069b5c7-b5b7-4b39-8844-c69328b02c7f.webp"}
    - heading: "DDR chart preview"
      items:
        - title: "Three freeze arrow styles"
          desc: "Freeze arrows can be drawn in three ways: full, thin, or head only."
          media: {type: image, src: "0cc90f8b-df91-4903-8ddb-faed881d366f.webp"}
        - title: "Ghost-tap mode"
          desc: "Step notes gained a ghost-tap mode with arrow buttons, beat division, move up and down, and delete."
          media: {type: image, src: "e78ae073-fa39-48c7-9078-72b12ceab34d.webp"}
    - heading: "Regions and other fixes"
      items:
        - title: "Now available in Indonesia"
          desc: "ALM4GEST is now available in Indonesia."
        - title: "Other fixes"
          list:
            - "Records for songs removed from DDR are shown as \"-\""
            - "Sync failure messages are now written per cause"
            - "Reordering friends no longer scrolls the whole list when you touch near the handle"
            - "Fixed several sync gaps, including pop'n reporting success while per-song details had stopped partway"
ko:
  title: "헬스케어 연동 지원, 곡 리스트 저장과 홈에서 원탭 빠른 동기화 추가"
  sections:
    - heading: "헬스케어와 체중"
      items:
        - title: "성장 보드에 건강 위젯 3개"
          desc: "iPhone 헬스케어(Android는 Health Connect)에서 체중・체지방률・활동 에너지를 읽어 성장 보드에 위젯 3개로 표시합니다. 누적 막대그래프로 플레이량과 체중 추이를 나란히 놓고, DDR을 한 날과 하지 않은 날에 체중 변화가 어떻게 다른지 볼 수 있습니다."
          media: {type: image, src: "d738e6da-818d-4966-aef3-b5b3166536af.webp"}
        - title: "체중 입력과 대응 기기 안내"
          desc: "체중은 앱에서 직접 입력할 수 있고, 공식 사이트의 체중 칸으로 보낼 수도 있습니다. 설정과 체중 입력 화면에 Apple Health・Health Connect에 대응하는 체중계・활동량계 목록을 두었습니다. 기기마다 이 앱이 읽는 항목(체중・체지방률・활동 에너지) 중 무엇에 대응하는지 알 수 있습니다."
          media: {type: image, src: "cc65fc7b-945c-4368-87d4-ac8e7f3fc0df.webp"}
        - title: "과거 체중을 수동으로 보완"
          desc: "과거 기록의 수동 보완에 체중을 추가했습니다. 헬스케어 연동 기록이 우선이며, 수동 입력과 CSV 가져오기는 연동으로 들어온 날을 덮어쓰지 않습니다."
          media: {type: image, src: "62069ab3-ec75-437d-b9a0-1037af5cc355.webp"}
    - heading: "곡 목록과 리스트"
      items:
        - title: "즐겨찾기를 「리스트 저장」으로"
          desc: "「즐겨찾기」를 「리스트 저장」으로 바꿨습니다. 채보마다 여러 리스트에 넣을 수 있고, 리스트 안은 수동으로 정렬할 수 있습니다. 곡 목록은 리스트로 필터할 수 있습니다."
          media: {type: image, src: "0ee03a73-20f5-413a-92a3-c1fbe184ce04.webp"}
        - title: "버전별 필터"
          desc: "4개 기종 모두에서 곡이 처음 나온 버전으로 필터와 정렬을 할 수 있습니다. 버전은 공식 로고에서 고릅니다."
          media: {type: image, src: "b9ac6d51-a86f-4c47-8653-beee7debd7ec.webp"}
        - title: "목록을 넓게 사용"
          desc: "아래로 스크롤하면 상단 필터가 숨겨져 목록이 넓어집니다. 아래로 움직이면 맨 아래로, 위로 움직이면 맨 위로 한 번에 이동하는 버튼이 나타납니다."
          media: {type: image, src: "7ee33f21-0fe4-4b09-8125-21c91003f68e.webp"}
    - heading: "pop'n 현재작과 역대"
      items:
        - title: "현재작／역대 전환"
          desc: "곡 목록・대상곡・추천・팝픈 클래스를 현재작 기록과 역대 기록으로 전환할 수 있습니다. 전환 버튼은 대상곡 목록의 「추천 곡」 오른쪽에 있습니다. 현재작 스코어 유무로도 필터할 수 있습니다."
          media: {type: image, src: "21b7eaf4-6cac-4ae2-bf54-7fc7a3b6588c.webp"}
    - heading: "티어표"
      items:
        - title: "구분 탭"
          desc: "DDR・pop'n・GITADORA 티어표에 구분 탭을 두어, 보고 싶은 구분만 표시할 수 있습니다. 달성한 곡 수를 보여 주는 띠는 구분 탭과 표 사이에 나타납니다."
          media: {type: image, src: "ddd3baa0-c0bc-4d96-9e5a-034906e25485.webp"}
        - title: "커스텀 티어표의 기준값"
          desc: "목표 달성 판정을 목록에 없는 수준이라도 수치로 직접 입력할 수 있습니다. 레벨 선택과 구분 입력 화면도 새로 만들었습니다."
          media: {type: image, src: "69de7e3f-6c67-46b2-836b-d249c0b8a99a.webp"}
    - heading: "동기화와 플레이 기록"
      items:
        - title: "홈에서 원탭 빠른 동기화"
          desc: "홈의 동기화 바에서 「빠른 동기화」와 「일반 동기화」를 전환할 수 있습니다. 빠른 동기화는 저장된 로그인 정보가 유효한지 먼저 확인하고, 만료된 경우에만 로그인 화면을 띄웁니다. 동기화 진행 상황은 홈의 바에 표시되므로 화면이 바뀌지 않습니다. 체중을 공식 사이트로 보낼 때도 같은 방식으로 확인합니다."
          media: {type: image, src: "63ca74f4-85d3-4fce-9a32-2bc36d87f119.webp"}
        - title: "최근 플레이한 곡 기록"
          desc: "오늘의 성과 제목 옆에 기록 아이콘을 두었습니다. DDR・GITADORA・pop'n에서 동기화로 가져온 플레이를 날짜별로 나열합니다. 공식 사이트의 상한(최근 20플레이)을 넘어 기기에 쌓이므로, 하루에 두 번 동기화하면 둘 다 남습니다. GITADORA는 행을 탭하면 판정 내역이 열립니다."
          media: {type: image, src: "ce78920a-0b3b-4b9c-ab1a-377c46042abb.webp"}
        - title: "GITADORA 「지난 동기화 이후」의 누락 방지"
          desc: "공식 플레이 기록에 다 들어가지 않는 경우를 위해, 대신 가져올 대상(변화한 곡만／전곡)을 고를 수 있게 했습니다. 기록이 「최대 최근 20플레이」라는 점도 동기화 화면에 표시합니다."
          media: {type: image, src: "23865882-b6c7-4c7c-81b8-f8c8e3865902.webp"}
    - heading: "홈과 곡 상세"
      items:
        - title: "방치곡 기간 선택"
          desc: "홈의 방치곡을 90일／반년／1년으로 전환할 수 있습니다. 성장 보드의 정렬은 티어표와 같은 판정으로 맞췄습니다."
          media: {type: image, src: "9bd149c6-3642-4487-8f95-9b6adb73932b.webp"}
        - title: "곡 상세를 쓰기 쉽게"
          desc: "수동 기록을 여는 연필을 기록 행 끝으로 옮기고, 채보 데이터 열은 폭이 부족하면 표시하지 않게 했습니다. 메모 칸이 키보드에 가려지는 문제도 고쳤습니다."
          media: {type: image, src: "e069b5c7-b5b7-4b39-8844-c69328b02c7f.webp"}
    - heading: "DDR 채보 확인"
      items:
        - title: "프리즈 애로우 표시 3단계"
          desc: "프리즈 애로우 표시를 3단계(일반・얇게・머리만)에서 고를 수 있습니다."
          media: {type: image, src: "0cc90f8b-df91-4903-8ddb-faed881d366f.webp"}
        - title: "고스트 탭 추가 모드"
          desc: "발 배치 기록에 고스트 탭을 추가하는 모드를 넣었습니다. 화살표 버튼・박자 단위 선택・위아래 이동・삭제를 할 수 있습니다."
          media: {type: image, src: "e78ae073-fa39-48c7-9078-72b12ceab34d.webp"}
    - heading: "출시 지역과 기타 수정"
      items:
        - title: "인도네시아 출시"
          desc: "인도네시아에서 출시했습니다."
        - title: "기타 수정"
          list:
            - "DDR에서 삭제된 곡의 기록을 「-」로 표시하게 했습니다"
            - "동기화에 실패했을 때의 문구를 원인별로 나누어 표시합니다"
            - "친구 정렬에서 손잡이 근처를 만지면 목록 전체가 움직이던 문제를 고쳤습니다"
            - "pop'n 곡별 상세가 도중에 멈춰도 동기화가 완료되던 문제 등, 동기화 누락을 고쳤습니다"
zh:
  title: "支援健康資料連動，新增樂曲清單儲存與首頁一鍵快速同步"
  sections:
    - heading: "健康資料與體重"
      items:
        - title: "成長看板新增 3 個健康小工具"
          desc: "從 iPhone 的「健康」（Android 為 Health Connect）讀取體重、體脂率與活動能量，在成長看板以 3 個小工具顯示。以堆疊長條圖並列遊玩量與體重變化，可比較有玩 DDR 的日子與沒玩的日子體重變化有何不同。"
          media: {type: image, src: "d738e6da-818d-4966-aef3-b5b3166536af.webp"}
        - title: "體重輸入與對應裝置說明"
          desc: "體重可直接在 App 內輸入，也能送到官方網站的體重欄。設定與體重輸入畫面新增支援 Apple Health・Health Connect 的體重計・活動量計清單，可看出每台裝置支援本 App 讀取的哪些項目（體重・體脂率・活動能量）。"
          media: {type: image, src: "cc65fc7b-945c-4368-87d4-ac8e7f3fc0df.webp"}
        - title: "手動補齊過去的體重"
          desc: "過去紀錄的手動補齊新增了體重。以健康資料連動的紀錄為優先，手動輸入與 CSV 匯入不會覆寫來自連動的日期。"
          media: {type: image, src: "62069ab3-ec75-437d-b9a0-1037af5cc355.webp"}
    - heading: "樂曲一覽與清單"
      items:
        - title: "「我的最愛」改為「清單儲存」"
          desc: "將「我的最愛」改為「清單儲存」。每個譜面可加入多個清單，清單內可手動排序。樂曲一覽可依清單篩選。"
          media: {type: image, src: "0ee03a73-20f5-413a-92a3-c1fbe184ce04.webp"}
        - title: "依版本篩選"
          desc: "4 個機種都能依樂曲首次登場的版本篩選與排序。版本從官方標誌中選擇。"
          media: {type: image, src: "b9ac6d51-a86f-4c47-8653-beee7debd7ec.webp"}
        - title: "列表可用空間更大"
          desc: "向下捲動時上方的篩選列會隱藏，列表變得更寬。向下移動時會出現跳至最下方的按鈕，向上移動時則出現跳至最上方的按鈕。"
          media: {type: image, src: "7ee33f21-0fe4-4b09-8125-21c91003f68e.webp"}
    - heading: "pop'n 本作與歷代"
      items:
        - title: "切換本作／歷代"
          desc: "樂曲一覽、對象曲、推薦與 pop'n 等級，都能在本作紀錄與歷代紀錄之間切換。切換位於對象曲列表「推薦樂曲」的右側。也可依有無本作分數篩選。"
          media: {type: image, src: "21b7eaf4-6cac-4ae2-bf54-7fc7a3b6588c.webp"}
    - heading: "Tier表"
      items:
        - title: "分類頁籤"
          desc: "DDR、pop'n、GITADORA 的 Tier表新增分類頁籤，可只顯示想看的分類。顯示已達成曲數的橫條會出現在分類頁籤與表格之間。"
          media: {type: image, src: "ddd3baa0-c0bc-4d96-9e5a-034906e25485.webp"}
        - title: "自訂 Tier表的門檻"
          desc: "目標的達成判定，即使是清單中沒有的水準，也能直接輸入數值。等級的選擇方式與分類的輸入畫面也重新製作。"
          media: {type: image, src: "69de7e3f-6c67-46b2-836b-d249c0b8a99a.webp"}
    - heading: "同步與遊玩紀錄"
      items:
        - title: "首頁一鍵快速同步"
          desc: "可在首頁的同步列切換「快速同步」與「一般同步」。快速同步會先確認已儲存的登入資訊是否仍有效，只有失效時才顯示登入畫面。同步進度顯示在首頁的同步列，畫面不會切換。將體重送到官方網站時也使用同樣的確認方式。"
          media: {type: image, src: "63ca74f4-85d3-4fce-9a32-2bc36d87f119.webp"}
        - title: "最近遊玩紀錄"
          desc: "今天的成果標題旁新增紀錄圖示。DDR、GITADORA、pop'n 會依日期列出同步取得的遊玩。紀錄會超過官方網站的上限（最近 20 次遊玩）累積在裝置上，因此一天同步兩次兩者都會保留。GITADORA 點選列即可開啟判定明細。"
          media: {type: image, src: "ce78920a-0b3b-4b9c-ab1a-377c46042abb.webp"}
        - title: "防止 GITADORA「上次同步後」的遺漏"
          desc: "為了官方遊玩紀錄裝不下的情況，可選擇改為取得的對象（僅有變化的樂曲／全部樂曲）。同步畫面也會顯示紀錄「最多為最近 20 次遊玩」。"
          media: {type: image, src: "23865882-b6c7-4c7c-81b8-f8c8e3865902.webp"}
    - heading: "首頁與樂曲詳細"
      items:
        - title: "可選擇放置曲的期間"
          desc: "首頁的放置曲可切換為 90 天／半年／1 年。成長看板的排序改為與 Tier表相同的判定。"
          media: {type: image, src: "9bd149c6-3642-4487-8f95-9b6adb73932b.webp"}
        - title: "樂曲詳細更好用"
          desc: "開啟手動紀錄的鉛筆移到紀錄列的末端，譜面資料欄在寬度不足時不顯示。也修正了備註欄被鍵盤遮住的問題。"
          media: {type: image, src: "e069b5c7-b5b7-4b39-8844-c69328b02c7f.webp"}
    - heading: "DDR 譜面確認"
      items:
        - title: "3 段凍結箭頭顯示"
          desc: "凍結箭頭的顯示可從 3 段（一般・細・只有頭部）中選擇。"
          media: {type: image, src: "0cc90f8b-df91-4903-8ddb-faed881d366f.webp"}
        - title: "空打追加模式"
          desc: "新增在踩法紀錄中加入空打的模式，可使用箭頭按鈕、選擇節拍刻度、上下移動與刪除。"
          media: {type: image, src: "e78ae073-fa39-48c7-9078-72b12ceab34d.webp"}
    - heading: "配信地區與其他修正"
      items:
        - title: "印尼開始配信"
          desc: "已在印尼開始配信。"
        - title: "其他修正"
          list:
            - "DDR 中已刪除樂曲的紀錄改以「-」顯示"
            - "同步失敗時的訊息依原因分別顯示"
            - "修正好友排序時，觸碰把手附近會使整個列表移動的問題"
            - "修正 pop'n 樂曲詳細中途停止仍顯示同步完成等同步遺漏問題"
