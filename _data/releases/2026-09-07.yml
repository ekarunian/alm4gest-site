id: "2026-09-07"
kind: release
version: "1.2.20260907"
date: "2026-09-07"
ja:
  title: "ベーシックコース未加入時に同期が毎回ログイン切れとして失敗する不具合を修正しました"
  sections:
    - heading: "不具合の修正"
      items:
        - title: "ベーシックコース未加入時の同期"
          desc: "e-amusementベーシックコースに加入していない場合に、同期が毎回「KONAMI IDのログインが切れました」と表示されて失敗する不具合を修正しました（ログインし直しても直らない状態でした）。"
en:
  title: "Fixed sync always failing as an expired session when the Basic Course is not active"
  sections:
    - heading: "Bug fixes"
      items:
        - title: "Sync without the Basic Course"
          desc: "Fixed sync always failing with “Your KONAMI ID session has expired” when your e-amusement Basic Course is not active. Signing in again did not help."
ko:
  title: "베이직 코스 미가입 시 동기화가 매번 로그인 만료로 실패하던 문제를 고쳤습니다"
  sections:
    - heading: "버그 수정"
      items:
        - title: "베이직 코스 미가입 시 동기화"
          desc: "e-amusement 베이직 코스에 가입하지 않은 경우, 동기화가 매번 “KONAMI ID 로그인이 만료되었습니다”로 실패하던 문제를 고쳤습니다. 다시 로그인해도 해결되지 않는 상태였습니다."
zh:
  title: "修正未加入基本課程時，同步每次都以登入失效而失敗的問題"
  sections:
    - heading: "錯誤修正"
      items:
        - title: "未加入基本課程時的同步"
          desc: "修正未加入 e-amusement 基本課程時，同步每次都顯示「KONAMI ID 的登入已失效」而失敗的問題。重新登入也無法解決。"
