id: "2026-09-18"
kind: release
version: "1.2.20260918"
date: "2026-09-17"
ja:
  title: "スコアアタック、プロフィール、フレンドを探す機能、知らせのベルを追加しました"
  sections:
    - heading: "スコアアタック"
      items:
        - title: "誰でも開催できる"
          desc: "誰でも自分でスコアアタックを開けます。開催の手順は4段で、その中でバナー画像・参加条件・スコアの登録方法を決めます。参加条件は端末が自分の指標値で判定するので、条件に届いていないスコアタは参加ボタンを押せません。一覧は開催中と終了に分かれ、終了したスコアタには記録がいつ消えるかを出します。"
          media: {type: image, src: "6f910097-5a6d-40f0-9ffd-c4182f0cf44b.webp"}
        - title: "結果を1枚の画像に"
          desc: "期間が終わると、参加者向けと主催者向けの2種類の結果画像を作れます。参加者向けは自分の順位と申告した曲数、主催者向けは順位表で、どちらも一言を添えられます。終わったスコアタはホームのスコアタ枠に出るので、そこから直接開けます。"
          media: {type: image, src: "340118eb-69dc-4fce-afcf-de0d7899e1cc.webp"}
        - title: "申告はその場で順位表へ"
          desc: "手で登録したスコアは出した時点で順位表に入り、主催者が見るまで「審査中」と出ます。却下された曲だけが合算から外れます。主催者は参加者の除外と BAN ができ、BAN した人は再参加できません。"
          media: {type: image, src: "4c713c96-9647-4913-ac13-3fd6bcc20eee.webp"}
    - heading: "プロフィールとフレンド探し"
      items:
        - title: "プロフィール"
          desc: "名刺・MY SHOWCASE・スコアタ成績を1枚にまとめ、画像で共有できます。好きな譜面と苦手な譜面も置けます。公開範囲は「フレンドのみ」が既定で、「公開」にするとフレンド探しに載ります。"
          media: {type: image, src: "8bdb1bc8-dc8c-4b20-9b69-faa579543a94.webp"}
        - title: "フレンドを探す"
          desc: "公開にしている人を、機種とランク区分で絞って探せます。"
          list:
            - "おすすめ：自分と同じ機種の人を、その機種の中核指標が近い順に並べます"
            - "活動中：最後に同期した順に並べます"
            - "申請：送った申請と届いている申請をまとめて出します"
          media: {type: image, src: "c79a6f78-6e28-43d5-9471-f1f8108568ba.webp"}
    - heading: "知らせのベル"
      items:
        - title: "知らせを1か所に"
          desc: "課題の到着・フレンド申請・スコアタの審査待ちと結果が1か所に並びます。"
    - heading: "楽曲詳細と弱点分析"
      items:
        - title: "楽曲詳細を全機種で見直し"
          desc: "曲名を2行まで出し、見切れていた文字をなくしました。「課題曲に固定」と「譜面を確認する」に主従を付け、値の無い行は出さないようにしました。"
          media: {type: image, src: "7944323f-ef27-4cc3-ba12-cecd1b05af48.webp"}
        - title: "弱点分析のレベル絞り込み"
          desc: "見たいレベルだけを選び、その中の弱点を出せます。"
    - heading: "そのほかの改善と修正"
      items:
        - title: "改善"
          list:
            - "Tier表の表示を軽くしました"
            - "成長ボードの並びを、DDR の SP と DP のあいだで写せるようにしました"
        - title: "不具合の修正"
          list:
            - "曲一覧を端まで一気に送ると固まることがある不具合を直しました"
            - "pop'n music のクラスで、曲ごとの値が公式と合わない不具合を直しました"
            - "pop'n music で直近の記録が埋まらないことがある不具合を直しました"
            - "iOS でヘルスケア連携の許可画面が出ない不具合を直しました"
            - "クイック同期で毎回ログイン画面が出る不具合を直しました"
            - "ミュートを解除したあとにクラップ音が遅れる不具合を直しました"
            - "プロフィールの名前と一言が画像で切れる不具合を直しました"
en:
  title: "Score Attack, profiles, Find Friends, and a notification bell"
  sections:
    - heading: "Score Attack"
      items:
        - title: "Anyone can host"
          desc: "Anyone can host a Score Attack. Setting one up takes four steps, where you choose the banner image, the entry requirements and how scores are submitted. Your device checks the requirements against your own metric values, so the join button stays disabled for an attack you have not reached yet. The list is split into running and finished, and a finished attack shows when its records will be removed."
          media: {type: image, src: "e0b1371d-e71f-457a-bef9-cc4914cb5082.webp"}
        - title: "The outcome as one image"
          desc: "Once the period ends you can build two kinds of result image, one for entrants and one for the host. The entrant image shows your rank and how many songs you submitted, the host image shows the standings, and both can carry a short comment. Finished attacks appear in the Score Attack slot on Home, so you can open them from there."
          media: {type: image, src: "34c7c793-cc8b-46fe-8e86-dc3550636365.webp"}
        - title: "Submissions join the standings right away"
          desc: "A score you enter by hand joins the standings the moment you submit it and is marked as under review until the host looks at it. Only rejected songs drop out of the total. Hosts can exclude entrants or ban them, and a banned player cannot join again."
          media: {type: image, src: "4e9f62e5-f5c7-4540-bd9b-3dad07797d07.webp"}
    - heading: "Profiles and finding friends"
      items:
        - title: "Profiles"
          desc: "Your business card, MY SHOWCASE and Score Attack results sit on one page that you can share as an image. You can also pin the charts you like and the ones you struggle with. Visibility defaults to friends only; switching it to public lists you in Find Friends."
          media: {type: image, src: "b71b13c3-2e06-47bc-9c69-65b568cf304e.webp"}
        - title: "Find Friends"
          desc: "Look for players who are public, filtered by game and rank band."
          list:
            - "Recommended: players of the same game as you, ordered by how close their core metric is to yours"
            - "Active: ordered by the most recent sync"
            - "Requests: the ones you sent and the ones you received, together"
          media: {type: image, src: "b68ca234-4406-4c79-aaad-fe7663968030.webp"}
    - heading: "Notification bell"
      items:
        - title: "Everything in one place"
          desc: "Arriving challenges, friend requests, and Score Attack reviews and results are listed in one place."
    - heading: "Song details and weakness analysis"
      items:
        - title: "Song details reworked on every game"
          desc: "Song titles now run to two lines, so nothing is cut off. \"Pin as a challenge\" and \"View the chart\" have a clear primary and secondary, and rows with no value are hidden."
          media: {type: image, src: "17697586-03ef-4caa-874a-d06b95ca3bee.webp"}
        - title: "Filter weakness analysis by level"
          desc: "Pick only the levels you want and see the weak points inside them."
    - heading: "Other improvements and fixes"
      items:
        - title: "Improvements"
          list:
            - "Tier Lists render faster"
            - "Growth board ordering can be copied between DDR SP and DP"
        - title: "Fixes"
          list:
            - "Fixed the song list sometimes freezing when you jump to the end"
            - "Fixed per-song pop'n music Class values not matching the official ones"
            - "Fixed recent records sometimes not filling in on pop'n music"
            - "Fixed the Apple Health permission screen not appearing on iOS"
            - "Fixed quick sync asking for login every time"
            - "Fixed the clap sound lagging after unmuting"
            - "Fixed the profile name and tagline being cut off in the image"
ko:
  title: "스코어 어택, 프로필, 친구 찾기, 알림 벨 추가"
  sections:
    - heading: "스코어 어택"
      items:
        - title: "누구나 개최"
          desc: "누구나 직접 스코어 어택을 열 수 있습니다. 개최 절차는 4단계이며, 그 안에서 배너 이미지・참가 조건・스코어 등록 방법을 정합니다. 참가 조건은 기기가 내 지표값으로 판정하므로, 조건에 닿지 않은 스코어 어택은 참가 버튼을 누를 수 없습니다. 목록은 개최 중과 종료로 나뉘며, 종료된 스코어 어택에는 기록이 언제 사라지는지 표시합니다."
          media: {type: image, src: "e0b1371d-e71f-457a-bef9-cc4914cb5082.webp"}
        - title: "결과를 이미지 한 장으로"
          desc: "기간이 끝나면 참가자용과 주최자용 2종의 결과 이미지를 만들 수 있습니다. 참가자용은 내 순위와 신고한 곡 수, 주최자용은 순위표이며, 둘 다 한마디를 덧붙일 수 있습니다. 끝난 스코어 어택은 홈의 스코어 어택 칸에 나오므로 거기서 바로 열 수 있습니다."
          media: {type: image, src: "34c7c793-cc8b-46fe-8e86-dc3550636365.webp"}
        - title: "신고는 즉시 순위표에"
          desc: "직접 등록한 스코어는 제출한 시점에 순위표에 들어가고, 주최자가 확인할 때까지 「심사 중」으로 표시됩니다. 반려된 곡만 합산에서 빠집니다. 주최자는 참가자를 제외하거나 BAN할 수 있고, BAN된 사람은 다시 참가할 수 없습니다."
          media: {type: image, src: "4e9f62e5-f5c7-4540-bd9b-3dad07797d07.webp"}
    - heading: "프로필과 친구 찾기"
      items:
        - title: "프로필"
          desc: "명함・MY SHOWCASE・스코어 어택 성적을 한 장에 모아 이미지로 공유할 수 있습니다. 좋아하는 채보와 어려워하는 채보도 올릴 수 있습니다. 공개 범위는 「친구만」이 기본이며, 「공개」로 하면 친구 찾기에 표시됩니다."
          media: {type: image, src: "b71b13c3-2e06-47bc-9c69-65b568cf304e.webp"}
        - title: "친구 찾기"
          desc: "공개로 설정한 사람을 기종과 랭크 구분으로 좁혀 찾을 수 있습니다."
          list:
            - "추천: 나와 같은 기종의 사람을, 그 기종의 핵심 지표가 가까운 순으로 나열합니다"
            - "활동 중: 마지막으로 동기화한 순으로 나열합니다"
            - "신청: 보낸 신청과 받은 신청을 함께 표시합니다"
          media: {type: image, src: "b68ca234-4406-4c79-aaad-fe7663968030.webp"}
    - heading: "알림 벨"
      items:
        - title: "알림을 한곳에"
          desc: "과제 도착・친구 신청・스코어 어택 심사 대기와 결과가 한곳에 모입니다."
    - heading: "곡 상세와 약점 분석"
      items:
        - title: "곡 상세를 전 기종에서 재정비"
          desc: "곡명을 2줄까지 표시해 잘리던 글자를 없앴습니다. 「과제곡으로 고정」과 「보면 확인하기」에 주종을 두고, 값이 없는 행은 표시하지 않습니다."
          media: {type: image, src: "17697586-03ef-4caa-874a-d06b95ca3bee.webp"}
        - title: "약점 분석의 레벨 필터"
          desc: "보고 싶은 레벨만 골라 그 안의 약점을 볼 수 있습니다."
    - heading: "그 밖의 개선과 수정"
      items:
        - title: "개선"
          list:
            - "티어표 표시를 가볍게 했습니다"
            - "성장 보드의 배치를 DDR의 SP와 DP 사이에서 복사할 수 있게 했습니다"
        - title: "문제 수정"
          list:
            - "곡 목록을 끝까지 단숨에 보낼 때 멈추는 경우가 있던 문제를 수정했습니다"
            - "pop'n music 클래스의 곡별 값이 공식과 맞지 않던 문제를 수정했습니다"
            - "pop'n music에서 최근 기록이 채워지지 않는 경우가 있던 문제를 수정했습니다"
            - "iOS에서 건강 앱 연동 허용 화면이 뜨지 않던 문제를 수정했습니다"
            - "빠른 동기화에서 매번 로그인 화면이 뜨던 문제를 수정했습니다"
            - "음소거를 해제한 뒤 클랩음이 늦게 나던 문제를 수정했습니다"
            - "프로필의 이름과 한마디가 이미지에서 잘리던 문제를 수정했습니다"
zh:
  title: "新增分數挑戰、個人檔案、尋找好友與通知鈴"
  sections:
    - heading: "分數挑戰"
      items:
        - title: "任何人都能舉辦"
          desc: "任何人都能自行舉辦分數挑戰。舉辦流程分為 4 個步驟，可在其中決定橫幅圖片、參加條件與分數的登錄方式。參加條件由裝置以自己的指標值判定，未達條件的分數挑戰無法按下參加按鈕。列表分為進行中與已結束，已結束的分數挑戰會顯示紀錄何時刪除。"
          media: {type: image, src: "e0b1371d-e71f-457a-bef9-cc4914cb5082.webp"}
        - title: "以一張圖片留下結果"
          desc: "期間結束後，可製作參加者版與主辦者版 2 種結果圖片。參加者版顯示自己的名次與申報的樂曲數，主辦者版為排名表，兩者都能附上一句話。已結束的分數挑戰會出現在首頁的分數挑戰欄位，可從那裡直接開啟。"
          media: {type: image, src: "34c7c793-cc8b-46fe-8e86-dc3550636365.webp"}
        - title: "申報立即列入排名表"
          desc: "手動登錄的分數在送出當下即列入排名表，主辦者確認前會顯示「審核中」。只有被駁回的樂曲會從合計中排除。主辦者可排除或 BAN 參加者，被 BAN 的人無法再次參加。"
          media: {type: image, src: "4e9f62e5-f5c7-4540-bd9b-3dad07797d07.webp"}
    - heading: "個人檔案與尋找好友"
      items:
        - title: "個人檔案"
          desc: "將名片、MY SHOWCASE、分數挑戰成績彙整成一張，並以圖片分享。也能放上喜歡的譜面與不擅長的譜面。公開範圍預設為「僅限好友」，設為「公開」後會列在尋找好友中。"
          media: {type: image, src: "b71b13c3-2e06-47bc-9c69-65b568cf304e.webp"}
        - title: "尋找好友"
          desc: "可依機種與等級區分篩選、尋找設為公開的玩家。"
          list:
            - "推薦：列出與自己相同機種的玩家，依該機種核心指標接近的順序排列"
            - "活躍中：依最後同步的順序排列"
            - "申請：一起顯示送出的申請與收到的申請"
          media: {type: image, src: "b68ca234-4406-4c79-aaad-fe7663968030.webp"}
    - heading: "通知鈴"
      items:
        - title: "通知集中在一處"
          desc: "課題到達、好友申請、分數挑戰的審核與結果會集中在一處。"
    - heading: "樂曲詳細與弱點分析"
      items:
        - title: "全機種重新調整樂曲詳細"
          desc: "曲名最多顯示 2 行，消除文字被截斷的情況。「釘選為課題曲」與「確認譜面」區分主次，沒有數值的列不再顯示。"
          media: {type: image, src: "17697586-03ef-4caa-874a-d06b95ca3bee.webp"}
        - title: "弱點分析的等級篩選"
          desc: "只選擇想看的等級，即可顯示其中的弱點。"
    - heading: "其他改善與修正"
      items:
        - title: "改善"
          list:
            - "讓 Tier表顯示更輕快"
            - "成長看板的排列可在 DDR 的 SP 與 DP 之間複製"
        - title: "問題修正"
          list:
            - "修正樂曲一覽一口氣移動到底端時有時會卡住的問題"
            - "修正 pop'n music class 各樂曲數值與官方不符的問題"
            - "修正 pop'n music 最近紀錄有時無法補齊的問題"
            - "修正 iOS 健康 App 連動授權畫面不會出現的問題"
            - "修正快速同步每次都顯示登入畫面的問題"
            - "修正解除靜音後拍手音延遲的問題"
            - "修正個人檔案的名稱與一句話在圖片中被截斷的問題"
