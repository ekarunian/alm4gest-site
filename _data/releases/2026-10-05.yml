id: "2026-10-05"
kind: release
version: "1.2.20261005"
date: "2026-10-06"
ja:
  title: "pop'nのポップンクラスを公式と同じく四捨五入するようにし、版数の表示の不具合を修正しました"
  sections:
    - heading: "pop'n"
      items:
        - title: "ポップンクラスの四捨五入"
          desc: "pop'nのポップンクラスの小数第3位を、公式と同じく四捨五入するようにしました。"
        - title: "追加された曲の記録"
          desc: "pop'nで曲データに曲が増えたとき、前回差分の同期でもその曲の記録を取り込むようにしました。"
    - heading: "不具合の修正"
      items:
        - title: "アプリ内の版数"
          desc: "アプリ内に表示される版数が1つ前のままになっていた不具合を修正しました。"
    - heading: "改善"
      items:
        - title: "同期で送る記録"
          desc: "公式の値とずれたときに原因を調べられるよう、同期で送る記録を増やしました。"
en:
  title: "pop'n class now rounds like the official site, and the in-app version number is fixed"
  sections:
    - heading: "pop'n"
      items:
        - title: "Rounding pop'n class"
          desc: "pop'n class now rounds the third decimal place, matching the official site."
        - title: "Records of newly added songs"
          desc: "pop'n \"Since last sync\" now imports records of songs newly added to song data."
    - heading: "Bug fixes"
      items:
        - title: "In-app version number"
          desc: "Fixed the in-app version number showing the previous version."
    - heading: "Improvements"
      items:
        - title: "Records sent during sync"
          desc: "Sync now sends more records so we can find why values differ from the official site."
ko:
  title: "pop'n 클래스를 공식과 같이 반올림하도록 하고, 버전 번호 표시 문제를 수정했습니다"
  sections:
    - heading: "pop'n"
      items:
        - title: "pop'n 클래스 반올림"
          desc: "pop'n 클래스의 소수점 셋째 자리를 공식과 같이 반올림하도록 했습니다."
        - title: "추가된 곡의 기록"
          desc: "pop'n에서 곡 데이터에 곡이 추가되면 「지난 동기화 이후」 동기화에서도 그 곡의 기록을 가져오도록 했습니다."
    - heading: "버그 수정"
      items:
        - title: "앱 내 버전 번호"
          desc: "앱에 표시되는 버전 번호가 이전 버전으로 남아 있던 문제를 수정했습니다."
    - heading: "개선"
      items:
        - title: "동기화 시 보내는 기록"
          desc: "공식 값과 다를 때 원인을 조사할 수 있도록 동기화 시 보내는 기록을 늘렸습니다."
zh:
  title: "pop'n 等級改為與官方相同的四捨五入，並修正版本號顯示的問題"
  sections:
    - heading: "pop'n"
      items:
        - title: "pop'n 等級的四捨五入"
          desc: "pop'n 等級的小數第三位改為與官方相同的四捨五入。"
        - title: "新增曲目的紀錄"
          desc: "pop'n 曲目資料新增曲目時，「上次同步後」同步也會讀入該曲的紀錄。"
    - heading: "錯誤修正"
      items:
        - title: "App 內的版本號"
          desc: "修正 App 內顯示的版本號仍為前一版的問題。"
    - heading: "改善"
      items:
        - title: "同步時傳送的紀錄"
          desc: "為了在數值與官方不同時找出原因，增加了同步時傳送的紀錄。"
