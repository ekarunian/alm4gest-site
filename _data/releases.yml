      - heading: "pop'n and GITADORA"
        items:
          - title: "Sort by medal"
            games: ["pop'n"]
            desc: "Added \"Medal\" to pop'n song list sorting."
            media: {type: video, src: popn-medal.mp4, poster: popn-medal.jpg}
          - title: "pop'n class and skill"
            games: ["pop'n", GITADORA]
            desc: "Partly fixed pop'n class mismatches, and partly fixed the same kind of problem in GITADORA."
      - heading: "Score Attack and Tier List"
        items:
          - title: "Friends-only events"
            desc: "Host a Score Attack for friends only."
            media: {type: video, src: sa-friends.mp4, poster: sa-friends.jpg}
          - title: "From challenge songs to song details"
            desc: "Selecting a Score Attack challenge song opens its song details."
            media: {type: video, src: sa-song.mp4, poster: sa-song.jpg}
          - title: "Change tier colors"
            desc: "Change the color of each tier in a custom Tier List."
            media: {type: video, src: tier-color.mp4, poster: tier-color.jpg}
      - heading: "Small improvements and bug fixes"
        items:
          - title: "Small improvements and bug fixes"
            list:
              - "Display of games with no friend records"
              - "UI and behavior of the friends tab in song filters"
              - "Display of the radar and per-attribute trend cards on the goals screen, and the UI and behavior while editing"
              - "Behavior when sending images to Discord"
  ko:
    title: "다른 KONAMI ID로 동기화할 수 있게 하고, 친구 한정 스코어 어택을 열 수 있게 했습니다"
    sections:
      - heading: "KONAMI ID"
        items:
          - title: "다른 KONAMI ID로 동기화"
            desc: "다른 KONAMI ID로 동기화할 수 없던 문제를 해결했습니다. 다만 이 앱은 현재 '1기기 1ID'로 운영됩니다. 여러 기기에서 같은 ID의 정보를 보거나, 한 기기에서 여러 계정의 정보를 볼 수는 없습니다. 이는 앞으로 해결합니다."
      - heading: "SDVX"
        items:
          - title: "추천과 EX 스코어 정렬"
            games: [SDVX]
            list:
              - "추천 기능(스코어로 올릴 수 있는 곡)의 대상과 목표를 이용자의 실력에 맞게 재검토했습니다"
              - "곡 목록 정렬에 'EX 스코어순'과 'EX 스코어율순'을 추가했습니다"
            media: {type: video, src: sdvx.mp4, poster: sdvx.jpg}
      - heading: "팝픈과 GITADORA"
        items:
          - title: "메달순 정렬"
            games: ["pop'n"]
            desc: "팝픈 곡 목록 정렬에 '메달순'을 추가했습니다."
            media: {type: video, src: popn-medal.mp4, poster: popn-medal.jpg}
          - title: "팝픈 클래스와 skill"
            games: ["pop'n", GITADORA]
            desc: "팝픈 클래스 어긋남을 일부 개선했습니다. GITADORA도 같은 종류의 문제를 일부 고쳤습니다."
      - heading: "스코어 어택과 티어표"
        items:
          - title: "친구 한정으로 개최"
            desc: "스코어 어택을 '친구 한정'으로도 열 수 있습니다."
            media: {type: video, src: sa-friends.mp4, poster: sa-friends.jpg}
          - title: "과제곡에서 곡 상세로"
            desc: "스코어 어택 과제곡을 고르면 곡 상세 화면이 열립니다."
            media: {type: video, src: sa-song.mp4, poster: sa-song.jpg}
          - title: "티어 색 변경"
            desc: "커스텀 티어표에서 티어 색을 바꿀 수 있습니다."
            media: {type: video, src: tier-color.mp4, poster: tier-color.jpg}
      - heading: "작은 개선과 버그 수정"
        items:
          - title: "작은 개선과 버그 수정"
            list:
              - "친구 기록이 없는 기종의 표시"
              - "곡 필터 친구 탭의 UI와 동작"
              - "목표 관리 화면의 레이더와 속성별 추이 카드 표시, 편집 중 UI와 동작"
              - "Discord로 이미지를 보낼 때의 동작"
  zh:
    title: "可用不同的 KONAMI ID 同步，並可舉辦僅限好友的分數挑戰"
    sections:
      - heading: "KONAMI ID"
        items:
          - title: "可用不同的 KONAMI ID 同步"
            desc: "解決無法用不同 KONAMI ID 同步的問題。不過，本 App 目前以「1 台裝置 1 個 ID」運作，無法在多台裝置查看同一 ID 的資訊，也無法在 1 台裝置查看多個帳號的資訊。這點之後會解決。"
      - heading: "SDVX"
        items:
          - title: "推薦與 EX 分數排序"
            games: [SDVX]
            list:
              - "依使用者實力重新調整推薦功能（可用分數提升）的對象與目標"
              - "樂曲一覽排序新增「EX 分數」與「EX 分數率」"
            media: {type: video, src: sdvx.mp4, poster: sdvx.jpg}
      - heading: "pop'n 與 GITADORA"
        items:
          - title: "依獎牌排序"
            games: ["pop'n"]
            desc: "pop'n 樂曲一覽排序新增「獎牌」。"
            media: {type: video, src: popn-medal.mp4, poster: popn-medal.jpg}
          - title: "pop'n class 與 skill"
            games: ["pop'n", GITADORA]
            desc: "部分改善 pop'n class 的偏差。GITADORA 也修正了部分同類問題。"
      - heading: "分數挑戰與 Tier表"
        items:
          - title: "僅限好友舉辦"
            desc: "分數挑戰也能以「僅限好友」舉辦。"
            media: {type: video, src: sa-friends.mp4, poster: sa-friends.jpg}
          - title: "從課題曲到樂曲詳情"
            desc: "選擇分數挑戰的課題曲後，會開啟樂曲詳情畫面。"
            media: {type: video, src: sa-song.mp4, poster: sa-song.jpg}
          - title: "可變更 Tier 顏色"
            desc: "自訂 Tier表可變更各 Tier 的顏色。"
            media: {type: video, src: tier-color.mp4, poster: tier-color.jpg}
      - heading: "小幅改善與錯誤修正"
        items:
          - title: "小幅改善與錯誤修正"
            list:
              - "沒有好友記錄的機種的顯示"
              - "樂曲篩選好友分頁的 UI 與動作"
              - "目標管理畫面的雷達與各屬性變化卡片的顯示，以及編輯中的 UI 與動作"
              - "傳送圖片到 Discord 時的動作"
- id: "2026-10-03"
  kind: release
  version: "1.2.20261003"
  date: "2026-10-02"
  ja:
    title: "GITADORA の skill とポップンクラスのずれを修正しました"
    sections:
      - heading: "不具合の修正"
        items:
          - title: "GITADORA の skill がずれる"
            games: [GITADORA]
            desc: "ギターとドラムを両方同期すると、別の曲の記録を取り込んでしまうことがありました。同期を続けていただいた皆様の記録から分かった、skill がずれる原因の1つです。"
          - title: "ポップンクラスがずれる"
            games: ["pop'n"]
            list:
              - "一部の曲を照合できていませんでした"
              - "イージー・アシストのクリアを、未クリアとして計算していました"
              - "端数処理もまだ違いそうなため、同期のときに、計算に使った今作の記録を送るようにしました。更新後も同期を続けていただけると助かります"
  en:
    title: "Fixed GITADORA skill and pop'n class mismatches"
    sections:
      - heading: "Bug fixes"
        items:
          - title: "GITADORA skill didn't match"
            games: [GITADORA]
            desc: "Syncing both guitar and drums could import another song's record. This is one cause of skill mismatches, found from the records of everyone who kept syncing."
          - title: "pop'n class didn't match"
            games: ["pop'n"]
            list:
              - "Some songs couldn't be matched"
              - "Clears with EASY or ASSIST were counted as not cleared"
              - "Rounding may still differ, so sync now sends the current-version records used in the calculation. Please keep syncing after updating"
  ko:
    title: "GITADORA skill과 팝픈 클래스 어긋남을 고쳤습니다"
    sections:
      - heading: "버그 수정"
        items:
          - title: "GITADORA skill이 어긋나는 문제"
            games: [GITADORA]
            desc: "기타와 드럼을 모두 동기화하면 다른 곡의 기록을 가져오는 경우가 있었습니다. 동기화를 계속해 주신 여러분의 기록으로 알게 된, skill이 어긋나는 원인 중 하나입니다."
          - title: "팝픈 클래스가 어긋나는 문제"
            games: ["pop'n"]
            list:
              - "일부 곡을 대조하지 못했습니다"
              - "이지·어시스트 클리어를 미클리어로 계산했습니다"
              - "반올림 처리도 아직 다를 수 있어, 동기화할 때 계산에 쓴 이번 작품 기록을 보내도록 했습니다. 업데이트 후에도 동기화를 계속해 주시면 도움이 됩니다"
  zh:
    title: "修正 GITADORA skill 與 pop'n class 的偏差"
    sections:
      - heading: "錯誤修正"
        items:
          - title: "GITADORA 的 skill 有偏差"
            games: [GITADORA]
            desc: "同時同步吉他與鼓時，有時會匯入其他樂曲的記錄。這是從持續同步的各位的記錄中找出的 skill 偏差原因之一。"
          - title: "pop'n class 有偏差"
            games: ["pop'n"]
            list:
              - "部分樂曲無法比對"
              - "將 EASY、ASSIST 通關算成未通關"
              - "尾數處理可能仍有差異，因此同步時會送出計算所用的本作記錄。更新後也請繼續同步"
- id: "2026-10-02"
  kind: release
  version: "1.2.20261002"
  date: "2026-09-30"
  ja:
    title: "判定調整を「音」と「描画」に分け、ハイスピを譜面ごとに残せます"
    sections:
      - heading: "判定調整とハイスピ"
        items:
          - title: "音・描画・ハイスピを譜面ごとに"
            desc: "判定調整を「音」と「描画」に分け、ハイスピを譜面ごとにメモできます。ハイスピの設定事故が起きないよう、既定値からハイスピを変えている譜面は、数字を反転・太字にして目立たせています。"
            media: {type: video, src: timing.mp4, poster: timing.jpg}
      - heading: "成果画像"
        items:
          - title: "「プレーした曲」でも出せる"
            games: [DDR, GITADORA]
            desc: "成果画像の表示形式の右端に「更新／プレー」の切り替えを置きました。自己ベストでなくても、その日一番良かったスコアを載せられます。"
            media: {type: video, src: result-played.mp4, poster: result-played.jpg}
      - heading: "スコアタ"
        items:
          - title: "コメントを残せる"
            desc: "参加中のスコアタにコメントを残せます。開催中に書いたコメントは、ランキングやスコアタの結果画像で、自分の名前の下に表示されます。"
            media: {type: video, src: sa-comment.mp4, poster: sa-comment.jpg}
      - heading: "ログインと初期値"
        items:
          - title: "起動時にログインをチェックする"
            desc: "設定に「起動時にログインをチェックする」を足しました。オンにすると、アプリの起動時に公式サイトのログインを確かめ、ログアウトの頻度を減らせます。アプリを1日に1回以上開く必要があるため、初期設定はオフです。"
          - title: "対象レベルの初期値"
            desc: "各機能の対象レベルの初期値は固定でしたが、初回同期のときに、プレー回数の多いレベル帯に合わせるようにしました。すでに使っている方は、フィルタなどを手で設定してください。"
      - heading: "不具合の修正"
        items:
          - title: "不具合の修正"
            list:
              - "フレンドに課題を送るとき、プレイしていない機種へ送れないようにしました"
              - "設定のチュートリアルが再生されない"
              - "共有画像で、壁紙が上部に写らない"
              - "共有画像を作るとき、特定の条件でアプリが落ちる"
              - "DDRの譜面再生で、初回だけクラップ音が遅れる"
              - "GITADORAで、公式の曲一覧の一部の曲が曲データと結び付かない"
              - "ポップンクラスの計算を修正しました"
              - "ポップンの一部の譜面の難易度を修正しました"
  en:
    title: "Timing split into audio and visual, and hi-speed memos per chart"
    sections:
      - heading: "Timing and hi-speed"
        items:
          - title: "Audio, visual and hi-speed per chart"
            desc: "Timing adjustment is split into audio and visual, and you can note your hi-speed for each chart. To prevent hi-speed mistakes, charts where hi-speed differs from your default show the number inverted and in bold."
            media: {type: video, src: timing.mp4, poster: timing.jpg}
      - heading: "Result images"
        items:
          - title: "Also by songs you played"
            games: [DDR, GITADORA]
            desc: "A switch between \"Updated\" and \"Played\" now sits at the right end of the result image format. You can show the day's best score even if it isn't a personal best."
            media: {type: video, src: result-played.mp4, poster: result-played.jpg}
      - heading: "Score Attack"
        items:
          - title: "Leave a comment"
            desc: "Leave a comment on a Score Attack you've joined. Comments written while it's running appear under your name in the rankings and result images."
            media: {type: video, src: sa-comment.mp4, poster: sa-comment.jpg}
      - heading: "Login and defaults"
        items:
          - title: "Check login at startup"
            desc: "Added \"Check login at startup\" to settings. When on, the app checks your official site login at startup, so you get logged out less often. It's off by default, since you need to open the app at least once a day."
          - title: "Default target level"
            desc: "The default target level for features used to be fixed. It now matches the level range you play most, at your first sync. If you already use the app, please set filters and such by hand."
      - heading: "Bug fixes"
        items:
          - title: "Bug fixes"
            list:
              - "You can no longer send a challenge to a friend for a game they don't play"
              - "The tutorial in settings didn't play"
              - "The wallpaper didn't appear at the top of share images"
              - "The app crashed under certain conditions when making a share image"
              - "In DDR chart playback, the clap sound was late the first time only"
              - "In GITADORA, some songs in the official song list weren't linked to song data"
              - "Fixed the pop'n class calculation"
              - "Fixed the difficulty of some pop'n charts"
  ko:
    title: "판정 조정을 '소리'와 '표시'로 나누고, 하이스피드를 채보마다 메모할 수 있게 했습니다"
    sections:
      - heading: "판정 조정과 하이스피드"
        items:
          - title: "소리·표시·하이스피드를 채보마다"
            desc: "판정 조정을 '소리'와 '표시'로 나누고, 하이스피드를 채보마다 메모할 수 있습니다. 하이스피드 설정 실수가 없도록, 기본값에서 하이스피드를 바꾼 채보는 숫자를 반전·굵게 표시해 눈에 띄게 했습니다."
            media: {type: video, src: timing.mp4, poster: timing.jpg}
      - heading: "성과 이미지"
        items:
          - title: "'플레이한 곡'으로도 출력"
            games: [DDR, GITADORA]
            desc: "성과 이미지 표시 형식의 오른쪽 끝에 '갱신/플레이' 전환을 두었습니다. 자기 최고 기록이 아니어도 그날 가장 좋았던 스코어를 실을 수 있습니다."
            media: {type: video, src: result-played.mp4, poster: result-played.jpg}
      - heading: "스코어 어택"
        items:
          - title: "코멘트 남기기"
            desc: "참가 중인 스코어 어택에 코멘트를 남길 수 있습니다. 개최 중에 쓴 코멘트는 랭킹과 결과 이미지에서 자신의 이름 아래에 표시됩니다."
            media: {type: video, src: sa-comment.mp4, poster: sa-comment.jpg}
      - heading: "로그인과 초기값"
        items:
          - title: "시작 시 로그인 확인"
            desc: "설정에 '시작 시 로그인 확인'을 추가했습니다. 켜면 앱을 시작할 때 공식 사이트 로그인을 확인해 로그아웃 빈도를 줄일 수 있습니다. 앱을 하루에 한 번 이상 열어야 하므로 기본값은 꺼짐입니다."
          - title: "대상 레벨 초기값"
            desc: "각 기능의 대상 레벨 초기값이 고정이었지만, 첫 동기화 때 플레이 횟수가 많은 레벨대에 맞추도록 했습니다. 이미 사용 중인 분은 필터 등을 직접 설정해 주세요."
      - heading: "버그 수정"
        items:
          - title: "버그 수정"
            list:
              - "친구에게 과제를 보낼 때, 플레이하지 않는 기종으로는 보낼 수 없게 했습니다"
              - "설정의 튜토리얼이 재생되지 않던 문제"
              - "공유 이미지에서 배경화면이 위쪽에 나오지 않던 문제"
              - "공유 이미지를 만들 때 특정 조건에서 앱이 종료되던 문제"
              - "DDR 채보 재생에서 처음에만 클랩 소리가 늦던 문제"
              - "GITADORA에서 공식 곡 목록의 일부 곡이 곡 데이터와 연결되지 않던 문제"
              - "팝픈 클래스 계산을 수정했습니다"
              - "팝픈 일부 채보의 난이도를 수정했습니다"
  zh:
    title: "判定調整分為「聲音」與「畫面」，並可依譜面記錄 Hi-Speed"
    sections:
      - heading: "判定調整與 Hi-Speed"
        items:
          - title: "依譜面記錄聲音、畫面與 Hi-Speed"
            desc: "判定調整分為「聲音」與「畫面」，並可依譜面記錄 Hi-Speed。為避免 Hi-Speed 設定失誤，Hi-Speed 與預設值不同的譜面會以反白粗體顯示數字。"
            media: {type: video, src: timing.mp4, poster: timing.jpg}
      - heading: "成果圖片"
        items:
          - title: "也能以「遊玩過的歌曲」輸出"
            games: [DDR, GITADORA]
            desc: "在成果圖片顯示格式的右端加入「更新／遊玩」切換。即使不是自己的最佳成績，也能放上當天最好的分數。"
            media: {type: video, src: result-played.mp4, poster: result-played.jpg}
      - heading: "分數挑戰"
        items:
          - title: "可留下留言"
            desc: "可在參加中的分數挑戰留下留言。舉辦期間寫的留言，會顯示在排名與結果圖片中自己的名字下方。"
            media: {type: video, src: sa-comment.mp4, poster: sa-comment.jpg}
      - heading: "登入與初始值"
        items:
          - title: "啟動時檢查登入"
            desc: "在設定中新增「啟動時檢查登入」。開啟後，App 啟動時會確認官方網站的登入狀態，減少被登出的次數。由於需要每天至少開啟一次 App，預設為關閉。"
          - title: "對象等級的初始值"
            desc: "各功能對象等級的初始值原本是固定的，現在會在首次同步時配合遊玩次數最多的等級帶。已在使用的人請手動設定篩選等。"
      - heading: "錯誤修正"
        items:
          - title: "錯誤修正"
            list:
              - "向好友送出課題時，無法再送往對方沒有遊玩的機種"
              - "設定中的教學無法播放"
              - "分享圖片上方不會顯示桌布"
              - "製作分享圖片時，特定條件下 App 會當機"
              - "DDR 譜面播放時，只有第一次拍手音會延遲"
              - "GITADORA 官方樂曲一覽中部分樂曲無法與樂曲資料對應"
              - "修正 pop'n class 的計算"
              - "修正部分 pop'n 譜面的難度"
- id: "2026-09-22"
  kind: release
  version: "1.2.20260922"
  date: "2026-09-22"
  ja:
    title: "スコアタの開催まわりを改善し、ポップンの差分同期を直しました"
    sections:
      - heading: "改善"
        items:
          - title: "スコアタとフレンド"
            list:
              - "スコアタの開催まわりの動きを改善しました（再承認、自動確定など）"
              - "ポップンでも、フレンドのポップンクラス対象楽曲を見られます"
      - heading: "不具合の修正"
        items:
          - title: "ポップンの差分同期"
            games: ["pop'n"]
            desc: "ポップンの差分同期が正しく動いていませんでした。ポップンのプレー履歴は、ボルテと同じく楽曲単位で最近プレイした曲が出る仕様なのに、DDRと同じロジックを使っていたのが原因です。ポップンクラスがずれる要因の一つでした。"
          - title: "Tier表の機種の名前"
            desc: "Tier表で機種を切り替えると、別の機種の名前が表示される不具合を直しました。"
  en:
    title: "Improved hosting Score Attacks, and fixed pop'n differential sync"
    sections:
      - heading: "Improvements"
        items:
          - title: "Score Attack and friends"
            list:
              - "Improved how hosting a Score Attack works (re-approval, automatic finalization and more)"
              - "pop'n can now show a friend's pop'n class songs too"
      - heading: "Bug fixes"
        items:
          - title: "pop'n differential sync"
            games: ["pop'n"]
            desc: "pop'n differential sync wasn't working correctly. Like SDVX, pop'n's play history lists recently played songs per song, but the app used the same logic as DDR. This was one cause of pop'n class mismatches."
          - title: "Game name in the Tier List"
            desc: "Fixed the Tier List showing another game's name after switching games."
  ko:
    title: "스코어 어택 개최 기능을 개선하고, 팝픈 차분 동기화를 고쳤습니다"
    sections:
      - heading: "개선"
        items:
          - title: "스코어 어택과 친구"
            list:
              - "스코어 어택 개최 관련 동작을 개선했습니다(재승인, 자동 확정 등)"
              - "팝픈에서도 친구의 팝픈 클래스 대상곡을 볼 수 있습니다"
      - heading: "버그 수정"
        items:
          - title: "팝픈 차분 동기화"
            games: ["pop'n"]
            desc: "팝픈 차분 동기화가 제대로 작동하지 않았습니다. 팝픈의 플레이 이력은 SDVX처럼 곡 단위로 최근 플레이한 곡이 나오는 사양인데, DDR과 같은 로직을 쓰고 있었던 것이 원인입니다. 팝픈 클래스가 어긋나는 원인 중 하나였습니다."
          - title: "티어표의 기종 이름"
            desc: "티어표에서 기종을 바꾸면 다른 기종의 이름이 표시되던 문제를 고쳤습니다."
  zh:
    title: "改善分數挑戰的舉辦功能，並修正 pop'n 差分同步"
    sections:
      - heading: "改善"
        items:
          - title: "分數挑戰與好友"
            list:
              - "改善舉辦分數挑戰相關的動作（重新核准、自動確定等）"
              - "pop'n 也能查看好友的 pop'n class 對象樂曲"
      - heading: "錯誤修正"
        items:
          - title: "pop'n 差分同步"
            games: ["pop'n"]
            desc: "pop'n 的差分同步沒有正確運作。pop'n 的遊玩履歷和 SDVX 一樣，是以樂曲為單位顯示最近遊玩的歌曲，卻使用了與 DDR 相同的邏輯。這是 pop'n class 偏差的原因之一。"
          - title: "Tier表的機種名稱"
            desc: "修正在 Tier表切換機種後，會顯示其他機種名稱的問題。"
- id: "2026-09-21"
  kind: release
  version: "1.2.20260921"
  date: "2026-09-20"
  ja:
    title: "ポップンクラスのずれを直し、フレンドとプロフィールまわりを改善しました"
    sections:
      - heading: "ポップンクラス"
        items:
          - title: "ポップンクラスが合わない不具合"
            games: ["pop'n"]
            list:
              - "ポップンの同期で、ポップンクラスが公式HPの値と合わない不具合に対応しました（今回で完全には直らない可能性があります）"
              - "歴代の記録の方が高い場合に、データを取得していませんでした"
              - "リリース後、最初のポップンの差分同期では全件同期が走ります"
      - heading: "フレンドとプロフィール"
        items:
          - title: "ランキングとフレンド申請"
            list:
              - "Skill などのランキングを見られます（プロフィールを公開していないユーザーの名前は表示されません）"
              - "フレンド一覧のUIを改善しました"
              - "プロフィールからフレンド申請するUIを改善しました"
              - "楽曲詳細の画面のUIを改善しました"
      - heading: "画像の共有"
        items:
          - title: "X への共有"
            desc: "おそらく X 側の仕様変更で、画像の共有が一時的にうまくいかなかったのを直しました。これまでは webview 経由で使いづらかったのが、アプリに移れるようになりました。"
  en:
    title: "Fixed pop'n class mismatches, and improved friends and profiles"
    sections:
      - heading: "pop'n class"
        items:
          - title: "pop'n class didn't match"
            games: ["pop'n"]
            list:
              - "Fixed pop'n class not matching the official site after syncing pop'n (this may not fully fix it)"
              - "Data wasn't fetched when your all-time record was higher"
              - "After this release, your first pop'n differential sync runs as a full sync"
      - heading: "Friends and profiles"
        items:
          - title: "Rankings and friend requests"
            list:
              - "See rankings for skill and more (names of users without a public profile aren't shown)"
              - "Improved the friend list UI"
              - "Improved the UI for sending friend requests from a profile"
              - "Improved the song details UI"
      - heading: "Sharing images"
        items:
          - title: "Sharing to X"
            desc: "Fixed image sharing, which briefly stopped working, probably because of a change on X's side. It used to go through a webview and was awkward; now it opens the app."
  ko:
    title: "팝픈 클래스 어긋남을 고치고, 친구와 프로필을 개선했습니다"
    sections:
      - heading: "팝픈 클래스"
        items:
          - title: "팝픈 클래스가 맞지 않는 문제"
            games: ["pop'n"]
            list:
              - "팝픈 동기화에서 팝픈 클래스가 공식 사이트 값과 맞지 않는 문제에 대응했습니다(이번에 완전히 해결되지 않을 수도 있습니다)"
              - "역대 기록이 더 높을 때 데이터를 가져오지 않았습니다"
              - "릴리스 후 첫 팝픈 차분 동기화는 전체 동기화로 진행됩니다"
      - heading: "친구와 프로필"
        items:
          - title: "랭킹과 친구 신청"
            list:
              - "Skill 등의 랭킹을 볼 수 있습니다(프로필을 공개하지 않은 사용자의 이름은 표시되지 않습니다)"
              - "친구 목록 UI를 개선했습니다"
              - "프로필에서 친구 신청하는 UI를 개선했습니다"
              - "곡 상세 화면 UI를 개선했습니다"
      - heading: "이미지 공유"
        items:
          - title: "X로 공유"
            desc: "아마도 X 측의 사양 변경으로 이미지 공유가 일시적으로 잘 되지 않던 것을 고쳤습니다. 지금까지는 webview를 거쳐 다소 불편했지만, 이제 앱으로 이동할 수 있습니다."
  zh:
    title: "修正 pop'n class 的偏差，並改善好友與個人檔案"
    sections:
      - heading: "pop'n class"
        items:
          - title: "pop'n class 對不上"
            games: ["pop'n"]
            list:
              - "處理 pop'n 同步後 pop'n class 與官方網站數值對不上的問題（這次可能無法完全修好）"
              - "歷代記錄較高時，沒有取得資料"
              - "發布後第一次 pop'n 差分同步會執行全部同步"
      - heading: "好友與個人檔案"
        items:
          - title: "排名與好友申請"
            list:
              - "可查看 Skill 等排名（未公開個人檔案的使用者不會顯示名稱）"
              - "改善好友列表的 UI"
              - "改善從個人檔案申請好友的 UI"
              - "改善樂曲詳情畫面的 UI"
      - heading: "分享圖片"
        items:
          - title: "分享到 X"
            desc: "修正可能因 X 方面規格變更而暫時無法分享圖片的問題。過去必須經由 webview，不太好用，現在可以直接跳到 App。"
- id: "2026-09-18"
  kind: release
  version: "1.2.20260918"
  date: "2026-09-17"
  ja:
    title: "スコアアタックとプロフィールを追加しました"
    sections:
      - heading: "スコアアタック"
        items:
          - title: "スコアタを開催できる"
            list:
              - "バナー画像（任意）・参加条件・機種・課題曲などを指定し、期間制のスコアタを開催できます"
              - "DDR（通常スコア）・GITADORA は差分同期で自動登録されます（手動登録も可）"
              - "DDR（EX）・SDVX・pop'n は手動登録が必要で、リザルト画像の提出が必須です"
            media: {type: video, src: score-attack.mp4, poster: score-attack.jpg}
          - title: "主催者の承認"
            list:
              - "リザルト画像は主催者の承認が必要です。主催者が画像と提出スコアを照合して承認すると、スコアが確定します"
              - "リザルト画像は終了後2日で削除されるため、承認は早めに行ってください"
            media: {type: video, src: sa-approve.mp4, poster: sa-approve.jpg}
          - title: "結果画像"
            desc: "スコアタが終了すると、参加者向けと主催者向けの2種類の結果画像を作れます。"
            media: {type: video, src: sa-result.mp4, poster: sa-result.jpg}
          - title: "データの保持と複数機種"
            list:
              - "スコアタのデータは終了後30日で消え、復元できなくなります。結果画像はお手元に保存してください"
              - "複数機種をまたいだスコアタも開催できます。その場合、満点比の百分率で正規化した記録で順位を決めます"
          - title: "その他"
            list:
              - "スコアタは全体公開のみです。参加条件は、skill などの指標値でだけ制限できます"
              - "SDVXを含む大会に参加すると、差分同期が「直近100曲のプレー履歴を確認する」動きに変わります"
      - heading: "プロフィール"
        items:
          - title: "プロフィールを作れる"
            list:
              - "一言、好きな譜面・苦手な譜面、ウィジェットなどを設定できます"
              - "各機種のプレイ傾向や選曲ランキング（一部のみ）を自動で表示します（SDVXは、もう一度全曲の詳細同期が必要です）"
              - "得意譜面には、相対的にスコアの高い譜面を自動で表示します"
              - "プロフィールは画像で出力できます"
              - "公開設定は、一括でも個別でも表示・非表示を切り替えられます"
              - "フレンド追加画面に、プロフィールを公開しているユーザーが一覧で出ます。これまでより他のプレイヤーに見つかりやすくなります"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
      - heading: "楽曲詳細と譜面確認"
        items:
          - title: "楽曲の読み方"
            desc: "楽曲詳細の画面から、各楽曲の読み方を確認できます。英語の読みは、発音記号を表しきれないため参考です。"
          - title: "譜面確認の速度表記"
            games: [DDR]
            desc: "DDRの譜面確認ビューアの速度表記を改善し、すぐに倍速や1/2倍速にできます（数字は実際の筐体の速度とは異なります）。"
            media: {type: image, src: ddr-speed.jpg}
      - heading: "統計"
        items:
          - title: "ランク区分と偏差値"
            list:
              - "統計情報などのランク区分で、偏りを考えて SDVX のインペリアルⅠを4分割、Ⅱを2分割しました"
              - "外れ値などの影響で極端に低くなる偏差値を、表示しないようにしました"
      - heading: "軽微な改善"
        items:
          - title: "ホームと同期"
            list:
              - "設定から、ホーム画面で非表示にする項目を選べます"
              - "同期したときに、ライバルのスコアを抜いたことが分かるようにしました"
              - "クイック同期の表記を改善しました（動きは変えていません）"
              - "今日の成果で、課題曲だけを表示できます"
          - title: "Tier表・弱点分析・検索"
            list:
              - "Tier表の動き（画像の読み込み速度）を改善しました"
              - "「弱点分析」で対象レベルを絞り込めます"
              - "楽曲検索で、ポップンのジャンル名を検索できます"
      - heading: "不具合の修正"
        items:
          - title: "同期漏れなど"
            list:
              - "ポップンの楽曲同期漏れ：差分同期で、歴代記録の更新の有無だけを見ていた"
              - "GITADORAの楽曲同期漏れ：考えられる対策を行いました。根本の要因は特定できておらず、引き続き見ていきます"
              - "DDRの譜面再生で、クラップ音がずれることがある"
              - "iOSでヘルスケア連携ができない"
  en:
    title: "Score Attack and profiles"
    sections:
      - heading: "Score Attack"
        items:
          - title: "Host a Score Attack"
            list:
              - "Set a banner image (optional), entry conditions, game and challenge songs, and host a Score Attack for a set period"
              - "DDR (normal score) and GITADORA are registered automatically by differential sync (manual registration also works)"
              - "DDR (EX), SDVX and pop'n need manual registration with a result screenshot"
            media: {type: video, src: score-attack.mp4, poster: score-attack.jpg}
          - title: "Approval by the host"
            list:
              - "Result screenshots need the host's approval. The score is final once the host checks the screenshot against the submitted score and approves it"
              - "Result screenshots are deleted 2 days after the end, so approve them early"
            media: {type: video, src: sa-approve.mp4, poster: sa-approve.jpg}
          - title: "Result images"
            desc: "When a Score Attack ends, you can make two kinds of result images: one for participants and one for the host."
            media: {type: video, src: sa-result.mp4, poster: sa-result.jpg}
          - title: "Data retention and multiple games"
            list:
              - "Score Attack data is deleted 30 days after the end and can't be restored. Save the result images yourself"
              - "You can also host a Score Attack across several games. Rankings then use records normalized as a percentage of the maximum score"
          - title: "Other notes"
            list:
              - "Score Attacks are public only. Entry conditions can only use metrics such as skill"
              - "Joining a tournament that includes SDVX changes differential sync to check the play history of the latest 100 songs"
      - heading: "Profiles"
        items:
          - title: "Make a profile"
            list:
              - "Set a short message, favorite and weak charts, widgets and more"
              - "Your play tendencies and song rankings (partly) for each game appear automatically (SDVX needs a full detailed sync again)"
              - "Charts where your score is relatively high appear automatically as your strong charts"
              - "Export your profile as an image"
              - "Show or hide items all at once or one by one"
              - "The add-friend screen lists users with public profiles, so other players can find you more easily"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
      - heading: "Song details and chart viewer"
        items:
          - title: "How to read song titles"
            desc: "Check how each song title is read from the song details screen. English readings are only a reference, since phonetic symbols can't be shown fully."
          - title: "Speed display in the chart viewer"
            games: [DDR]
            desc: "The DDR chart viewer shows speed more clearly, and you can switch to double or half speed right away (the numbers differ from the actual cabinet speed)."
            media: {type: image, src: ddr-speed.jpg}
      - heading: "Statistics"
        items:
          - title: "Rank ranges and T-scores"
            list:
              - "To account for skew, SDVX Imperial I is split into 4 and Imperial II into 2 in rank ranges for statistics"
              - "T-scores that become extremely low because of outliers are no longer shown"
      - heading: "Small improvements"
        items:
          - title: "Home and sync"
            list:
              - "Choose items to hide on the home screen from settings"
              - "Sync now tells you when you've beaten a rival's score"
              - "Improved the wording of Quick sync (its behavior is unchanged)"
              - "Show only challenge songs in today's results"
          - title: "Tier List, weakness analysis and search"
            list:
              - "Tier Lists load images faster"
              - "Narrow weakness analysis by level"
              - "Song search finds pop'n genre names"
      - heading: "Bug fixes"
        items:
          - title: "Missed syncs and more"
            list:
              - "pop'n songs missed in sync: differential sync only checked whether all-time records had changed"
              - "GITADORA songs missed in sync: we applied the fixes we could think of, but the root cause isn't identified yet, so we keep monitoring"
              - "The clap sound in DDR chart playback could be out of sync"
              - "Health integration didn't work on iOS"
  ko:
    title: "스코어 어택과 프로필을 추가했습니다"
    sections:
      - heading: "스코어 어택"
        items:
          - title: "스코어 어택 개최"
            list:
              - "배너 이미지(선택)·참가 조건·기종·과제곡 등을 지정해 기간제 스코어 어택을 열 수 있습니다"
              - "DDR(일반 스코어)·GITADORA는 차분 동기화로 자동 등록됩니다(수동 등록도 가능)"
              - "DDR(EX)·SDVX·pop'n은 수동 등록이 필요하며, 리절트 이미지 제출이 필수입니다"
            media: {type: video, src: score-attack.mp4, poster: score-attack.jpg}
          - title: "주최자 승인"
            list:
              - "리절트 이미지는 주최자 승인이 필요합니다. 주최자가 이미지와 제출 스코어를 대조해 승인하면 스코어가 확정됩니다"
              - "리절트 이미지는 종료 2일 후 삭제되므로 승인은 빨리 해 주세요"
            media: {type: video, src: sa-approve.mp4, poster: sa-approve.jpg}
          - title: "결과 이미지"
            desc: "스코어 어택이 끝나면 참가자용과 주최자용, 두 종류의 결과 이미지를 만들 수 있습니다."
            media: {type: video, src: sa-result.mp4, poster: sa-result.jpg}
          - title: "데이터 보존과 여러 기종"
            list:
              - "스코어 어택 데이터는 종료 30일 후 삭제되어 복원할 수 없습니다. 결과 이미지는 직접 저장해 주세요"
              - "여러 기종에 걸친 스코어 어택도 열 수 있습니다. 이 경우 만점 대비 백분율로 정규화한 기록으로 순위를 정합니다"
          - title: "그 밖에"
            list:
              - "스코어 어택은 전체 공개만 가능하며, 참가 조건은 skill 등 지표값으로만 제한할 수 있습니다"
              - "SDVX가 포함된 대회에 참가하면 차분 동기화가 '최근 100곡의 플레이 이력을 확인하는' 동작으로 바뀝니다"
      - heading: "프로필"
        items:
          - title: "프로필 만들기"
            list:
              - "한마디, 좋아하는 채보·어려운 채보, 위젯 등을 설정할 수 있습니다"
              - "각 기종의 플레이 경향과 선곡 랭킹(일부)을 자동으로 표시합니다(SDVX는 전곡 상세 동기화를 다시 해야 합니다)"
              - "잘하는 채보에는 상대적으로 스코어가 높은 채보를 자동으로 표시합니다"
              - "프로필을 이미지로 내보낼 수 있습니다"
              - "공개 설정은 일괄로도 개별로도 표시·숨김을 바꿀 수 있습니다"
              - "친구 추가 화면에 프로필을 공개한 사용자가 목록으로 나와, 다른 플레이어가 찾기 쉬워집니다"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
      - heading: "곡 상세와 채보 확인"
        items:
          - title: "곡명 읽는 법"
            desc: "곡 상세 화면에서 각 곡의 읽는 법을 확인할 수 있습니다. 영어 읽기는 발음 기호를 다 표현할 수 없어 참고용입니다."
          - title: "채보 확인의 속도 표기"
            games: [DDR]
            desc: "DDR 채보 확인 뷰어의 속도 표기를 개선해 바로 배속이나 1/2배속으로 바꿀 수 있습니다(숫자는 실제 기체 속도와 다릅니다)."
            media: {type: image, src: ddr-speed.jpg}
      - heading: "통계"
        items:
          - title: "랭크 구분과 T점수"
            list:
              - "통계 정보 등의 랭크 구분에서 편중을 고려해 SDVX 임페리얼 Ⅰ을 4분할, Ⅱ를 2분할했습니다"
              - "이상값 등의 영향으로 극단적으로 낮아지는 T점수는 표시하지 않습니다"
      - heading: "작은 개선"
        items:
          - title: "홈과 동기화"
            list:
              - "설정에서 홈 화면에 숨길 항목을 고를 수 있습니다"
              - "동기화할 때 라이벌 스코어를 넘으면 알 수 있게 했습니다"
              - "빠른 동기화의 표기를 개선했습니다(동작은 바꾸지 않았습니다)"
              - "오늘의 성과에서 과제곡만 표시할 수 있습니다"
          - title: "티어표·약점 분석·검색"
            list:
              - "티어표 동작(이미지 로딩 속도)을 개선했습니다"
              - "'약점 분석'에서 대상 레벨을 좁힐 수 있습니다"
              - "곡 검색에서 팝픈의 장르명을 검색할 수 있습니다"
      - heading: "버그 수정"
        items:
          - title: "동기화 누락 등"
            list:
              - "팝픈 곡 동기화 누락: 차분 동기화에서 역대 기록의 갱신 여부만 보고 있었습니다"
              - "GITADORA 곡 동기화 누락: 생각할 수 있는 대책을 적용했지만 근본 원인을 특정하지 못해 계속 지켜보고 있습니다"
              - "DDR 채보 재생에서 클랩 소리가 어긋나는 경우가 있던 문제"
              - "iOS에서 헬스케어 연동이 되지 않던 문제"
  zh:
    title: "新增分數挑戰與個人檔案"
    sections:
      - heading: "分數挑戰"
        items:
          - title: "可舉辦分數挑戰"
            list:
              - "可指定橫幅圖片（可選）、參加條件、機種、課題曲等，舉辦限定期間的分數挑戰"
              - "DDR（一般分數）與 GITADORA 會透過差分同步自動登錄（也可手動登錄）"
              - "DDR（EX）、SDVX、pop'n 需手動登錄，且必須提交結算畫面圖片"
            media: {type: video, src: score-attack.mp4, poster: score-attack.jpg}
          - title: "主辦者核准"
            list:
              - "結算圖片需要主辦者核准。主辦者比對圖片與提交的分數並核准後，分數即確定"
              - "結算圖片會在結束 2 天後刪除，請盡早核准"
            media: {type: video, src: sa-approve.mp4, poster: sa-approve.jpg}
          - title: "結果圖片"
            desc: "分數挑戰結束後，可製作參加者用與主辦者用兩種結果圖片。"
            media: {type: video, src: sa-result.mp4, poster: sa-result.jpg}
          - title: "資料保存與跨機種"
            list:
              - "分數挑戰的資料會在結束 30 天後刪除且無法復原，請自行保存結果圖片"
              - "也可舉辦跨多個機種的分數挑戰，此時以滿分比例的百分率正規化後的記錄決定名次"
          - title: "其他"
            list:
              - "分數挑戰只能全體公開，參加條件只能用 skill 等指標值限制"
              - "參加包含 SDVX 的大會後，差分同步會改為「確認最近 100 首的遊玩履歷」"
      - heading: "個人檔案"
        items:
          - title: "可建立個人檔案"
            list:
              - "可設定一句話、喜歡與不擅長的譜面、小工具等"
              - "自動顯示各機種的遊玩傾向與選曲排名（部分）（SDVX 需要再做一次全曲詳細同步）"
              - "擅長譜面會自動顯示分數相對較高的譜面"
              - "個人檔案可輸出為圖片"
              - "公開設定可一次或逐項切換顯示與隱藏"
              - "新增好友畫面會列出公開個人檔案的使用者，比以前更容易被其他玩家找到"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
      - heading: "樂曲詳情與譜面確認"
        items:
          - title: "樂曲的讀法"
            desc: "可從樂曲詳情畫面確認各樂曲的讀法。英文讀法無法完全以音標表示，僅供參考。"
          - title: "譜面確認的速度標示"
            games: [DDR]
            desc: "改善 DDR 譜面確認檢視器的速度標示，可立即切換為倍速或 1/2 倍速（數字與實際機台的速度不同）。"
            media: {type: image, src: ddr-speed.jpg}
      - heading: "統計"
        items:
          - title: "等級區分與 T分數"
            list:
              - "統計資訊等的等級區分考量偏差，將 SDVX 的 Imperial Ⅰ 分為 4 段、Ⅱ 分為 2 段"
              - "因離群值等影響而極端偏低的 T分數不再顯示"
      - heading: "小幅改善"
        items:
          - title: "首頁與同步"
            list:
              - "可從設定選擇首頁要隱藏的項目"
              - "同步時若超越勁敵的分數，會讓你知道"
              - "改善快速同步的標示（動作不變）"
              - "今日成果可只顯示課題曲"
          - title: "Tier表、弱點分析與搜尋"
            list:
              - "改善 Tier表的動作（圖片載入速度）"
              - "「弱點分析」可篩選對象等級"
              - "樂曲搜尋支援 pop'n 的類型名稱"
      - heading: "錯誤修正"
        items:
          - title: "同步遺漏等"
            list:
              - "pop'n 樂曲同步遺漏：差分同步只檢查歷代記錄是否更新"
              - "GITADORA 樂曲同步遺漏：已採取想得到的對策，但尚未找出根本原因，將持續觀察"
              - "DDR 譜面播放時，拍手音有時會偏移"
              - "iOS 無法連動健康 App"
- id: "2026-09-11"
  kind: release
  version: "1.2.20260911"
  date: "2026-09-11"
  ja:
    title: "1タップのクイック同期、ヘルスケア連動、リスト保存に対応しました"
    sections:
      - heading: "同期"
        items:
          - title: "1タップのクイック同期"
            list:
              - "ホームから「クイック同期」を選べます"
              - "ログイン情報が期限切れのときだけ、アプリ内ブラウザでログイン画面が開きます"
            media: {type: video, src: quick-sync.mp4, poster: quick-sync.jpg}
          - title: "プレー履歴を残す"
            games: [DDR, GITADORA, "pop'n"]
            desc: "公式HPの「プレー履歴」を、アプリ内に少し多めに保存できます。公式HPにはDDRは直近50曲、他は20曲しか残らないため、こまめな同期（クイック同期）がおすすめです。"
            media: {type: video, src: history.mp4, poster: history.jpg}
      - heading: "ヘルスケア連動"
        items:
          - title: "体重とカロリーの推移"
            games: [DDR]
            list:
              - "ヘルスケアの体重・カロリーの推移を表示します"
              - "体重は公式HPに同期され、DDRのカロリーもアプリに表示されます"
              - "手動入力もできますが、ヘルスケアと連動する体重計と活動量計の利用がおすすめです"
              - "サーバーには保存しません"
            media: {type: video, src: health.mp4, poster: health.jpg}
      - heading: "DDRの譜面確認"
        items:
          - title: "FAの表示と空打ち"
            games: [DDR]
            list:
              - "FAの表示を3段階（通常・細い・頭だけ）から選べます"
              - "空打ちを足すモードを入れ、空打ちのリズムを記録できます"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "リスト保存"
        items:
          - title: "お気に入りをリスト保存に"
            list:
              - "リストを自分で作り、譜面ごとに登録できます"
              - "これまでのお気に入りは、最初からあるリスト「お気に入り」に引き継がれます"
              - "リスト管理の画面で、曲の並びも変えられます"
            media: {type: video, src: lists.mp4, poster: lists.jpg}
      - heading: "楽曲一覧とTier表"
        items:
          - title: "楽曲一覧を広く"
            list:
              - "下へスクロールすると上部の絞り込みが隠れ、一覧が広くなります"
              - "上下に動かしたとき、最上部・最下部へ一気に送るボタンを表示します"
            media: {type: video, src: song-list.mp4, poster: song-list.jpg}
          - title: "今作と歴代、バージョンで絞り込み"
            list:
              - "pop'nの楽曲一覧・ポップンクラス対象楽曲などの表示を、今作の記録と歴代の記録で切り替えられます"
              - "各機種で、バージョンで曲を絞り込めます"
            media: {type: video, src: version.mp4, poster: version.jpg}
          - title: "Tier表の区分タブと達成基準"
            list:
              - "DDR・pop'n・GITADORA のTier表に区分タブを置き、見たい区分だけを出せます"
              - "カスタムTier表の達成基準に、任意のスコアを設定できます（あわせてUIも改善しました）"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
      - heading: "その他の改善"
        items:
          - title: "並べ替えと放置曲"
            list:
              - "フレンドの並べ替えの動きを改善しました"
              - "目標管理タブのウィジェットを並べ替えるときの動きを改善しました"
              - "放置曲を90日・半年・1年で切り替えられます"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
          - title: "手動入力"
            list:
              - "楽曲詳細の画面から、スコアやグレードを手で入力できます"
              - "DDRで、過去の体重を手で埋められます"
      - heading: "不具合の修正"
        items:
          - title: "不具合の修正"
            list:
              - "GITADORAのデータ取得がうまくいかない"
              - "メモ欄などがキーボードに隠れる"
  en:
    title: "One-tap Quick sync, Health integration and saved lists"
    sections:
      - heading: "Sync"
        items:
          - title: "One-tap Quick sync"
            list:
              - "Choose \"Quick sync\" from the home screen"
              - "The in-app browser opens a login screen only when your login has expired"
            media: {type: video, src: quick-sync.mp4, poster: quick-sync.jpg}
          - title: "Keep your play history"
            games: [DDR, GITADORA, "pop'n"]
            desc: "The app can keep a little more of the official site's play history. The official site keeps only the latest 50 songs for DDR and 20 for the others, so sync often (use Quick sync)."
            media: {type: video, src: history.mp4, poster: history.jpg}
      - heading: "Health integration"
        items:
          - title: "Weight and calories over time"
            games: [DDR]
            list:
              - "Shows your weight and calories over time from Health"
              - "Your weight syncs to the official site, and DDR calories appear in the app"
              - "You can enter values by hand, but a scale and activity tracker linked to Health are recommended"
              - "Nothing is stored on the server"
            media: {type: video, src: health.mp4, poster: health.jpg}
      - heading: "DDR chart viewer"
        items:
          - title: "FA display and ghost steps"
            games: [DDR]
            list:
              - "Choose from 3 FA displays (normal, thin, head only)"
              - "A new mode adds ghost steps, so you can record their rhythm"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "Saved lists"
        items:
          - title: "Favorites become saved lists"
            list:
              - "Create your own lists and add charts to them"
              - "Your previous favorites carry over to the default list \"Favorites\""
              - "Reorder songs on the list management screen"
            media: {type: video, src: lists.mp4, poster: lists.jpg}
      - heading: "Song list and Tier List"
        items:
          - title: "More room for the song list"
            list:
              - "Scrolling down hides the filters at the top, giving the list more room"
              - "When you scroll, buttons appear to jump to the top or bottom"
            media: {type: video, src: song-list.mp4, poster: song-list.jpg}
          - title: "Current and all-time, filter by version"
            list:
              - "For pop'n, switch the song list, pop'n class songs and more between this version's records and all-time records"
              - "Filter songs by version for every game"
            media: {type: video, src: version.mp4, poster: version.jpg}
          - title: "Category tabs and goals in Tier Lists"
            list:
              - "Tier Lists for DDR, pop'n and GITADORA have category tabs, so you can show only the category you want"
              - "Set any score as the goal of a custom Tier List (with an improved UI)"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
      - heading: "Other improvements"
        items:
          - title: "Reordering and neglected songs"
            list:
              - "Improved reordering of friends"
              - "Improved rearranging widgets on the goals tab"
              - "Switch neglected songs between 90 days, half a year and a year"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
          - title: "Manual entry"
            list:
              - "Enter scores and grades by hand from the song details screen"
              - "For DDR, fill in past weight by hand"
      - heading: "Bug fixes"
        items:
          - title: "Bug fixes"
            list:
              - "GITADORA data was not fetched properly"
              - "Memo fields and others were hidden behind the keyboard"
  ko:
    title: "원탭 빠른 동기화, 헬스케어 연동, 리스트 저장 지원"
    sections:
      - heading: "동기화"
        items:
          - title: "원탭 빠른 동기화"
            list:
              - "홈에서 '빠른 동기화'를 고를 수 있습니다"
              - "로그인 정보가 만료됐을 때만 앱 내 브라우저에서 로그인 화면이 열립니다"
            media: {type: video, src: quick-sync.mp4, poster: quick-sync.jpg}
          - title: "플레이 이력 남기기"
            games: [DDR, GITADORA, "pop'n"]
            desc: "공식 사이트의 '플레이 이력'을 앱 안에 조금 더 많이 저장할 수 있습니다. 공식 사이트에는 DDR은 최근 50곡, 다른 기종은 20곡만 남으므로 자주 동기화(빠른 동기화)하는 것을 권장합니다."
            media: {type: video, src: history.mp4, poster: history.jpg}
      - heading: "헬스케어 연동"
        items:
          - title: "체중과 칼로리 추이"
            games: [DDR]
            list:
              - "헬스케어의 체중·칼로리 추이를 표시합니다"
              - "체중은 공식 사이트에 동기화되고, DDR 칼로리도 앱에 표시됩니다"
              - "직접 입력도 가능하지만, 헬스케어와 연동되는 체중계와 활동량계를 권장합니다"
              - "서버에는 저장하지 않습니다"
            media: {type: video, src: health.mp4, poster: health.jpg}
      - heading: "DDR 채보 확인"
        items:
          - title: "FA 표시와 빈 스텝"
            games: [DDR]
            list:
              - "FA 표시를 3단계(일반·가늘게·머리만)에서 고를 수 있습니다"
              - "빈 스텝을 더하는 모드를 넣어 빈 스텝 리듬을 기록할 수 있습니다"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "리스트 저장"
        items:
          - title: "즐겨찾기를 리스트 저장으로"
            list:
              - "리스트를 직접 만들고 채보마다 등록할 수 있습니다"
              - "기존 즐겨찾기는 기본 리스트 '즐겨찾기'로 이어집니다"
              - "리스트 관리 화면에서 곡 순서도 바꿀 수 있습니다"
            media: {type: video, src: lists.mp4, poster: lists.jpg}
      - heading: "곡 목록과 티어표"
        items:
          - title: "곡 목록을 넓게"
            list:
              - "아래로 스크롤하면 상단 필터가 숨겨져 목록이 넓어집니다"
              - "위아래로 움직이면 맨 위·맨 아래로 한 번에 이동하는 버튼이 나옵니다"
            media: {type: video, src: song-list.mp4, poster: song-list.jpg}
          - title: "이번 작품과 역대, 버전으로 좁히기"
            list:
              - "pop'n의 곡 목록·팝픈 클래스 대상곡 등을 이번 작품 기록과 역대 기록으로 전환할 수 있습니다"
              - "각 기종에서 버전으로 곡을 좁힐 수 있습니다"
            media: {type: video, src: version.mp4, poster: version.jpg}
          - title: "티어표의 구분 탭과 달성 기준"
            list:
              - "DDR·pop'n·GITADORA 티어표에 구분 탭을 두어 보고 싶은 구분만 표시할 수 있습니다"
              - "커스텀 티어표의 달성 기준에 원하는 스코어를 설정할 수 있습니다(UI도 개선했습니다)"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
      - heading: "그 밖의 개선"
        items:
          - title: "정렬과 방치곡"
            list:
              - "친구 정렬 동작을 개선했습니다"
              - "목표 관리 탭의 위젯 재배치 동작을 개선했습니다"
              - "방치곡 기준을 90일·반년·1년으로 바꿀 수 있습니다"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
          - title: "직접 입력"
            list:
              - "곡 상세 화면에서 스코어와 그레이드를 직접 입력할 수 있습니다"
              - "DDR에서 과거 체중을 직접 채울 수 있습니다"
      - heading: "버그 수정"
        items:
          - title: "버그 수정"
            list:
              - "GITADORA 데이터 수집이 잘 되지 않는 문제"
              - "메모란 등이 키보드에 가려지는 문제"
  zh:
    title: "支援一鍵快速同步、健康 App 連動與清單儲存"
    sections:
      - heading: "同步"
        items:
          - title: "一鍵快速同步"
            list:
              - "可從首頁選擇「快速同步」"
              - "只有登入資訊過期時，才會在 App 內瀏覽器開啟登入畫面"
            media: {type: video, src: quick-sync.mp4, poster: quick-sync.jpg}
          - title: "保留遊玩履歷"
            games: [DDR, GITADORA, "pop'n"]
            desc: "可在 App 內多保存一些官方網站的「遊玩履歷」。官方網站上 DDR 只保留最近 50 首、其他機種只保留 20 首，建議經常同步（使用快速同步）。"
            media: {type: video, src: history.mp4, poster: history.jpg}
      - heading: "健康 App 連動"
        items:
          - title: "體重與熱量的變化"
            games: [DDR]
            list:
              - "顯示健康 App 中體重與熱量的變化"
              - "體重會同步到官方網站，DDR 的熱量也會顯示在 App 中"
              - "也可手動輸入，但建議使用與健康 App 連動的體重計與活動量計"
              - "不會儲存在伺服器"
            media: {type: video, src: health.mp4, poster: health.jpg}
      - heading: "DDR 譜面確認"
        items:
          - title: "FA 顯示與空踩"
            games: [DDR]
            list:
              - "FA 的顯示可從 3 種（一般、細、只有頭部）中選擇"
              - "新增加入空踩的模式，可記錄空踩的節奏"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "清單儲存"
        items:
          - title: "我的最愛改為清單儲存"
            list:
              - "可自行建立清單，並依譜面登錄"
              - "原本的我的最愛會延續到預設清單「我的最愛」"
              - "可在清單管理畫面調整樂曲順序"
            media: {type: video, src: lists.mp4, poster: lists.jpg}
      - heading: "樂曲一覽與 Tier表"
        items:
          - title: "樂曲一覽更寬"
            list:
              - "向下捲動時，上方的篩選會隱藏，一覽變得更寬"
              - "上下捲動時會顯示一鍵移到最上方或最下方的按鈕"
            media: {type: video, src: song-list.mp4, poster: song-list.jpg}
          - title: "本作與歷代、依版本篩選"
            list:
              - "pop'n 的樂曲一覽、pop'n class 對象樂曲等，可在本作記錄與歷代記錄間切換"
              - "各機種都可依版本篩選樂曲"
            media: {type: video, src: version.mp4, poster: version.jpg}
          - title: "Tier表的區分分頁與達成基準"
            list:
              - "DDR、pop'n、GITADORA 的 Tier表加入區分分頁，可只顯示想看的區分"
              - "自訂 Tier表的達成基準可設定任意分數（同時改善了 UI）"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
      - heading: "其他改善"
        items:
          - title: "排序與久未遊玩的樂曲"
            list:
              - "改善好友排序的動作"
              - "改善目標管理分頁重新排列小工具的動作"
              - "久未遊玩的樂曲可在 90 天、半年、1 年之間切換"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
          - title: "手動輸入"
            list:
              - "可從樂曲詳情畫面手動輸入分數與評價"
              - "DDR 可手動補上過去的體重"
      - heading: "錯誤修正"
        items:
          - title: "錯誤修正"
            list:
              - "GITADORA 資料無法順利取得"
              - "備忘欄等被鍵盤遮住"
- id: "2026-09-06"
  kind: release
  version: "1.2.20260906"
  date: "2026-09-06"
  ja:
    title: "1.2.20260904 で起きていた同期の不具合を修正しました"
    sections:
      - heading: "不具合の修正"
        items:
          - title: "楽曲同期でデータを取り損ねる"
            desc: "クリアランプが Failed 系の楽曲の取得に失敗していました。"
          - title: "差分同期が全件取得に切り替わる"
            desc: "直近のプレー回数が少なくても、差分同期に失敗して全件取得に切り替わっていました。レベルを指定した差分同期が同期時刻を保存しておらず、差分の起点にならないため、通算50プレー以上で全件取得（レベル指定）に切り替わっていました。"
  en:
    title: "Fixed sync problems in 1.2.20260904"
    sections:
      - heading: "Bug fixes"
        items:
          - title: "Song sync missed some data"
            desc: "Songs whose clear lamp was in the Failed group could not be fetched."
          - title: "Differential sync switched to fetching everything"
            desc: "Even with few recent plays, differential sync failed and switched to fetching every song. Differential sync by level did not save the sync time, so it never became the starting point, and after 50 plays in total it switched to fetching everything (by level)."
  ko:
    title: "1.2.20260904에서 발생한 동기화 문제를 고쳤습니다"
    sections:
      - heading: "버그 수정"
        items:
          - title: "곡 동기화에서 데이터를 놓치는 문제"
            desc: "클리어 램프가 Failed 계열인 곡을 가져오지 못했습니다."
          - title: "차분 동기화가 전체 수집으로 바뀌는 문제"
            desc: "최근 플레이 횟수가 적어도 차분 동기화에 실패해 전체 수집으로 바뀌었습니다. 레벨 지정 차분 동기화가 동기화 시각을 저장하지 않아 차분의 기점이 되지 못했고, 누적 50플레이 이상이면 전체 수집(레벨 지정)으로 바뀌었습니다."
  zh:
    title: "修正 1.2.20260904 發生的同步問題"
    sections:
      - heading: "錯誤修正"
        items:
          - title: "樂曲同步漏抓資料"
            desc: "通關燈為 Failed 類的樂曲無法取得。"
          - title: "差分同步切換為全部取得"
            desc: "即使最近遊玩次數不多，差分同步也會失敗並切換為全部取得。指定等級的差分同步沒有儲存同步時間，無法成為差分的起點，累計 50 次遊玩以上就會切換為全部取得（指定等級）。"
- id: "2026-09-04"
  kind: release
  version: "1.2.20260904"
  date: "2026-09-01"
  ja:
    title: "pop'n music に対応し、DDRの譜面確認を強化しました"
    sections:
      - heading: "pop'n music に対応"
        items:
          - title: "他の機種と同じ機能"
            desc: "楽曲一覧、Tier表、目標管理、フレンド機能など、他の機種と同じ機能が使えます。楽曲ジャケットにはバナーを使っています（一部の曲はバナーがありません）。"
            media: {type: video, src: popn.mp4, poster: popn.jpg}
            games: ["pop'n"]
          - title: "楽曲名のメイン表記を選べる"
            desc: "メイン表記を「楽曲名」と「ジャンル名」から選べます。画面右上の設定から変更できます。"
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
            games: ["pop'n"]
      - heading: "DDRの譜面確認"
        items:
          - title: "譜面全体の確認とメモ"
            list:
              - "譜面全体を確認し、目的の位置にすぐ移動できます"
              - "メモや踏み足を記録できます"
              - "メモや踏み足を入れた範囲を、画像で出力できます"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
            games: [DDR]
      - heading: "高速化とデザイン"
        items:
          - title: "速く、見やすく"
            list:
              - "起動・タブ切替えが速くなりました"
              - "公式素材の活用、全体のレイアウトの調整、ムダな余白の削減などを行いました"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "目標管理"
        items:
          - title: "アプリを入れる前の記録を埋める"
            list:
              - "目標管理ダッシュボードで、アプリを入れる前の記録を手で埋められます"
              - "手入力に加えて、CSVでの書き出しと取り込みができます"
              - "対象は skill系・消費カロリー・プレー数です"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "検索・楽曲一覧・Tier表"
        items:
          - title: "検索とフィルタ"
            list:
              - "検索機能を強化し、今までより検索幅が広がりました。間違った名前で検索してもヒットします"
              - "楽曲一覧のフィルタに小数を足しました（SDVXは0.1刻み・GITADORAは0.5刻み）"
              - "Tier表の段の中を、Tier順とレベル順で並べ替えられます"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "成果画像と同期"
        items:
          - title: "画像の出力と差分同期"
            list:
              - "成果画像の出力時に、skill対象曲だけを表示できます"
              - "その他の画像も、文字・ジャケットのサイズを変えられます（アプリの設定は変わりません）"
              - "楽曲の差分同期のフォールバック先を、レベルで指定できます"
            media: {type: video, src: export.mp4, poster: export.jpg}
            games: [DDR, "pop'n"]
      - heading: "フレンド"
        items:
          - title: "投げた課題の履歴"
            desc: "フレンドに投げた課題の履歴を見られます。投げた課題がその後どうなったかは追跡しません（目標を達成できずに削除されることもあるため）。"
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "統計と不具合の修正"
        items:
          - title: "統計の改善"
            desc: "利用者が増えて統計情報が出るようになり、課題が見えてきました。目下改善中で、改善に伴ってランク帯区分・偏差値・個人差が変わっています。"
          - title: "不具合の修正"
            list:
              - "GITADORA など、一部の楽曲の同期に失敗する"
              - "GITADORA で skill ソートをすると、異なる難易度の曲も固まって並んでしまう"
              - "フレンドの表示名を変えても、プレイヤーネームで表示されてしまう"
  en:
    title: "pop'n music support, and a stronger DDR chart viewer"
    sections:
      - heading: "pop'n music support"
        items:
          - title: "Same features as other games"
            desc: "The song list, Tier List, goals, friends and other features work the same as for other games. Song jackets use banners (some songs have no banner)."
            media: {type: video, src: popn.mp4, poster: popn.jpg}
            games: ["pop'n"]
          - title: "Choose the main song label"
            desc: "Choose whether songs are shown mainly by song title or by genre name. Change it from the settings at the top right of the screen."
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
            games: ["pop'n"]
      - heading: "DDR chart viewer"
        items:
          - title: "Whole-chart view and memos"
            list:
              - "See the whole chart and jump straight to the part you want"
              - "Record memos and footing"
              - "Export a selected range with your memos and footing as an image"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
            games: [DDR]
      - heading: "Speed and design"
        items:
          - title: "Faster and easier to read"
            list:
              - "Faster startup and tab switching"
              - "Uses official art, with an adjusted overall layout and less wasted space"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "Goals"
        items:
          - title: "Fill in records from before install"
            list:
              - "On the goals dashboard, you can fill in records from before you installed the app"
              - "Besides typing them in, you can export and import CSV"
              - "Covers skill metrics, calories burned and play count"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "Search, Song list and Tier List"
        items:
          - title: "Search and filters"
            list:
              - "Search now finds more. It also hits when you search with a wrong name"
              - "Song list filters now take decimals (0.1 steps for SDVX, 0.5 steps for GITADORA)"
              - "Within each Tier List row, sort by tier or by level"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "Result images and sync"
        items:
          - title: "Image export and differential sync"
            list:
              - "When exporting a result image, you can show only songs that count toward skill"
              - "Other images can also change text and jacket size (your app settings stay the same)"
              - "Choose by level what a differential sync falls back to"
            media: {type: video, src: export.mp4, poster: export.jpg}
            games: [DDR, "pop'n"]
      - heading: "Friends"
        items:
          - title: "History of challenges you sent"
            desc: "See the history of challenges you sent to friends. What happened to them afterwards isn't tracked, since some are deleted when a goal isn't reached."
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "Statistics and bug fixes"
        items:
          - title: "Improving statistics"
            desc: "With more users, statistics now appear, and problems have become visible. We are improving them, and rank ranges, T-scores and individual difficulty have changed as a result."
          - title: "Bug fixes"
            list:
              - "Sync failed for some songs, including GITADORA"
              - "Sorting by skill in GITADORA grouped songs of other difficulties together"
              - "Friends were shown by player name even after changing their display name"
  ko:
    title: "pop'n music 지원과 DDR 채보 확인 강화"
    sections:
      - heading: "pop'n music 지원"
        items:
          - title: "다른 기종과 같은 기능"
            desc: "곡 목록, 티어표, 목표 관리, 친구 기능 등 다른 기종과 같은 기능을 쓸 수 있습니다. 곡 재킷에는 배너를 사용합니다(일부 곡은 배너가 없습니다)."
            media: {type: video, src: popn.mp4, poster: popn.jpg}
            games: ["pop'n"]
          - title: "곡명 메인 표기 선택"
            desc: "메인 표기를 '곡명'과 '장르명' 중에서 고를 수 있습니다. 화면 오른쪽 위 설정에서 바꿀 수 있습니다."
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
            games: ["pop'n"]
      - heading: "DDR 채보 확인"
        items:
          - title: "채보 전체 확인과 메모"
            list:
              - "채보 전체를 확인하고 원하는 위치로 바로 이동할 수 있습니다"
              - "메모와 발 배치를 기록할 수 있습니다"
              - "메모와 발 배치를 넣은 범위를 이미지로 내보낼 수 있습니다"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
            games: [DDR]
      - heading: "속도와 디자인"
        items:
          - title: "더 빠르고 보기 쉽게"
            list:
              - "시작과 탭 전환이 빨라졌습니다"
              - "공식 소재를 활용하고, 전체 레이아웃 조정과 불필요한 여백 줄이기 등을 했습니다"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "목표 관리"
        items:
          - title: "앱 설치 전 기록 채우기"
            list:
              - "목표 관리 대시보드에서 앱을 설치하기 전의 기록을 직접 채울 수 있습니다"
              - "직접 입력 외에 CSV 내보내기와 가져오기도 됩니다"
              - "대상은 skill 계열·소비 칼로리·플레이 수입니다"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "검색·곡 목록·티어표"
        items:
          - title: "검색과 필터"
            list:
              - "검색 기능을 강화해 이전보다 넓게 찾을 수 있습니다. 틀린 이름으로 검색해도 찾아집니다"
              - "곡 목록 필터에 소수를 추가했습니다(SDVX는 0.1 단위·GITADORA는 0.5 단위)"
              - "티어표의 각 단 안을 티어순과 레벨순으로 정렬할 수 있습니다"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "성과 이미지와 동기화"
        items:
          - title: "이미지 내보내기와 차분 동기화"
            list:
              - "성과 이미지를 내보낼 때 skill 대상곡만 표시할 수 있습니다"
              - "다른 이미지도 글자·재킷 크기를 바꿀 수 있습니다(앱 설정은 바뀌지 않습니다)"
              - "곡 차분 동기화의 대체 수집 범위를 레벨로 지정할 수 있습니다"
            media: {type: video, src: export.mp4, poster: export.jpg}
            games: [DDR, "pop'n"]
      - heading: "친구"
        items:
          - title: "보낸 과제의 이력"
            desc: "친구에게 보낸 과제의 이력을 볼 수 있습니다. 보낸 과제가 그 후 어떻게 되었는지는 추적하지 않습니다(목표를 달성하지 못해 삭제되는 경우도 있기 때문입니다)."
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "통계와 버그 수정"
        items:
          - title: "통계 개선"
            desc: "이용자가 늘어 통계 정보가 나오게 되면서 과제가 보이기 시작했습니다. 현재 개선 중이며, 개선에 따라 랭크대 구분·T점수·개인차가 바뀌었습니다."
          - title: "버그 수정"
            list:
              - "GITADORA 등 일부 곡의 동기화에 실패하는 문제"
              - "GITADORA에서 skill 정렬 시 다른 난이도의 곡까지 묶여서 정렬되는 문제"
              - "친구 표시 이름을 바꿔도 플레이어 이름으로 표시되는 문제"
  zh:
    title: "支援 pop'n music，並強化 DDR 譜面確認"
    sections:
      - heading: "支援 pop'n music"
        items:
          - title: "與其他機種相同的功能"
            desc: "樂曲一覽、Tier表、目標管理、好友功能等，都能與其他機種一樣使用。樂曲封面使用橫幅圖（部分樂曲沒有橫幅圖）。"
            media: {type: video, src: popn.mp4, poster: popn.jpg}
            games: ["pop'n"]
          - title: "可選擇樂曲名稱的主要標示"
            desc: "主要標示可在「樂曲名」與「類型名」之間選擇。可從畫面右上角的設定變更。"
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
            games: ["pop'n"]
      - heading: "DDR 譜面確認"
        items:
          - title: "確認整份譜面與備忘"
            list:
              - "可確認整份譜面，並立即移動到想看的位置"
              - "可記錄備忘與踏法"
              - "可將加入備忘與踏法的指定範圍輸出為圖片"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
            games: [DDR]
      - heading: "速度與設計"
        items:
          - title: "更快、更好讀"
            list:
              - "啟動與切換分頁變快了"
              - "活用官方素材，並調整整體版面、減少多餘的留白"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "目標管理"
        items:
          - title: "補上安裝前的記錄"
            list:
              - "可在目標管理儀表板手動補上安裝 App 之前的記錄"
              - "除了手動輸入，也可匯出與匯入 CSV"
              - "對象為 skill 類、消耗熱量與遊玩次數"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "搜尋・樂曲一覽・Tier表"
        items:
          - title: "搜尋與篩選"
            list:
              - "強化搜尋功能，搜尋範圍比以前更廣。用錯誤的名稱搜尋也能找到"
              - "樂曲一覽的篩選加入小數（SDVX 以 0.1 為單位、GITADORA 以 0.5 為單位）"
              - "Tier表各段內可依 Tier 順序或等級順序排列"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "成果圖片與同步"
        items:
          - title: "圖片輸出與差分同步"
            list:
              - "輸出成果圖片時，可只顯示 skill 對象曲"
              - "其他圖片也能改變文字與封面的大小（App 的設定不會改變）"
              - "可用等級指定樂曲差分同步的備援範圍"
            media: {type: video, src: export.mp4, poster: export.jpg}
            games: [DDR, "pop'n"]
      - heading: "好友"
        items:
          - title: "送出課題的履歷"
            desc: "可查看送給好友的課題履歷。送出的課題之後如何不會追蹤（因為也有未達成目標而刪除的情況）。"
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "統計與錯誤修正"
        items:
          - title: "改善統計"
            desc: "隨著使用者增加，開始出現統計資訊，也看到了問題。目前正在改善，隨之改變了等級帶區分、T分數與個人差。"
          - title: "錯誤修正"
            list:
              - "GITADORA 等部分樂曲同步失敗"
              - "GITADORA 依 skill 排序時，不同難度的樂曲也會被聚在一起排序"
              - "變更好友顯示名稱後，仍以玩家名稱顯示"
- id: "2026-08-28"
  kind: release
  version: "1.2.20260828"
  date: "2026-08-26"
  ja:
    title: "自作Tier表とフレンド機能を追加し、Android版を公開しました"
    sections:
      - heading: "自作Tier表"
        items:
          - title: "自作Tier表を作れる"
            desc: "これまでは統計情報から自動でTier表を作っていましたが、自分でTier表を作れるようになりました。"
            media: {type: video, src: tier-make.mp4, poster: tier-make.jpg}
          - title: "他のプレイヤーに共有"
            desc: "作った表は他のプレイヤーに共有でき、Tier表の進捗が自動で埋まります。表を更新すると、他のプレイヤーにも日次で反映されます。"
            media: {type: video, src: tier-share.mp4, poster: tier-share.jpg}
          - title: "画像で出力"
            desc: "共有コードを発行する画面から、作ったTier表を画像で出力できます。画面右上から出力すると、Tier表の達成度を反映した画像になります。"
            media: {type: image, src: tier-image.jpg}
      - heading: "フレンド"
        items:
          - title: "申請と承諾"
            desc: "自分のデータの公開範囲を選び、フレンドコードや名前などから申請・承諾できます（最大50人）。これまでの設定は画面右上に移しました。"
            media: {type: video, src: friend-basic.mp4, poster: friend-basic.jpg}
          - title: "フレンドリスト"
            list:
              - "レベル別の勝敗・アクティビティ・抜かれた曲などを、フレンド横断で確認できます"
              - "フレンドにタグを付けて、機種別に管理できます"
              - "長押しで、ライバル／非表示の設定を切り替えられます"
            media: {type: video, src: friend-list.mp4, poster: friend-list.jpg}
          - title: "フレンド詳細"
            list:
              - "指標の比較や、相手の曲リストを見られます"
              - "好きなレベルで勝敗を比べ、負けている譜面を確認できます"
              - "期間のアクティビティ量を比べられます"
              - "見られるのは、相手がフレンドに公開している項目だけです"
            media: {type: video, src: friend-detail.mp4, poster: friend-detail.jpg}
          - title: "楽曲一覧でライバルのスコア"
            list:
              - "楽曲一覧を詳細表示にすると、ライバルのスコアを一覧できます"
              - "詳細画面では、全フレンドのスコアも見られます（非表示にしたフレンドは出ません）"
            media: {type: video, src: friend-songs.mp4, poster: friend-songs.jpg}
      - heading: "課題を投げる"
        items:
          - title: "フレンドに課題を投げる"
            desc: "フレンドに課題楽曲を、目標水準とともに投げられます。課題が届くと、アプリ内に通知が出ます。"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "成果画像に課題の進捗"
            desc: "課題の進捗を、その日の成果の出力画像に表示できます。"
            media: {type: video, src: challenge-image.mp4, poster: challenge-image.jpg}
      - heading: "細かな改善"
        items:
          - title: "判定メモと文字の見やすさ"
            list:
              - "DDRの判定メモで、参考値とプレイヤーの設定値を見分けやすくしました"
              - "文字を読みやすくし、ジャケットの大きさや文字サイズを変えられるようにしました"
            media: {type: video, src: ui-1.mp4, poster: ui-1.jpg}
          - title: "共有画像と譜面確認"
            list:
              - "目標管理ダッシュボード（成長タブ）の共有画像で、背景の設定画面を見やすくしました"
              - "DDRの譜面確認で、最後のスクロール速度を保つようにしました"
            media: {type: video, src: ui-2.mp4, poster: ui-2.jpg}
      - heading: "Android版"
        items:
          - title: "Google Play で公開"
            desc: "この版から、Android版を Google Play で公開しました。クローズドテストに参加していた方は、ストアから自動で更新されるので、操作は要りません。"
  en:
    title: "Custom Tier Lists, friends, and the Android version on Google Play"
    sections:
      - heading: "Custom Tier Lists"
        items:
          - title: "Make your own Tier List"
            desc: "Tier Lists used to be generated only from statistics. Now you can make your own."
            media: {type: video, src: tier-make.mp4, poster: tier-make.jpg}
          - title: "Share with other players"
            desc: "Share your list with other players, and their progress fills in automatically. Updates to the list reach other players daily."
            media: {type: video, src: tier-share.mp4, poster: tier-share.jpg}
          - title: "Export as an image"
            desc: "Export your Tier List as an image from the screen where you issue a share code. Exporting from the top right gives an image that reflects your progress on the list."
            media: {type: image, src: tier-image.jpg}
      - heading: "Friends"
        items:
          - title: "Requests and approval"
            desc: "Choose what of your data to make public, then send or accept requests by friend code, name and more (up to 50 friends). The previous settings moved to the top right of the screen."
            media: {type: video, src: friend-basic.mp4, poster: friend-basic.jpg}
          - title: "Friend list"
            list:
              - "See wins and losses by level, activity and songs where you were overtaken, across all friends"
              - "Tag friends to manage them by game"
              - "Long-press to switch a friend to rival or hidden"
            media: {type: video, src: friend-list.mp4, poster: friend-list.jpg}
          - title: "Friend details"
            list:
              - "Compare metrics and see your friend's song list"
              - "Compare wins and losses at any level and check the charts you're losing on"
              - "Compare activity over a period"
              - "You only see items your friend has made public to friends"
            media: {type: video, src: friend-detail.mp4, poster: friend-detail.jpg}
          - title: "Rival scores in the song list"
            list:
              - "Switch the song list to the detailed view to see your rivals' scores"
              - "The details screen also shows all friends' scores (hidden friends are not shown)"
            media: {type: video, src: friend-songs.mp4, poster: friend-songs.jpg}
      - heading: "Send challenges"
        items:
          - title: "Send a challenge to a friend"
            desc: "Send a friend a challenge song with a target. When a challenge arrives, you get an in-app notification."
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "Challenge progress in result images"
            desc: "Show your challenge progress in the day's result image."
            media: {type: video, src: challenge-image.mp4, poster: challenge-image.jpg}
      - heading: "Small improvements"
        items:
          - title: "Timing memo and readability"
            list:
              - "In DDR timing memos, reference values and your own settings are easier to tell apart"
              - "Text is easier to read, and you can change the jacket and text size"
            media: {type: video, src: ui-1.mp4, poster: ui-1.jpg}
          - title: "Share images and chart viewer"
            list:
              - "The background settings for goal dashboard (growth tab) share images are easier to see"
              - "The DDR chart viewer keeps your last scroll speed"
            media: {type: video, src: ui-2.mp4, poster: ui-2.jpg}
      - heading: "Android"
        items:
          - title: "Now on Google Play"
            desc: "From this version, the Android version is on Google Play. If you were in the closed test, the store updates the app automatically, so there's nothing to do."
  ko:
    title: "커스텀 티어표와 친구 기능 추가, Android 버전을 Google Play에 공개"
    sections:
      - heading: "커스텀 티어표"
        items:
          - title: "직접 티어표 만들기"
            desc: "지금까지는 통계로 티어표를 자동으로 만들었지만, 이제 직접 티어표를 만들 수 있습니다."
            media: {type: video, src: tier-make.mp4, poster: tier-make.jpg}
          - title: "다른 플레이어와 공유"
            desc: "만든 표를 다른 플레이어와 공유할 수 있고, 티어표 진행 상황이 자동으로 채워집니다. 표를 갱신하면 다른 플레이어에게도 매일 반영됩니다."
            media: {type: video, src: tier-share.mp4, poster: tier-share.jpg}
          - title: "이미지로 내보내기"
            desc: "공유 코드를 발급하는 화면에서 만든 티어표를 이미지로 내보낼 수 있습니다. 화면 오른쪽 위에서 내보내면 티어표 달성도가 반영된 이미지가 됩니다."
            media: {type: image, src: tier-image.jpg}
      - heading: "친구"
        items:
          - title: "신청과 승인"
            desc: "자신의 데이터 공개 범위를 고르고, 친구 코드나 이름 등으로 신청·승인할 수 있습니다(최대 50명). 기존 설정은 화면 오른쪽 위로 옮겼습니다."
            media: {type: video, src: friend-basic.mp4, poster: friend-basic.jpg}
          - title: "친구 목록"
            list:
              - "레벨별 승패·활동·추월당한 곡 등을 친구 전체에 걸쳐 확인할 수 있습니다"
              - "친구에게 태그를 붙여 기종별로 관리할 수 있습니다"
              - "길게 눌러 라이벌/숨김 설정을 바꿀 수 있습니다"
            media: {type: video, src: friend-list.mp4, poster: friend-list.jpg}
          - title: "친구 상세"
            list:
              - "지표 비교와 상대의 곡 목록을 볼 수 있습니다"
              - "원하는 레벨에서 승패를 비교하고, 지고 있는 채보를 확인할 수 있습니다"
              - "기간별 활동량을 비교할 수 있습니다"
              - "상대가 친구에게 공개한 항목만 볼 수 있습니다"
            media: {type: video, src: friend-detail.mp4, poster: friend-detail.jpg}
          - title: "곡 목록에서 라이벌 스코어"
            list:
              - "곡 목록을 상세 표시로 하면 라이벌의 스코어를 한눈에 볼 수 있습니다"
              - "상세 화면에서는 모든 친구의 스코어도 볼 수 있습니다(숨김 친구는 표시되지 않습니다)"
            media: {type: video, src: friend-songs.mp4, poster: friend-songs.jpg}
      - heading: "과제 보내기"
        items:
          - title: "친구에게 과제 보내기"
            desc: "친구에게 과제곡을 목표 수준과 함께 보낼 수 있습니다. 과제가 도착하면 앱 안에 알림이 옵니다."
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "성과 이미지에 과제 진행 상황"
            desc: "과제 진행 상황을 그날의 성과 이미지에 표시할 수 있습니다."
            media: {type: video, src: challenge-image.mp4, poster: challenge-image.jpg}
      - heading: "세세한 개선"
        items:
          - title: "판정 메모와 글자 가독성"
            list:
              - "DDR 판정 메모에서 참고값과 플레이어 설정값을 구분하기 쉽게 했습니다"
              - "글자를 읽기 쉽게 하고, 재킷 크기와 글자 크기를 바꿀 수 있게 했습니다"
            media: {type: video, src: ui-1.mp4, poster: ui-1.jpg}
          - title: "공유 이미지와 채보 확인"
            list:
              - "목표 관리 대시보드(성장 탭) 공유 이미지의 배경 설정 화면을 보기 쉽게 했습니다"
              - "DDR 채보 확인에서 마지막 스크롤 속도를 유지합니다"
            media: {type: video, src: ui-2.mp4, poster: ui-2.jpg}
      - heading: "Android 버전"
        items:
          - title: "Google Play에 공개"
            desc: "이 버전부터 Android 버전을 Google Play에 공개했습니다. 비공개 테스트에 참여하신 분은 스토어에서 자동으로 업데이트되므로 따로 조작할 필요가 없습니다."
  zh:
    title: "新增自製 Tier表與好友功能，Android 版於 Google Play 上架"
    sections:
      - heading: "自製 Tier表"
        items:
          - title: "可自製 Tier表"
            desc: "過去只依統計資訊自動製作 Tier表，現在可以自己製作。"
            media: {type: video, src: tier-make.mp4, poster: tier-make.jpg}
          - title: "分享給其他玩家"
            desc: "製作的表可分享給其他玩家，Tier表的進度會自動填入。更新表格後，也會每日反映給其他玩家。"
            media: {type: video, src: tier-share.mp4, poster: tier-share.jpg}
          - title: "輸出為圖片"
            desc: "可在發行分享碼的畫面將自製 Tier表輸出為圖片。從畫面右上角輸出時，會得到反映 Tier表達成度的圖片。"
            media: {type: image, src: tier-image.jpg}
      - heading: "好友"
        items:
          - title: "申請與同意"
            desc: "選擇自己資料的公開範圍，即可透過好友碼或名稱等申請與同意（最多 50 人）。原本的設定移到畫面右上角。"
            media: {type: video, src: friend-basic.mp4, poster: friend-basic.jpg}
          - title: "好友列表"
            list:
              - "可橫跨所有好友確認各等級勝負、活動與被超越的樂曲等"
              - "可為好友加上標籤，依機種管理"
              - "長按即可切換勁敵／隱藏設定"
            media: {type: video, src: friend-list.mp4, poster: friend-list.jpg}
          - title: "好友詳情"
            list:
              - "可比較指標，並查看對方的樂曲列表"
              - "可在任意等級比較勝負，確認自己落後的譜面"
              - "可比較一段期間的活動量"
              - "只能看到對方向好友公開的項目"
            media: {type: video, src: friend-detail.mp4, poster: friend-detail.jpg}
          - title: "在樂曲一覽查看勁敵分數"
            list:
              - "樂曲一覽切換為詳細顯示，即可一覽勁敵的分數"
              - "詳情畫面也能看到所有好友的分數（隱藏的好友不會顯示）"
            media: {type: video, src: friend-songs.mp4, poster: friend-songs.jpg}
      - heading: "送出課題"
        items:
          - title: "向好友送出課題"
            desc: "可將課題樂曲連同目標水準送給好友。收到課題時，App 內會出現通知。"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "成果圖片顯示課題進度"
            desc: "可在當天的成果輸出圖片中顯示課題進度。"
            media: {type: video, src: challenge-image.mp4, poster: challenge-image.jpg}
      - heading: "細部改善"
        items:
          - title: "判定備忘與文字易讀性"
            list:
              - "DDR 判定備忘中，參考值與玩家設定值更容易區分"
              - "提升文字易讀性，並可變更封面與文字大小"
            media: {type: video, src: ui-1.mp4, poster: ui-1.jpg}
          - title: "分享圖片與譜面確認"
            list:
              - "目標管理儀表板（成長分頁）分享圖片的背景設定畫面更容易看"
              - "DDR 譜面確認會保持上次的捲動速度"
            media: {type: video, src: ui-2.mp4, poster: ui-2.jpg}
      - heading: "Android 版"
        items:
          - title: "於 Google Play 上架"
            desc: "從這個版本起，Android 版於 Google Play 上架。參加過封閉測試的人會由商店自動更新，不需要任何操作。"
- id: "2026-08-21"
  kind: release
  version: "1.2.20260821"
  date: "2026-08-20"
  ja:
    title: "GITADORA に対応し、伸ばせる曲を絞り込むフィルタを追加しました"
    sections:
      - heading: "GITADORA に対応"
        items:
          - title: "GF と DM を分けて記録"
            games: [GITADORA]
            desc: "GF と DM のスコアを別々に管理できます。Tier表は、データが足りないため自動では作れません。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "自己ベストの判定内訳を保存"
            games: [GITADORA]
            desc: "差分同期のたびに、自己ベストの判定内訳を自動で保存します。譜面の確認は外部サイトへのリンクです。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "伸ばせる曲を絞り込む"
        items:
          - title: "2つのフィルタを追加"
            list:
              - "伸びしろ：スコアを伸ばせば Skill（FlareSkill・VOLFORCE など）の対象に入る曲"
              - "GP先行の除外（DDR のみ）：GP先行配信の対象曲のうち、通常解禁されていない曲を外す"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "楽曲詳細"
        items:
          - title: "同じランク帯との差"
            desc: "同じランク帯の中央値と上位10%のスコア、自分との差を表示します。データが少ないため、今は SDVX だけで使えます。"
            media: {type: image, src: detail-2.jpg}
          - title: "スコア履歴の数値"
            desc: "スコア履歴に、各回のスコアの数値を表示します。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同期"
        items:
          - title: "「昨日の成果」を選べる"
            desc: "プレイ当日に前回の同期忘れに気づいたら、プレイ前に「昨日の成果」で同期し、プレイ後に「今日の成果」で同期すると、その日の成果だけをまとめられます。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表と共有画像"
        items:
          - title: "Tier表"
            list:
              - "作成時のレベル・指標・区分の選び方を改善"
              - "自分のスコアとグレードを表示"
              - "曲数が多い（SDVX など）画像の出力でアプリが落ちる不具合を修正。画像の容量を減らしました"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "共有画像の見た目を統一"
            desc: "機能ごとに違っていた共有画像の見た目を揃えました。出力は右上のアイコンから。あわせて画面上部の配置を詰め、メインの表示を広くしました。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "ウィジェットと配置変更"
        items:
          - title: "目標ウィジェットと並べ替え"
            list:
              - "目標ウィジェットのグラフで、文字が重ならないようにしました"
              - "ウィジェットの配置変更や、楽曲一覧の表示プリセットの並べ替えなど、配置を変える操作を改善しました"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  en:
    title: "GITADORA support, and filters to find songs you can raise"
    sections:
      - heading: "GITADORA support"
        items:
          - title: "Separate records for GF and DM"
            games: [GITADORA]
            desc: "GF and DM scores are managed separately. Tier Lists can't be generated automatically yet, because there isn't enough data."
            media: {type: image, src: gitadora-1.jpg}
          - title: "Judgement breakdown of personal bests"
            games: [GITADORA]
            desc: "Each differential sync automatically saves the judgement breakdown of your personal bests. Chart previews link to an external site."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "Find songs you can raise"
        items:
          - title: "Two new filters"
            list:
              - "Room to grow: songs that would enter your Skill slots (FlareSkill, VOLFORCE, etc.) if you raise their score"
              - "Exclude early access (DDR only): removes songs in GP early access that haven't been unlocked normally"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "Song details"
        items:
          - title: "Compared with your rank range"
            desc: "Shows the median and top 10% scores in the same rank range, and your difference from them. Works only for SDVX for now, because there isn't enough data."
            media: {type: image, src: detail-2.jpg}
          - title: "Numbers in your score history"
            desc: "Your score history now shows the score of each entry."
            media: {type: image, src: detail-1.jpg}
      - heading: "Sync"
        items:
          - title: "Choose \"Yesterday's results\""
            desc: "If you notice on the day of play that you forgot to sync last time, sync with \"Yesterday's results\" before playing, then with \"Today's results\" after playing, to get only that day's results."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier List and share images"
        items:
          - title: "Tier List"
            list:
              - "Easier selection of level, metric and category when creating one"
              - "Shows your own score and grade"
              - "Fixed a crash when exporting images with many songs (such as SDVX) by reducing the image size"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "One look for share images"
            desc: "Share images, which looked different for each feature, now share one look. Export from the icon at the top right. The top of the screen is also more compact, giving the main content more room."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "Widgets and rearranging"
        items:
          - title: "Goal widget and reordering"
            list:
              - "Text no longer overlaps in the goal widget's graph"
              - "Improved rearranging, such as moving widgets and reordering song list presets"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  ko:
    title: "GITADORA 지원과, 올릴 수 있는 곡을 좁히는 필터 추가"
    sections:
      - heading: "GITADORA 지원"
        items:
          - title: "GF와 DM을 나누어 기록"
            games: [GITADORA]
            desc: "GF와 DM의 스코어를 따로 관리할 수 있습니다. 티어표는 데이터가 부족해 아직 자동으로 만들 수 없습니다."
            media: {type: image, src: gitadora-1.jpg}
          - title: "자기 최고 기록의 판정 내역 저장"
            games: [GITADORA]
            desc: "차분 동기화할 때마다 자기 최고 기록의 판정 내역을 자동으로 저장합니다. 보면 확인은 외부 사이트 링크입니다."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "올릴 수 있는 곡 좁히기"
        items:
          - title: "필터 2가지 추가"
            list:
              - "성장 여지: 스코어를 올리면 Skill(FlareSkill·VOLFORCE 등) 대상에 들어가는 곡"
              - "선행 플레이 제외(DDR 한정): 선행 플레이 대상곡 중 일반 해금되지 않은 곡을 제외"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "곡 상세"
        items:
          - title: "같은 랭크대와의 차이"
            desc: "같은 랭크대의 중앙값과 상위 10% 스코어, 자신과의 차이를 표시합니다. 데이터가 적어 지금은 SDVX에서만 쓸 수 있습니다."
            media: {type: image, src: detail-2.jpg}
          - title: "스코어 이력의 수치"
            desc: "스코어 이력에 각 회차의 스코어 수치를 표시합니다."
            media: {type: image, src: detail-1.jpg}
      - heading: "동기화"
        items:
          - title: "'어제의 성과' 선택"
            desc: "플레이 당일에 지난번 동기화를 잊은 것을 알아차리면, 플레이 전에 '어제의 성과'로, 플레이 후에 '오늘의 성과'로 동기화해 그날의 성과만 정리할 수 있습니다."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "티어표와 공유 이미지"
        items:
          - title: "티어표"
            list:
              - "작성 시 레벨·지표·구분 선택 방식 개선"
              - "자신의 스코어와 그레이드 표시"
              - "곡 수가 많은(SDVX 등) 이미지를 내보낼 때 앱이 종료되던 문제를 이미지 용량을 줄여 수정"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "공유 이미지 모양 통일"
            desc: "기능마다 달랐던 공유 이미지의 모양을 통일했습니다. 오른쪽 위 아이콘에서 내보냅니다. 화면 상단 배치도 줄여 메인 표시를 넓혔습니다."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "위젯과 배치 변경"
        items:
          - title: "목표 위젯과 순서 변경"
            list:
              - "목표 위젯 그래프에서 글자가 겹치지 않게 했습니다"
              - "위젯 배치 변경, 곡 목록 표시 프리셋 순서 변경 등 배치를 바꾸는 조작을 개선했습니다"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  zh:
    title: "支援 GITADORA，並新增篩選可提升歌曲的功能"
    sections:
      - heading: "支援 GITADORA"
        items:
          - title: "GF 與 DM 分開記錄"
            games: [GITADORA]
            desc: "GF 與 DM 的分數可分開管理。Tier表因資料不足，目前無法自動產生。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "儲存個人最佳的判定明細"
            games: [GITADORA]
            desc: "每次差分同步時，自動儲存個人最佳的判定明細。譜面確認為外部網站的連結。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "篩選可提升的歌曲"
        items:
          - title: "新增 2 種篩選"
            list:
              - "提升空間：只要提升分數就能進入 Skill（FlareSkill・VOLFORCE 等）名額的歌曲"
              - "排除搶先遊玩（僅 DDR）：排除搶先遊玩對象曲中尚未一般解禁的歌曲"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "歌曲詳細"
        items:
          - title: "與同等級區間的差距"
            desc: "顯示同等級區間的中位數與前 10% 分數，以及與自己的差距。資料量少，目前僅 SDVX 可用。"
            media: {type: image, src: detail-2.jpg}
          - title: "分數紀錄的數值"
            desc: "分數紀錄會顯示每次的分數數值。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同步"
        items:
          - title: "可選擇「昨天的成果」"
            desc: "遊玩當天發現忘了上次同步時，遊玩前以「昨天的成果」同步、遊玩後以「今天的成果」同步，就能只整理當天的成果。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表與分享圖片"
        items:
          - title: "Tier表"
            list:
              - "改善建立時等級・指標・分類的選擇方式"
              - "顯示自己的分數與評級"
              - "縮減圖片容量，修正歌曲數多（SDVX 等）的圖片輸出時 App 當機的問題"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "統一分享圖片外觀"
            desc: "統一了各功能各不相同的分享圖片外觀，從右上角圖示輸出。同時精簡畫面上方配置，讓主要內容更寬。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "小工具與配置變更"
        items:
          - title: "目標小工具與排序"
            list:
              - "目標小工具的圖表文字不再重疊"
              - "改善小工具配置變更、歌曲列表顯示預設排序等變更配置的操作"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
- id: "2026-08-14"
  kind: release
  version: "1.1.20260814"
  date: "2026-08-14"
  ja:
    title: "成長タブをダッシュボードにし、同期にレベル指定と前回差分を追加しました"
    sections:
      - heading: "判定ズレ"
        items:
          - title: "参考値を分布グラフに"
            desc: "横軸は設定値（個別設定値 − 共通設定値）、縦軸はその値にしている人数です。皆の平均・中央値・人数を表示します。誰がどれくらいの判定調整をしているのかを参照できます。"
            media: {type: video, src: offset.mp4, poster: offset.jpg}
      - heading: "データ同期"
        items:
          - title: "レベル指定と前回差分"
            list:
              - "全曲同期のほかに、レベル指定・前回差分を追加しました"
              - "前回差分では、SDVXは最大で直近100曲、DDRは最大で直近50プレイ（約12クレ）を取得できます"
            media: {type: video, src: sync.mp4, poster: sync.jpg}
      - heading: "共有画像"
        items:
          - title: "背景を編集できる"
            list:
              - "5種類の共有画像の背景を編集できます"
              - "カスタム設定を5つ保存でき、背景色やぼかし、文字色などを調整できます"
              - "写真も背景に設定できます（写真はバックアップされません）"
            media: {type: video, src: share-bg.mp4, poster: share-bg.jpg}
      - heading: "成長タブ"
        items:
          - title: "ウィジェットを並べるダッシュボード"
            desc: "成長タブを、ウィジェットを並べるダッシュボードにしました。目標設定では、何を・どのレベルで・どこまで・どの期間で達成するのかを設定でき、1年の目標の進捗などを測れます（画像出力もできます）。"
            media: {type: video, src: growth.mp4, poster: growth.jpg}
  en:
    title: "A growth tab dashboard, and sync by level or since last sync"
    sections:
      - heading: "Timing offset"
        items:
          - title: "Reference values as a distribution graph"
            desc: "The horizontal axis is the setting (per-song value − common value) and the vertical axis is how many players use it. Shows everyone's average, median and count, so you can see how much others adjust their timing."
            media: {type: video, src: offset.mp4, poster: offset.jpg}
      - heading: "Data sync"
        items:
          - title: "By level and since last sync"
            list:
              - "Besides syncing all songs, you can now sync by level or since last sync"
              - "Since last sync fetches up to the latest 100 songs for SDVX and up to the latest 50 plays (about 12 credits) for DDR"
            media: {type: video, src: sync.mp4, poster: sync.jpg}
      - heading: "Share images"
        items:
          - title: "Edit the background"
            list:
              - "Edit the background of the 5 kinds of share images"
              - "Save up to 5 custom settings and adjust background color, blur, text color and more"
              - "You can also use a photo as the background (photos are not backed up)"
            media: {type: video, src: share-bg.mp4, poster: share-bg.jpg}
      - heading: "Growth tab"
        items:
          - title: "A dashboard of widgets"
            desc: "The growth tab is now a dashboard where you arrange widgets. In goal settings, choose what to reach, at which level, how far and by when, and track progress such as a one-year goal (you can also export it as an image)."
            media: {type: video, src: growth.mp4, poster: growth.jpg}
  ko:
    title: "성장 탭을 대시보드로 바꾸고, 동기화에 레벨 지정과 지난 동기화 이후를 추가했습니다"
    sections:
      - heading: "판정 오프셋"
        items:
          - title: "참고값을 분포 그래프로"
            desc: "가로축은 설정값(개별 설정값 − 공통 설정값), 세로축은 그 값으로 설정한 사람 수입니다. 모두의 평균·중앙값·인원을 표시해, 누가 어느 정도 판정을 조정하는지 참고할 수 있습니다."
            media: {type: video, src: offset.mp4, poster: offset.jpg}
      - heading: "데이터 동기화"
        items:
          - title: "레벨 지정과 지난 동기화 이후"
            list:
              - "전곡 동기화 외에 레벨 지정·지난 동기화 이후를 추가했습니다"
              - "지난 동기화 이후는 SDVX는 최대 최근 100곡, DDR은 최대 최근 50플레이(약 12크레딧)를 가져옵니다"
            media: {type: video, src: sync.mp4, poster: sync.jpg}
      - heading: "공유 이미지"
        items:
          - title: "배경 편집"
            list:
              - "5종류의 공유 이미지 배경을 편집할 수 있습니다"
              - "사용자 설정을 5개까지 저장하고 배경색·흐림·글자색 등을 조정할 수 있습니다"
              - "사진도 배경으로 쓸 수 있습니다(사진은 백업되지 않습니다)"
            media: {type: video, src: share-bg.mp4, poster: share-bg.jpg}
      - heading: "성장 탭"
        items:
          - title: "위젯을 늘어놓는 대시보드"
            desc: "성장 탭을 위젯을 배치하는 대시보드로 바꿨습니다. 목표 설정에서 무엇을·어느 레벨에서·어디까지·어느 기간에 달성할지 정할 수 있고, 1년 목표의 진행 상황 등을 확인할 수 있습니다(이미지 출력 가능)."
            media: {type: video, src: growth.mp4, poster: growth.jpg}
  zh:
    title: "成長分頁改為儀表板，同步新增指定等級與上次同步後"
    sections:
      - heading: "判定偏移"
        items:
          - title: "參考值改為分布圖"
            desc: "橫軸為設定值（個別設定值 − 共通設定值），縱軸為設定該值的人數。顯示大家的平均、中位數與人數，可參考其他人如何調整判定。"
            media: {type: video, src: offset.mp4, poster: offset.jpg}
      - heading: "資料同步"
        items:
          - title: "指定等級與上次同步後"
            list:
              - "除了全曲同步，新增指定等級與上次同步後"
              - "上次同步後最多可取得 SDVX 最近 100 首、DDR 最近 50 次遊玩（約 12 道）"
            media: {type: video, src: sync.mp4, poster: sync.jpg}
      - heading: "分享圖片"
        items:
          - title: "可編輯背景"
            list:
              - "可編輯 5 種分享圖片的背景"
              - "可儲存 5 組自訂設定，調整背景色、模糊、文字顏色等"
              - "也可將照片設為背景（照片不會備份）"
            media: {type: video, src: share-bg.mp4, poster: share-bg.jpg}
      - heading: "成長分頁"
        items:
          - title: "排列小工具的儀表板"
            desc: "成長分頁改為可排列小工具的儀表板。目標設定可指定要達成什麼、在哪個等級、到什麼程度、在多長期間內，並追蹤一年目標等的進度（也可輸出圖片）。"
            media: {type: video, src: growth.mp4, poster: growth.jpg}
- id: "2026-08-07"
  kind: release
  version: "1.1.20260807"
  date: "2026-08-07"
  ja:
    title: "楽曲ジャケットの表示、判定ズレとメモの記録、配色テーマに対応しました"
    sections:
      - heading: "おすすめ楽曲"
        items:
          - title: "選び方を変えました"
            desc: "これまでは、おすすめ楽曲にレベルの高い曲ばかりが上に来ていました。同じ実力帯の人のうち基準に到達している人が多い楽曲を選ぶなど、複数の観点から複合的に選ぶようにしました。"
            media: {type: image, src: recommend.jpg}
      - heading: "楽曲詳細"
        items:
          - title: "判定調整メモと任意メモ"
            list:
              - "判定調整メモは曲ごとの設定です。機種共通の既定値は設定画面から設定できます"
              - "判定ズレの参考値を表示します。今は推測値ですが、利用者のデータが集まったら、ユーザー設定の平均値を表示します"
              - "どちらもバックアップの対象です。任意メモはプライバシーに配慮し、暗号化したデータだけをサーバーに保存します。判定調整メモは統計用にデータを集めます"
            media: {type: image, src: memo.jpg}
      - heading: "デザイン"
        items:
          - title: "配色テーマを5種から選べる"
            desc: "ダーク・ライトのほかに3種あります。ホームのセクション区切りなど、細かなデザインも見直しました。"
            media: {type: image, src: theme.jpg}
          - title: "楽曲ジャケットを表示"
            desc: "楽曲ジャケットを表示するようにしました。解像度を下げて使っています。"
      - heading: "その他の改善"
        items:
          - title: "検索と譜面確認"
            list:
              - "曲名・アーティストで検索できます"
              - "DDRの譜面確認を改善しました"
      - heading: "不具合の修正"
        items:
          - title: "不具合の修正"
            list:
              - "同名曲のスコアが取り込めない"
              - "チュートリアルとバックアップ復元の不具合"
  en:
    title: "Song jackets, timing offset and memos, and color themes"
    sections:
      - heading: "Recommended songs"
        items:
          - title: "A new way of choosing"
            desc: "Until now, recommended songs put high-level songs at the top. Songs are now chosen from several angles combined, such as favoring songs that many players in your skill range have reached the target on."
            media: {type: image, src: recommend.jpg}
      - heading: "Song details"
        items:
          - title: "Timing memo and free memo"
            list:
              - "The timing memo is set per song. The default for each game is set from the settings screen"
              - "Shows a reference value for timing offset. It's an estimate for now; once enough user data is collected, it will show the average of users' settings"
              - "Both are backed up. For privacy, only encrypted data of the free memo is stored on the server. Timing memos are collected for statistics"
            media: {type: image, src: memo.jpg}
      - heading: "Design"
        items:
          - title: "Choose from 5 color themes"
            desc: "Besides dark and light, there are 3 more. Small design details, such as section dividers on the home screen, were also reworked."
            media: {type: image, src: theme.jpg}
          - title: "Song jackets"
            desc: "Song jackets are now shown, at reduced resolution."
      - heading: "Other improvements"
        items:
          - title: "Search and chart viewer"
            list:
              - "Search by song title or artist"
              - "Improved the DDR chart viewer"
      - heading: "Bug fixes"
        items:
          - title: "Bug fixes"
            list:
              - "Scores for songs with the same title could not be imported"
              - "Problems with the tutorial and restoring backups"
  ko:
    title: "곡 재킷 표시, 판정 오프셋과 메모 기록, 색상 테마 지원"
    sections:
      - heading: "추천곡"
        items:
          - title: "고르는 방식을 바꿨습니다"
            desc: "지금까지는 추천곡에 레벨이 높은 곡만 위에 왔습니다. 같은 실력대 중 기준에 도달한 사람이 많은 곡을 고르는 등, 여러 관점을 복합적으로 반영해 고르도록 바꿨습니다."
            media: {type: image, src: recommend.jpg}
      - heading: "곡 상세"
        items:
          - title: "판정 조정 메모와 자유 메모"
            list:
              - "판정 조정 메모는 곡마다 설정합니다. 기종 공통 기본값은 설정 화면에서 정할 수 있습니다"
              - "판정 오프셋의 참고값을 표시합니다. 지금은 추정값이지만, 이용자 데이터가 모이면 사용자 설정의 평균값을 표시합니다"
              - "둘 다 백업 대상입니다. 자유 메모는 개인정보를 고려해 암호화된 데이터만 서버에 저장합니다. 판정 조정 메모는 통계용으로 수집합니다"
            media: {type: image, src: memo.jpg}
      - heading: "디자인"
        items:
          - title: "색상 테마 5종 선택"
            desc: "다크·라이트 외에 3종이 있습니다. 홈의 섹션 구분 등 세세한 디자인도 다시 손봤습니다."
            media: {type: image, src: theme.jpg}
          - title: "곡 재킷 표시"
            desc: "곡 재킷을 표시하도록 했습니다. 해상도를 낮춰 사용합니다."
      - heading: "그 밖의 개선"
        items:
          - title: "검색과 채보 확인"
            list:
              - "곡명·아티스트로 검색할 수 있습니다"
              - "DDR 채보 확인을 개선했습니다"
      - heading: "버그 수정"
        items:
          - title: "버그 수정"
            list:
              - "같은 이름의 곡 스코어를 가져오지 못하는 문제"
              - "튜토리얼과 백업 복원 문제"
  zh:
    title: "支援顯示樂曲封面、記錄判定偏移與備忘，以及配色主題"
    sections:
      - heading: "推薦樂曲"
        items:
          - title: "改變了選曲方式"
            desc: "過去推薦樂曲總是把高等級的曲子排在上面。現在會從多個角度綜合選曲，例如優先選擇同實力帶中達到基準的人較多的樂曲。"
            media: {type: image, src: recommend.jpg}
      - heading: "樂曲詳情"
        items:
          - title: "判定調整備忘與自由備忘"
            list:
              - "判定調整備忘是每首歌的設定。各機種共通的預設值可在設定畫面設定"
              - "顯示判定偏移的參考值。目前是推測值，收集到足夠的使用者資料後，將顯示使用者設定的平均值"
              - "兩者都在備份範圍內。自由備忘考量隱私，只在伺服器保存加密後的資料。判定調整備忘會作為統計資料收集"
            media: {type: image, src: memo.jpg}
      - heading: "設計"
        items:
          - title: "可從 5 種配色主題中選擇"
            desc: "除了深色與淺色，另有 3 種。首頁的區塊分隔等細節設計也重新調整。"
            media: {type: image, src: theme.jpg}
          - title: "顯示樂曲封面"
            desc: "開始顯示樂曲封面，並降低解析度使用。"
      - heading: "其他改善"
        items:
          - title: "搜尋與譜面確認"
            list:
              - "可用曲名、藝人搜尋"
              - "改善 DDR 譜面確認"
      - heading: "錯誤修正"
        items:
          - title: "錯誤修正"
            list:
              - "無法匯入同名樂曲的分數"
              - "教學與備份還原的問題"
- id: "2026-07-31"
  kind: release
  version: "1.1.20260731"
  date: "2026-07-31"
  ja:
    title: "データ同期の不具合を修正しました"
    sections:
      - heading: "不具合の修正"
        items:
          - title: "データ同期のエラー"
            desc: "主に Android で起きていた、データ同期のエラーを修正しました。Android と iOS の実機で、修正できていることを確認しています。"
  en:
    title: "Fixed a data sync problem"
    sections:
      - heading: "Bug fixes"
        items:
          - title: "Data sync errors"
            desc: "Fixed data sync errors that mainly occurred on Android. The fix was confirmed on real Android and iOS devices."
  ko:
    title: "데이터 동기화 문제를 고쳤습니다"
    sections:
      - heading: "버그 수정"
        items:
          - title: "데이터 동기화 오류"
            desc: "주로 Android에서 발생하던 데이터 동기화 오류를 고쳤습니다. Android와 iOS 실기기에서 수정된 것을 확인했습니다."
  zh:
    title: "修正資料同步的問題"
    sections:
      - heading: "錯誤修正"
        items:
          - title: "資料同步錯誤"
            desc: "修正主要發生在 Android 上的資料同步錯誤。已在 Android 與 iOS 實機上確認修正完成。"
- id: "2026-07-27"
  kind: release
  version: "1.1.20260727"
  date: "2026-07-30"
  ja:
    title: "DDR と SOUND VOLTEX のスコア管理アプリを公開しました"
    sections:
      - heading: "ALM4GEST を公開"
        items:
          - title: "できること"
            desc: "課題を設定したり、その日の成果を1枚の画像に出力したり、自分の相対的な位置や、データから作ったTier表などを見られます。全機能を無料で提供しています。"
            media: {type: video, src: launch.mp4, poster: launch.jpg}
          - title: "iOS と Android"
            desc: "iOS版は App Store で公開中です。Android版はクローズドテスト中で、テスターを募集しています。"
  en:
    title: "ALM4GEST is out: a score tracker for DDR and SOUND VOLTEX"
    sections:
      - heading: "ALM4GEST is out"
        items:
          - title: "What it does"
            desc: "Set your own challenges, export each day's results as a single image, see where you stand against other players, browse data-driven Tier Lists, and more. Every feature is free."
            media: {type: video, src: launch.mp4, poster: launch.jpg}
          - title: "iOS and Android"
            desc: "The iOS version is on the App Store. The Android version is in closed testing, and we're looking for testers."
  ko:
    title: "DDR과 SOUND VOLTEX 스코어 관리 앱 'ALM4GEST'를 공개했습니다"
    sections:
      - heading: "ALM4GEST 공개"
        items:
          - title: "할 수 있는 것"
            desc: "과제를 설정하고, 그날의 성과를 한 장의 이미지로 내보내고, 자신의 상대적인 위치와 데이터로 만든 티어표 등을 볼 수 있습니다. 모든 기능을 무료로 제공합니다."
            media: {type: video, src: launch.mp4, poster: launch.jpg}
          - title: "iOS와 Android"
            desc: "iOS 버전은 App Store에서 공개 중입니다. Android 버전은 비공개 테스트 중이며 테스터를 모집하고 있습니다."
  zh:
    title: "DDR 與 SOUND VOLTEX 的分數管理 App「ALM4GEST」正式公開"
    sections:
      - heading: "公開 ALM4GEST"
        items:
          - title: "可以做的事"
            desc: "可設定課題、將當天的成果輸出成一張圖片，查看自己的相對位置，以及由資料製作的 Tier表等。所有功能皆免費提供。"
            media: {type: video, src: launch.mp4, poster: launch.jpg}
          - title: "iOS 與 Android"
            desc: "iOS 版已在 App Store 上架。Android 版正在封閉測試中，並招募測試者。"
