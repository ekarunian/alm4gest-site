  zh:
    title: "重新製作 SDVX 效果雷達，Tier表支援小數等級"
    sections:
      - heading: "SDVX 效果雷達"
        items:
          - title: "改為由錄影推估"
            games: [SDVX]
            desc: "由於先前放入了一手來源可疑的資料，現已完全移除，改為由畫面錄影推估。等級 17 以上已全部計算。等級 16 以下將視需求處理，先行刪除。"
