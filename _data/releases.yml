- id: "2026-10-08"
  kind: release
  version: "1.2.20261008"
  date: "2026-10-09"
  ja:
    title: "プロフィールの保存直後にアプリが落ちる不具合を修正しました"
    sections:
      - heading: "不具合の修正"
        items:
          - title: "プロフィールの保存でクラッシュ"
            desc: "プロフィールの編集で「保存」を押したあと、すぐに「好きな譜面」などのボタンを押すと、保存が終わったときにアプリが落ちていました。プロフィールを設定できるすべての版で起きていた不具合です。"
  en:
    title: "Fixed a crash right after saving your profile"
    sections:
      - heading: "Bug fixes"
        items:
          - title: "Crash when saving a profile"
            desc: "If you pressed a button such as \"Favorite charts\" right after pressing \"Save\" while editing your profile, the app crashed when saving finished. This affected every version with profiles."
  ko:
    title: "프로필 저장 직후 앱이 종료되던 문제를 고쳤습니다"
    sections:
      - heading: "버그 수정"
        items:
          - title: "프로필 저장 시 앱 종료"
            desc: "프로필 편집에서 '저장'을 누른 직후 '좋아하는 채보' 등의 버튼을 누르면, 저장이 끝날 때 앱이 종료되었습니다. 프로필을 설정할 수 있는 모든 버전에서 발생한 문제입니다."
  zh:
    title: "修正儲存個人檔案後 App 當機的問題"
    sections:
      - heading: "錯誤修正"
        items:
          - title: "儲存個人檔案時當機"
            desc: "編輯個人檔案時按下「儲存」後，若立刻按下「喜歡的譜面」等按鈕，儲存完成時 App 會當機。所有可設定個人檔案的版本都有這個問題。"
- id: "2026-10-07"
  kind: release
  version: "1.2.20261007"
  date: "2026-10-08"
  ja:
