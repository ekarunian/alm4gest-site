# リリースノートの正本。X の告知（8/21 アップデート予告①〜⑦・公開時の投稿）の事実を、機能ごとに整理し直して書く。
# 1項目 = 右の枠に出す画面1つ。画像・動画は site.release_media_base/<id>/ に置く。
- id: "v1-4-4"
  kind: release
  version: "1.4.4"
  date: "2026-11-13"
  ja:
    title: "みんなの投票・投稿の翻訳・フレンド申請リンクに対応"
    sections:
      - heading: "みんなの投票"
        items:
          - title: "イヤホン・ヘッドホンなどの人気投票"
            desc: "ホームに「みんなの投票」を追加しました。利用者同士で音ゲーに使う製品を評価・共有できます。\n最初のテーマは「音ゲーで使うイヤホン・ヘッドホン」です。DDRでは「DDRで履く靴」を表示します（日本のみ）。テーマは今後随時追加していく予定です。取ってみたい投票がある場合は要望等からご連絡ください。"
            list:
              - "1人3票まで、使っている製品を星1〜5で評価できます"
              - "選択肢にない製品は、自分で追加できます"
              - "コメントの投稿なども可能です（匿名化されます）"
            media: {type: video, src: 261113-v144poll.mp4, poster: 261113-v144poll.jpg}
      - heading: "フレンド・交流機能"
        items:
          - title: "リンクからフレンド申請"
            desc: "SNSなどで共有したリンクから、直接フレンド申請できるようにしました。\n※アプリがインストールされていない場合は、ストアを開きます。"
            list:
              - "プロフィールのフレンドコードにある🔗を押すと、申請用リンクをコピーできます。"
              - "相手がリンクを開くと、アプリで申請の確認画面が表示されます。"
            media: {type: video, src: 261113-v144link.mp4, poster: 261113-v144link.jpg}
          - title: "ほかの言語の投稿を翻訳"
            desc: "スコアアタック・課題・コメントを、アプリの設定言語に翻訳して表示できるようにしました。"
            list:
              - "翻訳された文章には印を表示し、押すと原文に切り替えられます。"
            media: {type: video, src: 261113-v144translate.mp4, poster: 261113-v144translate.jpg}
      - heading: "楽曲一覧・楽曲詳細"
        items:
          - title: "譜面ごとのVFを表示"
            games: [SDVX]
            list:
              - "楽曲一覧・楽曲詳細で、各譜面のVFを確認できます"
              - "楽曲一覧をVF順に並べ替えられるようにしました"
            media: {type: video, src: 261113-v144vf-sdvx-vf-vf.mp4, poster: 261113-v144vf-sdvx-vf-vf.jpg}
      - heading: "アプリの改善"
        items:
          - title: "リリースノートをアプリ内で確認"
            desc: "アプリ更新時に、新しいリリースノートを通知するようにしました。"
            list:
              - "通知から更新内容をアプリ内で確認できます"
              - "過去のリリースノートは、設定の「このアプリについて」から確認できます"
            media: {type: video, src: 261113-v144notes.mp4, poster: 261113-v144notes.jpg}
          - title: "アプリを切り替えても同期を継続"
            games: [Android]
            desc: "同期中にほかのアプリへ切り替えても、同期を継続できるようにしました。同期状況はAndroidの通知欄で確認できます。"
      - heading: "軽微な改善と修正"
        items:
          - title: "レーダーの表示改善"
            games: [IIDX, SDVX]
            list:
              - "IIDXのノーツレーダーを公式と同じ項目順に変更しました"
              - "成長タブでレーダーの各項目の値と増減を表示します（IIDX・SDVX）"
          - title: "同期・記録の不具合修正"
            games: [GITADORA]
            list:
              - "前回差分で全件取得を無効にしても、全曲を取得していた不具合を修正しました"
              - "ΔとGWの記録が混ざる不具合を修正しました。混ざった記録は自動で復元し、影響を受けた課題も正しい記録で判定し直します"
              - "GWのSkillで「Shooting Star」が計算対象に含まれない不具合を修正しました"
          - title: "その他の不具合修正"
            list:
              - "[POPN] BPMが「※」になっていた曲で、譜面ごとのBPMを表示するように修正しました"
              - "[DDR, SDVX, POPN] 公式サイトから中身のないページが返された際に、同期結果の一部が欠ける不具合を修正しました"
  en:
    title: "Player polls, translated posts, and friend request links"
    sections:
      - heading: "Player polls"
        items:
          - title: "Earphone and headphone polls"
            desc: "Added \"Player polls\" to Home. Players can rate and share the products they use for rhythm games.\n\nThe first theme is \"Earphones and headphones for rhythm games\". In DDR, the poll \"Shoes for DDR\" is shown (Japan only). We plan to add more themes over time. If there is a poll you would like to see, let us know from \"Report a request or problem\"."
            list:
              - "Each player has up to 3 votes and can rate each product they use from 1 to 5 stars"
              - "You can add a product that is not in the choices"
              - "You can also post comments (shown anonymously)"
            media: {type: video, src: 261113-v144poll.mp4, poster: 261113-v144poll.jpg}
      - heading: "Friends and social features"
        items:
          - title: "Send friend requests from a link"
            desc: "You can now send a friend request directly from a link shared on social media and elsewhere.\n\n*If the app is not installed, the link opens the store."
            list:
              - "Tap 🔗 next to the friend code on your profile to copy your friend request link."
              - "When someone opens the link, the app shows the friend request confirmation screen."
            media: {type: video, src: 261113-v144link.mp4, poster: 261113-v144link.jpg}
          - title: "Translate posts in other languages"
            desc: "Score Attacks, challenges and comments can now be translated into the app's language."
            list:
              - "Translated text shows a mark; tap it to switch to the original."
            media: {type: video, src: 261113-v144translate.mp4, poster: 261113-v144translate.jpg}
      - heading: "Song list and song details"
        items:
          - title: "VF for each chart"
            games: [SDVX]
            list:
              - "See the VF of each chart in the song list and song details"
              - "Sort the song list by VF"
            media: {type: video, src: 261113-v144vf-sdvx-vf-vf.mp4, poster: 261113-v144vf-sdvx-vf-vf.jpg}
      - heading: "App improvements"
        items:
          - title: "Release notes inside the app"
            desc: "After an update, the app now notifies you of the new release notes."
            list:
              - "Open the update details inside the app from the notification"
              - "Past release notes are in Settings → \"About this app\""
            media: {type: video, src: 261113-v144notes.mp4, poster: 261113-v144notes.jpg}
          - title: "Sync keeps running when you switch apps"
            games: [Android]
            desc: "Sync now continues even if you switch to another app during sync. You can check its progress in the Android notification area."
      - heading: "Minor improvements and fixes"
        items:
          - title: "Better radar display"
            games: [IIDX, SDVX]
            list:
              - "The IIDX notes radar now uses the same item order as the official site"
              - "The Growth tab shows the value and change of each radar item (IIDX and SDVX)"
          - title: "Sync and record fixes"
            games: [GITADORA]
            list:
              - "Fixed an issue where a diff sync fetched every song even with \"switch to full sync\" turned off"
              - "Fixed an issue where Δ and GW records got mixed. Mixed records are restored automatically, and affected challenges are judged again with the correct records"
              - "Fixed an issue where \"Shooting Star\" was not counted in GW Skill"
          - title: "Other fixes"
            list:
              - "[POPN] Songs whose BPM showed \"※\" now show the BPM of each chart"
              - "[DDR, SDVX, POPN] Fixed an issue where part of the sync results was missing when the official site returned an empty page"
  ko:
    title: "모두의 투표, 게시글 번역, 친구 신청 링크 지원"
    sections:
      - heading: "모두의 투표"
        items:
          - title: "이어폰·헤드폰 등 인기 투표"
            desc: "홈에 '모두의 투표'를 추가했습니다. 리듬게임에 쓰는 제품을 플레이어끼리 평가하고 공유할 수 있습니다.\n\n첫 번째 주제는 '리듬게임에 쓰는 이어폰·헤드폰'입니다. DDR에서는 'DDR에서 신는 신발'을 표시합니다(일본 한정). 주제는 앞으로 계속 추가할 예정입니다. 보고 싶은 투표가 있다면 '개발 요청·불편 신고'로 알려 주세요."
            list:
              - "1인당 3표까지, 사용하는 제품을 별 1~5개로 평가할 수 있습니다"
              - "선택지에 없는 제품은 직접 추가할 수 있습니다"
              - "댓글도 남길 수 있습니다(익명으로 표시됩니다)"
            media: {type: video, src: 261113-v144poll.mp4, poster: 261113-v144poll.jpg}
      - heading: "친구·교류 기능"
        items:
          - title: "링크로 친구 신청"
            desc: "SNS 등에 공유한 링크에서 바로 친구 신청을 할 수 있게 되었습니다.\n\n※앱이 설치되어 있지 않으면 스토어가 열립니다."
            list:
              - "프로필의 친구 코드 옆 🔗을 누르면 신청용 링크를 복사할 수 있습니다."
              - "상대가 링크를 열면 앱에서 친구 신청 확인 화면이 표시됩니다."
            media: {type: video, src: 261113-v144link.mp4, poster: 261113-v144link.jpg}
          - title: "다른 언어의 게시글 번역"
            desc: "스코어 어택·과제·댓글을 앱의 설정 언어로 번역해 표시할 수 있게 되었습니다."
            list:
              - "번역된 글에는 표시가 붙고, 누르면 원문으로 전환됩니다."
            media: {type: video, src: 261113-v144translate.mp4, poster: 261113-v144translate.jpg}
      - heading: "곡 목록·곡 상세"
        items:
          - title: "채보별 VF 표시"
            games: [SDVX]
            list:
              - "곡 목록과 곡 상세에서 각 채보의 VF를 확인할 수 있습니다"
              - "곡 목록을 VF 순으로 정렬할 수 있게 되었습니다"
            media: {type: video, src: 261113-v144vf-sdvx-vf-vf.mp4, poster: 261113-v144vf-sdvx-vf-vf.jpg}
      - heading: "앱 개선"
        items:
          - title: "앱 안에서 릴리스 노트 확인"
            desc: "앱을 업데이트하면 새 릴리스 노트를 알림으로 알려 드립니다."
            list:
              - "알림에서 업데이트 내용을 앱 안에서 확인할 수 있습니다"
              - "이전 릴리스 노트는 설정의 '이 앱에 관하여'에서 확인할 수 있습니다"
            media: {type: video, src: 261113-v144notes.mp4, poster: 261113-v144notes.jpg}
          - title: "다른 앱으로 전환해도 동기화 계속"
            games: [Android]
            desc: "동기화 중에 다른 앱으로 전환해도 동기화가 계속되게 했습니다. 진행 상황은 Android 알림창에서 확인할 수 있습니다."
      - heading: "소소한 개선과 수정"
        items:
          - title: "레이더 표시 개선"
            games: [IIDX, SDVX]
            list:
              - "IIDX 노츠 레이더를 공식과 같은 항목 순서로 바꿨습니다"
              - "성장 탭에서 레이더 각 항목의 값과 증감을 표시합니다(IIDX·SDVX)"
          - title: "동기화·기록 오류 수정"
            games: [GITADORA]
            list:
              - "이전 차분 동기화에서 전체 가져오기를 꺼도 모든 곡을 가져오던 문제를 수정했습니다"
              - "Δ와 GW의 기록이 섞이던 문제를 수정했습니다. 섞인 기록은 자동으로 복원되고, 영향을 받은 과제도 올바른 기록으로 다시 판정합니다"
              - "GW의 Skill에서 'Shooting Star'가 계산 대상에 포함되지 않던 문제를 수정했습니다"
          - title: "기타 오류 수정"
            list:
              - "[POPN] BPM이 '※'로 표시되던 곡에서 채보별 BPM을 표시하도록 수정했습니다"
              - "[DDR, SDVX, POPN] 공식 사이트가 빈 페이지를 반환했을 때 동기화 결과 일부가 빠지던 문제를 수정했습니다"
  zh:
    title: "支援大家的投票、貼文翻譯與好友邀請連結"
    sections:
      - heading: "大家的投票"
        items:
          - title: "耳機等熱門投票"
            desc: "在首頁新增了「大家的投票」。玩家之間可以評價並分享用於音樂遊戲的產品。\n\n第一個主題是「玩音樂遊戲用的耳機」。DDR 會顯示「玩 DDR 穿的鞋」（僅限日本）。之後會陸續增加主題。若有想看的投票，請從「回報需求與問題」告訴我們。"
            list:
              - "每人最多 3 票，可為自己使用的產品評 1～5 顆星"
              - "選項中沒有的產品，可以自行新增"
              - "也可以發表留言（以匿名顯示）"
            media: {type: video, src: 261113-v144poll.mp4, poster: 261113-v144poll.jpg}
      - heading: "好友與交流功能"
        items:
          - title: "從連結送出好友邀請"
            desc: "現在可以從社群網站等處分享的連結直接送出好友邀請。\n\n※若尚未安裝 App，會開啟商店。"
            list:
              - "按下個人檔案中好友代碼旁的 🔗，即可複製邀請用連結。"
              - "對方開啟連結後，App 會顯示好友邀請的確認畫面。"
            media: {type: video, src: 261113-v144link.mp4, poster: 261113-v144link.jpg}
          - title: "翻譯其他語言的貼文"
            desc: "分數挑戰、課題與留言現在可以翻譯成 App 設定的語言顯示。"
            list:
              - "翻譯過的文字會顯示標記，按下即可切換回原文。"
            media: {type: video, src: 261113-v144translate.mp4, poster: 261113-v144translate.jpg}
      - heading: "樂曲列表與樂曲詳細"
        items:
          - title: "顯示每個譜面的 VF"
            games: [SDVX]
            list:
              - "可在樂曲列表與樂曲詳細查看各譜面的 VF"
              - "樂曲列表可依 VF 排序"
            media: {type: video, src: 261113-v144vf-sdvx-vf-vf.mp4, poster: 261113-v144vf-sdvx-vf-vf.jpg}
      - heading: "App 改善"
        items:
          - title: "在 App 內查看版本說明"
            desc: "更新 App 後，會以通知告訴你新的版本說明。"
            list:
              - "可從通知在 App 內查看更新內容"
              - "過去的版本說明可從設定的「關於本App」查看"
            media: {type: video, src: 261113-v144notes.mp4, poster: 261113-v144notes.jpg}
          - title: "切換到其他 App 也會繼續同步"
            games: [Android]
            desc: "同步中切換到其他 App 時，同步也會繼續進行。同步狀況可在 Android 的通知欄查看。"
      - heading: "小幅改善與修正"
        items:
          - title: "改善雷達顯示"
            games: [IIDX, SDVX]
            list:
              - "IIDX 的音符雷達改為與官方相同的項目順序"
              - "成長分頁會顯示雷達各項目的數值與增減（IIDX・SDVX）"
          - title: "同步與紀錄的錯誤修正"
            games: [GITADORA]
            list:
              - "修正前次差異同步即使關閉全部取得，仍會取得所有樂曲的問題"
              - "修正 Δ 與 GW 紀錄混在一起的問題。混在一起的紀錄會自動復原，受影響的課題也會以正確的紀錄重新判定"
              - "修正 GW 的 Skill 未將「Shooting Star」列入計算的問題"
          - title: "其他錯誤修正"
            list:
              - "[POPN] BPM 顯示為「※」的樂曲，改為顯示各譜面的 BPM"
              - "[DDR, SDVX, POPN] 修正官方網站回傳空白頁面時，部分同步結果缺漏的問題"
- id: "v1-4-2"
  kind: release
  version: "1.4.2"
  date: "2026-11-06"
  ja:
    title: "プレミアムコースのCSV同期に対応・ウィジェットの改善など"
    sections:
      - heading: "同期"
        items:
          - title: "プレミアムコースのCSV同期"
            games: [SDVX, IIDX]
            desc: "e-amusementのプレミアムコースに加入している場合、CSVで全曲の記録をまとめて取り込むようにしました。\n全譜面に記録がある場合の同期時間の目安は以下の通りです。\n加入中はCSV同期が自動で選ばれ、同期方法を変更できません。加入状況は同期のたびに確認します。"
            list:
              - "SDVX：約50分 → 約8秒"
              - "IIDX：約20分 → 約25秒"
      - heading: "ホーム画面ウィジェット"
        items:
          - title: "ウィジェットを6種類に拡充"
            games: [iPhone]
            desc: "iPhoneのホーム画面ウィジェットを作り直し、以下の6種類に対応しました。"
            list:
              - "目標・成長・クリアランプ分布・レーダー・自己ベスト更新・活動"
              - "目標は、アプリで設定した表示形式（進捗バー・半円ゲージ・累積グラフ）をそのまま表示します"
            media: {type: image, src: 261106-v142widget-6.jpg}
      - heading: "フレンド"
        items:
          - title: "楽曲一覧でフレンド・ライバルを一括表示切替"
            desc: "楽曲一覧の絞り込みにある人のアイコンから、フレンド・ライバルのスコア表示をまとめてオン・オフできるようにしました。"
            media: {type: video, src: 261106-v142friend.mp4, poster: 261106-v142friend.jpg}
          - title: "フレンドの表示設定"
            list:
              - "「通常」「ライバル」「スコア非表示」を機種ごとに設定できるようにしました"
              - "従来の非表示設定は、全機種共通の非表示として引き継ぎます"
            media: {type: video, src: 261106-v142friendgame.mp4, poster: 261106-v142friendgame.jpg}
      - heading: "beatmania IIDX"
        items:
          - title: "EXスコア率"
            games: [IIDX]
            list:
              - "EXスコアの表示を「DJ LEVELとの差」「EXスコア」「スコア率」から選べるようにしました"
              - "楽曲一覧の並べ替えにEXスコア率を追加しました"
          - title: "その他の改善"
            games: [IIDX]
            list:
              - "「NO PLAY」の絞り込みに、記録のない譜面も含めるようにしました"
              - "レベル別の到達状況を、ノーマルクリア以上・AA以上・AAA以上・MAX-以上で集計するようにしました"
      - heading: "軽微な改善と修正"
        items:
          - title: "楽曲一覧・楽曲詳細"
            list:
              - "全機種の楽曲一覧で、クリアランプ順に並べ替えられるようにしました"
              - "楽曲詳細にアーティスト名を追加しました。長い場合はスクロールして表示されます"
            media: {type: video, src: 261106-v142sort.mp4, poster: 261106-v142sort.jpg}
          - title: "設定画面"
            list:
              - "設定の各項目にアイコンを追加し、分かりやすくしました"
            media: {type: image, src: 261106-v142.jpg}
          - title: "不具合修正"
            games: [GITADORA]
            desc: "公式サイトで達成率が「NO」の譜面を、記録のない譜面として扱うように修正しました。次回の同期で、GWのみでプレーした譜面がΔのSkillから除外されます。"
  en:
    title: "CSV sync for the Premium Course, improved widgets, and more"
    sections:
      - heading: "Sync"
        items:
          - title: "CSV sync for the Premium Course"
            games: [SDVX, IIDX]
            desc: "If you subscribe to the e-amusement Premium Course, the app now imports the records of all songs at once via CSV.\nApproximate sync times when every chart has a record:\nWhile you are subscribed, CSV sync is chosen automatically and the sync method cannot be changed. Your subscription status is checked at every sync."
            list:
              - "SDVX: about 50 min → about 8 sec"
              - "IIDX: about 20 min → about 25 sec"
      - heading: "Home screen widgets"
        items:
          - title: "Six kinds of widgets"
            games: [iPhone]
            desc: "We rebuilt the iPhone home screen widgets. Six kinds are now available."
            list:
              - "Goal, Growth, Clear lamps, Radar, Personal bests, and Activity"
              - "The Goal widget uses the display format you chose in the app (progress bar, semicircle gauge, or cumulative graph)"
            media: {type: image, src: 261106-v142widget-6.jpg}
      - heading: "Friends"
        items:
          - title: "Toggle friends and rivals in the song list"
            desc: "The person icon in the song list filters now turns the scores of friends and rivals on or off all at once."
            media: {type: video, src: 261106-v142friend.mp4, poster: 261106-v142friend.jpg}
          - title: "Friend display settings"
            list:
              - "\"Normal\", \"Rival\", and \"Hide scores\" can now be set per game"
              - "Friends you hid before stay hidden in all games"
            media: {type: video, src: 261106-v142friendgame.mp4, poster: 261106-v142friendgame.jpg}
      - heading: "beatmania IIDX"
        items:
          - title: "EX score rate"
            games: [IIDX]
            list:
              - "You can now choose how EX scores are shown: \"Gap to DJ LEVEL\", \"EX score\", or \"Score rate\""
              - "EX score rate was added to the song list sort options"
          - title: "Other improvements"
            games: [IIDX]
            list:
              - "The \"NO PLAY\" filter now includes charts with no record"
              - "Progress by level now counts NORMAL CLEAR or better, AA or better, AAA or better, and MAX- or better"
      - heading: "Minor improvements and fixes"
        items:
          - title: "Song list and song details"
            list:
              - "The song list of every game can now be sorted by clear lamp"
              - "Song details now show the artist name. Long names scroll"
            media: {type: video, src: 261106-v142sort.mp4, poster: 261106-v142sort.jpg}
          - title: "Settings"
            list:
              - "Each settings item now has an icon to make it easier to find"
            media: {type: image, src: 261106-v142.jpg}
          - title: "Bug fix"
            games: [GITADORA]
            desc: "Charts whose achievement rate is \"NO\" on the official site are now treated as charts with no record. After your next sync, charts you played only on GW are no longer counted in your Δ Skill."
  ko:
    title: "프리미엄 코스 CSV 동기화 지원, 위젯 개선 등"
    sections:
      - heading: "동기화"
        items:
          - title: "프리미엄 코스 CSV 동기화"
            games: [SDVX, IIDX]
            desc: "e-amusement 프리미엄 코스에 가입되어 있으면, CSV로 모든 곡의 기록을 한꺼번에 가져오도록 했습니다.\n모든 보면에 기록이 있을 때의 동기화 시간 기준은 다음과 같습니다.\n가입 중에는 CSV 동기화가 자동으로 선택되며, 동기화 방법을 바꿀 수 없습니다. 가입 상태는 동기화할 때마다 확인합니다."
            list:
              - "SDVX: 약 50분 → 약 8초"
              - "IIDX: 약 20분 → 약 25초"
      - heading: "홈 화면 위젯"
        items:
          - title: "위젯을 6종류로 확장"
            games: [iPhone]
            desc: "iPhone 홈 화면 위젯을 새로 만들어, 다음 6종류를 지원합니다."
            list:
              - "목표·성장·클리어 램프 분포·레이더·자기 베스트 갱신·활동"
              - "목표 위젯은 앱에서 설정한 표시 형식(진행 바·반원 게이지·누적 그래프)을 그대로 표시합니다"
            media: {type: image, src: 261106-v142widget-6.jpg}
      - heading: "친구"
        items:
          - title: "악곡 목록에서 친구·라이벌 표시를 한꺼번에 전환"
            desc: "악곡 목록 필터에 있는 사람 아이콘으로 친구·라이벌의 점수 표시를 한꺼번에 켜고 끌 수 있게 했습니다."
            media: {type: video, src: 261106-v142friend.mp4, poster: 261106-v142friend.jpg}
          - title: "친구 표시 설정"
            list:
              - "「일반」「라이벌」「점수 숨김」을 기종별로 설정할 수 있게 했습니다"
              - "기존의 숨김 설정은 모든 기종 공통의 숨김으로 이어집니다"
            media: {type: video, src: 261106-v142friendgame.mp4, poster: 261106-v142friendgame.jpg}
      - heading: "beatmania IIDX"
        items:
          - title: "EX 스코어율"
            games: [IIDX]
            list:
              - "EX 스코어 표시를 「DJ LEVEL과의 차」「EX 스코어」「스코어율」 중에서 고를 수 있게 했습니다"
              - "악곡 목록 정렬에 EX 스코어율을 추가했습니다"
          - title: "기타 개선"
            games: [IIDX]
            list:
              - "「NO PLAY」 필터에 기록이 없는 보면도 포함하도록 했습니다"
              - "레벨별 달성 현황을 NORMAL CLEAR 이상·AA 이상·AAA 이상·MAX- 이상으로 집계하도록 했습니다"
      - heading: "소소한 개선 및 수정"
        items:
          - title: "악곡 목록·악곡 상세"
            list:
              - "모든 기종의 악곡 목록에서 클리어 램프 순으로 정렬할 수 있게 했습니다"
              - "악곡 상세에 아티스트 이름을 추가했습니다. 길면 스크롤되어 표시됩니다"
            media: {type: video, src: 261106-v142sort.mp4, poster: 261106-v142sort.jpg}
          - title: "설정 화면"
            list:
              - "설정의 각 항목에 아이콘을 추가해 알아보기 쉽게 했습니다"
            media: {type: image, src: 261106-v142.jpg}
          - title: "버그 수정"
            games: [GITADORA]
            desc: "공식 사이트에서 달성률이 「NO」인 보면을 기록이 없는 보면으로 다루도록 수정했습니다. 다음 동기화부터 GW에서만 플레이한 보면이 Δ의 Skill에서 제외됩니다."
  zh:
    title: "支援高級課程的 CSV 同步、改善小工具等"
    sections:
      - heading: "同步"
        items:
          - title: "高級課程的 CSV 同步"
            games: [SDVX, IIDX]
            desc: "若已加入 e-amusement 高級課程，現在會透過 CSV 一次匯入所有樂曲的紀錄。\n所有譜面都有紀錄時，同步時間的參考如下。\n加入期間會自動選擇 CSV 同步，無法變更同步方式。每次同步時都會確認加入狀態。"
            list:
              - "SDVX：約 50 分鐘 → 約 8 秒"
              - "IIDX：約 20 分鐘 → 約 25 秒"
      - heading: "主畫面小工具"
        items:
          - title: "小工具擴充為 6 種"
            games: [iPhone]
            desc: "重新製作了 iPhone 的主畫面小工具，支援以下 6 種。"
            list:
              - "目標、成長、通關燈號分布、雷達、自我最佳更新、活動"
              - "目標小工具會直接沿用在 App 中設定的顯示形式（進度條、半圓儀表、累積圖）"
            media: {type: image, src: 261106-v142widget-6.jpg}
      - heading: "好友"
        items:
          - title: "在樂曲列表一次切換好友與對手的顯示"
            desc: "現在可透過樂曲列表篩選中的人物圖示，一次開啟或關閉好友與對手的分數顯示。"
            media: {type: video, src: 261106-v142friend.mp4, poster: 261106-v142friend.jpg}
          - title: "好友的顯示設定"
            list:
              - "「一般」「對手」「隱藏分數」現在可依機種分別設定"
              - "原本的隱藏設定會沿用為所有機種共通的隱藏"
            media: {type: video, src: 261106-v142friendgame.mp4, poster: 261106-v142friendgame.jpg}
      - heading: "beatmania IIDX"
        items:
          - title: "EX分數率"
            games: [IIDX]
            list:
              - "EX 分數的顯示現在可從「與 DJ LEVEL 的差」「EX 分數」「分數率」中選擇"
              - "樂曲列表的排序新增了 EX分數率"
          - title: "其他改善"
            games: [IIDX]
            list:
              - "「NO PLAY」篩選現在也會包含沒有紀錄的譜面"
              - "各等級的達成狀況改為以 NORMAL CLEAR 以上、AA 以上、AAA 以上、MAX- 以上統計"
      - heading: "細微的改善與修正"
        items:
          - title: "樂曲列表與樂曲詳情"
            list:
              - "所有機種的樂曲列表現在都能依通關燈排序"
              - "樂曲詳情新增了藝人名稱。名稱較長時會捲動顯示"
            media: {type: video, src: 261106-v142sort.mp4, poster: 261106-v142sort.jpg}
          - title: "設定畫面"
            list:
              - "設定的各個項目新增了圖示，更容易辨識"
            media: {type: image, src: 261106-v142.jpg}
          - title: "錯誤修正"
            games: [GITADORA]
            desc: "修正為將官方網站上達成率為「NO」的譜面視為沒有紀錄的譜面。下次同步後，只在 GW 遊玩過的譜面將不再計入 Δ 的 Skill。"
- id: "v1-4-1"
  kind: release
  version: "1.4.1"
  date: "2026-11-04"
  ja:
    title: "GITADORAのGALAXY WAVE DELTA(Δ)とGALAXY WAVEの記録が混ざる不具合を直しました"
    sections:
      - heading: "GITADORA"
        items:
          - title: "GALAXY WAVE DELTA(Δ)とGALAXY WAVEの記録を分けて管理"
            games: [GITADORA]
            desc: "1.3.20261104 から、GALAXY WAVE DELTAとGALAXY WAVEの両方を遊んでいる方の記録が混ざっていました。ご迷惑をおかけして申し訳ありません。"
            list:
              - "スコア・Skill の推移・目標の伸びを、版ごとに分けて持つようにしました"
              - "次の同期で両方の版を読み直し、混ざった推移を直します"
              - "同期のほかに操作は要りません"
          - title: "楽曲一覧で版を切り替え"
            games: [GITADORA]
            desc: "両方の版に記録がある方は、楽曲一覧で「Δ」と「GW」を切り替えられます。"
            list:
              - "選んだ版が Skill・一覧・目標に反映されます"
              - "楽曲詳細では、両方の版の達成率を同じ行に並べます"
            media: {type: video, src: gitadora-version.mp4, poster: gitadora-version.jpg}
      - heading: "IIDX"
        items:
          - title: "前回差分で一部の曲が取り込まれない不具合を修正"
            games: [IIDX]
            list:
              - "前回差分の同期で取得出来なかった曲を改めて読み直すようにしました。"
          - title: "課題の目標を選ぶと落ちる不具合を修正"
            games: [IIDX]
            list:
              - "フレンドに課題を投げるとき、目標にクリアランプとDJ LEVELを選べるようにしました"
              - "前の版から届いた課題の目標がIIDXに無いものだったときは、受け取るときに目標を選び直せるようにしました"
  en:
    title: "Fixed GITADORA GALAXY WAVE DELTA (Δ) and GALAXY WAVE records getting mixed"
    sections:
      - heading: "GITADORA"
        items:
          - title: "GALAXY WAVE DELTA (Δ) and GALAXY WAVE records are kept separately"
            games: [GITADORA]
            desc: "Since 1.3.20261104, records of players who play both GALAXY WAVE DELTA and GALAXY WAVE were mixed together. We apologize for the inconvenience."
            list:
              - "Scores, Skill history, and goal progress are now kept per version"
              - "The next sync re-reads both versions and fixes the mixed history"
              - "No action is needed besides syncing"
          - title: "Switch versions in the song list"
            games: [GITADORA]
            desc: "If you have records in both versions, you can switch between \"Δ\" and \"GW\" in the song list."
            list:
              - "The selected version applies to Skill, the list, and goals"
              - "Song details show the achievement rates of both versions on the same row"
            media: {type: video, src: gitadora-version.mp4, poster: gitadora-version.jpg}
      - heading: "IIDX"
        items:
          - title: "Fixed some songs missing from \"since last sync\" syncs"
            games: [IIDX]
            list:
              - "Songs that could not be fetched in a \"since last sync\" sync are now read again."
          - title: "Fixed a crash when choosing a challenge goal"
            games: [IIDX]
            list:
              - "When sending a challenge to a friend, you can now choose a clear lamp or DJ LEVEL as the goal"
              - "If a challenge from an older version has a goal that IIDX does not have, you can choose a new goal when accepting it"
  ko:
    title: "GITADORA GALAXY WAVE DELTA(Δ)와 GALAXY WAVE의 기록이 섞이는 문제를 수정했습니다"
    sections:
      - heading: "GITADORA"
        items:
          - title: "GALAXY WAVE DELTA(Δ)와 GALAXY WAVE의 기록을 따로 관리"
            games: [GITADORA]
            desc: "1.3.20261104부터 GALAXY WAVE DELTA와 GALAXY WAVE를 모두 플레이하시는 분의 기록이 섞여 있었습니다. 불편을 드려 죄송합니다."
            list:
              - "스코어·Skill 추이·목표 진척을 버전별로 따로 저장하도록 했습니다"
              - "다음 동기화에서 두 버전을 다시 읽어 섞인 추이를 바로잡습니다"
              - "동기화 외에 따로 조작할 필요는 없습니다"
          - title: "악곡 목록에서 버전 전환"
            games: [GITADORA]
            desc: "두 버전 모두 기록이 있는 분은 악곡 목록에서 「Δ」와 「GW」를 전환할 수 있습니다."
            list:
              - "선택한 버전이 Skill·목록·목표에 반영됩니다"
              - "악곡 상세에서는 두 버전의 달성률을 같은 줄에 표시합니다"
            media: {type: video, src: gitadora-version.mp4, poster: gitadora-version.jpg}
      - heading: "IIDX"
        items:
          - title: "지난 동기화 이후 동기화에서 일부 곡이 반영되지 않는 문제 수정"
            games: [IIDX]
            list:
              - "지난 동기화 이후 동기화에서 가져오지 못한 곡을 다시 읽도록 했습니다."
          - title: "과제 목표를 고르면 앱이 종료되는 문제 수정"
            games: [IIDX]
            list:
              - "친구에게 과제를 보낼 때 목표로 클리어 램프와 DJ LEVEL을 고를 수 있게 했습니다"
              - "이전 버전에서 받은 과제의 목표가 IIDX에 없는 것일 때는 받을 때 목표를 다시 고를 수 있게 했습니다"
  zh:
    title: "修正了 GITADORA GALAXY WAVE DELTA(Δ) 與 GALAXY WAVE 紀錄混在一起的問題"
    sections:
      - heading: "GITADORA"
        items:
          - title: "分開管理 GALAXY WAVE DELTA(Δ) 與 GALAXY WAVE 的紀錄"
            games: [GITADORA]
            desc: "自 1.3.20261104 起，同時遊玩 GALAXY WAVE DELTA 與 GALAXY WAVE 的玩家紀錄混在了一起。造成不便，深感抱歉。"
            list:
              - "分數、Skill 推移與目標進度改為依版本分開保存"
              - "下次同步時會重新讀取兩個版本，修正混在一起的推移"
              - "除了同步之外不需要其他操作"
          - title: "在樂曲列表切換版本"
            games: [GITADORA]
            desc: "兩個版本都有紀錄的玩家，可在樂曲列表切換「Δ」與「GW」。"
            list:
              - "所選的版本會套用到 Skill、列表與目標"
              - "樂曲詳情會在同一行並列兩個版本的達成率"
            media: {type: video, src: gitadora-version.mp4, poster: gitadora-version.jpg}
      - heading: "IIDX"
        items:
          - title: "修正上次同步後的同步中部分樂曲未匯入的問題"
            games: [IIDX]
            list:
              - "上次同步後的同步中未能取得的樂曲，現在會重新讀取。"
          - title: "修正選擇課題目標時當機的問題"
            games: [IIDX]
            list:
              - "向好友發送課題時，現在可選擇通關燈與 DJ LEVEL 作為目標"
              - "從舊版本收到的課題目標若是 IIDX 沒有的項目，接收時可重新選擇目標"
- id: "2026-11-05"
  kind: release
  version: "1.3.20261105"
  date: "2026-11-03"
  ja:
    title: "複数端末利用・Tier表の絞り込み改善など"
    sections:
      - heading: "複数端末でのデータ共有"
        items:
          - title: "複数端末でのセットアップ"
            desc: "複数端末でスコア・課題・お気に入り・スコアタなどのデータを共有できるようにしました。\n設定方法は以下の通りです。"
            list:
              - "既存の端末でバックアップコードを確認します"
              - "新しい端末で「すでに別端末でALM4GESTを利用している方」を選択します"
              - "バックアップコードを入力すると、端末間でデータを共有できます"
            ordered: true
          - title: "バックアップ機能の改善"
            list:
              - "バックアップを端末ごとに保存するようにしました"
              - "復元時に複数のバックアップがある場合は、端末の機種名から選べます"
              - "バックアップ設定をしている場合、同期後に自動でバックアップするようにしました"
            media: {type: video, src: 261105-alm239.mp4, poster: 261105-alm239.jpg}
      - heading: "Tier表・楽曲一覧"
        items:
          - title: "Tier表の絞り込み"
            list:
              - "小数レベル・バージョンでTier表を絞り込めるようにしました"
              - "例えばLv17.5〜18.4のTier表を作ることもできます"
            levels: [0, 1]
            media: {type: video, src: 261105-alm242-tier.mp4, poster: 261105-alm242-tier.jpg}
          - title: "楽曲一覧・偏差値"
            list:
              - "楽曲一覧に「メモあり」の絞り込みを追加しました"
              - "偏差値が全体の上位に入っている譜面は、全体順位を表示します"
          - title: "メダルの分類"
            games: ["pop'n"]
            list:
              - "緑（EASY）・橙（ASSIST）のメダルを、銅（CLEAR）とは別の段に分けました。"
              - "楽曲一覧の絞り込み・統計・Tier表で利用できます。"
            levels: [0, 1]
      - heading: "同期"
        items:
          - title: "同期の不具合修正"
            games: [IIDX]
            list:
              - "同期が失敗する・終わらない不具合を修正しました"
              - "中断した同期を続きから再開できるようにしました"
              - "「最初からやり直す」で、最初から同期することもできます"
          - title: "曲詳細の取得"
            games: [IIDX]
            list:
              - "負荷軽減のため、MISS COUNT・選曲回数などは最近遊んだ曲から取得し、残りは次回以降の同期で読み込むようにしました。"
      - heading: "課題・スコアタ・通知"
        items:
          - title: "アプリ内通知"
            list:
              - "「すべて既読」を追加しました"
              - "操作の必要がない通知は、見るとホームの通知マークが消えるようにしました"
              - "投げた課題への返事の通知を、一言なし（初期設定OFF）と一言つき（初期設定ON）に分けました"
            media: {type: video, src: 261105-alm241.mp4, poster: 261105-alm241.jpg}
          - title: "課題の送信履歴"
            list:
              - "送った課題の履歴を、左にスワイプして削除できるようにしました。"
          - title: "通しのスコアタ"
            list:
              - "スコアタの一覧と詳細に「通し」のマークを追加しました。"
      - heading: "軽微な改善と修正"
        items:
          - title: "改善と修正"
            list:
              - "ホームの「画像で共有」で、現在表示している機種・日付の成果画像を出すように修正しました"
              - "初回起動時のUIを改善しました"
  en:
    title: "Multi-device use, better Tier List filters and more"
    sections:
      - heading: "Share data across devices"
        items:
          - title: "Set up on more devices"
            desc: "Scores, challenges, favorites, Score Attacks and other data can now be shared across devices.\nHere's how to set it up."
            list:
              - "Check your backup code on your current device"
              - "On the new device, choose \"Already using ALM4GEST on another device\""
              - "Enter your backup code to share data between the devices"
            ordered: true
          - title: "Better backups"
            list:
              - "Backups are now saved per device"
              - "If there are several backups when restoring, pick one by device model"
              - "If backup is set up, the app now backs up automatically after a sync"
            media: {type: video, src: 261105-alm239.mp4, poster: 261105-alm239.jpg}
      - heading: "Tier List and Songs"
        items:
          - title: "Tier List filters"
            list:
              - "Filter the Tier List by decimal level or version"
              - "For example, you can make a Tier List of Lv17.5–18.4"
            levels: [0, 1]
            media: {type: video, src: 261105-alm242-tier.mp4, poster: 261105-alm242-tier.jpg}
          - title: "Songs and T-scores"
            list:
              - "Added a \"Has notes\" filter to Songs"
              - "Charts whose T-score is near the top overall now show their overall rank"
          - title: "Medal groups"
            games: ["pop'n"]
            list:
              - "Green (EASY) and orange (ASSIST) medals are now a separate tier from bronze (CLEAR)."
              - "This works in Songs filters, stats and the Tier List."
            levels: [0, 1]
      - heading: "Sync"
        items:
          - title: "Sync fixes"
            games: [IIDX]
            list:
              - "Fixed syncs failing or never finishing"
              - "An interrupted sync can now resume where it stopped"
              - "You can also sync from scratch with \"Start over\""
          - title: "Song details"
            games: [IIDX]
            list:
              - "To reduce load, MISS COUNT, play counts and similar details are now fetched starting with recently played songs, and the rest are read in later syncs."
      - heading: "Challenges, Score Attack and notifications"
        items:
          - title: "In-app notifications"
            list:
              - "Added \"Mark all read\""
              - "Notifications that need no action now clear the mark on Home once you view them"
              - "Reply notifications for challenges you sent are now split into no message (off by default) and with a message (on by default)"
            media: {type: video, src: 261105-alm241.mp4, poster: 261105-alm241.jpg}
          - title: "Sent challenges"
            list:
              - "Swipe left to delete a sent challenge from the history."
          - title: "One-run Score Attacks"
            list:
              - "Score Attack lists and details now show a \"One run\" mark."
      - heading: "Minor improvements and fixes"
        items:
          - title: "Improvements and fixes"
            list:
              - "Share as image on Home now outputs the results for the game and date you're viewing"
              - "Improved the first-launch screens"
  ko:
    title: "여러 기기 사용, 티어표 필터 개선 등"
    sections:
      - heading: "여러 기기에서 데이터 공유"
        items:
          - title: "여러 기기에서 설정"
            desc: "여러 기기에서 점수·과제·즐겨찾기·스코어 어택 등의 데이터를 공유할 수 있습니다.\n설정 방법은 다음과 같습니다."
            list:
              - "기존 기기에서 백업 코드를 확인합니다"
              - "새 기기에서 '이미 다른 기기에서 ALM4GEST를 사용 중인 분'을 선택합니다"
              - "백업 코드를 입력하면 기기 간에 데이터를 공유할 수 있습니다"
            ordered: true
          - title: "백업 기능 개선"
            list:
              - "백업을 기기별로 저장하도록 했습니다"
              - "복원할 때 백업이 여러 개 있으면 기기 모델명으로 고를 수 있습니다"
              - "백업을 설정한 경우 동기화 후 자동으로 백업하도록 했습니다"
            media: {type: video, src: 261105-alm239.mp4, poster: 261105-alm239.jpg}
      - heading: "티어표·곡 목록"
        items:
          - title: "티어표 필터"
            list:
              - "소수 레벨·버전으로 티어표를 필터링할 수 있습니다"
              - "예를 들어 Lv17.5~18.4 티어표도 만들 수 있습니다"
            levels: [0, 1]
            media: {type: video, src: 261105-alm242-tier.mp4, poster: 261105-alm242-tier.jpg}
          - title: "곡 목록·T점수"
            list:
              - "곡 목록에 '메모 있음' 필터를 추가했습니다"
              - "T점수가 전체 상위권인 채보는 전체 순위를 표시합니다"
          - title: "메달 분류"
            games: ["pop'n"]
            list:
              - "초록(EASY)·주황(ASSIST) 메달을 동(CLEAR)과 다른 단계로 나눴습니다."
              - "곡 목록 필터·통계·티어표에서 사용할 수 있습니다."
            levels: [0, 1]
      - heading: "동기화"
        items:
          - title: "동기화 오류 수정"
            games: [IIDX]
            list:
              - "동기화가 실패하거나 끝나지 않는 오류를 수정했습니다"
              - "중단된 동기화를 이어서 다시 시작할 수 있습니다"
              - "'처음부터 다시'로 처음부터 동기화할 수도 있습니다"
          - title: "곡 상세 가져오기"
            games: [IIDX]
            list:
              - "부하를 줄이기 위해 MISS COUNT·선곡 횟수 등은 최근 플레이한 곡부터 가져오고, 나머지는 다음 동기화부터 읽어 오도록 했습니다."
      - heading: "과제·스코어 어택·알림"
        items:
          - title: "앱 내 알림"
            list:
              - "'모두 읽음'을 추가했습니다"
              - "조작이 필요 없는 알림은 확인하면 홈의 알림 표시가 사라집니다"
              - "보낸 과제의 응답 알림을 한마디 없음(기본 OFF)과 한마디 있음(기본 ON)으로 나눴습니다"
            media: {type: video, src: 261105-alm241.mp4, poster: 261105-alm241.jpg}
          - title: "보낸 과제 기록"
            list:
              - "보낸 과제 기록을 왼쪽으로 스와이프해 삭제할 수 있습니다."
          - title: "연속 플레이 스코어 어택"
            list:
              - "스코어 어택 목록과 상세에 '연속 플레이' 표시를 추가했습니다."
      - heading: "작은 개선과 수정"
        items:
          - title: "개선과 수정"
            list:
              - "홈의 '이미지로 공유'에서 지금 보고 있는 기종·날짜의 성과 이미지를 출력하도록 수정했습니다"
              - "첫 실행 시의 UI를 개선했습니다"
  zh:
    title: "多裝置使用、Tier表篩選改善等"
    sections:
      - heading: "多裝置共享資料"
        items:
          - title: "在多台裝置上設定"
            desc: "現在可以在多台裝置間共享分數、課題、我的最愛、分數挑戰等資料。\n設定方法如下。"
            list:
              - "在原本的裝置上確認備份碼"
              - "在新裝置上選擇「已在其他裝置使用 ALM4GEST」"
              - "輸入備份碼後，即可在裝置間共享資料"
            ordered: true
          - title: "備份功能改善"
            list:
              - "備份改為依裝置分別保存"
              - "還原時若有多份備份，可依裝置型號選擇"
              - "已設定備份時，同步後會自動備份"
            media: {type: video, src: 261105-alm239.mp4, poster: 261105-alm239.jpg}
      - heading: "Tier表・樂曲一覽"
        items:
          - title: "Tier表篩選"
            list:
              - "可依小數等級・版本篩選Tier表"
              - "例如也可以製作 Lv17.5～18.4 的Tier表"
            levels: [0, 1]
            media: {type: video, src: 261105-alm242-tier.mp4, poster: 261105-alm242-tier.jpg}
          - title: "樂曲一覽・T分數"
            list:
              - "樂曲一覽新增「有備註」篩選"
              - "T分數位居全體前段的譜面，會顯示全體排名"
          - title: "獎章分類"
            games: ["pop'n"]
            list:
              - "綠（EASY）・橙（ASSIST）獎章已與銅（CLEAR）分為不同段位。"
              - "可用於樂曲一覽的篩選、統計與Tier表。"
            levels: [0, 1]
      - heading: "同步"
        items:
          - title: "同步問題修正"
            games: [IIDX]
            list:
              - "修正同步失敗或無法結束的問題"
              - "中斷的同步可從中斷處繼續"
              - "也可以從「從頭開始」重新同步"
          - title: "曲目詳情的取得"
            games: [IIDX]
            list:
              - "為減輕負載，MISS COUNT、選曲次數等會從最近遊玩的曲目開始取得，其餘在之後的同步中讀取。"
      - heading: "課題・分數挑戰・通知"
        items:
          - title: "App 內通知"
            list:
              - "新增「全部已讀」"
              - "不需操作的通知，查看後首頁的通知標記就會消失"
              - "已發送課題的回覆通知，分為無留言（預設關閉）與附留言（預設開啟）"
            media: {type: video, src: 261105-alm241.mp4, poster: 261105-alm241.jpg}
          - title: "已發送的課題紀錄"
            list:
              - "已發送的課題紀錄可向左滑動刪除。"
          - title: "連續遊玩的分數挑戰"
            list:
              - "分數挑戰的列表與詳情新增「連續遊玩」標記。"
      - heading: "小幅改善與修正"
        items:
          - title: "改善與修正"
            list:
              - "修正首頁「以圖片分享」會輸出目前顯示中的機種與日期的成果圖片"
              - "改善首次啟動時的畫面"
- id: "2026-11-04"
  kind: release
  version: "1.3.20261104"
  date: "2026-11-02"
  ja:
    title: "beatmania IIDX に対応しました"
    sections:
      - heading: "beatmania IIDX に対応"
        items:
          - title: "同期・楽曲一覧・おすすめ・Tier表・目標管理"
            games: [IIDX]
            desc: "beatmania IIDX で、同期・楽曲一覧・おすすめ・Tier表・目標管理を使えます。"
            media: {type: video, src: iidx.mp4, poster: iidx.jpg}
          - title: "譜面確認"
            games: [IIDX]
            list:
              - "☆8以上が対象です"
              - "ZINRAIの「譜面表示エリアの固定」にも対応しました"
            media: {type: video, src: iidx-chart.mp4, poster: iidx-chart.jpg}
          - title: "RANDOMの当たり配置の記録と共有"
            games: [IIDX]
            list:
              - "オプションと、RANDOMの当たり配置を記録・管理できます"
              - "皆さんのオプション設定の分布と当たり配置が共有されます"
              - "当たり配置から、対応する譜面をすぐ確認できます"
              - "当たり配置に対応するランダムレーンチケットがある場合は、それが分かるように表示します"
            media: {type: video, src: iidx-random.mp4, poster: iidx-random.jpg}
          - title: "注意事項"
            games: [IIDX]
            list:
              - "初めのうちは統計の精度が暴れることが想定されます。11月中はご容赦ください"
              - "INFINITASの取り込みには対応していません"
              - "IIDXはジャケットがなく、Tier表が見づらい可能性があります。見せ方のご意見は、アプリ内のフォームなどでお待ちしています"
      - heading: "楽曲一覧の絞り込み"
        items:
          - title: "絞り込みのUIを改善"
            list:
              - "レベルごとの楽曲数を棒グラフで表します"
              - "得意度・レーダーの主軸でも絞り込めます"
              - "参加中のすべてのスコアタの対象曲で絞り込めます"
              - "DDRは、フレアランクなどでの絞り込みに対応しました"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "課題の受け付け"
        items:
          - title: "レベルごとの受け付け設定"
            list:
              - "レベルごとに「歓迎」「OK」「NG」を設定できます"
              - "受け付けるときの一言を設定できます（優先度は譜面ごと→機種ごと→全体）"
              - "重複を避けるため、課題に登録済みの譜面は投げられないようにしました"
            media: {type: video, src: ch-accept.mp4, poster: ch-accept.jpg}
      - heading: "スコアタ"
        items:
          - title: "家庭用の参加可否"
            desc: "主催者が「家庭用の参加可否」を選べます。機能は変わらず、参加できるかどうかを明示するだけです。"
            media: {type: video, src: sa-home.mp4, poster: sa-home.jpg}
          - title: "家庭用マークとコメントの全文"
            list:
              - "順位表などに「家庭用」マークを表示します"
              - "投稿されたコメントを、省略せずに全文で表示できます"
            media: {type: image, src: sa-ranking.jpg}
      - heading: "ホーム画面ウィジェット"
        items:
          - title: "iPhoneのホーム画面ウィジェット"
            list:
              - "小・中の2サイズに対応しました"
              - "この機能はプロトタイプの状態で、今後も改善していきます"
              - "不具合を報告するときに、画像4枚と動画1本（60秒まで）を添付できます。このアカウントへのリンクも置きました"
            media: {type: video, src: widget.mp4, poster: widget.jpg}
      - heading: "軽微な改善と修正"
        items:
          - title: "Tier表の未クリアの絞り込み"
            desc: "Tier表に、未クリアだけの絞り込みを足しました。"
            media: {type: video, src: tier-uncleared.mp4, poster: tier-uncleared.jpg}
          - title: "判定調整とハイスピの既定値"
            list:
              - "判定調整とハイスピの既定値を、GF/DM・SP/DPで分けました"
              - "SDVXの判定調整を、1ms単位で変えられるように直しました"
              - "各機種の同期と表示の不具合を直しました（一部は調査用のログの取得まで）"
            media: {type: video, src: play-setup.mp4, poster: play-setup.jpg}
  en:
    title: "beatmania IIDX support"
    sections:
      - heading: "beatmania IIDX support"
        items:
          - title: "Sync, Songs, Tier List, goals and more"
            games: [IIDX]
            desc: "Sync, the song list, recommendations, Tier Lists and goals now work for beatmania IIDX."
            media: {type: video, src: iidx.mp4, poster: iidx.jpg}
          - title: "Chart viewer"
            games: [IIDX]
            list:
              - "Covers ☆8 and above"
              - "Supports ZINRAI's \"fixed chart display area\""
            media: {type: video, src: iidx-chart.mp4, poster: iidx-chart.jpg}
          - title: "Record and share good RANDOM patterns"
            games: [IIDX]
            list:
              - "Record and manage options and good RANDOM lane patterns"
              - "Everyone's option settings and good patterns are shared"
              - "Jump from a good pattern straight to the matching chart"
              - "If a random lane ticket matches the pattern, it's shown"
            media: {type: video, src: iidx-random.mp4, poster: iidx-random.jpg}
          - title: "Notes"
            games: [IIDX]
            list:
              - "Statistics are expected to be unstable at first. Please bear with us through November"
              - "INFINITAS import isn't supported"
              - "IIDX has no jackets, so Tier Lists may be hard to read. We welcome ideas on how to show them through the in-app form"
      - heading: "Song list filters"
        items:
          - title: "A better filter UI"
            list:
              - "The number of songs per level is shown as a bar chart"
              - "Filter by Strength or the main axis of the radar"
              - "Filter by the songs of all Score Attacks you've joined"
              - "For DDR, filter by Flare rank and more"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "Accepting challenges"
        items:
          - title: "Acceptance per level"
            list:
              - "Set \"Welcome\", \"OK\" or \"No\" for each level"
              - "Set a short message for accepting (priority: per chart, then per game, then overall)"
              - "Charts already registered as challenges can't be sent again, to avoid duplicates"
            media: {type: video, src: ch-accept.mp4, poster: ch-accept.jpg}
      - heading: "Score Attack"
        items:
          - title: "Home version entries"
            desc: "The host can choose whether home versions can take part. This doesn't change any features; it only makes it clear."
            media: {type: video, src: sa-home.mp4, poster: sa-home.jpg}
          - title: "Home mark and full comments"
            list:
              - "A \"Home\" mark appears in rankings and elsewhere"
              - "Posted comments can be shown in full, without truncation"
            media: {type: image, src: sa-ranking.jpg}
      - heading: "Home screen widget"
        items:
          - title: "iPhone home screen widget"
            list:
              - "Available in small and medium sizes"
              - "This feature is a prototype and will keep improving"
              - "Bug reports can include 4 images and 1 video (up to 60 seconds). A link to this account is also included"
            media: {type: video, src: widget.mp4, poster: widget.jpg}
      - heading: "Small improvements and fixes"
        items:
          - title: "Filter Tier Lists by not cleared"
            desc: "Added a filter to show only not-cleared charts in Tier Lists."
            media: {type: video, src: tier-uncleared.mp4, poster: tier-uncleared.jpg}
          - title: "Timing and hi-speed defaults"
            list:
              - "Timing and hi-speed defaults are now separate for GF/DM and SP/DP"
              - "SDVX timing can now be changed in 1 ms steps"
              - "Fixed sync and display problems in each game (some only up to collecting logs for investigation)"
            media: {type: video, src: play-setup.mp4, poster: play-setup.jpg}
  ko:
    title: "beatmania IIDX에 대응했습니다"
    sections:
      - heading: "beatmania IIDX 지원"
        items:
          - title: "동기화·곡 목록·추천·티어표·목표 관리"
            games: [IIDX]
            desc: "beatmania IIDX에서 동기화·곡 목록·추천·티어표·목표 관리를 쓸 수 있습니다."
            media: {type: video, src: iidx.mp4, poster: iidx.jpg}
          - title: "채보 확인"
            games: [IIDX]
