              - "可在「送出的課題」確認對方是否收到、是否達成"
              - "新設的「已達成的課題」可比較從收到時起分數更新前後的差異"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "課題與分數挑戰的 UI"
            list:
              - "可在首頁的課題列表直接修改目標值，保留送出者顯示的同時讓版面更精簡"
              - "分數挑戰列表顯示樂曲數，並改善手動登錄分數欄的 UI"
            media: {type: video, src: challenge-ui.mp4, poster: challenge-ui.jpg}
      - heading: "GITADORA"
        items:
          - title: "Gt+Ba 與資料匯出"
            games: [GITADORA]
            list:
              - "GuitarFreaks 樂曲一覽新增「Gt+Ba」，可同時確認兩個聲部的譜面"
              - "增加資料匯出的項目"
              - "修正上次同步後同步會漏掉部分遊玩的問題"
      - heading: "其他改善與修正"
        items:
          - title: "個人檔案的公開範圍等"
            list:
              - "可依個人檔案的項目設定公開範圍"
              - "修正 SDVX 上次同步後同步會顯示未遊玩譜面的問題"
              - "調整被好友超越的樂曲顯示 UI"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
