            list:
              - "偏差値とは別に、自分の相対的な得意・苦手が分かる「得意度」を追加しました"
              - "得意度は、同じレベルの他の譜面での自分の成績から予想スコアを出し、実際の点数と比べる指標です。50が予想どおり、70以上が得意、30以下が苦手です"
              - "偏差値の計算方法を正しました（上がります）"
              - "曲一覧の並べ替えと、得意度での弱点分析にも対応しました"
              - "SDVXは、EXスコアの計算にも対応しています"
            media: {type: video, src: stats.mp4, poster: stats.jpg}
      - heading: "楽曲詳細"
        items:
          - title: "4つのタブに整理"
            list:
              - "「概要」「比較」「スコア履歴」「その他」の4タブに整理しました"
              - "偏差値の比較バーとスコア履歴を見やすくしました"
            media: {type: video, src: detail-tabs.mp4, poster: detail-tabs.jpg}
          - title: "攻略情報を共有"
            desc: "譜面ごとの攻略情報や感想を、ほかの利用者と共有できます。"
            media: {type: video, src: notes.mp4, poster: notes.jpg}
      - heading: "スコアタ"
        items:
          - title: "通しのルール"
            desc: "3〜4曲を1回の通しで競うルールを追加しました。"
            media: {type: video, src: sa-run.mp4, poster: sa-run.jpg}
          - title: "リザルト写真からスコアを読み取る"
            desc: "リザルト写真からスコアを読み取り、自動で補完します。精度は確認していますが、ミスがあまりに多いなどあれば報告をお願いします。"
            media: {type: video, src: sa-ocr.mp4, poster: sa-ocr.jpg}
      - heading: "Tier表と成長の目標"
        items:
          - title: "ポップンのTier表と目標"
            games: ["pop'n"]
            list:
              - "Tier表を「全曲」「最初から」「解禁」で絞り込めます"
              - "目標などに、銅◆・銅★・銀◆・銀★を足しました"
            media: {type: video, src: popn-tier.mp4, poster: popn-tier.jpg}
          - title: "達成率で目標を決める"
            desc: "成長の目標を、達成率（％）でも設定できます。"
            media: {type: video, src: goal-rate.mp4, poster: goal-rate.jpg}
      - heading: "その他の改善と修正"
        items:
          - title: "リンクと判定調整など"
            list:
              - "プロフィールに、SNSなどのリンクを最大5件登録できます"
              - "SDVXの判定調整を、目盛とmsで併記します"
              - "シート操作・課題通知・CSVの不具合を直しました"
              - "一部のクラッシュを直しました"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
  en:
    title: "Rebuilt statistics with \"Strength\", and song details in 4 tabs"
    sections:
      - heading: "Statistics"
        items:
          - title: "Strength and T-score"
            list:
              - "Added \"Strength\", separate from the T-score, which shows what you're relatively good or bad at"
              - "Strength predicts your score from your results on other charts of the same level and compares it with your actual score. 50 is as predicted, 70 or more is a strength, 30 or less a weakness"
              - "Corrected how the T-score is calculated (it goes up)"
              - "Song list sorting and weakness analysis by Strength are also supported"
              - "For SDVX, EX score calculation is supported too"
            media: {type: video, src: stats.mp4, poster: stats.jpg}
      - heading: "Song details"
        items:
          - title: "Organized into 4 tabs"
            list:
              - "Organized into 4 tabs: Overview, Compare, Score history and Other"
              - "The T-score comparison bar and score history are easier to read"
            media: {type: video, src: detail-tabs.mp4, poster: detail-tabs.jpg}
          - title: "Share strategy notes"
            desc: "Share strategy and impressions for each chart with other users."
            media: {type: video, src: notes.mp4, poster: notes.jpg}
      - heading: "Score Attack"
        items:
          - title: "Run rule"
            desc: "Added a rule where you compete on 3 to 4 songs in a single run."
            media: {type: video, src: sa-run.mp4, poster: sa-run.jpg}
          - title: "Read scores from result photos"
            desc: "Scores are read from result photos and filled in automatically. Accuracy has been checked, but please report it if mistakes are too frequent."
            media: {type: video, src: sa-ocr.mp4, poster: sa-ocr.jpg}
      - heading: "Tier List and growth goals"
        items:
          - title: "pop'n Tier List and goals"
            games: ["pop'n"]
            list:
              - "Filter the Tier List by \"All songs\", \"From the start\" and \"Unlocked\""
              - "Added bronze ◆, bronze ★, silver ◆ and silver ★ to goals and more"
            media: {type: video, src: popn-tier.mp4, poster: popn-tier.jpg}
          - title: "Goals by achievement rate"
            desc: "Growth goals can also be set by achievement rate (%)."
            media: {type: video, src: goal-rate.mp4, poster: goal-rate.jpg}
      - heading: "Other improvements and fixes"
        items:
          - title: "Links, timing and more"
            list:
              - "Add up to 5 links, such as social media, to your profile"
              - "SDVX timing adjustment shows both steps and ms"
              - "Fixed problems with sheet controls, challenge notifications and CSV"
              - "Fixed some crashes"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
  ko:
    title: "통계를 다시 만들어 '강점도'를 추가하고, 곡 상세를 4개 탭으로 정리했습니다"
    sections:
      - heading: "통계"
        items:
          - title: "강점도와 T점수"
            list:
              - "T점수와 별도로, 자신의 상대적인 강점·약점을 알 수 있는 '강점도'를 추가했습니다"
              - "강점도는 같은 레벨의 다른 채보 성적으로 예상 스코어를 내고 실제 점수와 비교하는 지표입니다. 50은 예상대로, 70 이상은 강점, 30 이하는 약점입니다"
              - "T점수 계산 방법을 바로잡았습니다(올라갑니다)"
              - "곡 목록 정렬과 강점도로 보는 약점 분석에도 대응했습니다"
              - "SDVX는 EX 스코어 계산에도 대응합니다"
            media: {type: video, src: stats.mp4, poster: stats.jpg}
      - heading: "곡 상세"
        items:
          - title: "4개 탭으로 정리"
            list:
              - "'개요' '비교' '스코어 이력' '기타' 4개 탭으로 정리했습니다"
              - "T점수 비교 막대와 스코어 이력을 보기 쉽게 했습니다"
            media: {type: video, src: detail-tabs.mp4, poster: detail-tabs.jpg}
          - title: "공략 정보 공유"
            desc: "채보별 공략 정보와 감상을 다른 이용자와 공유할 수 있습니다."
            media: {type: video, src: notes.mp4, poster: notes.jpg}
      - heading: "스코어 어택"
        items:
          - title: "연속 플레이 규칙"
            desc: "3~4곡을 한 번에 이어서 겨루는 규칙을 추가했습니다."
            media: {type: video, src: sa-run.mp4, poster: sa-run.jpg}
          - title: "리절트 사진에서 스코어 읽기"
            desc: "리절트 사진에서 스코어를 읽어 자동으로 채웁니다. 정확도는 확인했지만, 실수가 너무 많으면 알려 주세요."
            media: {type: video, src: sa-ocr.mp4, poster: sa-ocr.jpg}
      - heading: "티어표와 성장 목표"
        items:
          - title: "팝픈 티어표와 목표"
            games: ["pop'n"]
            list:
              - "티어표를 '전곡' '처음부터' '해금'으로 좁힐 수 있습니다"
              - "목표 등에 동◆·동★·은◆·은★을 추가했습니다"
            media: {type: video, src: popn-tier.mp4, poster: popn-tier.jpg}
          - title: "달성률로 목표 정하기"
            desc: "성장 목표를 달성률(%)로도 설정할 수 있습니다."
            media: {type: video, src: goal-rate.mp4, poster: goal-rate.jpg}
      - heading: "그 밖의 개선과 수정"
        items:
          - title: "링크와 판정 조정 등"
            list:
              - "프로필에 SNS 등의 링크를 최대 5개 등록할 수 있습니다"
              - "SDVX 판정 조정을 눈금과 ms로 함께 표시합니다"
              - "시트 조작·과제 알림·CSV 문제를 고쳤습니다"
              - "일부 앱 종료 문제를 고쳤습니다"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
  zh:
    title: "重新製作統計並新增「擅長度」，樂曲詳情改為 4 個分頁"
    sections:
      - heading: "統計"
        items:
          - title: "擅長度與 T分數"
            list:
              - "在 T分數之外，新增可看出自己相對擅長與不擅長的「擅長度」"
              - "擅長度是依自己在同等級其他譜面的成績算出預測分數，再與實際分數比較的指標。50 為符合預測，70 以上為擅長，30 以下為不擅長"
              - "修正 T分數的計算方式（數值會上升）"
              - "也支援樂曲一覽的排序與以擅長度進行的弱點分析"
              - "SDVX 也支援 EX 分數的計算"
            media: {type: video, src: stats.mp4, poster: stats.jpg}
      - heading: "樂曲詳情"
        items:
          - title: "整理為 4 個分頁"
            list:
              - "整理為「概要」「比較」「分數履歷」「其他」4 個分頁"
              - "T分數的比較條與分數履歷更容易閱讀"
            media: {type: video, src: detail-tabs.mp4, poster: detail-tabs.jpg}
          - title: "分享攻略資訊"
            desc: "可與其他使用者分享各譜面的攻略資訊與感想。"
            media: {type: video, src: notes.mp4, poster: notes.jpg}
      - heading: "分數挑戰"
        items:
          - title: "連續遊玩規則"
            desc: "新增以一次連續遊玩 3～4 首競賽的規則。"
            media: {type: video, src: sa-run.mp4, poster: sa-run.jpg}
          - title: "從結算照片讀取分數"
            desc: "會從結算照片讀取分數並自動填入。已確認過精度，若錯誤太多請回報。"
            media: {type: video, src: sa-ocr.mp4, poster: sa-ocr.jpg}
      - heading: "Tier表與成長目標"
        items:
          - title: "pop'n 的 Tier表與目標"
            games: ["pop'n"]
            list:
              - "Tier表可依「全曲」「初期」「解禁」篩選"
              - "目標等新增銅◆、銅★、銀◆、銀★"
            media: {type: video, src: popn-tier.mp4, poster: popn-tier.jpg}
          - title: "以達成率設定目標"
            desc: "成長目標也能以達成率（％）設定。"
            media: {type: video, src: goal-rate.mp4, poster: goal-rate.jpg}
      - heading: "其他改善與修正"
        items:
          - title: "連結與判定調整等"
            list:
              - "個人檔案最多可登錄 5 個社群等連結"
              - "SDVX 的判定調整同時顯示刻度與 ms"
              - "修正面板操作、課題通知與 CSV 的問題"
              - "修正部分當機問題"
            media: {type: video, src: misc.mp4, poster: misc.jpg}
- id: "2026-10-14"
  kind: release
  version: "1.2.20261014"
  date: "2026-10-14"
  ja:
    title: "SDVXのエフェクトレーダーを作り直し、小数レベルのTier表に対応しました"
    sections:
      - heading: "SDVXのエフェクトレーダー"
        items:
          - title: "画面録画から推定する方法へ"
            games: [SDVX]
            desc: "1次情報の怪しいデータを入れてしまっていたため完全に取り除き、画面録画から推定する方法に変えました。レベル17以上はすべて計算しました。レベル16以下は要望に応じて対応する方針とし、まずは削除します。"
            media: {type: video, src: radar.mp4, poster: radar.jpg}
          - title: "推定方法と注意"
            games: [SDVX]
            list:
              - "推定方法は画像のとおりです"
              - "レーダー値は目安です。相対的な弱点分析に使ってください（プレイヤーレーダーも同じです）"
              - "レーダーは手動で更新するため、楽曲マスタより後に随時追加します"
            media: {type: image, src: radar-method.jpg}
      - heading: "Tier表"
        items:
          - title: "小数レベルと並べ替え"
            list:
              - "SDVX・GITADORA のTier表で、18.0や18.1などの小数レベルごとに表示できます。カスタムTierを作るときも、複数の小数レベルを指定できます"
              - "Tier表の並べ替えに「スコア順」を足し、これまでの「Tier順」「レベル順」と合わせて選べます"
              - "ジャケットの表示サイズの切り替えや、EXスコア表示のUIも調整しました"
            media: {type: video, src: tier-decimal.mp4, poster: tier-decimal.jpg}
      - heading: "課題とスコアタ"
        items:
          - title: "課題にコメント"
            list:
              - "課題を送るときに、28字までのコメントを添えられます"
              - "「投げた課題」で、受け取り・達成の状況を確認できます"
              - "新しく作った「達成した課題」で、受け取った時点からのスコアの更新前後を比べられます"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "課題とスコアタのUI"
            list:
              - "ホームの課題一覧で目標値を直接変えられます。送り主の表示は残したまま、レイアウトをコンパクトにしました"
              - "スコアタのリストに楽曲数を表示し、手動のスコア登録欄のUIも改善しました"
            media: {type: video, src: challenge-ui.mp4, poster: challenge-ui.jpg}
      - heading: "GITADORA"
        items:
          - title: "Gt+Ba とデータ書き出し"
            games: [GITADORA]
            list:
              - "ギタフリの楽曲一覧に「Gt+Ba」を足し、両パートの譜面を同時に確認できます"
              - "データの書き出し項目を増やしました"
              - "前回差分同期で、一部のプレーを取りこぼす不具合を直しました"
      - heading: "その他の改善と修正"
        items:
          - title: "プロフィールの公開範囲など"
            list:
              - "プロフィールの項目ごとに公開範囲を設定できます"
              - "SDVXの前回差分同期で、未プレイの譜面が表示される不具合を直しました"
              - "フレンドに抜かれた楽曲の表示のUIを調整しました"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
  en:
    title: "A rebuilt SDVX effect radar, and Tier Lists by decimal level"
    sections:
      - heading: "SDVX effect radar"
        items:
          - title: "Estimated from screen recordings"
            games: [SDVX]
            desc: "Data of doubtful primary origin had been included, so it was removed completely and replaced with estimates from screen recordings. All charts at level 17 and above are calculated. Level 16 and below will be added on request, and are removed for now."
            media: {type: video, src: radar.mp4, poster: radar.jpg}
          - title: "Method and notes"
            games: [SDVX]
            list:
              - "The estimation method is shown in the image"
              - "Radar values are a guide. Use them for relative weakness analysis (the same goes for the player radar)"
              - "The radar is updated by hand, so it's added after the song master as it goes"
            media: {type: image, src: radar-method.jpg}
      - heading: "Tier List"
        items:
          - title: "Decimal levels and sorting"
            list:
              - "SDVX and GITADORA Tier Lists can show each decimal level, such as 18.0 or 18.1. Custom tiers can also use several decimal levels"
              - "Added \"Score\" to Tier List sorting, alongside \"Tier\" and \"Level\""
              - "Adjusted switching jacket size and the EX score display"
            media: {type: video, src: tier-decimal.mp4, poster: tier-decimal.jpg}
      - heading: "Challenges and Score Attack"
        items:
          - title: "Comments on challenges"
            list:
              - "Add a comment of up to 28 characters when sending a challenge"
              - "Check whether challenges you sent were received or achieved under \"Sent challenges\""
              - "The new \"Achieved challenges\" compares your score before and after, from when you received it"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "Challenge and Score Attack UI"
            list:
              - "Change target values directly in the home challenge list. The layout is more compact while still showing the sender"
              - "The Score Attack list shows the number of songs, and the manual score entry UI is improved"
            media: {type: video, src: challenge-ui.mp4, poster: challenge-ui.jpg}
      - heading: "GITADORA"
        items:
          - title: "Gt+Ba and data export"
            games: [GITADORA]
            list:
              - "Added \"Gt+Ba\" to the GuitarFreaks song list, so you can check both parts' charts at once"
              - "More items in data export"
              - "Fixed some plays being missed by differential sync"
      - heading: "Other improvements and fixes"
        items:
          - title: "Profile visibility and more"
            list:
              - "Set visibility for each profile item"
              - "Fixed unplayed charts appearing after SDVX differential sync"
              - "Adjusted the UI for songs where friends overtook you"
            media: {type: video, src: profile.mp4, poster: profile.jpg}
  ko:
    title: "SDVX 이펙트 레이더를 다시 만들고, 소수 레벨 티어표에 대응했습니다"
    sections:
      - heading: "SDVX 이펙트 레이더"
        items:
          - title: "화면 녹화로 추정하는 방식으로"
            games: [SDVX]
            desc: "1차 정보가 의심스러운 데이터를 넣고 있었기 때문에 완전히 제거하고, 화면 녹화로 추정하는 방식으로 바꿨습니다. 레벨 17 이상은 모두 계산했습니다. 레벨 16 이하는 요청에 따라 대응하기로 하고 우선 삭제합니다."
            media: {type: video, src: radar.mp4, poster: radar.jpg}
          - title: "추정 방법과 주의 사항"
            games: [SDVX]
            list:
              - "추정 방법은 이미지와 같습니다"
              - "레이더 값은 기준입니다. 상대적인 약점 분석에 활용해 주세요(플레이어 레이더도 같습니다)"
              - "레이더는 수동으로 갱신하므로 곡 마스터보다 나중에 수시로 추가합니다"
            media: {type: image, src: radar-method.jpg}
      - heading: "티어표"
        items:
          - title: "소수 레벨과 정렬"
            list:
              - "SDVX·GITADORA 티어표에서 18.0, 18.1 등 소수 레벨별로 표시할 수 있습니다. 커스텀 티어를 만들 때도 여러 소수 레벨을 지정할 수 있습니다"
              - "티어표 정렬에 '스코어순'을 추가해 기존 '티어순' '레벨순'과 함께 고를 수 있습니다"
              - "재킷 표시 크기 전환과 EX 스코어 표시 UI도 조정했습니다"
            media: {type: video, src: tier-decimal.mp4, poster: tier-decimal.jpg}
      - heading: "과제와 스코어 어택"
        items:
          - title: "과제에 코멘트"
            list:
              - "과제를 보낼 때 28자까지 코멘트를 붙일 수 있습니다"
              - "'보낸 과제'에서 수령·달성 상황을 확인할 수 있습니다"
              - "새로 만든 '달성한 과제'에서 받은 시점부터의 스코어 갱신 전후를 비교할 수 있습니다"
            media: {type: video, src: challenge.mp4, poster: challenge.jpg}
          - title: "과제와 스코어 어택 UI"
            list:
              - "홈의 과제 목록에서 목표값을 바로 바꿀 수 있습니다. 보낸 사람 표시는 유지한 채 레이아웃을 간결하게 했습니다"
              - "스코어 어택 목록에 곡 수를 표시하고, 수동 스코어 등록란 UI도 개선했습니다"
