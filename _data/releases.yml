              - "데이터 내보내기 항목을 늘렸습니다"
              - "지난 동기화 이후 동기화에서 일부 플레이를 놓치던 문제를 고쳤습니다"
      - heading: "그 밖의 개선과 수정"
        items:
          - title: "프로필 공개 범위 등"
            list:
              - "프로필 항목마다 공개 범위를 설정할 수 있습니다"
              - "SDVX 지난 동기화 이후 동기화에서 플레이하지 않은 채보가 표시되던 문제를 고쳤습니다"
              - "친구에게 추월당한 곡 표시 UI를 조정했습니다"
