# リリースノートの正本。X の告知（8/21 アップデート予告①〜⑦・公開時の投稿）の事実を、機能ごとに整理し直して書く。
# 1項目 = 右の枠に出す画面1つ。画像・動画は site.release_media_base/<id>/ に置く。
- id: "2026-08-21"
  kind: release
  version: "1.2.20260821"
  date: "2026-08-20"
  ja:
    title: "GITADORA に対応し、伸ばせる曲を絞り込むフィルタを追加しました"
    sections:
      - heading: "GITADORA に対応"
        items:
          - title: "GF と DM を分けて記録"
            desc: "GF と DM のスコアを別々に管理できます。Tier表は、データが足りないため自動では作れません。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "自己ベストの判定内訳を保存"
            desc: "差分同期のたびに、自己ベストの判定内訳を自動で保存します。譜面の確認は外部サイトへのリンクです。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "伸ばせる曲を絞り込む"
        items:
          - title: "2つのフィルタを追加"
            list:
              - "伸びしろ：スコアを伸ばせば Skill（FlareSkill・VOLFORCE など）の対象に入る曲"
              - "GP先行の除外（DDR のみ）：GP先行配信の対象曲のうち、通常解禁されていない曲を外す"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "楽曲詳細"
        items:
          - title: "同じランク帯との差"
            desc: "同じランク帯の中央値と上位10%のスコア、自分との差を表示します。データが少ないため、今は SDVX だけで使えます。"
            media: {type: image, src: detail-2.jpg}
          - title: "スコア履歴の数値"
            desc: "スコア履歴に、各回のスコアの数値を表示します。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同期"
        items:
          - title: "「昨日の成果」を選べる"
            desc: "プレイ当日に前回の同期忘れに気づいたら、プレイ前に「昨日の成果」で同期し、プレイ後に「今日の成果」で同期すると、その日の成果だけをまとめられます。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表と共有画像"
        items:
          - title: "Tier表"
            list:
              - "作成時のレベル・指標・区分の選び方を改善"
              - "自分のスコアとグレードを表示"
              - "曲数が多い（SDVX など）画像の出力でアプリが落ちる不具合を修正。画像の容量を減らしました"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "共有画像の見た目を統一"
            desc: "機能ごとに違っていた共有画像の見た目を揃えました。出力は右上のアイコンから。あわせて画面上部の配置を詰め、メインの表示を広くしました。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "ウィジェットと配置変更"
        items:
          - title: "目標ウィジェットと並べ替え"
            list:
              - "目標ウィジェットのグラフで、文字が重ならないようにしました"
              - "ウィジェットの配置変更や、楽曲一覧の表示プリセットの並べ替えなど、配置を変える操作を改善しました"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  en:
    title: "GITADORA support, and filters to find songs you can raise"
    sections:
      - heading: "GITADORA support"
        items:
          - title: "Separate records for GF and DM"
            desc: "GF and DM scores are managed separately. Tier Lists can't be generated automatically yet, because there isn't enough data."
            media: {type: image, src: gitadora-1.jpg}
          - title: "Judgement breakdown of personal bests"
            desc: "Each differential sync automatically saves the judgement breakdown of your personal bests. Chart previews link to an external site."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "Find songs you can raise"
        items:
          - title: "Two new filters"
            list:
              - "Room to grow: songs that would enter your Skill slots (FlareSkill, VOLFORCE, etc.) if you raise their score"
              - "Exclude early access (DDR only): removes songs in GP early access that haven't been unlocked normally"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "Song details"
        items:
          - title: "Compared with your rank range"
            desc: "Shows the median and top 10% scores in the same rank range, and your difference from them. Works only for SDVX for now, because there isn't enough data."
            media: {type: image, src: detail-2.jpg}
          - title: "Numbers in your score history"
            desc: "Your score history now shows the score of each entry."
            media: {type: image, src: detail-1.jpg}
      - heading: "Sync"
        items:
          - title: "Choose \"Yesterday's results\""
            desc: "If you notice on the day of play that you forgot to sync last time, sync with \"Yesterday's results\" before playing, then with \"Today's results\" after playing, to get only that day's results."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier List and share images"
        items:
          - title: "Tier List"
            list:
              - "Easier selection of level, metric and category when creating one"
              - "Shows your own score and grade"
              - "Fixed a crash when exporting images with many songs (such as SDVX) by reducing the image size"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "One look for share images"
            desc: "Share images, which looked different for each feature, now share one look. Export from the icon at the top right. The top of the screen is also more compact, giving the main content more room."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "Widgets and rearranging"
        items:
          - title: "Goal widget and reordering"
            list:
              - "Text no longer overlaps in the goal widget's graph"
              - "Improved rearranging, such as moving widgets and reordering song list presets"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  ko:
    title: "GITADORA 지원과, 올릴 수 있는 곡을 좁히는 필터 추가"
    sections:
      - heading: "GITADORA 지원"
        items:
          - title: "GF와 DM을 나누어 기록"
            desc: "GF와 DM의 스코어를 따로 관리할 수 있습니다. 티어표는 데이터가 부족해 아직 자동으로 만들 수 없습니다."
            media: {type: image, src: gitadora-1.jpg}
          - title: "자기 최고 기록의 판정 내역 저장"
            desc: "차분 동기화할 때마다 자기 최고 기록의 판정 내역을 자동으로 저장합니다. 보면 확인은 외부 사이트 링크입니다."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "올릴 수 있는 곡 좁히기"
        items:
          - title: "필터 2가지 추가"
            list:
              - "성장 여지: 스코어를 올리면 Skill(FlareSkill·VOLFORCE 등) 대상에 들어가는 곡"
              - "선행 플레이 제외(DDR 한정): 선행 플레이 대상곡 중 일반 해금되지 않은 곡을 제외"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "곡 상세"
        items:
          - title: "같은 랭크대와의 차이"
            desc: "같은 랭크대의 중앙값과 상위 10% 스코어, 자신과의 차이를 표시합니다. 데이터가 적어 지금은 SDVX에서만 쓸 수 있습니다."
            media: {type: image, src: detail-2.jpg}
          - title: "스코어 이력의 수치"
            desc: "스코어 이력에 각 회차의 스코어 수치를 표시합니다."
            media: {type: image, src: detail-1.jpg}
      - heading: "동기화"
        items:
          - title: "'어제의 성과' 선택"
            desc: "플레이 당일에 지난번 동기화를 잊은 것을 알아차리면, 플레이 전에 '어제의 성과'로, 플레이 후에 '오늘의 성과'로 동기화해 그날의 성과만 정리할 수 있습니다."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "티어표와 공유 이미지"
        items:
          - title: "티어표"
            list:
              - "작성 시 레벨·지표·구분 선택 방식 개선"
              - "자신의 스코어와 그레이드 표시"
              - "곡 수가 많은(SDVX 등) 이미지를 내보낼 때 앱이 종료되던 문제를 이미지 용량을 줄여 수정"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "공유 이미지 모양 통일"
            desc: "기능마다 달랐던 공유 이미지의 모양을 통일했습니다. 오른쪽 위 아이콘에서 내보냅니다. 화면 상단 배치도 줄여 메인 표시를 넓혔습니다."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "위젯과 배치 변경"
        items:
          - title: "목표 위젯과 순서 변경"
            list:
              - "목표 위젯 그래프에서 글자가 겹치지 않게 했습니다"
              - "위젯 배치 변경, 곡 목록 표시 프리셋 순서 변경 등 배치를 바꾸는 조작을 개선했습니다"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  zh:
    title: "支援 GITADORA，並新增篩選可提升歌曲的功能"
    sections:
      - heading: "支援 GITADORA"
        items:
          - title: "GF 與 DM 分開記錄"
            desc: "GF 與 DM 的分數可分開管理。Tier表因資料不足，目前無法自動產生。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "儲存個人最佳的判定明細"
            desc: "每次差分同步時，自動儲存個人最佳的判定明細。譜面確認為外部網站的連結。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "篩選可提升的歌曲"
        items:
          - title: "新增 2 種篩選"
            list:
              - "提升空間：只要提升分數就能進入 Skill（FlareSkill・VOLFORCE 等）名額的歌曲"
              - "排除搶先遊玩（僅 DDR）：排除搶先遊玩對象曲中尚未一般解禁的歌曲"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "歌曲詳細"
        items:
          - title: "與同等級區間的差距"
            desc: "顯示同等級區間的中位數與前 10% 分數，以及與自己的差距。資料量少，目前僅 SDVX 可用。"
            media: {type: image, src: detail-2.jpg}
          - title: "分數紀錄的數值"
            desc: "分數紀錄會顯示每次的分數數值。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同步"
        items:
          - title: "可選擇「昨天的成果」"
            desc: "遊玩當天發現忘了上次同步時，遊玩前以「昨天的成果」同步、遊玩後以「今天的成果」同步，就能只整理當天的成果。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表與分享圖片"
        items:
          - title: "Tier表"
            list:
              - "改善建立時等級・指標・分類的選擇方式"
              - "顯示自己的分數與評級"
              - "縮減圖片容量，修正歌曲數多（SDVX 等）的圖片輸出時 App 當機的問題"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "統一分享圖片外觀"
            desc: "統一了各功能各不相同的分享圖片外觀，從右上角圖示輸出。同時精簡畫面上方配置，讓主要內容更寬。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "小工具與配置變更"
        items:
          - title: "目標小工具與排序"
            list:
              - "目標小工具的圖表文字不再重疊"
              - "改善小工具配置變更、歌曲列表顯示預設排序等變更配置的操作"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
