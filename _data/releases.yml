# リリースノートの正本。X の告知（8/21 アップデート予告①〜⑦・公開時の投稿）の事実を、機能ごとに整理し直して書く。
# 1項目 = 右の枠に出す画面1つ。画像・動画は site.release_media_base/<id>/ に置く。
- id: "2026-09-04"
  kind: release
  version: "1.2.20260904"
  date: "2026-09-01"
  ja:
    title: "pop'n music に対応し、DDRの譜面確認を強化しました"
    sections:
      - heading: "pop'n music に対応"
        items:
          - title: "他の機種と同じ機能"
            desc: "楽曲一覧、Tier表、目標管理、フレンド機能など、他の機種と同じ機能が使えます。楽曲ジャケットにはバナーを使っています（一部の曲はバナーがありません）。"
            media: {type: video, src: popn.mp4, poster: popn.jpg}
          - title: "楽曲名のメイン表記を選べる"
            desc: "メイン表記を「楽曲名」と「ジャンル名」から選べます。画面右上の設定から変更できます。"
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
      - heading: "DDRの譜面確認"
        items:
          - title: "譜面全体の確認とメモ"
            list:
              - "譜面全体を確認し、目的の位置にすぐ移動できます"
              - "メモや踏み足を記録できます"
              - "メモや踏み足を入れた範囲を、画像で出力できます"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "高速化とデザイン"
        items:
          - title: "速く、見やすく"
            list:
              - "起動・タブ切替えが速くなりました"
              - "公式素材の活用、全体のレイアウトの調整、ムダな余白の削減などを行いました"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "目標管理"
        items:
          - title: "アプリを入れる前の記録を埋める"
            list:
              - "目標管理ダッシュボードで、アプリを入れる前の記録を手で埋められます"
              - "手入力に加えて、CSVでの書き出しと取り込みができます"
              - "対象は skill系・消費カロリー・プレー数です"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "検索・楽曲一覧・Tier表"
        items:
          - title: "検索とフィルタ"
            list:
              - "検索機能を強化し、今までより検索幅が広がりました。間違った名前で検索してもヒットします"
              - "楽曲一覧のフィルタに小数を足しました（SDVXは0.1刻み・GITADORAは0.5刻み）"
              - "Tier表の段の中を、Tier順とレベル順で並べ替えられます"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "成果画像と同期"
        items:
          - title: "画像の出力と差分同期"
            list:
              - "成果画像の出力時に、skill対象曲だけを表示できます"
              - "その他の画像も、文字・ジャケットのサイズを変えられます（アプリの設定は変わりません）"
              - "楽曲の差分同期のフォールバック先を、レベルで指定できます"
            media: {type: video, src: export.mp4, poster: export.jpg}
      - heading: "フレンド"
        items:
          - title: "投げた課題の履歴"
            desc: "フレンドに投げた課題の履歴を見られます。投げた課題がその後どうなったかは追跡しません（目標を達成できずに削除されることもあるため）。"
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "統計と不具合の修正"
        items:
          - title: "統計の改善"
            desc: "利用者が増えて統計情報が出るようになり、課題が見えてきました。目下改善中で、改善に伴ってランク帯区分・偏差値・個人差が変わっています。"
          - title: "不具合の修正"
            list:
              - "GITADORA など、一部の楽曲の同期に失敗する"
              - "GITADORA で skill ソートをすると、異なる難易度の曲も固まって並んでしまう"
              - "フレンドの表示名を変えても、プレイヤーネームで表示されてしまう"
  en:
    title: "pop'n music support, and a stronger DDR chart viewer"
    sections:
      - heading: "pop'n music support"
        items:
          - title: "Same features as other games"
            desc: "The song list, Tier List, goals, friends and other features work the same as for other games. Song jackets use banners (some songs have no banner)."
            media: {type: video, src: popn.mp4, poster: popn.jpg}
          - title: "Choose the main song label"
            desc: "Choose whether songs are shown mainly by song title or by genre name. Change it from the settings at the top right of the screen."
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
      - heading: "DDR chart viewer"
        items:
          - title: "Whole-chart view and memos"
            list:
              - "See the whole chart and jump straight to the part you want"
              - "Record memos and footing"
              - "Export a selected range with your memos and footing as an image"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "Speed and design"
        items:
          - title: "Faster and easier to read"
            list:
              - "Faster startup and tab switching"
              - "Uses official art, with an adjusted overall layout and less wasted space"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "Goals"
        items:
          - title: "Fill in records from before install"
            list:
              - "On the goals dashboard, you can fill in records from before you installed the app"
              - "Besides typing them in, you can export and import CSV"
              - "Covers skill metrics, calories burned and play count"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "Search, Song list and Tier List"
        items:
          - title: "Search and filters"
            list:
              - "Search now finds more. It also hits when you search with a wrong name"
              - "Song list filters now take decimals (0.1 steps for SDVX, 0.5 steps for GITADORA)"
              - "Within each Tier List row, sort by tier or by level"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "Result images and sync"
        items:
          - title: "Image export and differential sync"
            list:
              - "When exporting a result image, you can show only songs that count toward skill"
              - "Other images can also change text and jacket size (your app settings stay the same)"
              - "Choose by level what a differential sync falls back to"
            media: {type: video, src: export.mp4, poster: export.jpg}
      - heading: "Friends"
        items:
          - title: "History of challenges you sent"
            desc: "See the history of challenges you sent to friends. What happened to them afterwards isn't tracked, since some are deleted when a goal isn't reached."
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "Statistics and bug fixes"
        items:
          - title: "Improving statistics"
            desc: "With more users, statistics now appear, and problems have become visible. We are improving them, and rank ranges, T-scores and individual difficulty have changed as a result."
          - title: "Bug fixes"
            list:
              - "Sync failed for some songs, including GITADORA"
              - "Sorting by skill in GITADORA grouped songs of other difficulties together"
              - "Friends were shown by player name even after changing their display name"
  ko:
    title: "pop'n music 지원과 DDR 채보 확인 강화"
    sections:
      - heading: "pop'n music 지원"
        items:
          - title: "다른 기종과 같은 기능"
            desc: "곡 목록, 티어표, 목표 관리, 친구 기능 등 다른 기종과 같은 기능을 쓸 수 있습니다. 곡 재킷에는 배너를 사용합니다(일부 곡은 배너가 없습니다)."
            media: {type: video, src: popn.mp4, poster: popn.jpg}
          - title: "곡명 메인 표기 선택"
            desc: "메인 표기를 '곡명'과 '장르명' 중에서 고를 수 있습니다. 화면 오른쪽 위 설정에서 바꿀 수 있습니다."
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
      - heading: "DDR 채보 확인"
        items:
          - title: "채보 전체 확인과 메모"
            list:
              - "채보 전체를 확인하고 원하는 위치로 바로 이동할 수 있습니다"
              - "메모와 발 배치를 기록할 수 있습니다"
              - "메모와 발 배치를 넣은 범위를 이미지로 내보낼 수 있습니다"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "속도와 디자인"
        items:
          - title: "더 빠르고 보기 쉽게"
            list:
              - "시작과 탭 전환이 빨라졌습니다"
              - "공식 소재를 활용하고, 전체 레이아웃 조정과 불필요한 여백 줄이기 등을 했습니다"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "목표 관리"
        items:
          - title: "앱 설치 전 기록 채우기"
            list:
              - "목표 관리 대시보드에서 앱을 설치하기 전의 기록을 직접 채울 수 있습니다"
              - "직접 입력 외에 CSV 내보내기와 가져오기도 됩니다"
              - "대상은 skill 계열·소비 칼로리·플레이 수입니다"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "검색·곡 목록·티어표"
        items:
          - title: "검색과 필터"
            list:
              - "검색 기능을 강화해 이전보다 넓게 찾을 수 있습니다. 틀린 이름으로 검색해도 찾아집니다"
              - "곡 목록 필터에 소수를 추가했습니다(SDVX는 0.1 단위·GITADORA는 0.5 단위)"
              - "티어표의 각 단 안을 티어순과 레벨순으로 정렬할 수 있습니다"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "성과 이미지와 동기화"
        items:
          - title: "이미지 내보내기와 차분 동기화"
            list:
              - "성과 이미지를 내보낼 때 skill 대상곡만 표시할 수 있습니다"
              - "다른 이미지도 글자·재킷 크기를 바꿀 수 있습니다(앱 설정은 바뀌지 않습니다)"
              - "곡 차분 동기화의 대체 수집 범위를 레벨로 지정할 수 있습니다"
            media: {type: video, src: export.mp4, poster: export.jpg}
      - heading: "친구"
        items:
          - title: "보낸 과제의 이력"
            desc: "친구에게 보낸 과제의 이력을 볼 수 있습니다. 보낸 과제가 그 후 어떻게 되었는지는 추적하지 않습니다(목표를 달성하지 못해 삭제되는 경우도 있기 때문입니다)."
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "통계와 버그 수정"
        items:
          - title: "통계 개선"
            desc: "이용자가 늘어 통계 정보가 나오게 되면서 과제가 보이기 시작했습니다. 현재 개선 중이며, 개선에 따라 랭크대 구분·T점수·개인차가 바뀌었습니다."
          - title: "버그 수정"
            list:
              - "GITADORA 등 일부 곡의 동기화에 실패하는 문제"
              - "GITADORA에서 skill 정렬 시 다른 난이도의 곡까지 묶여서 정렬되는 문제"
              - "친구 표시 이름을 바꿔도 플레이어 이름으로 표시되는 문제"
  zh:
    title: "支援 pop'n music，並強化 DDR 譜面確認"
    sections:
      - heading: "支援 pop'n music"
        items:
          - title: "與其他機種相同的功能"
            desc: "樂曲一覽、Tier表、目標管理、好友功能等，都能與其他機種一樣使用。樂曲封面使用橫幅圖（部分樂曲沒有橫幅圖）。"
            media: {type: video, src: popn.mp4, poster: popn.jpg}
          - title: "可選擇樂曲名稱的主要標示"
            desc: "主要標示可在「樂曲名」與「類型名」之間選擇。可從畫面右上角的設定變更。"
            media: {type: video, src: popn-name.mp4, poster: popn-name.jpg}
      - heading: "DDR 譜面確認"
        items:
          - title: "確認整份譜面與備忘"
            list:
              - "可確認整份譜面，並立即移動到想看的位置"
              - "可記錄備忘與踏法"
              - "可將加入備忘與踏法的指定範圍輸出為圖片"
            media: {type: video, src: chart.mp4, poster: chart.jpg}
      - heading: "速度與設計"
        items:
          - title: "更快、更好讀"
            list:
              - "啟動與切換分頁變快了"
              - "活用官方素材，並調整整體版面、減少多餘的留白"
            media: {type: video, src: speed.mp4, poster: speed.jpg}
      - heading: "目標管理"
        items:
          - title: "補上安裝前的記錄"
            list:
              - "可在目標管理儀表板手動補上安裝 App 之前的記錄"
              - "除了手動輸入，也可匯出與匯入 CSV"
              - "對象為 skill 類、消耗熱量與遊玩次數"
            media: {type: video, src: before-install.mp4, poster: before-install.jpg}
      - heading: "搜尋・樂曲一覽・Tier表"
        items:
          - title: "搜尋與篩選"
            list:
              - "強化搜尋功能，搜尋範圍比以前更廣。用錯誤的名稱搜尋也能找到"
              - "樂曲一覽的篩選加入小數（SDVX 以 0.1 為單位、GITADORA 以 0.5 為單位）"
              - "Tier表各段內可依 Tier 順序或等級順序排列"
            media: {type: video, src: search.mp4, poster: search.jpg}
      - heading: "成果圖片與同步"
        items:
          - title: "圖片輸出與差分同步"
            list:
              - "輸出成果圖片時，可只顯示 skill 對象曲"
              - "其他圖片也能改變文字與封面的大小（App 的設定不會改變）"
              - "可用等級指定樂曲差分同步的備援範圍"
            media: {type: video, src: export.mp4, poster: export.jpg}
      - heading: "好友"
        items:
          - title: "送出課題的履歷"
            desc: "可查看送給好友的課題履歷。送出的課題之後如何不會追蹤（因為也有未達成目標而刪除的情況）。"
            media: {type: video, src: friend.mp4, poster: friend.jpg}
      - heading: "統計與錯誤修正"
        items:
          - title: "改善統計"
            desc: "隨著使用者增加，開始出現統計資訊，也看到了問題。目前正在改善，隨之改變了等級帶區分、T分數與個人差。"
          - title: "錯誤修正"
            list:
              - "GITADORA 等部分樂曲同步失敗"
              - "GITADORA 依 skill 排序時，不同難度的樂曲也會被聚在一起排序"
              - "變更好友顯示名稱後，仍以玩家名稱顯示"
- id: "2026-08-21"
  kind: release
  version: "1.2.20260821"
  date: "2026-08-20"
  ja:
    title: "GITADORA に対応し、伸ばせる曲を絞り込むフィルタを追加しました"
    sections:
      - heading: "GITADORA に対応"
        items:
          - title: "GF と DM を分けて記録"
            desc: "GF と DM のスコアを別々に管理できます。Tier表は、データが足りないため自動では作れません。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "自己ベストの判定内訳を保存"
            desc: "差分同期のたびに、自己ベストの判定内訳を自動で保存します。譜面の確認は外部サイトへのリンクです。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "伸ばせる曲を絞り込む"
        items:
          - title: "2つのフィルタを追加"
            list:
              - "伸びしろ：スコアを伸ばせば Skill（FlareSkill・VOLFORCE など）の対象に入る曲"
              - "GP先行の除外（DDR のみ）：GP先行配信の対象曲のうち、通常解禁されていない曲を外す"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "楽曲詳細"
        items:
          - title: "同じランク帯との差"
            desc: "同じランク帯の中央値と上位10%のスコア、自分との差を表示します。データが少ないため、今は SDVX だけで使えます。"
            media: {type: image, src: detail-2.jpg}
          - title: "スコア履歴の数値"
            desc: "スコア履歴に、各回のスコアの数値を表示します。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同期"
        items:
          - title: "「昨日の成果」を選べる"
            desc: "プレイ当日に前回の同期忘れに気づいたら、プレイ前に「昨日の成果」で同期し、プレイ後に「今日の成果」で同期すると、その日の成果だけをまとめられます。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表と共有画像"
        items:
          - title: "Tier表"
            list:
              - "作成時のレベル・指標・区分の選び方を改善"
              - "自分のスコアとグレードを表示"
              - "曲数が多い（SDVX など）画像の出力でアプリが落ちる不具合を修正。画像の容量を減らしました"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "共有画像の見た目を統一"
            desc: "機能ごとに違っていた共有画像の見た目を揃えました。出力は右上のアイコンから。あわせて画面上部の配置を詰め、メインの表示を広くしました。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "ウィジェットと配置変更"
        items:
          - title: "目標ウィジェットと並べ替え"
            list:
              - "目標ウィジェットのグラフで、文字が重ならないようにしました"
              - "ウィジェットの配置変更や、楽曲一覧の表示プリセットの並べ替えなど、配置を変える操作を改善しました"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  en:
    title: "GITADORA support, and filters to find songs you can raise"
    sections:
      - heading: "GITADORA support"
        items:
          - title: "Separate records for GF and DM"
            desc: "GF and DM scores are managed separately. Tier Lists can't be generated automatically yet, because there isn't enough data."
            media: {type: image, src: gitadora-1.jpg}
          - title: "Judgement breakdown of personal bests"
            desc: "Each differential sync automatically saves the judgement breakdown of your personal bests. Chart previews link to an external site."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "Find songs you can raise"
        items:
          - title: "Two new filters"
            list:
              - "Room to grow: songs that would enter your Skill slots (FlareSkill, VOLFORCE, etc.) if you raise their score"
              - "Exclude early access (DDR only): removes songs in GP early access that haven't been unlocked normally"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "Song details"
        items:
          - title: "Compared with your rank range"
            desc: "Shows the median and top 10% scores in the same rank range, and your difference from them. Works only for SDVX for now, because there isn't enough data."
            media: {type: image, src: detail-2.jpg}
          - title: "Numbers in your score history"
            desc: "Your score history now shows the score of each entry."
            media: {type: image, src: detail-1.jpg}
      - heading: "Sync"
        items:
          - title: "Choose \"Yesterday's results\""
            desc: "If you notice on the day of play that you forgot to sync last time, sync with \"Yesterday's results\" before playing, then with \"Today's results\" after playing, to get only that day's results."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier List and share images"
        items:
          - title: "Tier List"
            list:
              - "Easier selection of level, metric and category when creating one"
              - "Shows your own score and grade"
              - "Fixed a crash when exporting images with many songs (such as SDVX) by reducing the image size"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "One look for share images"
            desc: "Share images, which looked different for each feature, now share one look. Export from the icon at the top right. The top of the screen is also more compact, giving the main content more room."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "Widgets and rearranging"
        items:
          - title: "Goal widget and reordering"
            list:
              - "Text no longer overlaps in the goal widget's graph"
              - "Improved rearranging, such as moving widgets and reordering song list presets"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  ko:
    title: "GITADORA 지원과, 올릴 수 있는 곡을 좁히는 필터 추가"
    sections:
      - heading: "GITADORA 지원"
        items:
          - title: "GF와 DM을 나누어 기록"
            desc: "GF와 DM의 스코어를 따로 관리할 수 있습니다. 티어표는 데이터가 부족해 아직 자동으로 만들 수 없습니다."
            media: {type: image, src: gitadora-1.jpg}
          - title: "자기 최고 기록의 판정 내역 저장"
            desc: "차분 동기화할 때마다 자기 최고 기록의 판정 내역을 자동으로 저장합니다. 보면 확인은 외부 사이트 링크입니다."
            media: {type: image, src: gitadora-2.jpg}
      - heading: "올릴 수 있는 곡 좁히기"
        items:
          - title: "필터 2가지 추가"
            list:
              - "성장 여지: 스코어를 올리면 Skill(FlareSkill·VOLFORCE 등) 대상에 들어가는 곡"
              - "선행 플레이 제외(DDR 한정): 선행 플레이 대상곡 중 일반 해금되지 않은 곡을 제외"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "곡 상세"
        items:
          - title: "같은 랭크대와의 차이"
            desc: "같은 랭크대의 중앙값과 상위 10% 스코어, 자신과의 차이를 표시합니다. 데이터가 적어 지금은 SDVX에서만 쓸 수 있습니다."
            media: {type: image, src: detail-2.jpg}
          - title: "스코어 이력의 수치"
            desc: "스코어 이력에 각 회차의 스코어 수치를 표시합니다."
            media: {type: image, src: detail-1.jpg}
      - heading: "동기화"
        items:
          - title: "'어제의 성과' 선택"
            desc: "플레이 당일에 지난번 동기화를 잊은 것을 알아차리면, 플레이 전에 '어제의 성과'로, 플레이 후에 '오늘의 성과'로 동기화해 그날의 성과만 정리할 수 있습니다."
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "티어표와 공유 이미지"
        items:
          - title: "티어표"
            list:
              - "작성 시 레벨·지표·구분 선택 방식 개선"
              - "자신의 스코어와 그레이드 표시"
              - "곡 수가 많은(SDVX 등) 이미지를 내보낼 때 앱이 종료되던 문제를 이미지 용량을 줄여 수정"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "공유 이미지 모양 통일"
            desc: "기능마다 달랐던 공유 이미지의 모양을 통일했습니다. 오른쪽 위 아이콘에서 내보냅니다. 화면 상단 배치도 줄여 메인 표시를 넓혔습니다."
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "위젯과 배치 변경"
        items:
          - title: "목표 위젯과 순서 변경"
            list:
              - "목표 위젯 그래프에서 글자가 겹치지 않게 했습니다"
              - "위젯 배치 변경, 곡 목록 표시 프리셋 순서 변경 등 배치를 바꾸는 조작을 개선했습니다"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
  zh:
    title: "支援 GITADORA，並新增篩選可提升歌曲的功能"
    sections:
      - heading: "支援 GITADORA"
        items:
          - title: "GF 與 DM 分開記錄"
            desc: "GF 與 DM 的分數可分開管理。Tier表因資料不足，目前無法自動產生。"
            media: {type: image, src: gitadora-1.jpg}
          - title: "儲存個人最佳的判定明細"
            desc: "每次差分同步時，自動儲存個人最佳的判定明細。譜面確認為外部網站的連結。"
            media: {type: image, src: gitadora-2.jpg}
      - heading: "篩選可提升的歌曲"
        items:
          - title: "新增 2 種篩選"
            list:
              - "提升空間：只要提升分數就能進入 Skill（FlareSkill・VOLFORCE 等）名額的歌曲"
              - "排除搶先遊玩（僅 DDR）：排除搶先遊玩對象曲中尚未一般解禁的歌曲"
            media: {type: video, src: filter.mp4, poster: filter.jpg}
      - heading: "歌曲詳細"
        items:
          - title: "與同等級區間的差距"
            desc: "顯示同等級區間的中位數與前 10% 分數，以及與自己的差距。資料量少，目前僅 SDVX 可用。"
            media: {type: image, src: detail-2.jpg}
          - title: "分數紀錄的數值"
            desc: "分數紀錄會顯示每次的分數數值。"
            media: {type: image, src: detail-1.jpg}
      - heading: "同步"
        items:
          - title: "可選擇「昨天的成果」"
            desc: "遊玩當天發現忘了上次同步時，遊玩前以「昨天的成果」同步、遊玩後以「今天的成果」同步，就能只整理當天的成果。"
            media: {type: image, src: sync-yesterday.jpg}
      - heading: "Tier表與分享圖片"
        items:
          - title: "Tier表"
            list:
              - "改善建立時等級・指標・分類的選擇方式"
              - "顯示自己的分數與評級"
              - "縮減圖片容量，修正歌曲數多（SDVX 等）的圖片輸出時 App 當機的問題"
            media: {type: video, src: tier.mp4, poster: tier.jpg}
          - title: "統一分享圖片外觀"
            desc: "統一了各功能各不相同的分享圖片外觀，從右上角圖示輸出。同時精簡畫面上方配置，讓主要內容更寬。"
            media: {type: video, src: share-image.mp4, poster: share-image.jpg}
      - heading: "小工具與配置變更"
        items:
          - title: "目標小工具與排序"
            list:
              - "目標小工具的圖表文字不再重疊"
              - "改善小工具配置變更、歌曲列表顯示預設排序等變更配置的操作"
            media: {type: video, src: ui.mp4, poster: ui.jpg}
