    sections:
      - heading: "KONAMI ID"
        items:
          - title: "別のKONAMI IDで同期できる"
            desc: "異なるKONAMI IDで同期できない問題を解消しました。ただし、このアプリは今のところ「1端末1ID」で動いています。複数の端末で同じIDの情報を見ることや、1つの端末で複数のアカウントの情報を見ることはできません。これは今後解決します。"
      - heading: "SDVX"
        items:
          - title: "おすすめとEXスコアの並べ替え"
