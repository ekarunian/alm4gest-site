          - title: "推估方法與注意事項"
            games: [SDVX]
            list:
              - "推估方法如圖片所示"
              - "雷達值僅供參考，請用於相對的弱點分析（玩家雷達也一樣）"
              - "雷達以手動更新，會在樂曲資料之後陸續加入"
            media: {type: image, src: radar-method.jpg}
      - heading: "Tier表"
        items:
          - title: "小數等級與排序"
            list:
