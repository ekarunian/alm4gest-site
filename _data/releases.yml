            media: {type: video, src: sa-song.mp4, poster: sa-song.jpg}
          - title: "Tierの色を変えられる"
            desc: "カスタムTier表で、Tierの色を変えられます。"
            media: {type: video, src: tier-color.mp4, poster: tier-color.jpg}
      - heading: "軽微な改善と不具合の修正"
        items:
          - title: "軽微な改善と不具合の修正"
            list:
