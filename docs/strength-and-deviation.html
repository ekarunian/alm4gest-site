{% endraw %}</style><style>{% include palmdoc-site.css %}</style><div class="doc-body pd" data-theme="moss" data-mode="dark" data-density="文書"><div class="doc is-no-sidebar"><div class="doc-main">{% raw %}<header class="doc-hero"><p class="doc-kicker">2026-10-18</p><h1 class="doc-hero__title">得意度と<wbr>譜面ごとの<wbr>偏差値の計算</h1><div class="doc-hero__lead"><p>従来の偏差値は、点数が正規分布に従うと仮定して計算していましたが、実際の点数の分布には合っていませんでした。そのため、上位の人ほど実際の順位より低い偏差値が表示されていました。<br>
また、得意・苦手も偏差値だけで判定していたため、自分の中での得意・苦手を正しく表せていなかったこともあり、以下の2点を変更しています。</p><p>1つ目は偏差値の計算方法です。同じ実力帯の人が全員その譜面を遊んだと仮定した点数の分布を推定し、その中で自分が上から何%にいるかを偏差値に換算します。<br>
2つ目は得意・苦手の判定方法です。同じレベルの他の譜面での自分の成績から、その譜面での自分の予想点を見込み、実際の点数が予想点より上か下かで判定します。得意度は予想点ちょうどを50とし、同じ実力の人の点数のばらつき1つ分だけ予想点を上回ると70、下回ると30になります。70以上を得意、30以下を苦手とします。</p><div class="fig-side"><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-1.webp" alt="" tabindex="0" role="button"></div><figcaption><span>架空の例。実力帯の中では下の方にいる人の、同じレベルの4譜面。予想点は、同じレベルの他の譜面での自分の成績から見込んだ点数。</span></figcaption></figure><div class="fig-side__cap"><p class="fig-side__text">偏差値だけで見ると、どの譜面も苦手に見える。得意度は、自分の予想点と比べて得意・苦手を決める。</p><ul class="fig-side__points"><li><b>①</b><span>偏差値は低いが、予想点どおりなので、得意でも苦手でもない（得意度50）。</span></li><li><b>②</b><span>偏差値が高く、予想点も大きく上回るので、かなり得意（70以上）。</span></li><li><b>③</b><span>偏差値が低く、予想点も下回るので、苦手（30以下）。</span></li><li><b>④</b><span>偏差値は50だが、予想点を上回るので、得意（70以上）。</span></li></ul></div></div></div></header>
<section class="doc-sec" id="s01" aria-labelledby="s01-title"><p class="doc-kicker"><span class="doc-kicker__num">01</span></p><h2 class="doc-sec__title" id="s01-title">概要</h2><div class="doc-sec__body"><h3 id="変更1-偏差値の計算方法">変更1: 偏差値の計算方法</h3><figure class="mth-cs"><figcaption class="mth-cs__cap"></figcaption><div class="mth-cs__head" aria-hidden="true"><span></span><span class="mth-cs__hfrom">従来</span><span></span><span class="mth-cs__hto">今後</span></div><ol class="mth-cs__list"><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">1</span><span>偏差値の比較対象</span></div><div class="mth-cs__box is-from" aria-label="従来：同じ実力帯でその譜面を遊んだ人の平均点とばらつき"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">同じ実力帯でその譜面を遊んだ人の平均点とばらつき</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：同じ実力帯の人が全員その譜面を遊んだと仮定したときの点数の分布"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">同じ実力帯の人が全員その譜面を遊んだと仮定したときの点数の分布</span></div></li><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">2</span><span>偏差値の計算式</span></div><div class="mth-cs__box is-from" aria-label="従来：50 ＋ 10 ×（点数 − 平均）÷ ばらつき"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">50 ＋ 10 ×（点数 − 平均）÷ ばらつき</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：50 ＋ 10 × Φ⁻¹(p)（第2章で解説）"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">50 ＋ 10 × Φ⁻¹(p)（第2章で解説）</span></div></li><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">3</span><span>満点の取り扱い</span></div><div class="mth-cs__box is-from" aria-label="従来：他の点数と同じく偏差値を表示"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">他の点数と同じく偏差値を表示</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：偏差値は表示せず、満点の人の割合を表示（遊んだ人の15%が満点なら「満点・上位15%」）"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">偏差値は表示せず、満点の人の割合を表示（遊んだ人の15%が満点なら「満点・上位15%」）</span></div></li><li class="mth-cs__row is-result"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">4</span><span>上位10%の人の偏差値</span></div><div class="mth-cs__box is-from" aria-label="従来：55.4"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">55.4</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：59.9"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">59.9</span></div></li><li class="mth-cs__row is-result"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">5</span><span>偏差値が示す順位と実際の順位の差（平均）</span></div><div class="mth-cs__box is-from" aria-label="従来：14.3ポイント"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">14.3ポイント</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：5.8ポイント"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">5.8ポイント</span></div></li></ol></figure><h3 id="変更2-得意度の追加">変更2: 得意度の追加</h3><figure class="mth-cs"><figcaption class="mth-cs__cap"></figcaption><div class="mth-cs__head" aria-hidden="true"><span></span><span class="mth-cs__hfrom">従来</span><span></span><span class="mth-cs__hto">今後</span></div><ol class="mth-cs__list"><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">1</span><span>得意・苦手</span></div><div class="mth-cs__box is-from" aria-label="従来：得意: 同じ実力帯で上位10%以内の譜面。苦手: 判定なし（偏差値45以下を「伸びしろ」と表示）"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">得意: 同じ実力帯で上位10%以内の譜面。苦手: 判定なし（偏差値45以下を「伸びしろ」と表示）</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：得意: 得意度 70 以上。苦手: 得意度 30 以下（第3章で解説）"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">得意: 得意度 70 以上。苦手: 得意度 30 以下（第3章で解説）</span></div></li><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">2</span><span>使用する記録</span></div><div class="mth-cs__box is-from" aria-label="従来：全記録"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">全記録</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：やり込んでいるレベルのクリアした記録"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">やり込んでいるレベルのクリアした記録</span></div></li><li class="mth-cs__row"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">3</span><span>練習譜面の選び方</span></div><div class="mth-cs__box is-from" aria-label="従来：全レベルから偏差値45以下の譜面を、偏差値の低い順に表示"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">全レベルから偏差値45以下の譜面を、偏差値の低い順に表示</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：やり込んでいるレベルの上端から3レベル下までの苦手な譜面を表示。得意度が低いほど、またレベルが高いほど優先"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">やり込んでいるレベルの上端から3レベル下までの苦手な譜面を表示。得意度が低いほど、またレベルが高いほど優先</span></div></li><li class="mth-cs__row is-result"><div class="mth-cs__label"><span class="mth-cs__no" aria-hidden="true">4</span><span>得意が1つも付かない人の割合（実力帯の下位25%）</span></div><div class="mth-cs__box is-from" aria-label="従来：53%"><span class="mth-cs__mlabel" aria-hidden="true">従来</span><span class="mth-cs__val">53%</span></div><span class="mth-cs__arrow" aria-hidden="true"><i></i></span><div class="mth-cs__box is-to" aria-label="今後：0%"><span class="mth-cs__mlabel" aria-hidden="true">今後</span><span class="mth-cs__val">0%</span></div></li></ol></figure></div></section>
<section class="doc-sec" id="s02" aria-labelledby="s02-title"><p class="doc-kicker"><span class="doc-kicker__num">02</span></p><h2 class="doc-sec__title" id="s02-title">偏差値の<wbr>見直し</h2><div class="doc-sec__body"><p>偏差値は、集団の中での位置を、平均を50、標準偏差1つ分を10として表す数字です。偏差値60なら上位16%、70なら上位2%にあたります。この対応は、点数が正規分布（左右対称の釣り鐘形）に従うときにだけ成り立ちます。</p><p>従来は、同じ実力帯でその譜面を遊んだ人の平均点とばらつき（標準偏差 σ）から、50 ＋ 10 ×（点数 − 平均）÷ σ で偏差値を計算していました。この計算には4つの課題がありました。</p><div class="dtable dtable--wrap" role="region" tabindex="0"><table><caption></caption><thead><tr><th scope="col">課題</th><th scope="col">起きていたこと</th><th scope="col">今後の計算での直し方</th></tr></thead><tbody><tr><th scope="row" data-label="課題">1. 点数が正規分布に従わない</th><td data-label="起きていたこと">上位の人ほど、順位に見合う偏差値より低く出る</td><td data-label="今後の計算での直し方">点数の分布を推定し、上から何%かを偏差値に換算する</td></tr><tr><th scope="row" data-label="課題">2. 満点同士では順位が付かない</th><td data-label="起きていたこと">1位なのに平均並みの偏差値が出る</td><td data-label="今後の計算での直し方">満点には偏差値を出さず、満点の人の割合を出す</td></tr><tr><th scope="row" data-label="課題">3. 遊んだ人が少ない</th><td data-label="起きていたこと">遊んだ人によって偏差値が大きく変わる</td><td data-label="今後の計算での直し方">全員の全記録から推定し、遊んだ人が30人以上の譜面にだけ偏差値を出す</td></tr><tr><th scope="row" data-label="課題">4. 遊ぶ人が偏る</th><td data-label="起きていたこと">その譜面を選んだ人だけと比べてしまう</td><td data-label="今後の計算での直し方">実力帯の全員が遊んだと仮定して比べる</td></tr></tbody></table></div><h3 id="課題1-点数は満点の近くに詰まる">課題1: 点数は満点の近くに詰まる</h3><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-2.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図1</b><span>DDR SP で最も人数の多い実力帯（85人）が遊んだ Lv17 の譜面。左は点数の分布、右は各点数より下にいる人の割合。</span></figcaption></figure><ul>
<li>点数には満点という上限があるため、多くの人の点数が満点近くに集まる一方、一部の人の点数は低い側に広く分布します。そのため、左右対称の釣り鐘形になりません。</li>
<li>一部の低い点数に引っ張られて平均が下がり、ばらつきが大きくなります。この譜面では平均 ＋ σ が102.1万点で、満点を超えます。</li>
<li>その結果、上位10%の人の点数が、従来の計算では「上位29%」の偏差値になります。</li>
<li>DDR SP で50人以上が遊んだ2,890組（譜面と実力帯の組み合わせ）で見ると、上位10%に対応する偏差値は62.8以上ですが、従来の計算での中央値は55.9でした。</li>
<li>1人でも極端に低い点数があると、その人の偏差値は異常に低い値になります。一部では−200を下回るような例もありました。</li>
</ul><h3 id="課題2-満点同士では順位が付かない">課題2: 満点同士では順位が付かない</h3><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-3.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図2</b><span>SDVX の Lv17 で、満点の人が3〜5割の譜面のうち、遊んだ人が最も多い譜面（704人）。右は50人以上が遊んだ全10,878組。</span></figcaption></figure><ul>
<li>この譜面では45%の人が満点で、その人たちは全員同率1位です。点数では差が付かないので、偏差値を1つに決められません。</li>
<li>従来は満点に偏差値53.6（上位36%相当）が出ていました。同率1位なのに、平均並みの値でした。</li>
<li>実際の順位とのずれは満点の人の割合で変わり、満点の人が5〜10%の譜面では上位25%相当、95%を超える譜面では上位42%相当と出ていました。</li>
</ul><h3 id="課題3-遊んだ人が少ないと値が安定しない">課題3: 遊んだ人が少ないと値が安定しない</h3><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-4.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図3</b><span>図1の譜面を遊んだ85人から5〜50人を無作為に選び、98.7万点の偏差値を4,000回ずつ計算した。</span></figcaption></figure><ul>
<li>同じ実力帯でその譜面を遊んだ人数の中央値は、13〜23人です。</li>
<li>同じ98.7万点でも、計算に使う人数が5人だと偏差値が53〜64、50人だと54〜57の間で変わります（中央の90%の範囲）。</li>
</ul><h3 id="課題4-遊ぶ人の偏りで比較対象が変わる">課題4: 遊ぶ人の偏りで比較対象が変わる</h3><ul>
<li>遊ぶ譜面は人によって違うため、その譜面を遊んだ人だけでは、実力帯全体の傾向が分からないことがあります。</li>
<li>DDR SP では、遊んだ人と実力帯全員の実力の平均の差は、9割の譜面で実力帯内の実力のばらつきの半分以下でした。課題1〜3より影響は小さいです。</li>
</ul><h3 id="今後の計算-上から何かを先に推定し偏差値に換算する">今後の計算: 上から何%かを先に推定し、偏差値に換算する</h3><p>点数から直接偏差値を出すのをやめ、その点数が実力帯の中で上から何%にあたるかを先に推定します。手順は次の3段階です。</p><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-5.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図4</b><span>今後の計算の3段階（図1と同じ譜面・実力帯）。</span></figcaption></figure><ol>
<li>全員の全記録から、各プレイヤーの実力と各譜面の難しさを同時に推定し、同じ実力の人がその譜面でどの点数をどれくらいの確率で取るかを求めます。その譜面を遊んだ人が少なくても、他の譜面の記録から推定できます（課題3）。</li>
<li>同じ実力帯の全員がその譜面を遊んだと仮定して、点数の分布を作ります。満点の近くに詰まる形もそのまま再現できます（課題1・4）。</li>
<li>自分の点数より下にいる人の割合 p を、偏差値 ＝ 50 ＋ 10 × Φ⁻¹(p) で偏差値に換算します。Φ⁻¹ は、下からの割合 p を、正規分布の平均からの距離（標準偏差何個分か）に換算する関数です。p が50%なら偏差値50、84%なら60、98%なら70になります。</li>
</ol><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-6.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図5</b><span>実力帯の全員で見た点数の分布（左）の上位10%と、偏差値（右）での位置の対応。</span></figcaption></figure><ul>
<li>実力帯の全員で上位10%にあたる点数（99.5万点以上）は、偏差値62.8以上になります。従来の計算では、同じ点数が56.0でした。</li>
<li>譜面ごとに点数の分布の形が違っても、偏差値60は常に上位16%を表します。</li>
<li>満点には偏差値を出さず、「満点・上位15%」のように満点の人の割合を出します。遊んだ人の15%が満点で、その全員が同率1位という意味です（課題2）。</li>
<li>偏差値を出すのは、遊んだ人が30人以上の譜面だけです。30人未満の譜面は「13人中1位」のように実際の順位を出します。</li>
</ul><h3 id="結果">結果</h3><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-7.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図6</b><span>全体の8割の人の記録からモデルを推定し、検証用に分けた残り2割の人の偏差値を計算。実力帯の中の位置ごとに中央値を示す。</span></figcaption></figure><ul>
<li>今後の計算では、実力帯の中位の人の偏差値はほぼ50になり、上位10%の人も順位に見合う偏差値に近づきます。</li>
<li>DDR SP で、遊んだ人が50人以上いる譜面について、偏差値が示す順位と実際の順位の差を平均すると、従来は14.3ポイント、今後は5.8ポイントです。第1章の偏差値の数値は、いずれも DDR SP での値です。</li>
</ul></div></section>
<section class="doc-sec" id="s03" aria-labelledby="s03-title"><p class="doc-kicker"><span class="doc-kicker__num">03</span></p><h2 class="doc-sec__title" id="s03-title">得意・苦手と<wbr>練習譜面の<wbr>見直し</h2><div class="doc-sec__body"><h3 id="従来-得意苦手を他の人との比較だけで決めていた">従来: 得意・苦手を他の人との比較だけで決めていた</h3><p>従来は、同じ実力帯で上位10%以内の譜面を「得意」、偏差値45以下の譜面を「伸びしろ」としていました。偏差値は他の人との比較なので、実力帯の中で下位にいる人は、どの譜面でも低い値になります。その結果、どの譜面にも「得意」が付かず、全曲が苦手であるかのように見えていました。</p><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-8.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図7</b><span>得意が1つも付かない人の割合（実力帯の中の位置ごと・記録20件以上の人）。</span></figcaption></figure><ul>
<li>実力帯の下位25%の人では、「伸びしろ」と表示される譜面の割合の中央値が21〜36%で、上位25%の人の約2倍でした。</li>
</ul><h3 id="今後-自分の他の譜面と比べる">今後: 自分の他の譜面と比べる</h3><p>今後は「得意度」で得意・苦手を判定します。その譜面での自分の位置を z、同じレベルの他の譜面での自分の位置の平均を B とし、50 ＋ 20 ×（z − B）で計算します。</p><ul>
<li>位置 z は、同じ実力の人の中で自分の点数がどこにいるかを表します。0が中央で、+1 なら上位16%、−1 なら下位16%です。</li>
<li>自分の平均 B を引くことで、他の人との実力差を取り除き、自分の中での得意・苦手を表します。</li>
<li>得意度 50 は普段の自分と同じ成績を表します。同じ実力の人の標準偏差1つ分だけ普段より高ければ70、低ければ30です。70 以上を得意、30 以下を苦手とし、表示は0〜100に収めます。</li>
<li>その結果、苦手の割合は実力帯の中の位置によらず11〜12%、得意は9〜13%になりました。</li>
</ul><h3 id="練習譜面-やり込んでいない低いレベルとクリアできなかった譜面を除く">練習譜面: やり込んでいない低いレベルと、クリアできなかった譜面を除く</h3><p>従来は全レベルから偏差値45以下の譜面を選んでいたので、やり込んでいない低いレベルの譜面や、クリアできなかった譜面が並びました。実力より低い点数の記録が混ざるためで、原因は2つあります。</p><p>1つ目は、クリアできなかった記録です。ゲージが尽きて途中で終わると点数の加算がそこで止まるので、実力より低い点数になります。</p><figure class="mth-hg"><figcaption class="mth-hg__cap">DDR SP の位置 z の分布（満点を除く。0が中央、−1 なら下位16%）</figcaption><div class="mth-hg__scroll"><div class="mth-hg__body" style="--n:9"><p class="mth-hg__name">FAILED</p><div class="mth-hg__plot" role="img" aria-label="FAILED：〜−2.5 33%、−2.5 13%、−2 13%、−1.5 14%、−1 11%、−0.5 8%、0 5%、0.5 2%、1〜 1%"><div class="mth-hg__col is-hl"><span class="mth-hg__bar" style="height:100.0%"><b class="mth-hg__num">33</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:39.4%"><b class="mth-hg__num">13</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:39.4%"><b class="mth-hg__num">13</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:42.4%"><b class="mth-hg__num">14</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:33.3%"><b class="mth-hg__num">11</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:24.2%"><b class="mth-hg__num">8</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:15.2%"><b class="mth-hg__num">5</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:6.1%"><b class="mth-hg__num">2</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:3.0%"><b class="mth-hg__num">1</b></span></div></div><p class="mth-hg__name">CLEARED</p><div class="mth-hg__plot" role="img" aria-label="CLEARED：〜−2.5 2%、−2.5 3%、−2 7%、−1.5 12%、−1 18%、−0.5 22%、0 20%、0.5 13%、1〜 5%"><div class="mth-hg__col is-hl"><span class="mth-hg__bar" style="height:6.1%"><b class="mth-hg__num">2</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:9.1%"><b class="mth-hg__num">3</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:21.2%"><b class="mth-hg__num">7</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:36.4%"><b class="mth-hg__num">12</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:54.5%"><b class="mth-hg__num">18</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:66.7%"><b class="mth-hg__num">22</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:60.6%"><b class="mth-hg__num">20</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:39.4%"><b class="mth-hg__num">13</b></span></div><div class="mth-hg__col"><span class="mth-hg__bar" style="height:15.2%"><b class="mth-hg__num">5</b></span></div></div><span></span><div class="mth-hg__bins" aria-hidden="true"><span class="is-hl">〜−2.5</span><span>−2.5</span><span>−2</span><span>−1.5</span><span>−1</span><span>−0.5</span><span>0</span><span>0.5</span><span>1〜</span></div></div></div><p class="mth-hg__title">z（区間の下端）</p><p class="mth-hg__note">z の中央値は FAILED −1.88、CLEARED −0.28</p></figure><p>2つ目は、低いレベルの昔の記録です。高いレベルを中心に遊ぶ人は低いレベルをあまり遊び直さないので、過去の低い点数が残りがちです。</p><figure class="capfig"><div class="capfig__media"><img src="/assets/docs/strength-and-deviation/fig-9.webp" alt="" tabindex="0" role="button"></div><figcaption><b>図8</b><span>やり込んでいるレベルの上端からのレベル差ごとの、上位レベルとの位置 z の差（実力帯の下位25%の人）。</span></figcaption></figure><p>そこで、今後は次のようにします。</p><ul>
<li>やり込んでいるレベルの成績を基準にし、それを下回るレベルを人ごとに見つけ、そこから下を「やり込んでいる範囲」の外とします（第4章で例を示します）。どのレベルから下回るかは人によって違うので、全員に同じレベル幅を当てはめません。</li>
<li>範囲外の記録とクリアできなかった記録は、得意度の計算に使用しません。</li>
<li>練習譜面には、範囲の上端から3レベル下（pop’n は8レベル下）までの苦手な譜面を選びます。得意度が低いほど、またレベルが高いほど優先して並べます。</li>
</ul></div></section>
<section class="doc-sec" id="s04" aria-labelledby="s04-title"><p class="doc-kicker"><span class="doc-kicker__num">04</span></p><h2 class="doc-sec__title" id="s04-title">計算の例</h2><div class="doc-sec__body"><p>DDR SP の架空のプレイヤーで、実際の配信用モデルを使って計算します。記録は Lv11〜18 の182件です。Lv17 を60譜面遊んでいて、Lv11〜13 には昔の低い記録が残っています。</p><h3 id="やり込んでいる範囲を決める">やり込んでいる範囲を決める</h3><p>やり込んでいるレベルの記録を基準に、下のレベルの成績を比べます。比較には、同じ実力の人と比べた位置 z（第3章）のレベルごとの平均を使います。平均の差が、やり込んでいるレベル同士でも生じる差の2倍を超えたら、そのレベルは基準を下回ったとします。式では t ＞ 2 にあたります。</p><figure class="mth-blk"><div class="mth-blk__eq"><div class="mth-blk__scroll is-wide"><math display="block" class="tml-display" style="display:block math;"><mrow><msub><mi>t</mi><mi>L</mi></msub><mo>=</mo><mfrac><mrow><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mtext>基準</mtext></msub><mo>−</mo><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mi>L</mi></msub></mrow><msqrt><mrow><msup><mi>τ</mi><mn>2</mn></msup><mspace width="0.1667em"></mspace><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>1</mn><mo>+</mo><mo movablelimits="false">∑</mo><msup><mi>w</mi><mn class="tml-med-pad">2</mn></msup><mo fence="true" form="postfix" stretchy="false">)</mo></mrow><mo>+</mo><msup><mi>s</mi><mn class="tml-sml-pad">2</mn></msup><mspace width="0.1667em"></mspace><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>1</mn><mi>/</mi><msub><mi>n</mi><mi>L</mi></msub><mo>+</mo><mn>1</mn><mi>/</mi><msub><mi>n</mi><mtext>基準</mtext></msub><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></msqrt></mfrac></mrow></math></div><div class="mth-blk__scroll is-narrow"><math display="block" class="tml-display" style="display:block math;"><mtable displaystyle="true" class="tml-jot"><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><msub><mi>t</mi><mi>L</mi></msub></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo>=</mo><mfrac><mrow><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mtext>基準</mtext></msub><mo>−</mo><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mi>L</mi></msub></mrow><msqrt><mi>V</mi></msqrt></mfrac></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mi>V</mi></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo>=</mo><msup><mi>τ</mi><mn>2</mn></msup><mspace width="0.1667em"></mspace><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>1</mn><mo>+</mo><mstyle scriptlevel="0" displaystyle="false"><mo movablelimits="false">∑</mo><msup><mi>w</mi><mn class="tml-med-pad">2</mn></msup></mstyle><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mrow></mrow></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mspace width="1em"></mspace><mo>+</mo><msup><mi>s</mi><mn class="tml-sml-pad">2</mn></msup><mspace width="0.1667em"></mspace><mrow><mo fence="true" form="prefix" stretchy="false">(</mo><mn>1</mn><mi>/</mi><msub><mi>n</mi><mi>L</mi></msub><mo>+</mo><mn>1</mn><mi>/</mi><msub><mi>n</mi><mtext>基準</mtext></msub><mo fence="true" form="postfix" stretchy="false">)</mo></mrow></mrow></mtd></mtr></mtable></math></div></div><dl class="mth-blk__terms"><dt class="mth-blk__thead">ただし</dt><div class="mth-blk__term"><dt><math><msup><mi>τ</mi><mn>2</mn></msup></math></dt><dd>やり込んでいるレベル同士でも生じる、レベルごとの平均の差の分散（DDR SP は 0.031）</dd></div><div class="mth-blk__term"><dt><math><mi>w</mi></math></dt><dd>基準に入っている各レベルの記録の割合</dd></div><div class="mth-blk__term"><dt><math><msup><mi>s</mi><mn class="tml-sml-pad">2</mn></msup></math></dt><dd>この人の同じレベル内での z の分散（0.595）</dd></div><div class="mth-blk__term"><dt><math><mrow><msub><mi>n</mi><mi>L</mi></msub><mo separator="true">,</mo><mtext>&nbsp;</mtext><msub><mi>n</mi><mtext>基準</mtext></msub></mrow></math></dt><dd>そのレベルと基準の記録数</dd></div></dl></figure><p>この人の範囲の上端は Lv17 で、基準は Lv16 以上の98件（z の平均 +0.08）です。</p><figure class="mth-dl"><figcaption class="mth-dl__cap">範囲の決め方（上から順に確認）</figcaption><ol class="mth-dl__list"><li class="mth-dl__row"><span class="mth-dl__no" aria-hidden="true">1</span><div class="mth-dl__cond"><span>記録が20件未満、または上端のレベルの譜面を遊んだ割合が30%未満</span></div><div class="mth-dl__hit"><span class="mth-dl__yes"><span>はい</span><i aria-hidden="true"></i></span><strong class="mth-dl__result">範囲を決めない</strong></div><span class="mth-dl__no-line"><i aria-hidden="true"></i>いいえ</span></li><li class="mth-dl__row"><span class="mth-dl__no" aria-hidden="true">2</span><div class="mth-dl__cond"><span>下のレベルを上から順に見て、基準を下回るレベル（t ＞ 2）が2つ続く</span><small>基準を下回らないレベルは基準に加えて、次のレベルへ進む</small></div><div class="mth-dl__hit"><span class="mth-dl__yes"><span>はい</span><i aria-hidden="true"></i></span><strong class="mth-dl__result">基準を下回った2レベルのうち、上のレベルから下を外す</strong></div><span class="mth-dl__no-line"><i aria-hidden="true"></i>いいえ</span></li><li class="mth-dl__row"><span class="mth-dl__no" aria-hidden="true">3</span><div class="mth-dl__cond"><span>最後に見たレベルだけが基準を下回る</span></div><div class="mth-dl__hit"><span class="mth-dl__yes"><span>はい</span><i aria-hidden="true"></i></span><strong class="mth-dl__result">そのレベルから下を外す</strong></div><span class="mth-dl__no-line"><i aria-hidden="true"></i>いいえ</span></li><li class="mth-dl__row is-fallback"><span class="mth-dl__no" aria-hidden="true">4</span><div class="mth-dl__cond"><span>どれにも当てはまらない</span></div><div class="mth-dl__hit"><span class="mth-dl__yes"><span></span><i aria-hidden="true"></i></span><strong class="mth-dl__result">範囲を決めない</strong></div></li></ol></figure><figure class="mth-vr"><figcaption class="mth-vr__cap">レベルごとの判定</figcaption><p class="mth-vr__legend"><span><i class="mth-vr__mk is-to" aria-hidden="true"></i>基準を下回らない（基準に加える）</span><span><i class="mth-vr__mk is-ref" aria-hidden="true"></i>基準を下回る</span></p><div class="mth-vr__grid"><span class="mth-vr__corner"></span><div class="mth-vr__axis" aria-hidden="true"><span class="is-first" style="left:0.00%">−1.2</span><span class="is-thin" style="left:20.00%">−0.8</span><span style="left:40.00%">−0.4</span><span class="is-thin" style="left:60.00%">0</span><span style="left:80.00%">+0.4</span><span class="is-last is-thin" style="left:100.00%">+0.8</span></div><p class="mth-vr__label">Lv15<small>25件・t −0.87</small></p><div class="mth-vr__track" role="img" aria-label="Lv15：基準を下回らない（基準に加える） +0.32"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%"></i><i class="mth-vr__gl" style="left:60.00%"></i><i class="mth-vr__gl" style="left:70.00%"></i><i class="mth-vr__gl" style="left:80.00%"></i><i class="mth-vr__gl" style="left:90.00%"></i><i class="mth-vr__gl" style="left:100.00%"></i><i class="mth-vr__center" style="left:64.00%"></i><i class="mth-vr__mk is-to" style="left:76.00%"></i><span class="mth-vr__val is-above" style="left:76.00%">+0.32</span></div><p class="mth-vr__label">Lv14<small>20件・t −1.34</small></p><div class="mth-vr__track" role="img" aria-label="Lv14：基準を下回らない（基準に加える） +0.50"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%"></i><i class="mth-vr__gl" style="left:60.00%"></i><i class="mth-vr__gl" style="left:70.00%"></i><i class="mth-vr__gl" style="left:80.00%"></i><i class="mth-vr__gl" style="left:90.00%"></i><i class="mth-vr__gl" style="left:100.00%"></i><i class="mth-vr__center" style="left:64.00%"></i><i class="mth-vr__mk is-to" style="left:85.00%"></i><span class="mth-vr__val is-above" style="left:85.00%">+0.50</span></div><p class="mth-vr__label is-em">Lv13<small>15件・t 3.58</small></p><div class="mth-vr__track is-em" role="img" aria-label="Lv13：基準を下回る −0.86"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%"></i><i class="mth-vr__gl" style="left:60.00%"></i><i class="mth-vr__gl" style="left:70.00%"></i><i class="mth-vr__gl" style="left:80.00%"></i><i class="mth-vr__gl" style="left:90.00%"></i><i class="mth-vr__gl" style="left:100.00%"></i><i class="mth-vr__center" style="left:64.00%"></i><i class="mth-vr__mk is-ref" style="left:17.00%"></i><span class="mth-vr__val is-above" style="left:17.00%">−0.86</span></div><p class="mth-vr__label is-em">Lv12<small>12件・t 2.69</small></p><div class="mth-vr__track is-em" role="img" aria-label="Lv12：基準を下回る −0.65"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%"></i><i class="mth-vr__gl" style="left:60.00%"></i><i class="mth-vr__gl" style="left:70.00%"></i><i class="mth-vr__gl" style="left:80.00%"></i><i class="mth-vr__gl" style="left:90.00%"></i><i class="mth-vr__gl" style="left:100.00%"></i><i class="mth-vr__center" style="left:64.00%"></i><i class="mth-vr__mk is-ref" style="left:27.50%"></i><span class="mth-vr__val is-above" style="left:27.50%">−0.65</span></div><span></span><p class="mth-vr__title">z の平均<span class="mth-vr__ctitle">｜ 縦の線＝基準（Lv16 以上・98件）+0.08</span></p></div></figure><p>Lv13 と Lv12 が続けて基準を下回ったので、Lv14 以上がやり込んでいる範囲です。範囲外の37件は、一覧で得意・苦手を付けずに薄く表示します。偏差値は表示します。</p><h3 id="譜面ごとの位置-z-を計算する">譜面ごとの位置 z を計算する</h3><p>点数が各閾値 t_k 以上になる確率を、実力 θ と譜面の難しさ δ で表します（段階反応モデル）。</p><figure class="mth-blk"><div class="mth-blk__eq has-no"><span class="mth-blk__no">(1)</span><div class="mth-blk__scroll is-wide"><math display="block" class="tml-display" style="display:block math;"><mrow><mi>P</mi><mo form="prefix" stretchy="false">(</mo><mtext>点数</mtext><mo>≥</mo><msub><mi>t</mi><mi>k</mi></msub><mo lspace="0.22em" rspace="0.22em" stretchy="false">|</mo><mi>θ</mi><mo separator="true">,</mo><mi>j</mi><mo form="postfix" stretchy="false">)</mo><mo>=</mo><mi>σ</mi><mo fence="true" symmetric="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>c</mi><mi>j</mi></msub><mspace width="0.1667em"></mspace><mo form="prefix" stretchy="false">(</mo><msub><mi>α</mi><mi>k</mi></msub><mo>+</mo><mi>β</mi><mspace width="0.1667em"></mspace><mo form="prefix" stretchy="false">(</mo><mi>θ</mi><mo>−</mo><msub><mi>δ</mi><mi>j</mi></msub><mo form="postfix" stretchy="false">)</mo><mo form="postfix" stretchy="false">)</mo><mo fence="true" symmetric="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow></math></div><div class="mth-blk__scroll is-narrow"><math display="block" class="tml-display" style="display:block math;"><mtable displaystyle="true" class="tml-jot"><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mrow></mrow></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mi>P</mi><mo form="prefix" stretchy="false">(</mo><mtext>点数</mtext><mo>≥</mo><msub><mi>t</mi><mi>k</mi></msub><mo lspace="0.22em" rspace="0.22em" stretchy="false">|</mo><mi>θ</mi><mo separator="true">,</mo><mi>j</mi><mo form="postfix" stretchy="false">)</mo></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mrow></mrow></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mspace width="1em"></mspace><mo>=</mo><mi>σ</mi><mo fence="true" symmetric="true" minsize="1.2em" maxsize="1.2em">(</mo><msub><mi>c</mi><mi>j</mi></msub><mspace width="0.1667em"></mspace><mo form="prefix" stretchy="false">(</mo><msub><mi>α</mi><mi>k</mi></msub><mo>+</mo><mi>β</mi><mspace width="0.1667em"></mspace><mo form="prefix" stretchy="false">(</mo><mi>θ</mi><mo>−</mo><msub><mi>δ</mi><mi>j</mi></msub><mo form="postfix" stretchy="false">)</mo><mo form="postfix" stretchy="false">)</mo><mo fence="true" symmetric="true" minsize="1.2em" maxsize="1.2em">)</mo></mrow></mtd></mtr></mtable></math></div></div><dl class="mth-blk__terms"><dt class="mth-blk__thead">ただし</dt><div class="mth-blk__term"><dt><math><mi>θ</mi></math></dt><dd>実力（全員の平均が0、ばらつきが1）</dd></div><div class="mth-blk__term"><dt><math><msub><mi>δ</mi><mi>j</mi></msub></math></dt><dd>譜面 j の難しさ</dd></div><div class="mth-blk__term"><dt><math><mrow><msub><mi>α</mi><mi>k</mi></msub><mo separator="true">,</mo><mtext>&nbsp;</mtext><mi>β</mi></mrow></math></dt><dd>レベルの形ごとの切片と傾き</dd></div><div class="mth-blk__term"><dt><math><msub><mi>t</mi><mi>k</mi></msub></math></dt><dd>点数の閾値（レベルの形ごとの記録の分位点）</dd></div><div class="mth-blk__term"><dt><math><msub><mi>c</mi><mi>j</mi></msub></math></dt><dd>譜面の難しさの推定誤差を予測に反映する縮小係数</dd></div></dl></figure><p>やり込んでいる範囲内の記録を使い、計算対象の記録を除いて実力を推定し直します。その実力をもとに、同じ実力の人のうち、自分より点数が低い人の割合 P を計算します。計算対象の記録を除くのは、その点数自体が比較の基準に影響しないようにするためです。z ＝ Φ⁻¹(P) です。</p><figure class="mth-blk"><div class="mth-blk__eq has-no"><span class="mth-blk__no">(2)</span><div class="mth-blk__scroll is-wide"><math display="block" class="tml-display" style="display:block math;"><mrow><msub><mi>z</mi><mi>j</mi></msub><mo>=</mo><msup><mrow><mi mathvariant="normal">Φ</mi><mspace></mspace></mrow><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">−</mo><mn>1</mn></mrow></msup><mo fence="true" symmetric="true" minsize="1.8em" maxsize="1.8em">(</mo><mo movablelimits="false">∫</mo><mi>P</mi><mo form="prefix" stretchy="false">(</mo><mtext>点数</mtext><mo>&lt;</mo><msub><mi>s</mi><mi>j</mi></msub><mo lspace="0.22em" rspace="0.22em" stretchy="false">|</mo><mi>θ</mi><mo separator="true">,</mo><mi>j</mi><mo form="postfix" stretchy="false">)</mo><mspace width="0.1667em"></mspace><msub><mi>π</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">−</mo><mi>j</mi></mrow></msub><mo form="prefix" stretchy="false">(</mo><mi>θ</mi><mo form="postfix" stretchy="false">)</mo><mspace width="0.1667em"></mspace><mi>d</mi><mi>θ</mi><mo fence="true" symmetric="true" minsize="1.8em" maxsize="1.8em">)</mo></mrow></math></div><div class="mth-blk__scroll is-narrow"><math display="block" class="tml-display" style="display:block math;"><mtable displaystyle="true" class="tml-jot"><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mrow><msub><mi>z</mi><mi>j</mi></msub><mo>=</mo><msup><mrow><mi mathvariant="normal">Φ</mi><mspace></mspace></mrow><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">−</mo><mn>1</mn></mrow></msup><mo fence="true" symmetric="true" minsize="1.8em" maxsize="1.8em">(</mo></mrow></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo movablelimits="false">∫</mo><mi>P</mi><mo form="prefix" stretchy="false">(</mo><mtext>点数</mtext><mo>&lt;</mo><msub><mi>s</mi><mi>j</mi></msub><mo lspace="0.22em" rspace="0.22em" stretchy="false">|</mo><mi>θ</mi><mo separator="true">,</mo><mi>j</mi><mo form="postfix" stretchy="false">)</mo></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mrow></mrow></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo form="prefix" stretchy="false">×</mo><msub><mi>π</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">−</mo><mi>j</mi></mrow></msub><mo form="prefix" stretchy="false">(</mo><mi>θ</mi><mo form="postfix" stretchy="false">)</mo><mspace width="0.1667em"></mspace><mi>d</mi><mi>θ</mi><mo fence="true" symmetric="true" minsize="1.8em" maxsize="1.8em">)</mo></mrow></mtd></mtr></mtable></math></div></div><dl class="mth-blk__terms"><dt class="mth-blk__thead">ただし</dt><div class="mth-blk__term"><dt><math><msub><mi>s</mi><mi>j</mi></msub></math></dt><dd>その譜面の自分の点数</dd></div><div class="mth-blk__term"><dt><math><msub><mi>π</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">−</mo><mi>j</mi></mrow></msub></math></dt><dd>その記録を除いた実力の推定</dd></div></dl></figure><h3 id="得意度を計算する">得意度を計算する</h3><p>Lv16 で983,520点の譜面を例にします。z は −1.91 です。</p><figure class="mth-cc"><figcaption class="mth-cc__cap">基準 B と得意度（Lv16・983,520点）</figcaption><ol class="mth-cc__row"><li class="mth-cc__box" aria-label="全体の平均 +0.004"><span class="mth-cc__label">全体の平均</span><strong class="mth-cc__value">+0.004</strong><span class="mth-cc__sub">満点以外の自分の他の記録140件</span></li><li class="mth-cc__op" aria-hidden="true"><span>10件分だけ全体の平均に寄せる</span><i></i></li><li class="mth-cc__box" aria-label="10件分だけ全体の平均に寄せる → ±1レベル（Lv15〜17） −0.011"><span class="mth-cc__label">±1レベル（Lv15〜17）</span><strong class="mth-cc__value">−0.011</strong><span class="mth-cc__sub">111件の平均 −0.013</span></li><li class="mth-cc__op" aria-hidden="true"><span>10件分だけ上の値に寄せる</span><i></i></li><li class="mth-cc__box" aria-label="10件分だけ上の値に寄せる → 同じレベル（Lv16） B ＝ +0.063"><span class="mth-cc__label">同じレベル（Lv16）</span><strong class="mth-cc__value">B ＝ +0.063</strong><span class="mth-cc__sub">29件の平均 +0.089</span></li><li class="mth-cc__op" aria-hidden="true"><span>50 ＋ 20 ×（z − B）</span><i></i></li><li class="mth-cc__box is-result" aria-label="50 ＋ 20 ×（z − B） → 得意度 11"><span class="mth-cc__label">得意度</span><strong class="mth-cc__value">11</strong><span class="mth-cc__sub">30 以下なので苦手</span></li></ol></figure><figure class="mth-blk"><div class="mth-blk__eq has-no"><span class="mth-blk__no">(3)</span><div class="mth-blk__scroll is-wide"><math display="block" class="tml-display" style="display:block math;"><mrow><msubsup><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msubsup><mo>=</mo><mfrac><mrow><msub><mo movablelimits="false">∑</mo><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub><mi>z</mi><mo>+</mo><mi>K</mi><mspace width="0.1667em"></mspace><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mtext>全体</mtext></msub></mrow><mrow><msub><mi>n</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub><mo>+</mo><mi>K</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"></mspace><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mo movablelimits="false">∑</mo><mi>L</mi></msub><mi>z</mi><mo>+</mo><mi>K</mi><mspace width="0.1667em"></mspace><msubsup><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msubsup></mrow><mrow><msub><mi>n</mi><mi>L</mi></msub><mo>+</mo><mi>K</mi></mrow></mfrac><mo separator="true">,</mo><mspace width="2em"></mspace><mi>K</mi><mo>=</mo><mn>10</mn></mrow></math></div><div class="mth-blk__scroll is-narrow"><math display="block" class="tml-display" style="display:block math;"><mtable displaystyle="true" class="tml-jot"><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><msubsup><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msubsup></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo>=</mo><mfrac><mrow><msub><mo movablelimits="false">∑</mo><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub><mi>z</mi><mo>+</mo><mi>K</mi><mspace width="0.1667em"></mspace><msub><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mtext>全体</mtext></msub></mrow><mrow><msub><mi>n</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub><mo>+</mo><mi>K</mi></mrow></mfrac></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mi>B</mi></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo>=</mo><mfrac><mrow><msub><mo movablelimits="false">∑</mo><mi>L</mi></msub><mi>z</mi><mo>+</mo><mi>K</mi><mspace width="0.1667em"></mspace><msubsup><mover><mi>z</mi><mo stretchy="false" class="chr-sml wbk-sml-acc" style="math-depth:0;">‾</mo></mover><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow><mo lspace="0em" rspace="0em" class="tml-prime">′</mo></msubsup></mrow><mrow><msub><mi>n</mi><mi>L</mi></msub><mo>+</mo><mi>K</mi></mrow></mfrac></mrow></mtd></mtr><mtr><mtd class="tml-right" style="padding-left:0em;padding-right:0em;"><mi>K</mi></mtd><mtd class="tml-left" style="padding-left:0em;padding-right:0em;"><mrow><mo>=</mo><mn>10</mn></mrow></mtd></mtr></mtable></math></div></div><dl class="mth-blk__terms"><dt class="mth-blk__thead">ただし</dt><div class="mth-blk__term"><dt><math><mrow><msub><mo movablelimits="false">∑</mo><mi>L</mi></msub><mo separator="true">,</mo><mtext>&nbsp;</mtext><msub><mi>n</mi><mi>L</mi></msub></mrow></math></dt><dd>同じレベルの、満点以外の自分の他の記録の z の合計と件数</dd></div><div class="mth-blk__term"><dt><math><mrow><msub><mo movablelimits="false">∑</mo><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub><mo separator="true">,</mo><mtext>&nbsp;</mtext><msub><mi>n</mi><mrow><mo form="prefix" stretchy="false" lspace="0em" rspace="0em">±</mo><mn>1</mn></mrow></msub></mrow></math></dt><dd>±1レベルの同じ合計と件数</dd></div></dl></figure><p>上の値へ10件分だけ寄せるのは、同じレベルの記録が少ない人の基準が、1〜2件で大きく変わらないようにするためです。</p><p>満点の記録では B を使わず、同じ実力の人が満点を出す確率 q から z ＝ Φ⁻¹(1 − q/2) を計算し、50 ＋ 20 × z を得意度とします。この例の Lv15 の満点は q ＝ 0.008% で、得意度は100以上となり、得意と判定されます。同じ実力の人の多くが満点を出す譜面（q が大きい）ほど、得意度は50に近づきます。50を下回らないので、満点に苦手は付きません。</p><figure class="mth-vr"><figcaption class="mth-vr__cap">満点の得意度と、同じ実力の人が満点を出す確率 q</figcaption><p class="mth-vr__legend"><span><i class="mth-vr__mk is-to" aria-hidden="true"></i>得意度</span></p><div class="mth-vr__grid"><span class="mth-vr__corner"></span><div class="mth-vr__axis" aria-hidden="true"><span class="is-first" style="left:0.00%">50</span><span class="is-thin" style="left:20.00%">60</span><span style="left:40.00%">70</span><span class="is-thin" style="left:60.00%">80</span><span style="left:80.00%">90</span><span class="is-last is-thin" style="left:100.00%">100</span></div><p class="mth-vr__label is-em">q 0.008%<small>Lv15 の満点</small></p><div class="mth-vr__track is-em" role="img" aria-label="q 0.008%：得意度 100以上"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%"></i><i class="mth-vr__gl" style="left:60.00%"></i><i class="mth-vr__gl" style="left:70.00%"></i><i class="mth-vr__gl" style="left:80.00%"></i><i class="mth-vr__gl" style="left:90.00%"></i><i class="mth-vr__gl" style="left:100.00%"></i><i class="mth-vr__center" style="left:40.00%"></i><i class="mth-vr__mk is-to" style="left:100.00%"></i><span class="mth-vr__val is-above is-end" style="left:100.00%">100以上</span></div><p class="mth-vr__label">q 5%</p><div class="mth-vr__track" role="img" aria-label="q 5%：得意度 89"><i class="mth-vr__gl" style="left:0.00%"></i><i class="mth-vr__gl" style="left:10.00%"></i><i class="mth-vr__gl" style="left:20.00%"></i><i class="mth-vr__gl" style="left:30.00%"></i><i class="mth-vr__gl" style="left:40.00%"></i><i class="mth-vr__gl" style="left:50.00%
