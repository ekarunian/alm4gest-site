{% endraw %}</style><style>{% include palmdoc-site.css %}</style><div class="doc-body pd" data-theme="moss" data-mode="dark" data-density="文書"><div class="doc is-no-sidebar"><div class="doc-main">{% raw %}<header class="doc-hero"><p class="doc-kicker"></p><h1 class="doc-hero__title">エフェクトレーダーの<wbr>推定方法</h1><div class="doc-hero__lead"><p>ここでは、KONAMIの非公式スコア管理ツール「ALM4GEST」におけるSOUND VOLTEX ∇のエフェクトレーダーの推定方法を説明します。<br>
従来は一次情報が不明なデータを取り扱ってしまっていたため、ゲーム画面のキャプチャからレーダーの形を測り、中心から各頂点までの距離を値に変換する方法に変更するものです。<br>
そのため、この値は必ずしも実際のエフェクトレーダー値と整合するとは限りません。<br>
あくまで、相対的なユーザーの弱点を分析したりするために利用するものであり、プレイヤーレーダーも含めて正確な値を提供するものではありません。<br>
なお、この変更に伴い、新曲のエフェクトレーダー値のマスタは解禁日当日には埋まらない可能性が高い旨ご容赦ください。</p></div></header>
<section class="doc-sec" id="s01" aria-labelledby="s01-title"><p class="doc-kicker"><span class="doc-kicker__num">Ver. 1.2.20261013以降でのエフェクトレーダーの推定方法</span></p><h2 class="doc-sec__title" id="s01-title">具体的な<wbr>推定手順</h2><div class="doc-sec__body"><ol class="flw-pn"><li><div class="flw-pn__text"><span class="flw-pn__tag">STEP 1</span><p class="flw-pn__title">録画データからレーダーを切り出す</p><p class="flw-pn__body">録画する際は、画面を切替え、背景にジャケットが表示される前のキャプチャを使います<br>これは、背景の差分で結果が変わらないようにするためです。</p></div><div class="flw-pn__media"><figure class="flw-pf flw-pf--pick has-media" aria-hidden="true"><img class="media-fill" src="/assets/docs/effect-radar/fig-1.webp" style="object-fit:cover;object-position:50% 50%;transform-origin:50% 50%;transform:scale(1);filter:brightness(1)" data-media="/studio/261012_radar_step1.png" alt="" loading="lazy" decoding="async"></figure></div></li><li><div class="flw-pn__text"><span class="flw-pn__tag">STEP 2</span><p class="flw-pn__title">中心と目盛りを決める</p><p class="flw-pn__body">中心点は結果に大きく影響するため、画素単位で決め打ちせず、中心は6本の軸の明るさの変化を見て推定し、対称性などを使って横位置を補正します。<br>1目盛りは6本の軸の目盛り線が最もよく一致する間隔とします。</p></div><div class="flw-pn__media"><figure class="flw-pf flw-pf--pick has-media" aria-hidden="true"><img class="media-fill" src="/assets/docs/effect-radar/fig-2.webp" style="object-fit:cover;object-position:50% 50%;transform-origin:50% 50%;transform:scale(1);filter:brightness(1)" data-media="/studio/261012_radar_step2.png" alt="" loading="lazy" decoding="async"></figure></div></li><li><div class="flw-pn__text"><span class="flw-pn__tag">STEP 3</span><p class="flw-pn__title">画素ごとの被覆率を出す</p><p class="flw-pn__body">レーダーにはグラデーションがあるため、色だけでは境界の位置を正確に特定できません。<br>そこで、各画素がレーダーにどの程度覆われているかを0〜1の被覆率として推定します。<br>境界の画素は、背景とレーダーの中間の色になり、その色の変化量から覆われている割合を求めることで、境界の位置を1画素より細かく推定します。</p></div><div class="flw-pn__media"><figure class="flw-pf flw-pf--pick has-media" aria-hidden="true"><img class="media-fill" src="/assets/docs/effect-radar/fig-3.webp" style="object-fit:cover;object-position:50% 50%;transform-origin:50% 50%;transform:scale(1);filter:brightness(1)" data-media="/studio/261012_radar_step3.png" alt="" loading="lazy" decoding="async"></figure></div></li><li><div class="flw-pn__text"><span class="flw-pn__tag">STEP 4</span><p class="flw-pn__title">六角形を当てはめ、距離を測る</p><p class="flw-pn__body">頂点の先は1画素より細いため、頂点を直接探すと正しい値が出しづらいです。<br>6つの頂点までの距離を未知数とした六角形から各画素の被覆率を予測し、実際の被覆率との差の2乗の合計が最も小さくなる距離を探します（最小二乗法）。<br>六角形形状で近似することで、文字に隠れて見えない頂点も含めて推定が可能になります。<br>そして、中心からの距離が4の位置を100としてレーダー値に換算しています。</p></div><div class="flw-pn__media"><figure class="flw-pf flw-pf--pick has-media" aria-hidden="true"><img class="media-fill" src="/assets/docs/effect-radar/fig-4.webp" style="object-fit:cover;object-position:50% 50%;transform-origin:50% 50%;transform:scale(1);filter:brightness(1)" data-media="/studio/261012_radar_step4.png" alt="" loading="lazy" decoding="async"></figure></div></li></ol></div></section><footer class="doc-footer"><span class="doc-footer__brand"></span><span>更新: 2026-10-12</span><a class="doc-footer__top" href="#top">ページの先頭へ</a></footer>{% endraw %}</div></div></div></template></div>
