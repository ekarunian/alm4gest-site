# 英・韓・中の訳。Claude が書く（川口さんは直さない）。
# src は訳したときの日本語。原稿の日本語が変わった文は build が TODO に戻す。
# アプリの用語は konami_score_app/lib/l10n/app_*.arb に合わせる。
src:
  title: 複数端末でのデータ共有・Tier表の絞り込み改善など
  sections:
  - heading: 複数端末でのデータ共有
    items:
    - title: 複数端末でのセットアップ
      desc: 同じバックアップコードを使うことで、複数端末でスコア・課題・お気に入り・スコアタなどのデータを共有できるようにしました。
      list:
      - 既存の端末でバックアップコードを確認します
      - 新しい端末で「すでに別端末でALM4GESTを利用している方」を選択します
      - バックアップコードを入力してセットアップを進めます
    - title: バックアップ機能の改善
      list:
      - バックアップを端末ごとに保存するようにしました
      - 復元時に複数のバックアップがある場合は、端末の機種名から選べます
      - 同期後に自動でバックアップするようにしました
  - heading: Tier表・楽曲一覧
    items:
    - title: Tier表の絞り込み
      list:
      - Tier表を小数レベルやバージョンで絞り込めるようにしました
      - 例えば、Lv17.5〜18.4の譜面だけでTier表を作成できます
      - バージョンは公式ロゴで表示します
      - 絞り込んだ状態での画像共有にも対応しました
    - title: 楽曲一覧・偏差値
      list:
      - 楽曲一覧に「メモあり」の絞り込みを追加しました
      - 偏差値が全体の上位に入っている譜面は、全体順位を表示するようにしました
    - title: メダルの分類
      desc: 緑（EASY）・橙（ASSIST）のメダルを、銅（CLEAR）と別の段として扱うようにしました。楽曲一覧の絞り込み・統計・Tier表に反映しています。
  - heading: 同期
    items:
    - title: 同期の不具合修正
      list:
      - 同期が失敗する・終わらない不具合を修正しました
      - 中断した同期を続きから再開できるようにしました
      - 「最初からやり直す」から、最初から同期することもできます
    - title: 曲詳細の取得
      desc: '公式サイトでは、1回のログインで約30曲を超える曲詳細を取得すると、情報が返らなくなる場合があります。

        そのため、MISS COUNT・選曲回数などは最近遊んだ曲から優先して取得し、取得できなかった曲は次回以降の同期で読み込むようにしました。'
  - heading: 課題・スコアタ・通知
    items:
    - title: アプリ内通知
      list:
      - 「すべて既読」を追加しました
      - 操作の必要がない通知は、確認するとホームの通知マークが消えるようにしました
      - 投げた課題への返事の通知を、一言なし（初期設定OFF）と一言つき（初期設定ON）に分けました
    - title: 課題の送信履歴
      desc: 送った課題の履歴を、左にスワイプして削除できるようにしました。返事待ちの課題を削除するときは注意を表示します。
    - title: 通しのスコアタ
      desc: スコアタの一覧と詳細に「通し」のマークを追加しました。
  - heading: 軽微な改善と修正
    items:
    - title: 同期処理
      list:
      - クイック同期が失敗したあとの通常同期は、現在の設定から組み直して実行するように修正しました
      - 同期する機種がない場合は、同期の設定画面を表示するようにしました
    - title: 成果画像
      list:
      - ホームの「画像で共有」で、現在表示している機種・日付の成果画像を出力するように修正しました
      - IIDXの成果画像の横幅をほかの機種と揃え、クリアランプが小さく表示される不具合を修正しました
    - title: 初回起動の機種選択
      desc: 初回起動時の機種選択を、ロゴと機種名を並べた2列の表示に変更しました。
en:
  title: Share data across devices, better Tier List filters and more
  sections:
  - heading: Share data across devices
    items:
    - title: Set up on more devices
      desc: Use the same backup code to share scores, challenges, favorites, Score Attacks and more across devices.
      list:
      - Check your backup code on your current device
      - On the new device, choose "Already using ALM4GEST on another device"
      - Enter your backup code and continue setup
    - title: Better backups
      list:
      - Backups are now saved per device
      - If there are several backups when restoring, pick one by device model
      - The app now backs up automatically after a sync
  - heading: Tier List and Songs
    items:
    - title: Tier List filters
      list:
      - Filter the Tier List by decimal level or version
      - For example, make a Tier List of only Lv17.5–18.4 charts
      - Versions are shown with their official logos
      - Share as image also works while filtered
    - title: Songs and T-scores
      list:
      - Added a "Has notes" filter to Songs
      - Charts whose T-score is near the top overall now show their overall rank
    - title: Medal groups
      desc: Green (EASY) and orange (ASSIST) medals are now a separate tier from bronze (CLEAR). This applies to Songs filters, stats and the Tier List.
  - heading: Sync
    items:
    - title: Sync fixes
      list:
      - Fixed syncs failing or never finishing
      - An interrupted sync can now resume where it stopped
      - You can also sync from scratch with "Start over"
    - title: Song details
      desc: 'On the official site, fetching details for more than about 30 songs in one login can stop returning data.

        So MISS COUNT, play counts and similar details are now fetched starting with recently played songs, and songs not fetched are read in later syncs.'
  - heading: Challenges, Score Attack and notifications
    items:
    - title: In-app notifications
      list:
      - Added "Mark all read"
      - Notifications that need no action now clear the mark on Home once you check them
      - Reply notifications for challenges you sent are now split into no message (off by default) and with a message (on by default)
    - title: Sent challenges
      desc: Swipe left to delete a sent challenge from the history. A warning appears when deleting one still waiting for a reply.
    - title: One-run Score Attacks
      desc: Score Attack lists and details now show a "One run" mark.
  - heading: Minor improvements and fixes
    items:
    - title: Sync
      list:
      - After a failed quick sync, the standard sync now rebuilds from your current settings
      - If no game is set to sync, the sync settings screen now opens
    - title: Results image
      list:
      - Share as image on Home now outputs the results for the game and date you're viewing
      - IIDX results images now match the width of other games, fixing small clear lamps
    - title: Choosing games on first launch
      desc: Game selection on first launch now shows logos and names in two columns.
ko:
  title: 여러 기기 데이터 공유, 티어표 필터 개선 등
  sections:
  - heading: 여러 기기에서 데이터 공유
    items:
    - title: 여러 기기에서 설정
      desc: 같은 백업 코드를 사용하면 여러 기기에서 점수·과제·즐겨찾기·스코어 어택 등의 데이터를 공유할 수 있습니다.
      list:
      - 기존 기기에서 백업 코드를 확인합니다
      - 새 기기에서 '이미 다른 기기에서 ALM4GEST를 사용 중인 분'을 선택합니다
      - 백업 코드를 입력하고 설정을 진행합니다
    - title: 백업 기능 개선
      list:
      - 백업을 기기별로 저장하도록 했습니다
      - 복원할 때 백업이 여러 개 있으면 기기 모델명으로 고를 수 있습니다
      - 동기화 후 자동으로 백업하도록 했습니다
  - heading: 티어표·곡 목록
    items:
    - title: 티어표 필터
      list:
      - 티어표를 소수 레벨이나 버전으로 필터링할 수 있습니다
      - 예를 들어 Lv17.5~18.4 채보만으로 티어표를 만들 수 있습니다
      - 버전은 공식 로고로 표시합니다
      - 필터링한 상태로 이미지 공유도 할 수 있습니다
    - title: 곡 목록·T점수
      list:
      - 곡 목록에 '메모 있음' 필터를 추가했습니다
      - T점수가 전체 상위권인 채보는 전체 순위를 표시합니다
    - title: 메달 분류
      desc: 초록(EASY)·주황(ASSIST) 메달을 동(CLEAR)과 다른 단계로 다루도록 했습니다. 곡 목록 필터·통계·티어표에 반영됩니다.
  - heading: 동기화
    items:
    - title: 동기화 오류 수정
      list:
      - 동기화가 실패하거나 끝나지 않는 오류를 수정했습니다
      - 중단된 동기화를 이어서 다시 시작할 수 있습니다
      - '''처음부터 다시''로 처음부터 동기화할 수도 있습니다'
    - title: 곡 상세 가져오기
      desc: '공식 사이트에서는 한 번 로그인으로 약 30곡이 넘는 곡 상세를 가져오면 정보가 돌아오지 않을 수 있습니다.

        그래서 MISS COUNT·선곡 횟수 등은 최근 플레이한 곡부터 먼저 가져오고, 가져오지 못한 곡은 다음 동기화부터 읽어 옵니다.'
  - heading: 과제·스코어 어택·알림
    items:
    - title: 앱 내 알림
      list:
      - '''모두 읽음''을 추가했습니다'
      - 조작이 필요 없는 알림은 확인하면 홈의 알림 표시가 사라집니다
      - 보낸 과제의 응답 알림을 한마디 없음(기본 OFF)과 한마디 있음(기본 ON)으로 나눴습니다
    - title: 보낸 과제 기록
      desc: 보낸 과제 기록을 왼쪽으로 스와이프해 삭제할 수 있습니다. 답장을 기다리는 과제를 삭제할 때는 주의를 표시합니다.
    - title: 연속 플레이 스코어 어택
      desc: 스코어 어택 목록과 상세에 '연속 플레이' 표시를 추가했습니다.
  - heading: 작은 개선과 수정
    items:
    - title: 동기화 처리
      list:
      - 빠른 동기화가 실패한 뒤의 일반 동기화는 현재 설정으로 다시 구성해 실행하도록 수정했습니다
      - 동기화할 기종이 없으면 동기화 설정 화면을 표시합니다
    - title: 성과 이미지
      list:
      - 홈의 '이미지로 공유'에서 지금 보고 있는 기종·날짜의 성과 이미지를 출력하도록 수정했습니다
      - IIDX 성과 이미지의 너비를 다른 기종과 맞춰, 클리어 램프가 작게 표시되던 오류를 수정했습니다
    - title: 첫 실행 시 기종 선택
      desc: 첫 실행 시 기종 선택을 로고와 기종명을 나란히 놓은 2열 표시로 바꿨습니다.
zh:
  title: 多裝置共享資料、Tier表篩選改善等
  sections:
  - heading: 多裝置共享資料
    items:
    - title: 在多台裝置上設定
      desc: 使用同一組備份碼，即可在多台裝置間共享分數、課題、我的最愛、分數挑戰等資料。
      list:
      - 在原本的裝置上確認備份碼
      - 在新裝置上選擇「已在其他裝置使用 ALM4GEST」
      - 輸入備份碼並繼續設定
    - title: 備份功能改善
      list:
      - 備份改為依裝置分別保存
      - 還原時若有多份備份，可依裝置型號選擇
      - 同步後會自動備份
  - heading: Tier表・樂曲一覽
    items:
    - title: Tier表篩選
      list:
      - Tier表可依小數等級或版本篩選
      - 例如可只用 Lv17.5～18.4 的譜面製作Tier表
      - 版本以官方標誌顯示
      - 篩選狀態下也能以圖片分享
    - title: 樂曲一覽・T分數
      list:
      - 樂曲一覽新增「有備註」篩選
      - T分數位居全體前段的譜面，會顯示全體排名
    - title: 獎章分類
      desc: 綠（EASY）・橙（ASSIST）獎章改為與銅（CLEAR）不同的段位，並反映在樂曲一覽的篩選、統計與Tier表。
  - heading: 同步
    items:
    - title: 同步問題修正
      list:
      - 修正同步失敗或無法結束的問題
      - 中斷的同步可從中斷處繼續
      - 也可以從「從頭開始」重新同步
    - title: 曲目詳情的取得
      desc: '在官方網站上，一次登入取得超過約30首的曲目詳情時，可能不再回傳資料。

        因此 MISS COUNT、選曲次數等會從最近遊玩的曲目優先取得，未取得的曲目則在之後的同步中讀取。'
  - heading: 課題・分數挑戰・通知
    items:
    - title: App 內通知
      list:
      - 新增「全部已讀」
      - 不需操作的通知，確認後首頁的通知標記就會消失
      - 已發送課題的回覆通知，分為無留言（預設關閉）與附留言（預設開啟）
    - title: 已發送的課題紀錄
      desc: 已發送的課題紀錄可向左滑動刪除。刪除尚在等待回覆的課題時會顯示提醒。
    - title: 連續遊玩的分數挑戰
      desc: 分數挑戰的列表與詳情新增「連續遊玩」標記。
  - heading: 小幅改善與修正
    items:
    - title: 同步處理
      list:
      - 快速同步失敗後的一般同步，改為依目前設定重新組成後執行
      - 沒有要同步的機種時，會顯示同步設定畫面
    - title: 成果圖片
      list:
      - 修正首頁「以圖片分享」會輸出目前顯示中的機種與日期的成果圖片
      - IIDX 成果圖片的寬度與其他機種一致，修正通關燈號顯示過小的問題
    - title: 首次啟動的機種選擇
      desc: 首次啟動時的機種選擇，改為並排標誌與機種名稱的兩欄顯示。
